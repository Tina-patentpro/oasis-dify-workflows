    - data:
        code: "from typing import Optional\nimport re\n\n\ndef _clean(text: Optional[str]) -> str:\n    value = \"\" if text is None else str(text)\n    value = value.replace(\"\\r\\n\", \"\\n\").replace(\"\\r\", \"\\n\").replace(\"\\ufeff\", \"\")\n    value = re.sub(r\"[\\u200B-\\u200D\\uFEFF]\", \"\", value)\n    value = re.sub(r\"\\n{3,}\", \"\\n\\n\", value)\n    return value.strip()\n\n\ndef _prefer(primary: Optional[str], secondary: Optional[str]) -> str:\n    second = _clean(secondary)\n    return second if second else _clean(primary)\n\n\ndef main(\n    user_instruction: Optional[str] = None,\n    office_action_text: Optional[str] = None,\n    office_action_file_text: Optional[str] = None,\n    claims_text: Optional[str] = None,\n    claims_file_text: Optional[str] = None,\n    specification_text: Optional[str] = None,\n    specification_file_text: Optional[str] = None,\n    d1_text: Optional[str] = None,\n    d2_text: Optional[str] = None,\n    d3_text: Optional[str] = None,\n\
          ) -> dict:\n    ui = _clean(user_instruction)\n    oa = _prefer(office_action_text, office_action_file_text)\n    claims = _prefer(claims_text, claims_file_text)\n    spec = _prefer(specification_text, specification_file_text)\n    d1 = _clean(d1_text)\n    d2 = _clean(d2_text)\n    d3 = _clean(d3_text)\n\n    parts = []\n    if ui:\n        parts.append(\"## 用户重点说明\\n\" + ui)\n    parts.append(\"## 审查意见\\n\" + (oa or \"未提供审查意见文本。\"))\n    parts.append(\"## 权利要求书\\n\" + (claims or \"未提供权利要求书。\"))\n    parts.append(\"## 说明书\\n\" + (spec or \"未提供说明书。\"))\n    parts.append(\"## D1\\n\" + (d1 or \"未提供 D1。\"))\n    parts.append(\"## D2\\n\" + (d2 or \"未提供 D2。\"))\n    parts.append(\"## D3\\n\" + (d3 or \"未提供 D3。\"))\n\n    return {\n        \"normalized_context\": \"\\n\\n---\\n\\n\".join(parts),\n        \"oa_text\": oa,\n        \"claims_text\": claims,\n        \"spec_text\": spec,\n        \"d1_text\": d1,\n        \"d2_text\": d2,\n        \"d3_text\": d3,\n    }\n"
