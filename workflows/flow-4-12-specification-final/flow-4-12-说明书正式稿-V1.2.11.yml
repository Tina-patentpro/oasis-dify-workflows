    nodes:
    - data:
        desc: 1.2.11输入：技术交底文件或六个手动技术章节、Claims文件或手动Claims。本工作流不处理图片。
        prompt_template: []
        selected: false
        title: 开始
        type: start
        variables:
        - label: 技术领域
          max_length: 128000
          options:
          - 1.1 电子类：涉及电子元器件、电路设计、电信设备等
          - 1.2 通信类：涉及通信技术、网络协议、信息传输系统等
          - 1.3 光学类：包括与光学技术相关的设备、器件及其应用
          - 1.4 消费电子类：包括个人电子设备、家用电器及其智能化应用
          - 1.5 虚拟现实与增强现实类：包括虚拟现实（VR）、增强现实（AR）技术及其应用
          - 1.6 照明与光源类：包括照明设备、光源技术及其应用
          - 1.7 软件类：包括计算机程序、软件设计方法及其应用
          - 2.1 机械类：涵盖各种机械设备、器械、工具及其制造方法
          - 2.2 智能制造与工业4.0类：包括智能工厂、自动化生产线、工业物联网等
          - 2.3 机器人与自动化类：涉及机器人技术、自动化控制系统等
          - 2.4 航空航天类：包括航空器、航天器及其相关技术
          - 2.5 海洋工程与船舶类：涉及海洋工程技术、船舶设计与制造等
          - 2.6 交通运输类：涉及交通工具、运输设备及其管理系统
          - 2.7 建筑与土木类：包括建筑材料、建筑结构、土木工程技术等
          - 2.8 包装与印刷类：涉及包装设计、印刷工艺、材料应用等
          - 3.1 化学类：包括化学物质、化学合成方法及其应用
          - 3.2 新材料与先进制造类：涉及新型材料和先进制造技术的交叉领域，如3D打印、生物材料、智能材料等
          - 3.3 纳米技术类：包括纳米材料、纳米器件及其应用
          - 3.4 合成生物学类：涉及基因合成、生物路径设计和细胞工厂等
          - 4.1 生物类：涉及生物技术、生物工程、基因工程等
          - 4.2 医疗器械类：涉及用于医疗诊断、治疗的设备和器械
          - 4.3 再生医学与组织工程类：涉及生物材料、人工器官、组织工程等
          - 4.4 生物信息学与基因组学类：包括基因测序、生物数据分析、个性化医疗等
          - 4.5 老龄化技术与养老服务类：涉及养老设备、老龄化服务及其相关技术
          - 4.6 心理健康与数字治疗技术类：涉及心理健康评估、数字化治疗方案、在线心理咨询等
          - 4.7 中医药类：涉及中医药相关的技术，包括中草药配方、传统治疗方法及其现代应用
          - 5.1 大数据与数据分析类：涉及海量数据处理、数据挖掘、分析工具等
          - 5.2 人工智能与机器学习类：涉及智能算法、数据分析、自动化系统等
          - 5.3 算法类：涉及数据处理、计算方法等，通常与软件专利交叉
          - 5.4 网络与信息安全类：包括网络安全技术、数据加密、隐私保护等
          - 5.5 高性能计算与超级计算类：涉及高性能计算系统、并行计算算法等
          - 5.6 区块链与分布式账本类：涉及区块链技术、去中心化网络、加密协议等
          - 5.7 虚拟货币与金融衍生品类：涉及虚拟货币及其衍生品如期权、期货等
          - 5.8 金融科技类：涉及金融技术、电子支付系统、区块链技术等
          - 5.9 教育与培训类：包括教育工具、培训方法、在线学习平台等
          - 5.10 人机交互与用户体验类：涉及用户界面设计、交互技术、体验优化等
          - 5.11 社交媒体与网络社区技术类：包括社交媒体平台、网络社区管理技术、内容推荐算法等
          - 5.12 金融安全类：涉及金融安全技术，如反洗钱、欺诈检测等
          - 6.1 电力与能源类：包括电力系统、能源技术及其管理方法
          - 6.2 新兴能源与电动技术类：涉及新能源开发、电动交通工具、电池技术等
          - 6.3 环境监测与治理类：涉及环保技术、可再生能源、污染控制、环境监测等
          - 6.4 气候与气象技术类：包括气候监测、气象预测、天气控制等技术
          - 7.1 家居与日用消费品类：包括家居产品、日用消费品及其制造方法
          - 7.2 家具与室内设计类：涉及家具设计、制造技术、室内装饰材料等
          - 7.3 婴儿与母婴用品类：包括婴儿用品、母婴护理设备及其相关技术
          - 7.4 安防与监控类：涉及安全防护、监控系统及其相关技术
          - 7.5 美容与个人护理类：涉及美容产品、个人护理设备及其制造方法
          - 7.6 宠物与动物护理类：包括宠物用品、动物护理设备及相关技术
          - 7.7 旅游与户外装备类：涉及旅游装备、户外活动设备及其相关技术
          - 7.8 办公与文具类：涉及办公设备、文具用品及其相关技术
          - 7.9 物流与供应链管理类：涉及物流技术、供应链优化、仓储管理等
