app:
  description: 1.2.11：从上一冻结版本旁路修复运行记录揭示的根因。4P仅装配说明书，5E改为具名类型输入并分别处理对象记录与字符串告警；1B/1C/3A/3B使用提供方安全枚举，3B/3C改为逐段结构化输出，3V按原子Claims特征、证据、推导边界及段落血缘验证并诚实标记专业终稿、初稿回退、工作稿或无可用正文；2F明确为纯文本附图说明节点，0F仍为语义参数提取器且其后不回读原技术素材；11个LLM和0F模型路由保持不变，输出预算按职责收敛。保持33节点、44边、11个LLM、插件0.1.3、Claims逐字锁定和单End三输出合同。当前仅为本地静态候选，尚未完成Dify导入、发布或真实运行。
  icon: 🤖
  icon_background: '#FFEAD5'
  mode: workflow
  name: flow-2-7-说明书生成-basic-1.2.11
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.6.0
