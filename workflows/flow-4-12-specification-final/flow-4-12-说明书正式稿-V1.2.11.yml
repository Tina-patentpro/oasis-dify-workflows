          \        \"final_technical_field_text\": technical_field,\n        \"final_background_text\": background,\n        \"final_invention_content_text\": invention,\n        \"final_drawings_text\": drawings,\n        \"final_embodiments_text\": embodiments,\n        \"locked_claims_text\": claims,\n        \"renderer_payload_sha256\": payload_sha,\n        \"report_record_catalog\": _record_map(catalog),\n        \"report_coverage_manifest\": manifest,\n    }\n"
