          \ or \"missing\",\n            owner=\"agent\",\n            priority=\"P1\",\n            required_action=\"代理师必须复核具体实施方式机械问题；工作稿不得作为申报就绪终稿。\",\n        )\n    \n    for row in issues:\n        add_record(\n            record_type=\"mechanical_validation\",\n            required_sections=[\"article_26_3\"],\n            subject=row.get(\"scope\") or \"说明书机械一致性\",\n            evidence_refs=[_s(row.get(\"issue\"))] if _s(row.get(\"issue\")) else [],\n            evidence_excerpt=row.get(\"observed\"),\n            observed_status=row.get(\"issue\"),\n            owner=\"agent\",\n            priority=\"P1\",\n            required_action=\"在代理师终审时核对并处理该机械一致性问题。\",\n        )\n    detail_metrics = evidence.get(\"embodiment_detail_metrics\")\n    if isinstance(detail_metrics, dict):\n        target_status = _s(\n            detail_metrics.get(\"eight_to_ten_times_target_status\")\n        )\n        if target_status != \"met\":\n            add_record(\n                record_type=\"\
