    - data:
        code: "from __future__ import annotations\n\nimport re\nfrom typing import Any\n\n\ndef _text(value: Any) -> str:\n    if value is None:\n        return \"\"\n    return str(value).strip()\n\n\ndef _rows(value: Any) -> list[dict[str, Any]]:\n    if isinstance(value, list):\n        items = value\n    elif isinstance(value, dict):\n        items = list(value.values())\n    elif value is None:\n        return []\n    else:\n        raise TypeError(\"collection input must be a list or object map\")\n    if any(not isinstance(item, dict) for item in items):\n        raise TypeError(\"collection rows must be objects\")\n    rows = [dict(item) for item in items]\n\n    def _order(row: dict[str, Any]) -> tuple[int, int]:\n        try:\n            return (0, int(row.get(\"sequence_no\")))\n        except (TypeError, ValueError):\n            return (1, 0)\n\n    return sorted(rows, key=_order)\n\ndef _strings(value: Any) -> list[str]:\n    if not isinstance(value, list):\n        return\
          \ []\n    return [str(item).strip() for item in value if str(item).strip()]\n\n\ndef _safe(value: Any) -> str:\n    text = _text(value)\n    replacements = {\n        \"structured_output\": \"结构化结果\",\n        \"report_evidence_pack\": \"报告证据包\",\n        \"mechanical_validation_issues\": \"机械一致性事项\",\n        \"renderer_payload_sha256\": \"渲染载荷校验值\",\n        \"ABI\": \"接口合同\",\n    }\n    for internal, public in replacements.items():\n        text = text.replace(internal, public)\n    node_terms = {\n        \"3B\": \"详细实施方式初稿\",\n        \"3C\": \"代理师级实施方式终稿\",\n        \"3V\": \"具体实施方式机械核验\",\n        \"4P\": \"说明书装配\",\n        \"5E\": \"最终机械核验\",\n        \"5R\": \"专业报告审查\",\n        \"5B\": \"报告渲染\",\n    }\n    for internal, public in node_terms.items():\n        text = re.sub(\n            rf\"(?<![A-Za-z0-9]){re.escape(internal)}(?![A-Za-z0-9])\",\n            public,\n            text,\n        )\n    text = re.sub(r\"\\b[0-9a-fA-F]{64}\\b\", \"校验值已省略\", text)\n    text\
          \ = re.sub(r\"(?m)^\\s*#{1,6}\\s*\", \"\", text)\n    text = re.sub(\n        r\"(?m)^\\s*(?:四[、.]|第四章|附录|结论)\\s*[:：]?\\s*\",\n        \"补充说明：\",\n        text,\n    )\n    return text.strip()\n\n\ndef _record_map(value: Any) -> dict[str, dict[str, Any]]:\n    return {\n        _text(row.get(\"record_id\")): row\n        for row in _rows(value)\n        if _text(row.get(\"record_id\"))\n    }\n\n\ndef _fallback(row: dict[str, Any], section: str) -> str:\n    subject = _safe(row.get(\"subject\")) or \"待复核事项\"\n    status = _safe(row.get(\"observed_status\")) or \"尚未形成完整专业结论\"\n    owner = _safe(row.get(\"owner\")) or \"unassigned\"\n    priority = _safe(row.get(\"priority\")) or \"P2\"\n    action = _safe(row.get(\"required_action\")) or \"由责任人复核并处理。\"\n    consequence = _safe(row.get(\"non_action_consequence\"))\n    prefix = \"支持评估补漏\" if section == \"article_26_4\" else \"审查补漏\"\n    return (\n        f\"- {prefix}｜{subject}：{status}；责任人={owner}；\"\n        f\"优先级={priority}；行动={action}\"\
          \n        + (f\"；未处理后果={consequence}\" if consequence else \"\")\n    )\n\n\ndef _valid_ids(\n    item: dict[str, Any],\n    records: dict[str, dict[str, Any]],\n    section: str,\n) -> list[str]:\n    return [\n        record_id\n        for record_id in _strings(item.get(\"covered_record_ids\"))\n        if record_id in records\n        and section in _strings(records[record_id].get(\"required_sections\"))\n    ]\n\n\ndef main(\n    final_spec_text: str = \"\",\n    article_26_3_review: Any = None,\n    article_26_4_review: Any = None,\n    confirmation_and_risk_items: Any = None,\n    report_record_catalog: Any = None,\n    report_coverage_manifest: Any = None,\n) -> dict[str, Any]:\n    records = _record_map(report_record_catalog)\n    manifest = (\n        report_coverage_manifest\n        if isinstance(report_coverage_manifest, dict)\n        else {}\n    )\n    covered_263: set[str] = set()\n    section_263 = (\n        article_26_3_review\n        if isinstance(article_26_3_review,\
          \ dict)\n        else {}\n    )\n    body_263: list[str] = []\n    summary_263 = _safe(section_263.get(\"summary\"))\n    assessment_263 = _safe(section_263.get(\"overall_assessment\"))\n    if assessment_263 or summary_263:\n        body_263.append(\n            f\"总体判断：{assessment_263 or 'manual_review_required'}。\"\n            + (f\"{summary_263}\" if summary_263 else \"\")\n        )\n    for item in _rows(section_263.get(\"findings\")):\n        valid = _valid_ids(item, records, \"article_26_3\")\n        if not valid:\n            continue\n        uncovered = [record_id for record_id in valid if record_id not in covered_263]\n        if not uncovered:\n            continue\n        covered_263.update(uncovered)\n        body_263.append(\n            \"- \"\n            + \"；\".join(\n                part\n                for part in [\n                    _safe(item.get(\"subject\")),\n                    _safe(item.get(\"finding\")),\n                    _safe(item.get(\"\
          enablement_impact\")),\n                    f\"责任人={_safe(item.get('owner'))}\",\n                    f\"优先级={_safe(item.get('priority'))}\",\n                    f\"行动={_safe(item.get('action'))}\",\n                    f\"未处理后果={_safe(item.get('non_action_consequence'))}\",\n                ]\n                if part and not part.endswith(\"=\")\n            )\n        )\n    for record_id in _strings(\n        manifest.get(\"required_article_26_3_record_ids\")\n    ):\n        if record_id in records and record_id not in covered_263:\n            body_263.append(_fallback(records[record_id], \"article_26_3\"))\n            covered_263.add(record_id)\n\n    section_264 = (\n        article_26_4_review\n        if isinstance(article_26_4_review, dict)\n        else {}\n    )\n    body_264: list[str] = []\n    summary_264 = _safe(section_264.get(\"summary\"))\n    assessment_264 = _safe(section_264.get(\"overall_assessment\"))\n    if assessment_264 or summary_264:\n        body_264.append(\n\
          \            f\"总体判断：{assessment_264 or 'manual_review_required'}。\"\n            + (f\"{summary_264}\" if summary_264 else \"\")\n        )\n    covered_264: set[str] = set()\n    rendered_claims: set[str] = set()\n    for item in _rows(section_264.get(\"claim_assessments\")):\n        claim_no = _safe(item.get(\"claim_no\"))\n        valid = _valid_ids(item, records, \"article_26_4\")\n        if not claim_no or claim_no in rendered_claims or not valid:\n            continue\n        rendered_claims.add(claim_no)\n        covered_264.update(valid)\n        body_264.append(\n            \"- \"\n            + \"；\".join(\n                part\n                for part in [\n                    f\"权利要求{claim_no}\",\n                    f\"支持状态={_safe(item.get('support_status'))}\",\n                    f\"清楚性={_safe(item.get('clarity_status'))}\",\n                    f\"简要性={_safe(item.get('conciseness_status'))}\",\n                    f\"保护范围确定性={_safe(item.get('scope_determinacy_status'))}\"\
          ,\n                    _safe(item.get(\"disclosure_support_summary\")),\n                    (\n                        \"Claims字面或推导特征=\"\n                        + \"、\".join(_strings(item.get(\"claim_only_or_inferred_features\")))\n                        if _strings(item.get(\"claim_only_or_inferred_features\"))\n                        else \"\"\n                    ),\n                    (\n                        \"未支持或待确认特征=\"\n                        + \"、\".join(_strings(item.get(\"unsupported_or_unconfirmed_features\")))\n                        if _strings(item.get(\"unsupported_or_unconfirmed_features\"))\n                        else \"\"\n                    ),\n                    (\n                        \"术语或标号事项=\"\n                        + \"、\".join(_strings(item.get(\"terminology_or_sign_issues\")))\n                        if _strings(item.get(\"terminology_or_sign_issues\"))\n                        else \"\"\n                    ),\n               \
          \     (\n                        \"清楚性或范围事项=\"\n                        + \"、\".join(_strings(item.get(\"clarity_and_scope_issues\")))\n                        if _strings(item.get(\"clarity_and_scope_issues\"))\n                        else \"\"\n                    ),\n                    f\"责任人={_safe(item.get('owner'))}\",\n                    f\"优先级={_safe(item.get('priority'))}\",\n                    f\"行动={_safe(item.get('action'))}\",\n                    f\"未处理后果={_safe(item.get('non_action_consequence'))}\",\n                ]\n                if part and not part.endswith(\"=\")\n            )\n        )\n    for claim_no in _strings(manifest.get(\"required_claim_nos\")):\n        if claim_no in rendered_claims:\n            continue\n        matching = [\n            row\n            for row in records.values()\n            if row.get(\"record_type\") == \"claim_review\"\n            and claim_no in _strings(row.get(\"claim_nos\"))\n        ]\n        if matching:\n\
          \            body_264.append(\n                f\"- 权利要求{claim_no}：尚未获得完整专业支持评估；\"\n                \"需代理师结合最终说明书段落、原始技术交底和Claims字面逐特征复核，\"\n                \"不得据此认定已获得支持。\"\n            )\n            covered_264.add(_text(matching[0].get(\"record_id\")))\n        rendered_claims.add(claim_no)\n    for record_id in _strings(\n        manifest.get(\"required_article_26_4_record_ids\")\n    ):\n        if record_id in records and record_id not in covered_264:\n            body_264.append(_fallback(records[record_id], \"article_26_4\"))\n            covered_264.add(record_id)\n\n    section_risk = (\n        confirmation_and_risk_items\n        if isinstance(confirmation_and_risk_items, dict)\n        else {}\n    )\n    body_risk: list[str] = []\n    covered_risk: set[str] = set()\n    for item in _rows(section_risk.get(\"items\")):\n        valid = _valid_ids(item, records, \"confirmation_risk\")\n        uncovered = [record_id for record_id in valid if record_id not in covered_risk]\n\
          \        if not uncovered:\n            continue\n        covered_risk.update(uncovered)\n        body_risk.append(\n            \"- \"\n            + \"；\".join(\n                part\n                for part in [\n                    _safe(item.get(\"category\")),\n                    _safe(item.get(\"subject\")),\n                    (\n                        \"关联权利要求=\"\n                        + \"、\".join(_strings(item.get(\"linked_claim_nos\")))\n                        if _strings(item.get(\"linked_claim_nos\"))\n                        else \"\"\n                    ),\n                    _safe(item.get(\"confirmation_or_risk\")),\n                    f\"责任人={_safe(item.get('owner'))}\",\n                    f\"优先级={_safe(item.get('priority'))}\",\n                    f\"行动={_safe(item.get('action'))}\",\n                    f\"未处理后果={_safe(item.get('non_action_consequence'))}\",\n                ]\n                if part and not part.endswith(\"=\")\n            )\n\
          \        )\n    for record_id in _strings(\n        manifest.get(\"required_confirmation_record_ids\")\n    ):\n        if record_id in records and record_id not in covered_risk:\n            body_risk.append(_fallback(records[record_id], \"confirmation_risk\"))\n            covered_risk.add(record_id)\n    if not body_263:\n        body_263.append(\"未获得可核验的专业审查结论，需代理师复核。\")\n    if not body_264:\n        body_264.append(\"未获得可核验的逐Claim支持结论，需代理师复核。\")\n    if not body_risk:\n        body_risk.append(\"未形成可核验的确认事项清单，需代理师复核。\")\n    report = (\n        \"# 说明书生成报告\\n\\n\"\n        \"## 一、专利法第二十六条第三款审查\\n\\n\"\n        + \"\\n\".join(body_263)\n        + \"\\n\\n## 二、专利法第二十六条第四款审查\\n\\n\"\n        + \"\\n\".join(body_264)\n        + \"\\n\\n## 三、确认事项与风险提示\\n\\n\"\n        + \"\\n\".join(body_risk)\n    ).strip()\n    specification = _text(final_spec_text)\n    combined = (\n        specification + \"\\n\\n---\\n\\n\" + report\n        if specification\n        else report\n    )\n\
          \    return {\n        \"report_markdown\": report,\n        \"combined_output\": combined,\n    }\n"
