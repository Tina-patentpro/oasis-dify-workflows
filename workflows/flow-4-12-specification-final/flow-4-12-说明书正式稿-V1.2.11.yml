    - data:
        code: "from __future__ import annotations\n\nimport re\nfrom typing import Any\n\n\ndef _s(value: Any) -> str:\n    if value is None:\n        return \"\"\n    return str(value).strip()\n\n\ndef _rows(value: Any) -> list[dict[str, Any]]:\n    if isinstance(value, dict):\n        items = list(value.values())\n    elif isinstance(value, list):\n        items = value\n    elif value is None:\n        items = []\n    else:\n        items = [value]\n    rows: list[dict[str, Any]] = []\n    for item in items:\n        if isinstance(item, dict):\n            rows.append(dict(item))\n        else:\n            rows.append({\"message\": _s(item), \"collection_type_error\": \"non_object_row\"})\n    def order(row: dict[str, Any]) -> tuple[int, int]:\n        try:\n            return (0, int(row.get(\"sequence_no\")))\n        except (TypeError, ValueError):\n            return (1, 0)\n    return sorted(rows, key=order)\n\n\ndef _strings(value: Any) -> list[str]:\n    if isinstance(value, dict):\n\
          \        items = list(value.values())\n    elif isinstance(value, list):\n        items = value\n    elif value is None:\n        items = []\n    else:\n        items = [value]\n    result: list[str] = []\n    for item in items:\n        if isinstance(item, dict):\n            text = _s(item.get(\"message\") or item.get(\"value\"))\n        else:\n            text = _s(item)\n        if text:\n            result.append(text)\n    return result\n\n\ndef _record_map(value: Any) -> dict[str, dict[str, Any]]:\n    rows = _rows(value)\n    result: dict[str, dict[str, Any]] = {}\n    for index, row in enumerate(rows, start=1):\n        normalized = dict(row)\n        normalized[\"sequence_no\"] = index\n        result[f\"R{index:06d}\"] = normalized\n    return result\n\n\ndef _integer(value: Any) -> int:\n    try:\n        return int(value)\n    except (TypeError, ValueError):\n        return 0\n\n\ndef _effective_length(text: str) -> int:\n    return len(re.sub(r\"[^0-9A-Za-z\\u4e00-\\\
          u9fff]+\", \"\", text))\n\n\ndef _technical_tokens(text: str) -> set[str]:\n    return set(re.findall(\n        r\"\\d+(?:\\.\\d+)?\\s*(?:mm|cm|m|kg|g|mg|μm|nm|℃|°C|%|V|A|Pa|kPa|MPa|s|min|h)?\",\n        text,\n        flags=re.IGNORECASE,\n    ))\n\n\ndef _assemble(rows: list[dict[str, Any]], number_field: str) -> str:\n    ordered = sorted(rows, key=lambda row: _integer(row.get(number_field)))\n    return \"\\n\\n\".join(_s(row.get(\"paragraph_text\")) for row in ordered if _s(row.get(\"paragraph_text\"))).strip()\n\n\ndef _model_refs(groups: list[Any]) -> set[str]:\n    refs: set[str] = set()\n    for group in groups:\n        for row in _rows(group):\n            for key, value in row.items():\n                if key.endswith(\"_ref\") and _s(value):\n                    refs.add(_s(value))\n    return refs\n\n\ndef main(\n    embodiment_paragraphs: Any = None,\n    final_paragraphs: Any = None,\n    draft_claim_coverage_map: Any = None,\n    final_claim_coverage_map: Any =\
          \ None,\n    final_quality_metrics: Any = None,\n    claim_derived_inferences: Any = None,\n    retained_inference_refs: Any = None,\n    new_inference_requests: Any = None,\n    claims_source_text: str = \"\",\n    claims_feature_spans: Any = None,\n    paragraph_plan: Any = None,\n    inference_allocation_plan: Any = None,\n    validated_technical_facts: Any = None,\n    validated_claim_literal_facts: Any = None,\n    inference_required_items: Any = None,\n    claim_disclosure_conflicts: Any = None,\n    terminology_map: Any = None,\n    reference_sign_register: Any = None,\n    model_entities: Any = None,\n    component_hierarchy: Any = None,\n    connection_relationships: Any = None,\n    spatial_relationships: Any = None,\n    functional_relationships: Any = None,\n    process_steps: Any = None,\n    state_transitions: Any = None,\n    signal_force_energy_paths: Any = None,\n    material_parameter_requirements: Any = None,\n    claim_feature_placement: Any = None,\n) -> dict[str,\
          \ Any]:\n    draft_rows = _rows(embodiment_paragraphs)\n    final_rows = _rows(final_paragraphs)\n    draft_coverage = _rows(draft_claim_coverage_map)\n    final_coverage = _rows(final_claim_coverage_map)\n    feature_rows = _rows(claims_feature_spans)\n    derived_rows = _rows(claim_derived_inferences)\n    requirement_rows = _rows(inference_required_items)\n    allocation_rows = _rows(inference_allocation_plan)\n    issues: list[dict[str, Any]] = []\n    draft_errors: list[str] = []\n    final_errors: list[str] = []\n\n    fact_refs = {_s(row.get(\"fact_id\")) for row in _rows(validated_technical_facts) if _s(row.get(\"fact_id\"))}\n    literal_refs = {_s(row.get(\"claim_literal_ref\")) for row in _rows(validated_claim_literal_facts) if _s(row.get(\"claim_literal_ref\"))}\n    inference_refs = {_s(row.get(\"inference_requirement_id\")) for row in requirement_rows if _s(row.get(\"inference_requirement_id\"))}\n    allowed_model_refs = _model_refs([\n        model_entities,\n \
          \       component_hierarchy,\n        connection_relationships,\n        spatial_relationships,\n        functional_relationships,\n        process_steps,\n        state_transitions,\n        signal_force_energy_paths,\n        material_parameter_requirements,\n        claim_feature_placement,\n    ])\n\n    def add(scope: str, issue: str, stage: str = \"global\") -> None:\n        issues.append({\"scope\": scope, \"issue\": issue, \"stage\": stage})\n        if stage == \"draft\":\n            draft_errors.append(issue)\n        elif stage == \"final\":\n            final_errors.append(issue)\n\n    def validate_paragraphs(rows: list[dict[str, Any]], number_field: str, stage: str) -> None:\n        numbers = [_integer(row.get(number_field)) for row in rows]\n        if not rows:\n            add(stage, \"paragraphs_empty\", stage)\n            return\n        if numbers != list(range(1, len(rows) + 1)):\n            add(stage, \"paragraph_numbers_not_continuous\", stage)\n   \
          \     seen_text: set[str] = set()\n        for index, row in enumerate(rows, start=1):\n            text = _s(row.get(\"paragraph_text\"))\n            if not text:\n                add(f\"{stage}_paragraph_{index}\", \"paragraph_text_empty\", stage)\n            if text in seen_text and text:\n                add(f\"{stage}_paragraph_{index}\", \"duplicate_paragraph\", stage)\n            seen_text.add(text)\n            refs = {\n                \"fact_refs\": (set(_strings(row.get(\"fact_refs\"))), fact_refs),\n                \"claim_literal_refs\": (set(_strings(row.get(\"claim_literal_refs\"))), literal_refs),\n                \"inference_refs\": (set(_strings(row.get(\"inference_refs\"))), inference_refs),\n                \"model_refs\": (set(_strings(row.get(\"model_refs\"))), allowed_model_refs),\n            }\n            if not any(refs[name][0] for name in (\"fact_refs\", \"claim_literal_refs\", \"inference_refs\")):\n                add(f\"{stage}_paragraph_{index}\"\
          , \"paragraph_without_fact_claim_or_inference_ref\", stage)\n            for name, (used, allowed) in refs.items():\n                for unknown in sorted(used - allowed):\n                    add(f\"{stage}_paragraph_{index}\", f\"unknown_{name}:{unknown}\", stage)\n\n    validate_paragraphs(draft_rows, \"paragraph_no\", \"draft\")\n    validate_paragraphs(final_rows, \"final_paragraph_no\", \"final\")\n\n    expected = {\n        (_s(row.get(\"claim_no\")), _s(row.get(\"feature_ref\"))): _s(row.get(\"feature_excerpt\"))\n        for row in feature_rows\n        if _s(row.get(\"claim_no\")) and _s(row.get(\"feature_ref\"))\n    }\n\n    def validate_coverage(rows: list[dict[str, Any]], stage: str) -> None:\n        observed: dict[tuple[str, str], list[dict[str, Any]]] = {}\n        for row in rows:\n            key = (_s(row.get(\"claim_no\")), _s(row.get(\"feature_ref\")))\n            observed.setdefault(key, []).append(row)\n        for key, excerpt in expected.items():\n \
          \           matches = observed.get(key, [])\n            if len(matches) != 1:\n                add(f\"{stage}_claim_feature:{key[0]}:{key[1]}\", \"atomic_feature_missing_or_duplicate\", stage)\n            elif _s(matches[0].get(\"feature_excerpt\")) != excerpt:\n                add(f\"{stage}_claim_feature:{key[0]}:{key[1]}\", \"atomic_feature_excerpt_changed\", stage)\n        for key in sorted(set(observed) - set(expected)):\n            add(f\"{stage}_claim_feature:{key[0]}:{key[1]}\", \"unknown_atomic_feature\", stage)\n\n    validate_coverage(draft_coverage, \"draft\")\n    validate_coverage(final_coverage, \"final\")\n\n    allocation_mode = {\n        _s(row.get(\"requirement_ref\")): _s(row.get(\"drafting_mode\"))\n        for row in allocation_rows\n        if _s(row.get(\"requirement_ref\"))\n    }\n    body_inference_refs = {\n        ref\n        for row in draft_rows\n        for ref in _strings(row.get(\"inference_refs\"))\n    } | {\n        ref\n        for row\
          \ in final_rows\n        for ref in _strings(row.get(\"inference_refs\"))\n    }\n    for row in derived_rows:\n        ref = _s(row.get(\"inference_requirement_ref\"))\n        status = _s(row.get(\"body_entry_status\"))\n        if allocation_mode.get(ref) == \"report_only\":\n            if status != \"not_entered\" or ref in body_inference_refs or _integer(row.get(\"destination_paragraph_no\")) > 0:\n                add(ref or \"report_only\", \"report_only_inference_entered_body\", \"draft\")\n                add(ref or \"report_only\", \"report_only_inference_entered_body\", \"final\")\n        elif status == \"entered\" and ref not in body_inference_refs:\n            add(ref or \"inference\", \"entered_inference_not_located_in_body\")\n\n    retained = set(_strings(retained_inference_refs))\n    derived_ids = {_s(row.get(\"inference_ref\")) for row in derived_rows if _s(row.get(\"inference_ref\"))}\n    for ref in sorted(retained - derived_ids):\n        add(ref, \"unknown_retained_inference_ref\"\
          , \"final\")\n    for ref in sorted(derived_ids - retained):\n        add(ref, \"draft_inference_not_retained\", \"final\")\n\n    draft_by_no = {_integer(row.get(\"paragraph_no\")): row for row in draft_rows}\n    for row in final_rows:\n        final_no = _integer(row.get(\"final_paragraph_no\"))\n        sources = [_integer(value) for value in row.get(\"source_draft_paragraph_nos\") or []]\n        source_rows = [draft_by_no[value] for value in sources if value in draft_by_no]\n        if not sources or len(source_rows) != len(sources):\n            add(f\"final_paragraph_{final_no}\", \"invalid_source_draft_paragraph_lineage\", \"final\")\n            continue\n        for field in (\"fact_refs\", \"claim_literal_refs\", \"inference_refs\", \"model_refs\", \"drawing_refs\"):\n            inherited = {ref for source in source_rows for ref in _strings(source.get(field))}\n            current = set(_strings(row.get(field)))\n            if not current.issubset(inherited):\n  \
          \              add(f\"final_paragraph_{final_no}\", f\"unregistered_{field}_added\", \"final\")\n\n    draft_text = _assemble(draft_rows, \"paragraph_no\")\n    final_text = _assemble(final_rows, \"final_paragraph_no\")\n    if _effective_length(final_text) < _effective_length(draft_text):\n        add(\"final\", \"3C_effective_length_less_than_3B\", \"final\")\n    for token in sorted(_technical_tokens(final_text) - _technical_tokens(draft_text)):\n        add(\"final\", f\"3C_unregistered_numeric_or_unit_token:{token}\", \"final\")\n\n    draft_valid = bool(draft_text) and not draft_errors\n    final_valid = bool(final_text) and not final_errors\n    if final_valid:\n        selected_text = final_text\n        selected_rows = final_rows\n        selected_coverage = final_coverage\n        selected_version = \"3C\"\n        selection_status = \"professional_final\"\n    elif draft_valid:\n        selected_text = draft_text\n        selected_rows = draft_rows\n        selected_coverage\
          \ = draft_coverage\n        selected_version = \"3B\"\n        selection_status = \"draft_fallback\"\n    elif final_text or draft_text:\n        use_final = bool(final_text) and _effective_length(final_text) >= _effective_length(draft_text)\n        selected_text = final_text if use_final else draft_text\n        selected_rows = final_rows if use_final else draft_rows\n        selected_coverage = final_coverage if use_final else draft_coverage\n        selected_version = \"3C_work_draft\" if use_final else \"3B_work_draft\"\n        selection_status = \"work_draft_only\"\n    else:\n        selected_text = \"\"\n        selected_rows = []\n        selected_coverage = []\n        selected_version = \"none\"\n        selection_status = \"no_usable_embodiment\"\n\n    evidence_rows: list[dict[str, Any]] = []\n    for index, row in enumerate(selected_rows, start=1):\n        evidence_rows.append({\n            \"paragraph_no\": index,\n            \"paragraph_exact_excerpt\": _s(row.get(\"\
          paragraph_text\")),\n            \"fact_refs\": _strings(row.get(\"fact_refs\")),\n            \"claim_literal_refs\": _strings(row.get(\"claim_literal_refs\")),\n            \"inference_refs\": _strings(row.get(\"inference_refs\")),\n            \"model_refs\": _strings(row.get(\"model_refs\")),\n            \"drawing_refs\": _strings(row.get(\"drawing_refs\")),\n        })\n\n    claims_length = max(1, _effective_length(_s(claims_source_text)))\n    selected_length = _effective_length(selected_text)\n    ratio = round(selected_length / claims_length, 3)\n    detail_metrics = {\n        \"claims_effective_length\": claims_length,\n        \"draft_effective_length\": _effective_length(draft_text),\n        \"final_effective_length\": _effective_length(final_text),\n        \"selected_effective_length\": selected_length,\n        \"selected_to_claims_ratio\": ratio,\n        \"eight_to_ten_times_target_status\": \"met\" if ratio >= 8 else \"not_met\",\n        \"selection_status\"\
          : selection_status,\n    }\n    reconciliation = {\n        \"registered_requirement_count\": len(inference_refs),\n        \"derived_inference_count\": len(derived_rows),\n        \"retained_inference_count\": len(retained),\n        \"new_request_count\": len(_rows(new_inference_requests)),\n        \"report_only_body_violation_count\": sum(\n            1 for row in issues if row.get(\"issue\") == \"report_only_inference_entered_body\"\n        ),\n    }\n    return {\n        \"selected_embodiments\": selected_text,\n        \"selected_version\": selected_version,\n        \"selection_status\": selection_status,\n        \"validation_issues\": _record_map(issues),\n        \"validation_status\": \"pass\" if selection_status == \"professional_final\" else (\n            \"no_usable\" if selection_status == \"no_usable_embodiment\" else \"work_draft_with_issues\"\n        ),\n        \"final_paragraph_evidence\": _record_map(evidence_rows),\n        \"final_claim_coverage_map\"\
