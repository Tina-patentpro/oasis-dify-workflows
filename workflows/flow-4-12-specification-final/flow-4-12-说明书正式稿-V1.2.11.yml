    - data:
        code: "from __future__ import annotations\n\nimport re\nfrom typing import Any\n\n\ndef _s(value: Any) -> str:\n    if value is None:\n        return \"\"\n    if isinstance(value, str):\n        return value.replace(\"\\r\\n\", \"\\n\").replace(\"\\r\", \"\\n\").strip()\n    return str(value).strip()\n\n\ndef _norm(value: Any) -> str:\n    return re.sub(r\"\\s+\", \"\", _s(value))\n\n\ndef _substantive(value: Any) -> bool:\n    text = _s(value)\n    residue = re.sub(\n        r\"(?:技术领域|背景技术|发明内容|技术方案|有益效果|附图说明|具体实施方式|实施例|\"\n        r\"待补充|待填写|请填写|暂无|无|none|n/a|null|[\\s:：;；,.，。_\\-—=()（）【】\\[\\]])\",\n        \"\",\n        text,\n        flags=re.IGNORECASE,\n    )\n    return len(residue) >= 6\n\n\ndef main(\n    technical_file_text: str = \"\",\n    manual_technical_field: str = \"\",\n    manual_background_art_TD: str = \"\",\n    manual_technical_solution_TD: str = \"\",\n    manual_beneficial_effects_TD: str = \"\",\n    manual_drawings_explain_TD: str = \"\",\n    manual_embodiments_TD:\
          \ str = \"\",\n) -> dict[str, Any]:\n    file_text = _s(technical_file_text)\n    manual_sections = [\n        (\"技术领域\", _s(manual_technical_field)),\n        (\"背景技术\", _s(manual_background_art_TD)),\n        (\"技术方案\", _s(manual_technical_solution_TD)),\n        (\"有益效果\", _s(manual_beneficial_effects_TD)),\n        (\"附图说明\", _s(manual_drawings_explain_TD)),\n        (\"具体实施方式\", _s(manual_embodiments_TD)),\n    ]\n    blocks: list[str] = []\n    if _substantive(file_text):\n        blocks.append(\"## 技术交底文件原文\\n\" + file_text)\n    normalized_file = _norm(file_text)\n    for title, text in manual_sections:\n        if not _substantive(text):\n            continue\n        if normalized_file and _norm(text) in normalized_file:\n            continue\n        blocks.append(f\"## 手动补充：{title}\\n{text}\")\n    canonical = \"\\n\\n\".join(blocks)\n    return {\n        \"canonical_technical_source\": canonical,\n    }\n"
