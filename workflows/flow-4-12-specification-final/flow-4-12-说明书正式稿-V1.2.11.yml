          \    if isinstance(value, list):\n        items = value\n    elif isinstance(value, dict):\n        items = list(value.values())\n    elif value is None:\n        return []\n    else:\n        items = [value]\n    result: list[str] = []\n    for item in items:\n        if isinstance(item, dict):\n            text = _s(item.get(\"message\") or item.get(\"value\"))\n        else:\n            text = _s(item)\n        if text:\n            result.append(text)\n    return result\n\ndef _section(title: str, value: Any) -> str:\n    text = _s(value)\n    return f\"## {title}\\n\\n{text}\" if text else f\"## {title}\\n\\n\"\n\n\ndef _canonical(\n    title: str,\n    abstract: str,\n    technical_field: str,\n    background: str,\n    invention: str,\n    drawings: str,\n    embodiments: str,\n    claims: str,\n) -> str:\n    return \"\\n\\n\".join([\n        \"# \" + (title or \"发明名称待代理师确认\"),\n        _section(\"摘要\", abstract),\n        _section(\"技术领域\", technical_field),\n       \
