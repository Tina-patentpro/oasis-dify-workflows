    - data:
        code: "from __future__ import annotations\n\nimport re\nfrom typing import Any\n\n\ndef _s(value: Any) -> str:\n    if value is None:\n        return \"\"\n    return str(value).replace(\"\\r\\n\", \"\\n\").replace(\"\\r\", \"\\n\").strip()\n\n\ndef _substantive(value: Any) -> bool:\n    text = _s(value)\n    residue = re.sub(\n        r\"(?:技术领域|背景技术|发明内容|技术方案|有益效果|附图说明|具体实施方式|实施例|\"\n        r\"待补充|待填写|请填写|暂无|无|none|n/a|null|[\\s:：;；,.，。_\\-—=()（）【】\\[\\]])\",\n        \"\",\n        text,\n        flags=re.IGNORECASE,\n    )\n    return len(residue) >= 6\n\n\ndef _strings(value: Any) -> list[str]:\n    if isinstance(value, list):\n        return [_s(item) for item in value if _s(item)]\n    if isinstance(value, dict):\n        return [_s(item) for item in value.values() if _s(item)]\n    return []\n\n\ndef main(\n    technical_field: str = \"\",\n    background_art_TD: str = \"\",\n    technical_solution_TD: str = \"\",\n    beneficial_effects_TD: str = \"\",\n    drawings_explain_TD:\
          \ str = \"\",\n    embodiments_TD: str = \"\",\n    unclassified_material: str = \"\",\n    missing_sections: Any = None,\n    extraction_status: str = \"\",\n) -> dict[str, Any]:\n    sections = {\n        \"technical_field\": _s(technical_field),\n        \"background_art_TD\": _s(background_art_TD),\n        \"technical_solution_TD\": _s(technical_solution_TD),\n        \"beneficial_effects_TD\": _s(beneficial_effects_TD),\n        \"drawings_explain_TD\": _s(drawings_explain_TD),\n        \"embodiments_TD\": _s(embodiments_TD),\n        \"unclassified_material\": _s(unclassified_material),\n    }\n    missing = _strings(missing_sections)\n    observed_missing = [\n        key for key in (\n            \"technical_field\",\n            \"background_art_TD\",\n            \"technical_solution_TD\",\n            \"beneficial_effects_TD\",\n            \"drawings_explain_TD\",\n            \"embodiments_TD\",\n        )\n        if not _substantive(sections[key])\n    ]\n    for\
          \ item in observed_missing:\n        if item not in missing:\n            missing.append(item)\n    substantive_keys = [key for key, value in sections.items() if _substantive(value)]\n    core_keys = [\n        key for key in (\"technical_solution_TD\", \"embodiments_TD\", \"unclassified_material\")\n        if _substantive(sections[key])\n    ]\n    status = _s(extraction_status).lower()\n    if not substantive_keys:\n        status = \"empty\"\n    elif missing:\n        status = \"partial\"\n    elif status not in {\"success\", \"complete\"}:\n        status = \"success\"\n    warnings: list[str] = []\n    if status == \"empty\":\n        warnings.append(\"0F未抽取到实质技术内容；下游不得回读原素材。\")\n    if status == \"partial\":\n        warnings.append(\"0F抽取不完整；未抽取内容只能登记为缺口，不得回读原素材补写。\")\n    if _substantive(sections[\"unclassified_material\"]):\n        warnings.append(\"存在未归类技术材料，事实节点必须逐字核验后才能起草。\")\n    return {\n        **sections,\n        \"missing_sections\": missing,\n        \"extraction_status\"\
          : status,\n        \"extraction_warnings\": warnings,\n        \"technical_material_empty\": not bool(substantive_keys),\n        \"technical_core_empty\": not bool(core_keys),\n    }\n"
