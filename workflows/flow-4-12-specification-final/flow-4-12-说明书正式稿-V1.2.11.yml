        code: "from __future__ import annotations\n\nimport hashlib\nimport re\nfrom typing import Any\n\n\ndef _raw(value: Any) -> str:\n    if value is None:\n        return \"\"\n    return value if isinstance(value, str) else str(value)\n\n\ndef _substantive(value: Any) -> bool:\n    text = _raw(value)\n    return \"权利要求\" in text or \"其特征在于\" in text or bool(\n        re.search(r\"(?m)^\\s*\\d+\\s*[.、．]\", text)\n    )\n\n\ndef _claims(value: str) -> list[dict[str, str]]:\n    pattern = re.compile(\n        r\"(?ms)^\\s*(?:权利要求\\s*)?(\\d+)\\s*[.、．:：)）]\\s*(.*?)\"\n        r\"(?=^\\s*(?:权利要求\\s*)?\\d+\\s*[.、．:：)）]|\\Z)\"\n    )\n    rows: list[dict[str, str]] = []\n    for match in pattern.finditer(value):\n        claim_no = match.group(1)\n        claim_text = match.group(2).strip()\n        feature_parts = [\n            item.strip().rstrip(\"，,；;。\").strip()\n            for item in re.findall(r\"[^，,；;。]+[，,；;。]?\", claim_text)\n            if item.strip().rstrip(\"，,；;。\").strip()\n\
          \        ]\n        if not feature_parts and claim_text:\n            feature_parts = [claim_text]\n        for feature_index, feature_excerpt in enumerate(feature_parts, start=1):\n            rows.append({\n                \"claim_no\": claim_no,\n                \"feature_ref\": f\"CL{claim_no}-F{feature_index:03d}\",\n                \"feature_excerpt\": feature_excerpt,\n                \"claim_text\": claim_text,\n                \"claim_exact_excerpt\": feature_excerpt,\n            })\n    return rows\n\n\n\ndef _record_map(value: Any) -> dict[str, dict[str, Any]]:\n    if isinstance(value, dict):\n        items = list(value.values())\n    elif isinstance(value, list):\n        items = value\n    elif value is None:\n        items = []\n    else:\n        raise TypeError(\"collection output must be a list or object map\")\n    result: dict[str, dict[str, Any]] = {}\n    for index, item in enumerate(items, start=1):\n        if isinstance(item, dict):\n            row =\
          \ dict(item)\n        else:\n            text = str(item).strip()\n            row = {\"message\": text}\n        row[\"sequence_no\"] = index\n        result[f\"R{index:06d}\"] = row\n    if len(result) != len(items):\n        raise ValueError(\"collection output lost records during map conversion\")\n    return result\n\n\ndef main(\n    claims_file_text: str = \"\",\n    manual_claims_text: str = \"\",\n) -> dict[str, Any]:\n    manual = _raw(manual_claims_text)\n    file_text = _raw(claims_file_text)\n    if manual.strip() and (_substantive(manual) or not _substantive(file_text)):\n        selected = manual\n    elif file_text.strip():\n        selected = file_text\n    else:\n        selected = \"\"\n    claim_spans = _claims(selected)\n    warnings: list[str] = []\n    if not selected:\n        warnings.append(\"未检测到权利要求文本。\")\n    elif not claim_spans:\n        warnings.append(\"权利要求文本存在，但未能按权利要求序号稳定解析。\")\n    return {\n        \"claims_source_text\": selected,\n      \
          \  \"claims_source_sha256\": hashlib.sha256(selected.encode(\"utf-8\")).hexdigest(),\n        \"claims_feature_spans\": _record_map(claim_spans),\n        \"claims_lock_warnings\": warnings,\n    }\n"
