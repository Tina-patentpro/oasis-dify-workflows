      - remote_url
      enabled: true
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 2
    opening_statement: 1.2.11：修复上一版本在5E因异构证据集合导致的运行失败，并修复上游结构化输出失效、具体实施方式误降级、Claims原子特征映射、report-only推导越界、纯文本附图状态误述和Token预算失控。保持33节点、44边、11个LLM、Claims锁定、三章报告和插件0.1.3。本版本尚未完成Dify导入、发布或真实运行。
