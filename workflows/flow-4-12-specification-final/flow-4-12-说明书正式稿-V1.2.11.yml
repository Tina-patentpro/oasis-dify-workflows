    - data:
        code: "from __future__ import annotations\n\nimport hashlib\nimport math\nimport re\nfrom typing import Any\n\n\ndef _s(value: Any) -> str:\n    if value is None:\n        return \"\"\n    return str(value)\n\n\ndef _rows(value: Any) -> list[dict[str, Any]]:\n    if isinstance(value, list):\n        return [item for item in value if isinstance(item, dict)]\n    if isinstance(value, dict):\n        return [item for item in value.values() if isinstance(item, dict)]\n    return []\n\n\ndef _semantic_text(value: str) -> str:\n    return re.sub(r\"\\s+\", \"\", value)\n\n\ndef _claim_ranges(text: str) -> list[dict[str, Any]]:\n    pattern = re.compile(\n        r\"(?ms)^\\s*(?:权利要求\\s*)?(\\d+)\\s*[.、．:：)）]\\s*.*?\"\n        r\"(?=^\\s*(?:权利要求\\s*)?\\d+\\s*[.、．:：)）]|\\Z)\"\n    )\n    return [\n        {\n            \"claim_no\": match.group(1),\n            \"start\": match.start(),\n            \"end\": match.end(),\n        }\n        for match in pattern.finditer(text)\n    ]\n\n\n\
          def _claim_no_for_offset(ranges: list[dict[str, Any]], offset: int) -> str:\n    for row in ranges:\n        if int(row[\"start\"]) <= offset < int(row[\"end\"]):\n            return str(row[\"claim_no\"])\n    return \"\"\n\n\ndef _clean_entity_name(value: str, known_names: list[str]) -> str:\n    text = value.strip()\n    for name in known_names:\n        if text.endswith(name):\n            return name\n    previous = \"\"\n    while previous != text:\n        previous = text\n        text = re.sub(\n            r\"^(?:包括|以及|其中|所述|设有|具有|包含|和|及|与|一个|一种|多个|若干)\",\n            \"\",\n            text,\n        ).strip()\n    return text\n\n\ndef _existing(\n    text: str,\n    ranges: list[dict[str, Any]],\n    entities: Any,\n) -> list[dict[str, Any]]:\n    known_names = sorted(\n        {\n            _s(row.get(\"entity_name\") or row.get(\"canonical_name\")).strip()\n            for row in _rows(entities)\n            if _s(row.get(\"entity_name\") or row.get(\"canonical_name\"\
          )).strip()\n        },\n        key=len,\n        reverse=True,\n    )\n    rows: list[dict[str, Any]] = []\n    for match in re.finditer(\n        r\"([\\u4e00-\\u9fffA-Za-z][\\u4e00-\\u9fffA-Za-z0-9_-]{0,30}?)\"\n        r\"[（(]\\s*(\\d+(?:[.-]\\d+)*|[A-Za-z]\\d+)\\s*[)）]\",\n        text,\n    ):\n        tail = text[match.end():match.end() + 8]\n        if re.match(\n            r\"\\s*(?:mm|cm|km|kg|mg|μm|nm|℃|°C|%|V|A|Pa|kPa|MPa|s|min|h)\\b\",\n            tail,\n            flags=re.IGNORECASE,\n        ):\n            continue\n        entity_name = _clean_entity_name(match.group(1), known_names)\n        if not entity_name:\n            continue\n        rows.append({\n            \"entity_name\": entity_name,\n            \"sign\": match.group(2),\n            \"exact_excerpt\": match.group(0),\n            \"origin\": \"claims_existing\",\n            \"claim_no\": _claim_no_for_offset(ranges, match.start()),\n        })\n    return rows\n\n\ndef _interval(values: list[int])\
          \ -> int:\n    unique = sorted(set(values))\n    if len(unique) >= 2:\n        positive = [value for value in unique if value > 0]\n        if positive:\n            return max(1, math.gcd(*positive))\n    if unique:\n        text = str(unique[0])\n        trailing_zeros = len(text) - len(text.rstrip(\"0\"))\n        return 10 ** trailing_zeros if trailing_zeros else 1\n    return 1\n\n\ndef _style(existing: list[dict[str, Any]]) -> tuple[str, dict[str, Any]]:\n    signs = [str(item[\"sign\"]) for item in existing]\n    numeric = [int(sign) for sign in signs if sign.isdigit()]\n    if signs and len(numeric) == len(signs):\n        return \"existing_numeric\", {\n            \"counter\": max(numeric),\n            \"increment\": _interval(numeric),\n        }\n    if signs and all(re.fullmatch(r\"\\d+(?:[.-]\\d+)+\", sign) for sign in signs):\n        parts = [\n            [int(item) for item in re.split(r\"[.-]\", sign)]\n            for sign in signs\n        ]\n        selected\
          \ = max(parts)\n        same_prefix = [\n            item[-1]\n            for item in parts\n            if len(item) == len(selected) and item[:-1] == selected[:-1]\n        ]\n        return \"existing_hierarchical\", {\n            \"parts\": selected,\n            \"separator\": \".\" if \".\" in signs[0] else \"-\",\n            \"increment\": _interval(same_prefix),\n        }\n    if signs and all(re.fullmatch(r\"[Ss]\\d+\", sign) for sign in signs):\n        values = [int(re.sub(r\"\\D\", \"\", sign)) for sign in signs]\n        return \"existing_step\", {\n            \"counter\": max(values),\n            \"increment\": _interval(values),\n            \"prefix\": signs[0][0],\n        }\n    if signs and all(\n        sign.isdigit() or re.fullmatch(r\"\\d+(?:[.-]\\d+)+\", sign)\n        for sign in signs\n    ):\n        root_values = [int(sign) for sign in signs if sign.isdigit()]\n        hierarchical = [\n            [int(item) for item in re.split(r\"[.-]\", sign)]\n\
          \            for sign in signs\n            if re.fullmatch(r\"\\d+(?:[.-]\\d+)+\", sign)\n        ]\n        child_values: dict[str, list[int]] = {}\n        for parts in hierarchical:\n            prefix = \".\".join(str(item) for item in parts[:-1])\n            child_values.setdefault(prefix, []).append(parts[-1])\n        return \"numeric_hierarchical_family\", {\n            \"counter\": max(root_values) if root_values else 0,\n            \"increment\": _interval(root_values) if root_values else 1,\n            \"separator\": \".\" if any(\".\" in sign for sign in signs) else \"-\",\n            \"child_values\": child_values,\n        }\n    if signs:\n        return \"mixed_conflict\", {}\n    return \"generated_sequential\", {\"counter\": 0, \"increment\": 1}\n\n\ndef _allocate_sign(\n    style: str,\n    state: dict[str, Any],\n    used_signs: set[str],\n    parent_sign: str = \"\",\n) -> str:\n    for _ in range(10_000):\n        if style in {\"existing_numeric\", \"\
          generated_sequential\"}:\n            state[\"counter\"] = int(state.get(\"counter\", 0)) + int(\n                state.get(\"increment\", 1)\n            )\n            candidate = str(state[\"counter\"])\n        elif style == \"existing_step\":\n            state[\"counter\"] = int(state.get(\"counter\", 0)) + int(\n                state.get(\"increment\", 1)\n            )\n            candidate = f\"{state.get('prefix', 'S')}{state['counter']}\"\n        elif style == \"existing_hierarchical\":\n            parts = [int(item) for item in state.get(\"parts\", [0])]\n            parts[-1] += int(state.get(\"increment\", 1))\n            state[\"parts\"] = parts\n            candidate = str(state.get(\"separator\", \".\")).join(\n                str(item) for item in parts\n            )\n        elif style == \"numeric_hierarchical_family\":\n            separator = str(state.get(\"separator\", \".\"))\n            if parent_sign:\n                prefix = parent_sign.replace(\"\
          -\", separator).replace(\".\", separator)\n                values = state.setdefault(\"child_values\", {}).setdefault(prefix, [])\n                next_value = (max(values) if values else 0) + _interval(values)\n                values.append(next_value)\n                candidate = f\"{prefix}{separator}{next_value}\"\n            else:\n                state[\"counter\"] = int(state.get(\"counter\", 0)) + int(\n                    state.get(\"increment\", 1)\n                )\n                candidate = str(state[\"counter\"])\n        else:\n            return \"\"\n        if candidate not in used_signs:\n            used_signs.add(candidate)\n            return candidate\n    return \"\"\n\n\ndef _search_scope(\n    source: str,\n    ranges: list[dict[str, Any]],\n    claim_no: str,\n) -> tuple[int | None, str]:\n    if claim_no:\n        matching = [row for row in ranges if str(row[\"claim_no\"]) == claim_no]\n        if len(matching) == 1:\n            start = int(matching[0][\"\
          start\"])\n            end = int(matching[0][\"end\"])\n            return start, source[start:end]\n        return None, \"\"\n    return 0, source\n\n\n\ndef _record_map(value: Any) -> dict[str, dict[str, Any]]:\n    if isinstance(value, dict):\n        items = list(value.values())\n    elif isinstance(value, list):\n        items = value\n    elif value is None:\n        items = []\n    else:\n        raise TypeError(\"collection output must be a list or object map\")\n    result: dict[str, dict[str, Any]] = {}\n    for index, item in enumerate(items, start=1):\n        if isinstance(item, dict):\n            row = dict(item)\n        else:\n            text = str(item).strip()\n            row = {\"message\": text}\n        row[\"sequence_no\"] = index\n        result[f\"R{index:06d}\"] = row\n    if len(result) != len(items):\n        raise ValueError(\"collection output lost records during map conversion\")\n    return result\n\n\ndef main(\n    claims_source_text: str =\
          \ \"\",\n    claims_source_sha256: str = \"\",\n    entities: Any = None,\n    figure_items: Any = None,\n) -> dict[str, Any]:\n    source = _s(claims_source_text)\n    source_sha = hashlib.sha256(source.encode(\"utf-8\")).hexdigest()\n    warnings: list[str] = []\n    if claims_source_sha256 and claims_source_sha256 != source_sha:\n        warnings.append(\"claims_source_sha256_mismatch\")\n    ranges = _claim_ranges(source)\n    existing = _existing(source, ranges, entities)\n    style, style_state = _style(existing)\n    register_by_key: dict[tuple[str, str], dict[str, Any]] = {}\n    for item in existing:\n        key = (str(item[\"entity_name\"]), str(item[\"sign\"]))\n        record = register_by_key.setdefault(key, {\n            \"entity_name\": key[0],\n            \"sign\": key[1],\n            \"origin\": item[\"origin\"],\n            \"claim_nos\": [],\n            \"figure_nos\": [],\n            \"style_basis\": style,\n        })\n        claim_no = str(item.get(\"\
          claim_no\", \"\"))\n        if claim_no and claim_no not in record[\"claim_nos\"]:\n            record[\"claim_nos\"].append(claim_no)\n    register = list(register_by_key.values())\n    used_signs = {str(item[\"sign\"]) for item in existing}\n    term_signs: dict[str, set[str]] = {}\n    sign_terms: dict[str, set[str]] = {}\n    for item in existing:\n        term_signs.setdefault(str(item[\"entity_name\"]), set()).add(str(item[\"sign\"]))\n        sign_terms.setdefault(str(item[\"sign\"]), set()).add(str(item[\"entity_name\"]))\n    for term, signs_for_term in term_signs.items():\n        if len(signs_for_term) > 1:\n            warnings.append(f\"same_entity_multiple_signs:{term}\")\n    for sign, terms_for_sign in sign_terms.items():\n        if len(terms_for_sign) > 1:\n            warnings.append(f\"same_sign_multiple_entities:{sign}\")\n    mapping_conflict = any(\n        item.startswith(\"same_entity_multiple_signs:\")\n        or item.startswith(\"same_sign_multiple_entities:\"\
          )\n        for item in warnings\n    )\n    insertions: list[dict[str, Any]] = []\n    supplemented: list[dict[str, Any]] = []\n    planned_occurrences: set[tuple[str, int, str]] = set()\n    if style != \"mixed_conflict\":\n        for row in _rows(entities):\n            if _s(row.get(\"requires_reference_sign\")).strip() != \"required\":\n                continue\n            term = _s(row.get(\"entity_name\") or row.get(\"canonical_name\")).strip()\n            exact = _s(row.get(\"claim_exact_excerpt\")).strip() or term\n            claim_no = _s(row.get(\"claim_no\")).strip()\n            if not term:\n                continue\n            if len(term_signs.get(term, set())) > 1:\n                warnings.append(f\"ambiguous_existing_sign_for_entity:{term}\")\n                continue\n            scope_start, scope = _search_scope(source, ranges, claim_no)\n            if scope_start is None:\n                warnings.append(f\"unknown_or_duplicate_claim_no:{claim_no or\
          \ 'empty'}\")\n                continue\n            positions = [\n                scope_start + match.start()\n                for match in re.finditer(re.escape(exact), scope)\n            ] if exact else []\n            if len(positions) != 1:\n                warnings.append(f\"ambiguous_or_missing_exact_excerpt:{term}\")\n                continue\n            term_positions = [\n                match.start()\n                for match in re.finditer(re.escape(term), exact)\n            ]\n            if len(term_positions) != 1:\n                warnings.append(f\"ambiguous_entity_inside_exact_excerpt:{term}\")\n                continue\n            offset = positions[0] + term_positions[0] + len(term)\n            following = source[offset:offset + 40]\n            if re.match(r\"\\s*[（(]\\s*(?:\\d+(?:[.-]\\d+)*|[A-Za-z]\\d+)\\s*[)）]\", following):\n                continue\n            occurrence_key = (claim_no, offset, term)\n            if occurrence_key in planned_occurrences:\n\
          \                warnings.append(f\"duplicate_marker_request:{claim_no}:{term}\")\n                continue\n            planned_occurrences.add(occurrence_key)\n            existing_for_term = sorted(term_signs.get(term, set()))\n            if existing_for_term:\n                sign = existing_for_term[0]\n                origin = \"claims_existing_reused\"\n            else:\n                parent_name = _s(row.get(\"parent_entity\")).strip()\n                parent_signs = sorted(term_signs.get(parent_name, set()))\n                parent_sign = parent_signs[0] if len(parent_signs) == 1 else \"\"\n                sign = _allocate_sign(\n                    style,\n                    style_state,\n                    used_signs,\n                    parent_sign=parent_sign,\n                )\n                origin = \"claims_style_supplemented\" if existing else \"industry_generated\"\n            if not sign:\n                warnings.append(f\"unable_to_allocate_reference_sign:{term}\"\
          )\n                continue\n            term_signs.setdefault(term, set()).add(sign)\n            inserted = f\"（{sign}）\"\n            insertions.append({\n                \"claim_no\": claim_no,\n                \"target_exact_excerpt\": exact,\n                \"start_offset\": offset,\n                \"end_offset\": offset,\n                \"inserted_text\": inserted,\n                \"entity_name\": term,\n                \"sign\": sign,\n            })\n            record = {\n                \"entity_name\": term,\n                \"sign\": sign,\n                \"origin\": origin,\n                \"claim_nos\": [claim_no] if claim_no else [],\n                \"figure_nos\": [],\n                \"style_basis\": style,\n            }\n            supplemented.append(record)\n            existing_record = register_by_key.get((term, sign))\n            if existing_record is not None:\n                if claim_no and claim_no not in existing_record[\"claim_nos\"]:\n\
          \                    existing_record[\"claim_nos\"].append(claim_no)\n            else:\n                register_by_key[(term, sign)] = record\n                register.append(record)\n    delivery = source\n    changes: list[dict[str, Any]] = []\n    for row in sorted(insertions, key=lambda item: int(item[\"start_offset\"]), reverse=True):\n        offset = int(row[\"start_offset\"])\n        before = delivery[max(0, offset - 40):offset]\n        after = delivery[offset:min(len(delivery), offset + 40)]\n        delivery = delivery[:offset] + str(row[\"inserted_text\"]) + delivery[offset:]\n        changes.append({\n            **row,\n            \"before_excerpt\": before,\n            \"after_excerpt\": after,\n        })\n    changes.reverse()\n    reconstructed = delivery\n    replay_ok = True\n    for row in sorted(insertions, key=lambda item: int(item[\"start_offset\"])):\n        offset = int(row[\"start_offset\"])\n        inserted_text = str(row[\"inserted_text\"])\n\
          \        if reconstructed[offset:offset + len(inserted_text)] != inserted_text:\n            replay_ok = False\n            break\n        reconstructed = (\n            reconstructed[:offset]\n            + reconstructed[offset + len(inserted_text):]\n        )\n    semantic_hash = hashlib.sha256(_semantic_text(source).encode(\"utf-8\")).hexdigest()\n    delivery_semantic_hash = hashlib.sha256(\n        _semantic_text(reconstructed).encode(\"utf-8\")\n    ).hexdigest()\n    if not replay_ok or reconstructed != source or delivery_semantic_hash != semantic_hash:\n        warnings.append(\"claims_semantic_hash_changed\")\n    figure_nos = [str(row.get(\"figure_no\", \"\")) for row in _rows(figure_items)]\n    return {\n        \"claims_source_text\": source,\n        \"claims_delivery_text\": delivery,\n        \"claims_source_sha256\": source_sha,\n        \"claims_delivery_sha256\": hashlib.sha256(delivery.encode(\"utf-8\")).hexdigest(),\n        \"claims_semantic_hash\": semantic_hash,\n\
          \        \"reference_sign_register\": _record_map(register),\n        \"supplemented_reference_signs\": _record_map(supplemented),\n        \"reference_sign_style_profile\": {\n            \"style\": style,\n            \"basis\": \"Claims已有标号\" if existing else \"Claims无标号，按跨文引用所需顺序编号\",\n            \"figure_nos\": figure_nos,\n            \"allocation_state\": style_state,\n        },\n        \"reference_sign_change_log\": _record_map(changes),\n        \"reference_sign_warnings\": _record_map(warnings),\n        \"claims_marker_status\": (\n            \"conflict\" if style == \"mixed_conflict\" or mapping_conflict\n            else \"provisional\" if changes\n            else \"unchanged\"\n        ),\n    }\n"
