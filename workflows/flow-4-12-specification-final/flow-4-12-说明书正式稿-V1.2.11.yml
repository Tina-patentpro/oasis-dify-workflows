          \        \"background\": _s(background_section),\n        \"invention\": _s(invention_section),\n        \"drawings\": _s(drawings_section),\n        \"embodiments\": _s(selected_embodiments),\n        \"claims\": _s(claims_delivery_text),\n    }\n    candidate = \"\\n\\n\".join([\n        \"# \" + title,\n        _section(\"摘要\", sections[\"abstract\"]),\n        _section(\"技术领域\", sections[\"technical_field\"]),\n        _section(\"背景技术\", sections[\"background\"]),\n        _section(\"发明内容\", sections[\"invention\"]),\n        _section(\"附图说明\", sections[\"drawings\"]),\n        _section(\"具体实施方式\", sections[\"embodiments\"]),\n        _section(\"权利要求书\", sections[\"claims\"]),\n    ]).strip()\n    issues = [\n        {\"scope\": key, \"issue\": \"section_empty\"}\n        for key, value in sections.items()\n        if not value\n    ]\n    return {\n        \"candidate_spec_text\": candidate,\n        \"invention_title\": title,\n        \"abstract_text\": sections[\"abstract\"\
          ],\n        \"technical_field_text\": sections[\"technical_field\"],\n        \"background_text\": sections[\"background\"],\n        \"invention_content_text\": sections[\"invention\"],\n        \"drawings_text\": sections[\"drawings\"],\n        \"embodiments_text\": sections[\"embodiments\"],\n        \"claims_delivery_text\": sections[\"claims\"],\n        \"claims_source_text\": _s(claims_source_text),\n        \"claims_source_sha256\": _s(claims_source_sha256),\n        \"claims_delivery_sha256\": _s(claims_delivery_sha256),\n        \"claims_semantic_hash\": _s(claims_semantic_hash),\n        \"assembly_issues\": issues,\n    }\n"
