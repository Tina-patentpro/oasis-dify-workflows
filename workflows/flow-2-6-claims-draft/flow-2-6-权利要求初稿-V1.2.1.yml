            \n### 已生成的核心独立权利要求文本（来自前序权利要求节点）\n\n{{#1769301001002.clean_text#}}\n\n---\n\n### 次要/2-6-3并列独立权利要求说明\n\n- 次要（并列）独立权利要求是否存在，以及其技术骨架和分组边界，必须以\
            \ `parallel_independent_claims` 的结构化内容为准。\n- 即使 `2-6-3并列独立权利要求` 被条件分支跳过，你也必须把这视为合法路径，而不是异常。\n- 当 `parallel_independent_claims`\
            \ 为空时，不得假设存在2-6-3并列独立权利要求文本。\n\n---\n\n### “技术交底书”包含以下部分（来自“技术交底书”节点）\n\n技术领域  \n{{#1770000100003.technical_field#}}\n\
            \n背景技术  \n{{#1770000100003.background_art_TD#}}\n\n技术方案  \n{{#1770000100003.technical_solutions#}}\n\n有益效果  \n\
            {{#1770000100003.beneficial_effects_TD#}}\n\n实施例  \n{{#1770000100003.embodiments_TD#}}\n\n附图说明  \n{{#1770000100003.drawings_explain_TD#}}\n\
            \n---\n\n## 输入说明（2-6-Outline 节点 structured_output 输出）\n\n> 提示：下面所有以字符串形式提供的变量，本质上都是 JSON 数组或 JSON 对象的文本表示。  \n\
            > 你需要在「心中」将它们解析为相应的 JSON 结构，用于理解和推理，**不要在输出中直接吐出 JSON**。\n\n---\n\n1）technical_problems（技术问题列表）  \n【输入变量：technical_problems】\n\
            \n你将收到一个名为 technical_problems 的上游结构化变量（由“2-6-Outline”节点 structured_output 输出）。  \n该字符串是一个 JSON 数组，请先在心中解析为数组，每个元素具有字段：\n\
            \n- id：技术问题编号，例如 \"TP1\"；\n- text：该技术问题的文字描述。\n\n解析后：\n\n1. 按原有顺序理解技术问题的先后关系，不要随意调整顺序；  \n2. 在内部建立“技术问题 → 技术方案\
            \ → 技术效果”的逻辑链条时，将 id 作为主索引，并结合 text 理解问题实质；  \n3. 在撰写从属权利要求时，技术问题内容主要用于内部校验，不需要直接出现在条款文本中。\n\n如果数组为空或内容明显无效，请在内部标记“上游未提供有效的技术问题列表”，但仍不得凭空创造新的技术问题编号或内容。\n\
            \n---\n\n2）elementary_features（基本特征 EF）  \n【输入变量：elementary_features】\n\n你将收到一个名为 elementary_features 的上游结构化变量（来自“2-6-Outline”节点\
            \ structured_output）。  \n该变量会以 JSON 形式呈现，请直接按数组理解，每个元素表示一个基本特征 EF，字段结构通常为：\n\n- id：EF 编号，例如 \"AA\"；  \n- entities：实体列表，每个实体包含：\
            \  \n  - id：实体编号，例如 \"E111\"；  \n  - text：实体/构件的文字描述；  \n- relations：EF 内部实体关系列表，每个关系包含：  \n  - id：关系编号，通常形如 \"\
            E111-E112\" 或类似形式；  \n  - from：起始实体编号；  \n  - to：目标实体编号；  \n  - text：关系描述；  \n- means：实现手段列表，每项包含：  \n  - id：手段编号，例如\
            \ \"WAAa\"；  \n  - text：手段描述；  \n- functions：功能列表，每项包含：  \n  - id：功能编号，例如 \"FAAa\"；  \n  - text：功能描述；  \n- effects：效果列表，每项包含：\
            \  \n  - id：效果编号，例如 \"RAAa\"；  \n  - text：效果描述。\n\n解析后：\n\n1. 将每个 EF 视为“实体 + 连接/关系 + 手段 + 功能 + 效果”的技术要素单元；  \n\
            2. 在理解技术方案和构造从属权利要求时，应以实体（entities）和实体关系（relations）为基础，优先抽取**结构和连接**相关的特征；  \n3. means / functions / effects 字段只用于你在内部理解“某结构为何存在”和“隐含的作用链条”，**不得直接将功能/效果性描述写入从属权利要求中**；\
            \  \n4. 保持 EF 编号及其含义的一致性，不要发明新的 EF 编号，也不要改变已有 EF 的技术含义。\n\n---\n\n3）entity_hierarchy_nodes（实体层级树节点）  \n【输入变量：entity_hierarchy_nodes】\n\
            \n你将收到一个名为 entity_hierarchy_nodes 的上游结构化变量（来自“2-6-Outline”节点 structured_output）。  \n该变量会以 JSON 形式呈现，请直接按数组理解，每个元素代表实体层级树中的一个节点，字段通常包括：\n\
            \n- tag：层级标签，例如 \"L0\"、\"L1\"、\"L2\"……，数字越小表示层级越高；  \n- id：实体编号，例如 \"E0\"、\"E1\"、\"E11\"、\"E111\" 等；  \n- parent_id：父节点实体编号，顶层节点通常为空字符串或\
            \ null；  \n- text：该实体层级对应的名称或说明（如有）。\n\n解析后：\n\n1. 在内部根据 tag 和 parent_id 重建“系统 → 子系统 → 部件 → 子部件”的层级结构树；  \n2.\
            \ 在撰写从属权利要求时，可利用该层级结构来组织“上位部件–下位部件”的引用关系，如“所述 X 包括 Y，Y 上设置有 Z”；  \n3. 不要随意改变层级关系或虚构新的父子关系；  \n4. 不要在权利要求中直接使用\
            \ L0/L1 等层级标签，它们仅用于内部结构理解。\n\n---\n\n4）entity_relations（实体关系表）  \n【输入变量：entity_relations】\n\n你将收到一个名为 entity_relations\
            \ 的上游结构化变量（来自“2-6-Outline”节点 structured_output）。  \n该变量会以 JSON 形式呈现，请直接按数组理解，每个元素表示系统级实体之间的一条关系，字段通常包括：\n\n- id：关系编号，通常形如\
            \ \"E1-E2\" 或类似形式；  \n- from：起始实体编号；  \n- to：目标实体编号；  \n- text：该关系的文字描述（如有）。\n\n解析后：\n\n1. 将这些关系视为不同实体/构件之间的连接、配合、安装、相对位置或信号/流体/力学等作用关系；\
            \  \n2. 在撰写从属权利要求时，可以基于这些关系生成结构限定，如“所述 A 通过螺栓连接在所述 B 上”、“所述 C 设置在所述 D 的一侧”等；  \n3. 若数组为空，应在内部标记“系统级实体关系未显式给出”，避免凭空杜撰复杂连接关系，只能从其他结构化信息和技术交底书中谨慎抽取。\n\
            \n---\n\n5）tech_element_table（技术要素表行）  \n【输入变量：tech_element_table】\n\n你将收到一个名为 tech_element_table 的上游结构化变量（来自“2-6-Outline”节点\
            \ structured_output）。  \n该变量会以 JSON 形式呈现，请直接按数组理解，每个元素对应技术要素表的一行，字段通常包括：\n\n- tp：技术问题编号，例如 \"TP1\"；  \n- macro：宏观特征编号，例如\
            \ \"A\"；  \n- ef：基本特征 EF 编号，例如 \"AA\"；  \n- entities_raw：原始实体串，例如 \"E111/E11211\"；  \n- entities：实体编号列表，例如 [\"\
            E111\", \"E11211\"]；  \n- means：实现手段编号或描述；  \n- function：功能编号或描述；  \n- effect：效果编号或描述；  \n- tech_effect：技术效果的编号或文字描述。\n\
            \n解析后：\n\n1. 将每一行理解为“针对某个技术问题 TP，由某宏观特征和 EF 及其实体/手段/功能/效果共同构成的一条解决路径”；  \n2. 在内部建立“技术问题→技术手段→技术效果”的链路时，以此表为主索引，不要擅自改变\
            \ TP–macro–EF 的对应关系；  \n3. 在撰写从属权利要求时，**只从 tech_element_table 中抽取实体和结构/参数相关信息**，function / effect / tech_effect\
            \ 仅用于内部理解，**不得以功能/效果性措辞写入条款**；  \n4. 不要编造表中不存在的新对应关系（例如新的 TP–EF 组合）。\n\n---\n\n6）core_independent_claim（核心独立权利要求骨架，两段式结构）\
            \  \n【输入变量：core_independent_claim】\n\n你将收到一个名为 core_independent_claim 的上游结构化变量（来自“2-6-Outline”节点 structured_output）。\
            \  \n该变量会以 JSON 形式呈现，请直接按对象理解，字段通常包括：\n\n- object_type：权利要求客体类型，例如“装置”、“系统”、“方法”、“弓头弹簧”等；  \n- preamble_features：前序部分特征列表（两段式中的“前序部分”），每项包含：\
            \  \n  - id：特征编号，例如 \"PF1\"；  \n  - text：该前序特征的文字描述，一般对应与“最接近的现有技术”共有的技术特征；  \n- characterizing_features：特征部分特征列表（两段式中的“其特征在于部分”），每项包含：\
            \  \n  - id：特征编号，例如 \"CF1\"；  \n  - text：区别技术特征的文字描述；  \n- derived_from_elements：来源 EF 列表，每项包含：  \n  - ref：对应的\
            \ EF 编号，例如 \"AA\"；  \n  - text：补充说明（如有）；  \n- （旧结构字段，可能存在也可能为空，仅供参考，不强制使用）：  \n  - essential_components：必需构件列表；\
            \  \n  - necessary_relations：必需关系列表；  \n  - necessary_actions：必需动作/步骤列表；  \n  - core_conditions：核心条件列表。\n\n解析后：\n\
            \n1. 将 core_independent_claim 视为“核心独立权利要求的两段式结构骨架”：  \n   - object_type + preamble_features：对应权利要求的前序部分（主题名称 +\
            \ 与最近现有技术共有的结构或用途）；  \n   - characterizing_features：对应“其特征在于”部分的区别技术特征。  \n2. 在为核心权利要求组生成从属权利要求时，应：  \n   - 以\
            \ characterizing_features 为基础，结合 derived_from_elements 和 tech_element_table / elementary_features，识别可进一步细化的结构和参数特征；\
            \  \n   - 保证从属权利要求不会改变或否定核心独权骨架，只是在其基础上逐步增加限定。  \n3. 不得对 core_independent_claim 中的前序部分和特征部分做结构性改写，只能在此基础上做“从属”层次的补充和细化。\n\
            \n---\n\n7）parallel_independent_claims（次要/2-6-3并列独立权利要求骨架）  \n【输入变量：parallel_independent_claims】\n\n你将收到一个名为 parallel_independent_claims\
            \ 的上游结构化变量（来自“2-6-Outline”节点 structured_output）。  \n该变量会以 JSON 形式呈现，请直接按数组理解，每个元素表示一个次要（并列）独立权利要求骨架，字段通常包括：\n\n\
            - id：次要独立权利要求编号，例如 \"PI1\"；  \n- object_type：该独立权利要求的客体类型；  \n- preamble_features：前序部分特征列表，每项包含：  \n  - id：特征编号，例如\
            \ \"PI1-PF1\"；  \n  - text：该前序特征的文字描述；  \n- characterizing_features：特征部分特征列表，每项包含：  \n  - id：特征编号，例如 \"PI1-CF1\"\
            ；  \n  - text：该次要方案相对于核心方案的区别技术特征描述；  \n- derived_from_elements：来源 EF 列表，每项：  \n  - ref：对应的 EF 编号，例如 \"AB\"； \
            \ \n  - text：补充说明（如有）。\n\n解析后：\n\n1. 将每个元素视为“一个完整的次要独立权利要求的两段式骨架”；  \n2. 在规划“次要权利要求组”从属条款时，应分别围绕每个 parallel_independent_claim\
            \ 构建独立的从属链条，不在不同次要方案之间交叉引用；  \n3. 在从属条款中不得改写这些次要骨架的核心内容，只能在其基础上增加结构/参数/材料/过程限定。\n\n---\n\n8）sub_claim_clusters（从属权利要求簇）\
            \  \n【输入变量：sub_claim_clusters】\n\n你将收到一个名为 sub_claim_clusters 的上游结构化变量（来自“2-6-Outline”节点 structured_output）。 \
            \ \n该变量会以 JSON 形式呈现，请直接按数组理解，每个元素表示一个从属权利要求簇，字段通常包括：\n\n- type：簇类型，通常为 \"structure\"、\"parameter\"、\"material\"\
            、\"process\"、\"function\" 等之一；  \n- id：簇编号，例如 \"SC1\"、\"SC2\"、\"SC3\" 等；  \n- features：从属特征列表，每项通常包含：  \n  - id：从属特征编号，例如\
            \ \"SC1-1\"；  \n  - text：从属特征的文字描述（通常是单条从属权利要求主体部分的候选语句或其核心技术内容）；  \n  - refines：（可选）被细化的上位特征编号，例如 \"SC1-1\"、\"\
            SC1-2\"；若为空则表示这是簇内的首级特征；  \n- derived_from：簇的来源信息（可为 null 或对象），如存在：  \n  - ref：来源编号，例如某实体 ID \"E11\"、某功能 ID \"\
            FAAa\" 或某 EF 编号等；  \n  - text：来源的补充说明（如有）。\n\n解析后：\n\n1. 将每个簇视为“围绕同一来源对象（实体/功能/参数/EF 等）的同类从属特征集合”；  \n2. 通过 features.refines\
            \ 在内部重建簇内的层次结构：  \n   - refines 为空的特征：适合作为“根据权利要求X所述的……，其中……”这一级的首级从属条款；  \n   - refines 指向簇内其他特征 id：适合作为在上位从属条款基础上再加一层的下位从属条款；\
            \  \n3. 在生成从属权利要求时：  \n   - type=\"structure\"/\"parameter\"/\"material\"/\"process\" 的特征是优先考虑的候选；  \n   - type=\"\
            function\" 的特征只可作为内部理解线索，如其 text 中包含功能/效果性表达时，必须转化为结构/参数/材料/过程限定后再使用；  \n4. 不得擅自合并不同簇的特征为一个从属条款，也不得将明显指向不同客体/模块的特征混写在同一从属权利要求中。\n\
            \n---\n\n9）implementation_elements（实施要素组合）  \n【输入变量：implementation_elements】\n\n你将收到一个名为 implementation_elements\
            \ 的上游结构化变量（来自“2-6-Outline”节点 structured_output）。  \n该变量会以 JSON 形式呈现，请直接按数组理解，每个元素表示一个实施要素组合，字段通常包括：\n\n- id：实施要素编号，例如\
            \ \"IME1\"；  \n- entity：关联的实体/构件编号，例如 \"E111\" 或 \"E126/E127\"；  \n- means：该实施方式采用的具体手段编号或描述；  \n- function：该实施方式实现的功能编号或描述；\
            \  \n- effect：该实施方式带来的效果编号或描述。\n\n解析后：\n\n1. 将每个实施要素视为“在某个实体上，通过特定结构/配置实现某种功能并产生某种效果”的实施片段；  \n2. 在撰写从属权利要求时，**只允许抽取其中与结构、连接方式、布置形式、数量等相关的信息**，将\
            \ function 和 effect 留在内部用于理解，不得用功能/效果性语言写入条款；  \n3. 对含有多个实体（如 \"E121/E126/E127\"）的实施要素，可据此识别“协同配合的构件组合”，并抽象为结构式描述；\
            \  \n4. 不得创作 implementation_elements 中不存在的全新实施要素编号或显著违背其内容的结构安排。\n\n---\n\n10）preferred_ranges（优选范围）  \n【输入变量：preferred_ranges】\n\
            \n你将收到一个名为 preferred_ranges 的上游结构化变量（来自“2-6-Outline”节点 structured_output）。  \n该变量会以 JSON 形式呈现，请直接按数组理解，每个元素表示一个优选范围或数值设定，字段通常包括：\n\
            \n- id：范围编号，例如 \"PR1\"；  \n- text：该优选范围的文字描述，通常包含具体数值、区间、比例或参数条件。\n\n解析后：\n\n1. 将这些内容视为从属权利要求中“参数和数值限定”的主要来源；\
            \  \n2. 在撰写从属权利要求时，应尽量保持 text 中的数值和范围边界精确，不随意调整数值大小、区间边界或单位；  \n3. 如果 preferred_ranges 为空，则在从属条款中避免凭空虚构具体数值，仅可使用来自实施例的明确数值或定性描述（但同样不得使用功能/效果性表述）。\n\
            \n---\n\n11）variations（变型方案）  \n【输入变量：variations】\n\n你将收到一个名为 variations 的上游结构化变量（来自“2-6-Outline”节点 structured_output）。\
            \  \n该变量会以 JSON 形式呈现，请直接按数组理解，每个元素表示一个变型实施方案，字段通常包括：\n\n- id：变型编号，例如 \"V1\"、\"V2\"；  \n- text：该变型方案的文字描述。\n\n\
            解析后：\n\n1. 将 variations 视作为从属权利要求提供“替代结构、替代材料或替代布置方式”的素材库；  \n2. 在撰写从属权利要求时，可将 text 中的变型内容提炼为结构/材料/参数/过程限定，例如“所述部件可以采用……材料”、“所述连接方式可采用……形式”；\
            \  \n3. 必须确保每个变型仍与核心发明构思保持一致，仅是对实现方式的变化，而不是另起炉灶的独立方案；  \n4. 避免用“可选地”、“优选地”的语句增加泛泛描述，应将变型转化为明确的技术特征限定。\n\n---\n\
            \n12）独立权利要求文本与分组依据  \n【输入变量：独立权利要求文本与结构化骨架】\n\n你将收到：  \n- 一个已生成的核心独立权利要求文本：`{{#1769301001002.clean_text#}}`； \
            \ \n- 以及结构化的 `parallel_independent_claims` 骨架，用于判断是否存在次要（并列）独立权利要求及其分组边界。\n\n解析和使用原则：\n\n1. `{{#1769301001002.clean_text#}}`\
            \ 是当前申请中已生成的核心独立权利要求的最终语言表达，你在本节点中不得修改其技术实质；  \n2. 是否存在2-6-3并列独立权利要求，必须由 `parallel_independent_claims` 的结构化内容判定，而不是依赖某个可能被条件分支跳过的文本变量；\
            \  \n3. 在生成从属权利要求时，应以核心独立权利要求文本和结构化骨架作为引用基础，在其基础上增加结构/参数/材料/过程限定；  \n4. 若 `parallel_independent_claims` 为空，则仅生成核心权利要求组的从属链，不得凭空扩展次要权利要求组。\n\
            \n---\n\n## 输入说明（技术交底书）\n\n> 以下说明与 4-1-1 节点保持一致，用于统一你对“技术交底书”各字段的理解。  \n> 这些内容**只用于内部理解和一致性校验，最终输出中不得直接复用原文。**\n\
            \n1）general 形式与整体用法  \n\n- 以上各字段通常以结构化 JSON、Markdown 或自然语言长文本形式提供，内部可能包含编号、小标题、列表或表格。  \n- 你应当把这些字段作为**原始技术事实的来源**：\
            \  \n  - 用于理解发明的背景、技术问题、核心技术方案和具体实施方式；  \n  - 用于校验2-6-Outline 节点 structured_output 输出的合理性和一致性。  \n- 在生成从属权利要求时，只能在内部使用这些内容进行分析与推理，**不得在输出中直接复述整段交底书原文**，也不要输出“技术领域”“背景技术”等栏目标题。\n\
            \n---\n\n2）technical_field（技术领域）\n\n- technical_field 提供本发明所属的技术领域或应用场景，例如“本发明涉及……领域”。  \n- 作用：  \n  - 帮助你确认权利要求客体类型是否合理（装置/系统/方法/用途等）；\
            \  \n  - 帮助你把握术语语境，避免跨领域误解。  \n- 注意：  \n  - 技术领域本身通常不构成区别技术特征，不应直接写入从属权利要求的限定部分；  \n  - 仅在需要限定发明对象的应用环境且该限定本身具有技术意义时，才考虑在独立权利要求前序部分中体现，在从属条款中一般不再重复。\n\
            \n---\n\n3）background_art_TD（背景技术）\n\n- background_art_TD 描述现有技术方案、典型结构和存在的问题。  \n- 作用：  \n  - 为识别“最近现有技术”和“已有技术特征”提供依据；\
            \  \n  - 用于判断哪些特征应视为前序部分中的共有特征。  \n- 使用原则：  \n  - 将与本发明方案重合的部分视为现有技术的共有技术特征，通常被纳入独立权利要求的前序部分，而不是从属权利要求新增内容；  \n\
            \  - 不要把背景技术中的缺陷或问题直接写进权利要求；  \n  - 不要把仅在背景技术中出现、而未进入本发明技术方案的特征写入权利要求。\n\n---\n\n4）technical_solutions（技术方案）\n\
            \n- technical_solutions 是本发明或实用新型的核心方案描述，是提取技术特征的**主信息源**之一。  \n- 作用：  \n  - 与 tech_element_table、elementary_features\
            \ 一起，用于识别解决技术问题的核心结构/步骤及其组合关系；  \n  - 帮助判断哪些特征属于最小必要技术特征集，哪些适合下沉到从属权利要求。  \n- 使用原则：  \n  - 若 technical_solutions\
            \ 与 core_independent_claim 或 parallel_independent_claims 的描述存在轻微措辞差异，以结构化骨架为主，technical_solutions 作为补充说明；  \n\
            \  - 如发现明显矛盾，在内部尽量以“更具体、更一致”的描述为准，但不得自行创造全新的结构；  \n  - 在生成从属权利要求时，优先从 technical_solutions 中抽取**可下沉的结构/参数/材料/过程细节**。\n\
            \n---\n\n5）beneficial_effects_TD（有益效果）\n\n- beneficial_effects_TD 描述相对于现有技术所获得的技术效果、优点或性能提升。  \n- 作用：  \n  - 帮助你在内部建立“技术问题\
            \ → 技术手段 → 技术效果”的逻辑链；  \n  - 帮助你识别哪些结构/步骤是为实现这些效果而必需的。  \n- 严格限制：  \n  - 有益效果内容**只用于内部推理，不得直接写入任何权利要求文本**；  \n\
            \  - 不得在权利要求中出现“本发明具有……有益效果”“提高了……性能”等句式；  \n  - 你在本节点生成的从属权利要求中，必须严格杜绝所有功能性和效果性描述。  \n- 你应当做的是：  \n  - 将有益效果与\
            \ tech_element_table / elementary_features / implementation_elements 中的具体结构或步骤相对应；  \n  - 通过在从属权利要求中增加结构和参数限定，间接支持这些有益效果，而不是直接描述效果本身。\n\
            \n---\n\n6）embodiments_TD（实施例）\n\n- embodiments_TD 提供了本发明的具体实施方式、结构细节、材料选择、具体步骤等。  \n- 作用：  \n  - 为技术特征提供详细的支持和可实施性基础；\
            \  \n  - 帮助你区分“基本必要结构”与“优选或示例性结构”。  \n- 使用原则：  \n  - 结合大纲中的 sub_claim_clusters、implementation_elements、preferred_ranges，将实施例中的优选结构和参数匹配到相应簇和范围；\
            \  \n  - 独立权利要求通常只包含“最小必要技术特征集”，适合放入从属权利要求的部分应来自实施例中较具体的结构/参数/材料/过程描述；  \n  - 避免逐字照抄实施例长句，只抽取对解决技术问题和支撑有益效果具有实质性贡献的结构特征和参数限定。\n\
            \n---\n\n7）drawings_explain_TD（附图说明）\n\n- drawings_explain_TD 对各附图和标号进行了说明，例如“图1是……的结构示意图”“1 为……，2 为……”。  \n-\
            \ 作用：  \n  - 帮助你核对实体名称与结构层级，确认部件之间的连接关系、位置关系；  \n  - 为大纲中的 entity_hierarchy_nodes 和 entity_relations 提供交叉验证。 \
            \ \n- 使用原则：  \n  - 可以利用附图说明来确认构件之间的关系是否完整，但不得在权利要求中书写“如图1所示”“参见图2”等表述；  \n  - 不应以纯图号或附图说明中的描述作为唯一依据引入新的技术特征，必须与\
            \ technical_solutions / embodiments_TD 的内容相一致。\n\n---\n\n8）整体一致性与内部使用约束\n\n- 你应将技术交底书各字段与2-6-Outline 节点 structured_output\
            \ 输出（technical_problems、elementary_features、tech_element_table、sub_claim_clusters、core_independent_claim、parallel_independent_claims\
            \ 等）进行交叉验证：  \n  - 若差异仅为措辞，应统一为技术含义更清晰、与结构化大纲一致的理解；  \n  - 若存在明显冲突，在内部尽量做合理解释，但仍不得凭空创造与任一来源完全不一致的新方案或新特征。  \n\
            - 所有交底书字段仅用于你在内部理解与推理，**最终输出中只应出现经过提炼后的从属权利要求条款**，不得复述交底书原文或结构化标签名称。\n"
        - id: e81d6f56-0ef5-4ef4-b9fe-6a5a7a621401
          role: assistant
          text: '## 分支兼容约束


            1. `2-6-3并列独立权利要求` 可能因条件分支被跳过，这属于合法路径，而不是异常。

            2. 后续节点统一从模板转换节点 `2-6-3并列独立权利要求` 的 `output` 获取并列独权文本，不得直接依赖被条件分支跳过的节点输出。

            3. 次要（并列）独立权利要求是否存在，必须以 `parallel_independent_claims` 的结构化内容为准，并结合 `{{#1769200300001.output#}}` 是否为空进行使用判断。

            4. 当 `parallel_independent_claims` 为空时，你只能围绕核心独立权利要求组生成从属权利要求，不得凭空补出次要独权组或其从属链。

            5. 只有当结构化大纲中确有有效并列独权骨架且 `{{#1769200300001.output#}}` 非空时，才允许展开并列独权对应的从属权利要求组。

            6. 不得因为并列组缺失而预留空编号、空占位条款或说明文字。'
        - id: c8d57c64-6c4e-4753-8a44-9e0bc8d74231
          role: assistant
          text: '## 功能与效果语义收紧


            1. `sub_claim_clusters` 中 `type=function` 的簇，以及任何带有目的性或效果性语义的 feature，只能作为“反查结构来源和层级关系”的线索，不得原样写入从属权利要求。

            2. `implementation_elements`、`tech_element_table`、`beneficial_effects_TD` 中的 function/effect 语义，只能用来反查对应的实体、连接关系、步骤、材料或参数，不能直接当作条文素材。

            3. 若某个功能/效果片段无法稳定回溯到输入中已披露的结构、连接关系、材料、步骤或参数特征，则该片段不得写入从属权利要求。

            4. 最终输出的从属权利要求，只允许使用结构、参数、材料、过程和连接关系限定；禁止保留“用于、实现、提高、降低、抑制、破坏、改善、优化、增强”等目的性或效果性表述。

            5. 如果功能簇与结构簇发生冲突，优先保留能够直接落地为权利要求条文的结构/参数特征，而不是功能或效果描述。'
