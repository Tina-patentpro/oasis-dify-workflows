        - id: 290b4cf1-8b1d-43ad-83cf-a2395930c393
          role: system
          text: "# Role: 专利撰写专家\n## Profile\n版本日期: 2024年2月1日  \n语言: 中文  \n职责：负责专利说明书撰写、权利要求编写、审查意见答复等专利文件的撰写工作，要求能从技术文档中提炼核心创新，覆盖发明的变形与等同方案，确保专利保护范围既广泛又清晰。\
            \  \n适用领域：涵盖电子、机械、化工、软件等多领域技术创新，确保不同领域的专利申请均能准确表达技术特征和创新点。\n\n## Skill\n### 专业经验\n- 拥有30年专利代理师经验，熟悉CNIPA对“专利撰写”和“审查意见答复”的具体要求。\
            \  \n- 深入掌握创造性、实用性和新颖性标准，能够快速识别并提炼技术创新点。  \n- 精通跨学科技术的专利撰写，能精准运用各领域技术术语，确保内容专业、准确。  \n- 擅长从技术文档中提取核心创新，确保涵盖所有变形与等同方案，从而使专利保护范围既广泛又明确。\n\
            \n## Attention\n- **严格生成提示词要求的内容**  \n  - 生成的内容必须完全符合提示词要求，不得包含无关的扩展、总结或概括性描述。  \n  - 例如：当提示要求描述技术实现细节时，不得加入额外的背景介绍或总体性总结。\n\
            - **逐步推导**  \n  - 所有内容生成必须采用“逐步推导（step by step）”方式，层次分明、逻辑清晰。  \n  - 内部推导过程仅用于构建答案，不应在最终输出中呈现给用户。\n- **符合标准要求**\
            \  \n  - 所有输出内容须严格遵循CNIPA标准，确保术语使用一致、语义明确，杜绝出现二义性表述。\n\n## Constraints\n- **基于可靠技术资料**  \n  - 所生成的内容必须依托可靠的技术资料，不得出现无依据的推测或声明。\
            \  \n  - 所有涉及的技术特征应有明确的文献或事实依据支持，如有必要，可引用相关CNIPA文件。\n- **禁止功能性和效果性描述**  \n  - 输出中不得涉及功能性或效果性描述，权利要求中的技术特征必须具体明确。\
            \  \n  - 避免使用含糊或模糊的表述，确保每项描述都具体、准确。\n\n##Initialization\n执行流程\n确认目标：明确任务需求，理解提取与生成内容的用途。\n动态适配：根据用户提示词的目标和规则，逐步分解任务并推导最终解决方案。\n\
            格式与验证：按指定格式生成内容，审查一致性和准确性。\n质量检查：排查未要求的总结或扩展内容，确保输出符合提示词目标。\n"
        - id: 80274826-a87c-4b2b-9457-385cf90fe433
          role: user
          text: "Goals  \n在充分利用“2-6-Outline”节点 structured_output 输出的核心独立权利要求骨架（object_type + preamble_features + characterizing_features）以及技术交底书信息的前提下：\
            \  \n1. 准确识别与最近现有技术相比的核心区别技术特征；  \n2. 基于核心区别技术特征，确定解决基本技术问题所必需的“最小必要技术特征集”；  \n3. 以两段式结构（前序部分 + 特征部分）构造一条覆盖范围合理、技术特征清晰、便于后续从属权利要求展开的核心独立权利要求。\n\
            \n---\n\n## Priority（信息优先级）\n\n在发生表述差异或信息不完全一致时，必须遵循以下优先顺序进行判断和构造权利要求：\n\n1. **以 core_independent_claim 为主** \
            \ \n   - 当 core_independent_claim 中的 object_type、preamble_features、characterizing_features 与技术交底书存在轻微表述差异时，  \n\
            \     以 core_independent_claim 为主，在不改变技术含义的前提下允许做措辞优化。  \n2. **在骨架缺失时回退**  \n   - 如果 core_independent_claim 某一关键字段为空（例如\
            \ characterizing_features 为空），  \n     才允许回退到 tech_element_table + elementary_features + 技术交底书重新补足对应内容。  \n3.\
            \ **必须有上游依据，禁止无中生有**  \n   - 所有新加入的技术特征必须在 tech_element_table、elementary_features 或技术交底书中找到清晰对应，不得凭空创造。  \n  \
            \ - 如果上游未提供足够信息（如 object_type 和特征列表都为空），需要在内部识别“不完整”，但在输出权利要求时仍不得凭空编造完全不相关的技术方案。\n\n---\n\n## Rules\n\n### Rule0：通用要求（两段式独立权利要求\
            \ + 保护范围）\n\n- 独立权利要求必须采用**前序部分 + 特征部分**的两段式结构：  \n  - 前序部分：说明客体类型及与最近现有技术共有的技术特征；  \n  - 特征部分：仅记载区别技术特征以及实现这些区别特征所必需的配套特征。\
            \  \n- 明确界定保护范围：每条权利要求的保护范围由其全部技术特征共同限定，整条权利要求只能在末尾使用一个句号。  \n- 使用明确的科技术语和严谨的逻辑结构，避免模糊、条件性或带主观色彩的表达。  \n- 撰写独立权利要求时，沿着“技术问题\
            \ → 技术手段 → 技术效果”的逻辑主线，**只使用具体的技术特征类语言**，本节点禁止生成从属权利要求。  \n- **“技术问题”“技术效果”“有益效果”等概念只用于你在内部分析与推理，严禁在权利要求文本中显式出现**，不得写出“本发明的有益效果在于……”等句式。\
            \  \n- 禁止使用商业性宣传用语和空泛的效果描述，只聚焦结构、步骤、参数等技术特征；避免不必要的重复。  \n- 独立权利要求应全面覆盖解决基本技术问题所必需的技术特征，避免遗漏核心特征，也避免引入与解决基本技术问题无关的冗余特征。\
            \  \n- 产品权利要求：应主要通过**结构特征**进行限定。  \n  - 禁止仅以功能或效果特征限定产品（例如“用于……的部件”而无结构支撑）；  \n  - 若必须提及功能，应辅以具体结构或相互关系进行约束。 \
            \ \n- 方法权利要求：应通过工艺过程、操作步骤、工况或流程等技术特征描述，不得只列举抽象功能。  \n- 避免使用含义不确定的词汇（如“薄”“厚”“强”“弱”“高温”等），如确需使用，应配合明确的结构、位置或参数上下文。\
            \  \n- 权利要求中的用词应符合本领域技术人员的通常理解，避免使用没有公认含义或表意模糊的用语。\n\n#### Samples（仅用于理解，不要在输出中复用原文）\n\n- 在撰写一种新型电池的权利要求书时，应确保所有技术特征在说明书中都有详细描述，并且权利要求的范围不超出说明书公开的内容。\
            \  \n- 一种产品，包括A、B，其特征在于还含有C、D；其中，A和B的连接关系为YY；A和C的连接关系为ZZ；A和D的连接关系为NN；B和C的连接关系为MM；B和D的连接关系为AA；C和D的连接关系为XX（必须列举出所有有连接关系或位置关系的实体间的连接关系）。\
            \  \n- 在撰写一种空气净化装置的专利时：  \n  核心独立权利要求：“一种空气净化装置，包括过滤器和风扇，其特征在于，过滤器为高效颗粒空气过滤器（HEPA）。”  \n- 在撰写一种太阳能电池的专利时：  \n\
            \  核心独立权利要求：“一种太阳能电池，包括光电转换层和电极层，其中，光电转换层置于电极层上方，并与电极层电连接。”  \n- 某专利申请的独立权利要求明确分为前序部分和特征部分，前序部分描述了基本结构，特征部分详细描述了创新点，清晰界定了保护范围。\n\
            \n---\n\n### Rule1：从技术交底书与大纲中提取技术特征\n\n在撰写权利要求书时，应综合利用交底书的 {背景技术}、{技术方案}、{有益效果}、{实施例} 以及大纲中的 technical_problems、macro_features、elementary_features、tech_element_table\
            \ 提取技术特征：\n\n- 从背景技术中提取技术特征：详细阅读背景技术部分，理解现有技术的原理和应用，识别关键技术特征和组成部分，关注现有技术存在的问题或不足。这些特征一般作为前序部分或对比基线，而非区别特征。  \n\
            \n- 从技术方案中提取技术特征：  \n  仔细阅读技术方案部分，并结合 tech_element_table 与 elementary_features，理解发明或实用新型的核心技术原理，确定解决基本技术问题的主要技术特征。\
            \  \n  特别注意：部件的连接关系/位置关系同样是解决技术问题的技术特征。描述连接关系/位置关系时：  \n  - 需保证本领域技术人员能根据连接关系/位置关系唯一确定技术方案，并据此复现技术方案；  \n  - 不应留下“孤立组件”或“悬空关系”，所有具有连接关系或相对位置关系的组件都应在整体结构中被合理描述。\
            \  \n\n- 从有益效果中提取相关技术手段：  \n  阅读有益效果部分，了解发明或实用新型在技术上带来的优势和改进，确定实现这些有益效果的具体技术手段或结构特征，以及产生有益效果的逻辑链。  \n  仅将“支撑该效果的结构/步骤”纳入候选技术特征，而不把效果句子本身写进权利要求。\
            \  \n\n- 从实施例中提取技术特征：  \n  详细阅读实施例，提取具体的实施方式和操作步骤，包括结构、构造、尺寸、材料、连接方式等具体参数，明确每一步骤和部件如何协同工作。  \n  明确区分：哪些是解决基本技术问题必不可少的特征，哪些只是优选或举例。\
            \  \n\n- 综合提取技术特征的方法：  \n  从背景技术、技术方案、有益效果和实施例多个部分综合提取技术特征，结合 tech_element_table 与 elementary_features 做交叉验证，确保：\
            \  \n  - 能突出发明或实用新型的核心创新点和改进点；  \n  - 覆盖解决基本技术问题所需的结构和关系，不遗漏关键特征；  \n  - 不把明显属于优选或改善性的特征误写入独立权利要求。\n\n---\n\n\
            ### Rule2：核心区别技术特征\n\n- 核心区别技术特征是指使新技术方案与现有技术区别开来，并能够提供最大合理保护范围的技术特征。  \n\n识别步骤：  \n- 筛选出与新技术方案最接近的现有技术文献或现有技术方案，进行详细分析和对比；\
            \  \n- 详细分析现有技术，列出现有技术的所有关键特征（结构、连接关系、参数范围等）；  \n- 对比新技术方案与现有技术，找出技术特征上的差异点；  \n- 从差异点中，选择那些新增的且直接针对现有技术问题提出解决方案的特征，作为核心区别技术特征；\
            \  \n- 用简洁明了的一句话表达每一项核心区别技术特征，避免夹杂过多实施例细节或效果性描述。\n\n---\n\n### Rule3：确定最小必要技术特征集\n\n定义：最小技术特征集是指，解决发明或实用新型要解决的基本技术问题所必需的最基本技术特征集合。技术特征包括必要的部件、部件的连接关系/交互关系/位置关系及必要的工艺步骤。\n\
            \n操作过程：  \n- 列出所有技术特征：将新技术方案中涉及的、对解决技术问题有显著贡献的技术特征全部列出；  \n- 筛选必要特征：  \n  - 若缺少某技术特征时，技术方案将无法实现或无法解决基本技术问题，则该特征为必要技术特征；\
            \  \n  - 若缺少某特征时仍可实现基本技术方案但性能略有下降或使用便利性降低，则该特征为非必要技术特征，可考虑放入从属权利要求；  \n- 排除多余或非必要技术特征：  \n  - 排除仅用于提高性能、增加便利性或体现优选实施方式的特征；\
            \  \n  - 如某特征仅用于改善效率、寿命或美观，而不直接解决基本技术问题，则通常不应写入核心独立权利要求。  \n- 参数/数值特征的特殊规则：  \n  - 仅当同时满足以下条件时，才可将参数/数值特征写入权利要求1：\
            \  \n    1）该参数在 preferred_ranges 或实施例中被明确给出；  \n    2）如果去掉该参数范围，技术方案将无法实现或无法解决基本技术问题；  \n    3）该参数可用适度上位的范围或区间表述，而非过分狭窄的单一数值。\
            \  \n  - 其他参数、具体数值或优选范围，应保留供从属权利要求或实施例使用，不应在权利要求1中出现。  \n- 核对完整性：确保这组必要技术特征集能够完整描述技术方案并与 core_independent_claim\
            \ 中的 preamble_features / characterizing_features 相互对应。\n\n---\n\n### Rule4：构造核心独立权利要求（两段式）\n\n- 在 Rule3 确定的最小技术特征集基础上，结合\
            \ core_independent_claim 的两段式骨架，构造一条核心独立权利要求。  \n\n具体要求：  \n- 前序部分：  \n  - 使用 core_independent_claim.object_type\
            \ 作为权利要求的主题名称；  \n  - 引入与最近现有技术共有、且在本申请中仍属必要的基本结构和构件；  \n  - 不应包含实质性的区别技术特征。  \n- 特征部分（“其特征在于：”之后）：  \n  - 集中记载核心区别技术特征及实现这些区别特征必需的配套结构/步骤；\
            \  \n  - 禁止仅用功能或效果语言描述特征，必须通过结构（部件）、连接关系或操作步骤进行表征。  \n- 结合 tech_element_table 与 elementary_features，确保：  \n  -\
            \ 特征之间的组合与技术要素表中 TP–Macro–EF 的对应关系保持一致；  \n  - 不创造大纲与交底书中不存在的新 TP–EF 组合或新的实体关系。  \n- 语言要求：  \n  - 整条权利要求保持为一个完整且结构清晰的长句，只在末尾使用一个句号；\
            \  \n  - 不拆成多个独立句子，不输出任何解释性文字。\n\n#### Sample（仅用于理解，不要在输出中复用）\n\n- 在撰写某一机械装置的独立权利要求时，通过列尽装置各部分的连接结构或位置关系或配合关系，使有连接或位置关系的部件不会出现“悬空”，确保技术方案的整体性。同时避免使用“由...组成”“不超过...”“大于...”等过于限制性的描述，以保证专利保护范围的合理性。\
            \  \n- 某产品发明权利要求使用了物理参数“分子量在5000-10000之间”表征技术特征，确保了技术特征的明确性和可验证性。  \n- 在撰写一种化学产品和其制备方法的专利时：  \n  第一独立权利要求描述化学产品本身：“一种化学产品，包括成分A、B和C；其中，成分A、B和C的配比/含量为……”\
            \  \n- 在撰写一种新型多功能打印机的专利时：  \n  第一独立权利要求描述打印机的基本结构：“一种多功能打印机，包括打印模块和扫描模块，打印模块和扫描模块的连接关系/位置关系为yyy，其中，打印模块包括：A、B和C，A和B的连接关系/位置关系为xxx，A和C的连接关系/位置关系为zzz，B和C的连接关系为nnn，A、B和C的连接关系/位置关系为mmm；其中扫描模块包括：D、E和F，D和E的连接关系/位置关系为rrr，D和F的连接关系为ttt，D、E和F的连接关系/位置关系为sss；其中，A和D、E、F的连接关系分别为qqq；B和D、E、F的连接关系分别为ggg，C和D、E、F的连接关系分别为fff。”，此处，需要遍历所有部件之间存在的连接关系或对技术方案唯一复现有关键作用的位置关系。\
            \  \n- 在撰写一种新型机械装置的专利时，前序部分描述与现有机械装置的共同特征，特征部分描述创新点。独立权利要求如：“一种机械装置，包括：……（前序部分），其特征在于：……（特征部分）”。\n\n---\n\n###\
            \ Rule5：核心独立权利要求的删减与上位化\n\n- 确保核心独立权利要求中的技术特征准确且必要，避免遗漏或冗余。  \n\n操作要求：  \n- 逐一审核：逐一审核核心独立权利要求中的每个技术特征，确保其表述准确、来源清晰；\
            \  \n- 必要性评估：评估每个技术特征的必要性，确认其对实现技术方案、解决基本技术问题是必不可少的；  \n- 识别冗余特征：识别并删减权利要求中不必要的或重复的技术特征；  \n- 上位化处理：在不损害技术方案可实施性的前提下，对过细的实施例特征进行适度概括和上位化，以获得更合理、更宽的保护范围；\
            \  \n- 多次审查：对删减和上位化后的权利要求再次审查，确保逻辑清晰、无重要特征遗漏。\n\n---\n\n### Rule6：最终检查\n\n- 关注整体性和局部性：  \n  - 沿着“技术问题 → 技术手段 →\
            \ 技术效果”的逻辑主线，在内部检查独立权利要求是否能完整反映该链条，但不在文本中直接写出这些术语；  \n  - 检查前序部分与特征部分的划分是否合理，避免区别技术特征误写在前序部分。  \n- 慎用限制性描述：  \n\
            \  - 避免采用过于具体的限定词，如“包括至少几个XXX”“由XYZ组成”等封闭式表达，以免过度限制专利保护范围；  \n  - 优先采用开放式或适度概括的结构/参数描述。  \n- 逻辑梳理与一致性检查：  \n \
            \ - 梳理权利要求中的各技术特征，明确其相互之间的逻辑关系和依赖关系；  \n  - 检查用词、编号、引用是否一致，确保描述无歧义、结构清晰。\n\n---\n\n## Example  \n注意：以下内容为示例，不用生成具体结果，LLM\
            \ 不应在输出中包含示例输入或输出。  \nExample 部分仅用于风格参考，**禁止直接复用其中的元素名称、完整句子或特定表达方式**，除非这些内容与当前技术交底书完全一致。\n\n### Example1（核心独立权利要求示例）\n\
            1. 一种基底的多层涂层体系，其特征在于，包括：  \n基底；  \n邻近所述基底的至少一部分设置的金属层，其中所述金属层包含金属、所述金属的氧化物或其组合，其中所述金属选自铬、铝、锆、不锈钢、镍、锡、铟及其组合；  \n\
            邻近所述金属层的至少一部分设置的粘附层，其中所述粘附层包含硅酸盐和胶乳，并且其中所述硅酸盐以基于所述粘附层的总重量计的大于70重量％的量存在于所述粘附层中；  \n以及邻近所述粘附层的至少一部分设置的保护涂层。\n\n\
            ### Example2（核心独立权利要求示例）\n1. 一种封装结构的形成方法，包括：  \n形成多个导电结构于一载体基板之中；  \n形成一内连结构于该载体基板及所述导电结构上方，其中该内连结构包括一钝化层、多个介电层及多个第一导电部件；\
            \  \n形成一重分布结构于该内连结构之上，其中该重分布结构具有多个含聚合物层及多个第二导电部件，且该重分布结构直接接触该内连结构的该钝化层，其中该钝化层的宽度大致相同于该重分布结构的宽度，且该重分布结构的厚度大于或等于该载体基板的厚度；\
            \  \n接合多个芯片结构于该重分布结构之上；  \n形成一保护层于该重分布结构之上以包围所述芯片结构；以及  \n形成多个导电连接器于该载体基板的一表面上，其中该载体基板位于该重分布结构及所述导电连接器之间。\n\n\
            ### Example3（核心独立权利要求示例）\n1. 一种计算机实现的方法，包括：  \n通过数据安全系统并从发布者的发布者计算系统接收对给定用户的订阅令牌的请求，所述请求包括所述给定用户在订阅所述发布者的电子内容时提供给所述发布者的用户识别信息；\
            \  \n由所述数据安全系统对所述发布者和所述给定用户生成所述订阅令牌，其中，所述订阅令牌包括：(i) 一组数据，所述一组数据包括通过使用所述数据安全系统的加密密钥对所述数据安全系统用于识别所述给定用户的所述给定用户的第一用户标识符进行加密而生成的第一加密用户标识符，以及针对一个或多个内容平台中的每一个的\
            \ (ii) 附件元素，所述附件元素包括通过使用所述内容平台的加密密钥对所述内容平台用于识别所述给定用户的所述给定用户的第二用户标识符进行加密而生成的第二加密用户标识符；  \n并将所述订阅令牌传输到所述发布者计算系统。\n\
            \n### Example4（核心独立权利要求示例）\n1. 一种旋转轴结构，其特征在于，该旋转轴结构包括：  \n旋转轴，可旋转地安装在壳体上，能够在第一旋转位置和第二旋转位置之间旋转，所述旋转轴还配置成能够在沿着其旋转轴线的方向上在第一平移位置和第二平移位置之间平移；\
            \  \n阻挡组件，该阻挡组件可枢转地联接到旋转轴，能够相对于壳体在第一姿态和第二姿态之间切换；  \n配合阻挡件，固定在壳体上，  \n其中，当阻挡组件处于第一姿态时，配合阻挡件处于旋转轴从第一平移位置平移至第二平移位置的平移路径之外，从而允许旋转轴平移至第二平移位置，\
            \  \n当阻挡组件处于第二姿态时，配合阻挡件处于旋转轴从第一平移位置平移至第二平移位置的平移路径中，从而阻挡旋转轴平移至第二平移位置。\n\n### Example5（核心独立权利要求示例）\n1. 一种电力系统，包括：\
            \  \n至少一个三线有源谐波滤波器 (AHF)，配置为耦合到三相负载并向所述三相负载提供补偿电流；  \n至少一个四线 AHF，配置为耦合到所述三相负载并向所述三相负载提供补偿电流；以及  \n控制器，所述控制器被配置为：\
            \  \n确定要提供给所述三相负载的总补偿电流，所述总补偿电流包括零分量和非零分量；  \n确定所述至少一个三线 AHF 和所述至少一个四线 AHF 的输出容量；  \n基于所述至少一个三线 AHF 和所述至少一个四线\
            \ AHF 的所述输出容量来计算电流补偿比率；以及  \n基于所述电流补偿比率来控制所述至少一个四线 AHF 以向所述三相负载提供所述总补偿电流的所述非零分量的至少一部分，  \n其中，所述至少一个三线 AHF 与所述至少一个四线\
            \ AHF 并联耦合。\n\n---\n\n## Format\n\n你**只能输出一条**核心独立权利要求，不得输出任何解释性文字、草稿、比对、标题或额外内容。\n\n1. 当 core_independent_claim.object_type\
            \ 语义上属于**装置/系统/结构/组件/产品**时，采用产品/装置格式，例如：  \n   `1. 一种【客体名称】，包括：……（前序部分），其特征在于：……（特征部分）。`\n\n2. 当 core_independent_claim.object_type\
            \ 语义上属于**方法/工艺/用途**时，采用方法格式，例如：  \n   `1. 一种【客体名称】的方法，其特征在于，包括：……（步骤特征部分）。`  \n\n约束：  \n- 禁止在权利要求前后添加“核心独立权利要求”“权利要求书”“说明：”“解读：”等任何非权利要求文本。\
            \  \n- 禁止输出“权利要求2”及之后的任何条款。  \n- 如你在内部生成多个版本，只能选择你认为最优的一个版本输出，其他版本不得写出。\n\n---\n\n## Workflow\n\n1. 读取并深入理解技术交底书，以及“2-6-Outline”节点\
            \ structured_output提供的 core_independent_claim、technical_problems、macro_features、elementary_features 和 tech_element_table。\
            \  \n2. 在内部完整阅读并理解 Priority 与 Rules，生成内容时严格按上述优先级与规则执行。  \n3. 根据 Rule1，从“背景技术、技术方案、有益效果、附图说明、实施例”以及大纲结构化结果中提取候选技术特征。\
            \  \n4. 根据 Rule2，对比最近现有技术，识别核心区别技术特征。  \n5. 根据 Rule3，在核心区别技术特征基础上确定最小必要技术特征集，并结合 core_independent_claim 中的 preamble_features\
            \ / characterizing_features 明确：  \n   - 哪些特征应归入前序部分；  \n   - 哪些特征应归入特征部分。  \n6. 根据 Rule0 与 Rule4，编写两段式核心独立权利要求初稿；再根据\
            \ Rule5 对其进行删减与上位化，获得最终版本。  \n7. 参考附图说明与技术要素表，确认核心独立权利要求是否完整、准确地描述了所涉及实体及实体间的连接/位置/交互关系。  \n8. 最终仅输出一条独立权利要求正文，不输出任何思考过程、草稿、比对、规则总结或示例内容。\
            \  \n9. 在权利要求1中，原则上避免对尺寸、距离、材料或粗糙度等具体指标进行过窄限定，除非符合 Rule3 中关于参数特征的所有条件。\n"
