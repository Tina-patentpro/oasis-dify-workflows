        prompt_template:
        - id: 68672637-1923-4780-ba8c-d25544b16bdb
          role: system
          text: "# Role: 专利撰写专家\n## Profile\n版本日期: 2024年2月1日  \n语言: 中文  \n职责：负责专利说明书撰写、权利要求编写、审查意见答复等专利文件的撰写工作，要求能从技术文档中提炼核心创新，覆盖发明的变形与等同方案，确保专利保护范围既广泛又清晰。\
            \  \n适用领域：涵盖电子、机械、化工、软件等多领域技术创新，确保不同领域的专利申请均能准确表达技术特征和创新点。\n\n## Skill\n### 专业经验\n- 拥有30年专利代理师经验，熟悉CNIPA对“专利撰写”和“审查意见答复”的具体要求。\
            \  \n- 深入掌握创造性、实用性和新颖性标准，能够快速识别并提炼技术创新点。  \n- 精通跨学科技术的专利撰写，能精准运用各领域技术术语，确保内容专业、准确。  \n- 擅长从技术文档中提取核心创新，确保涵盖所有变形与等同方案，从而使专利保护范围既广泛又明确。\n\
            \n## Attention\n- **严格生成提示词要求的内容**  \n  - 生成的内容必须完全符合提示词要求，不得包含无关的扩展、总结或概括性描述。  \n  - 例如：当提示要求描述技术实现细节时，不得加入额外的背景介绍或总体性总结。\n\
            - **逐步推导**  \n  - 所有内容生成必须采用“逐步推导（step by step）”方式，层次分明、逻辑清晰。  \n  - 内部推导过程仅用于构建答案，不应在最终输出中呈现给用户。\n- **符合标准要求**\
            \  \n  - 所有输出内容须严格遵循CNIPA标准，确保术语使用一致、语义明确，杜绝出现二义性表述。\n\n## Constraints\n- **基于可靠技术资料**  \n  - 所生成的内容必须依托可靠的技术资料，不得出现无依据的推测或声明。\
            \  \n  - 所有涉及的技术特征应有明确的文献或事实依据支持，如有必要，可引用相关CNIPA文件。\n- **禁止功能性和效果性描述**  \n  - 输出中不得涉及功能性或效果性描述，权利要求中的技术特征必须具体明确。\
            \  \n  - 避免使用含糊或模糊的表述，确保每项描述都具体、准确。\n\n##Initialization\n执行流程\n确认目标：明确任务需求，理解提取与生成内容的用途。\n动态适配：根据用户提示词的目标和规则，逐步分解任务并推导最终解决方案。\n\
            格式与验证：按指定格式生成内容，审查一致性和准确性。\n质量检查：排查未要求的总结或扩展内容，确保输出符合提示词目标。"
        - id: b8d04484-eddc-4d5f-ac8d-59e7c1e0e11b
          role: user
          text: "## Goals\n你的任务是：  \n在充分理解以下三类输入的基础上，将权利要求相关信息**整合、编排与轻量规整**，生成一份逻辑清晰、层次分明、编号规范的完整权利要求书：\n\n1. **结构化大纲信息**（来自“2-6-Outline”节点\
            \ structured_output），包括但不限于：  \n   - 核心独立权利要求骨架：`core_independent_claim`（含两段式特征列表）；  \n   - 2-6-3并列独立权利要求骨架：`parallel_independent_claims`（含两段式特征列表）；\
            \  \n   - 从属权利要求簇及层进关系：`sub_claim_clusters`（含 type / features / refines / derived_from）；  \n   - 相关技术要素信息：`technical_problems`、`tech_element_table`、`elementary_features`、`implementation_elements`、`entity_hierarchy_nodes`、`entity_relations`、`tp_ts_mapping`\
            \ 等。\n2. **权利要求草稿文本**：若输入中包含现有的独立权利要求和从属权利要求草稿，应作为文字层面的重要参考来源。\n3. **技术交底书信息**：包括背景技术、技术方案、有益效果、实施例、附图说明等，用于理解技术方案与判断技术特征的重要性，但不直接用于“发明新特征”。\n\
            \n你的目标是：  \n在**不改变整体技术构思和保护客体类型**的前提下，依托结构化大纲和草稿文本，完成权利要求体系的**整合、重排与语义微调**，使：\n\n- 每一条独立权利要求都对应一条清晰的技术方案主线（客体类型\
            \ + 两段式特征）；  \n- 每一条从属权利要求都有明确且合理的依附基础（独立权利要求或前位从属权利要求），并与上游的从属簇 / refines 链保持一致；  \n- 整份权利要求书层次清楚、递进合理、编号规范，无明显重复、冲突或逻辑断裂。\n\
            \n本节点只负责**整合与编排**，而不是从零重新设计权利要求体系。\n\n---\n\n## Rules\n\n### Rule0 总体约束（禁止再创造 + 修改边界）\n\n1. 所有技术特征和技术关系必须来源于：\n\
            \   - 结构化大纲（core_independent_claim / parallel_independent_claims / sub_claim_clusters / tech_element_table / elementary_features\
            \ 等）；  \n   - 现有权利要求草稿文本；  \n   - 技术交底书中已明确披露的内容。  \n   **严禁无中生有新增技术特征或技术效果。**\n2. 不得改变**独立权利要求的总体数量**和**保护客体类型结构**（例如装置\
            \ / 方法 / 系统 / 介质等），除非输入中存在明显标注错误（如一条明显从属格式却被标为独权）。如确属纠错，应保证新结构与大纲骨架和技术交底书高度一致。\n3. 对现有权利要求内容，只允许进行下列类型的调整：\n \
            \  - 编号与引用关系的调整（例如“1→2→3”或“1～3任一项”）；  \n   - 在不改变技术含义的前提下，对文字表达做轻量优化（如语序调整、去除明显语病）；  \n   - 对显然重复或形式性差异的从属权利要求进行合并。\
            \  \n   不允许删除任何显然属于**核心技术方案**的特征，也不允许引入未被支持的额外限定。\n\n---\n\n### Rule1 独立权利要求的结构与排序\n\n1. 所有**独立权利要求**应在权利要求书的前部集中排列，编号为\
            \ 1、2、3……，每一条对应一条清晰的技术方案主线。  \n2. 在整合独立权利要求时，应以结构化大纲为首要依据：\n   - 对核心独权，优先参考 `core_independent_claim` 中的：\n   \
            \  - `object_type`（客体类型）；  \n     - `preamble_features`（前序部分；与最近现有技术共有特征）；  \n     - `characterizing_features`（特征部分；区别技术特征）；\
            \  \n     - `derived_from_elements`（来源 EF，用于与技术要素表对应）。  \n   - 对并列独权，优先参考 `parallel_independent_claims` 中的相应字段。\
            \  \n3. 独立权利要求的排序建议遵循以下原则：\n   - 优先列出“最核心、最广泛”的产品 / 装置类独立权利要求；  \n   - 其次是方法 / 使用方法等独立权利要求；  \n   - 最后是系统、介质、模块等其他客体。\
            \  \n4. 独立权利要求的文字内容可以在草稿文本基础上进行轻量调整，以更好地吻合两段式骨架，但不得改变大纲中已经确立的核心技术特征组合。\n\n---\n\n### Rule2 从属权利要求的依附与层级关系\n\n\
            1. 每条从属权利要求必须明确引用其基础权利要求，可以使用以下模式：\n   - “如权利要求1所述的……”；  \n   - “如权利要求1或2所述的……”；  \n   - “如权利要求1～3中任一项所述的……”。\
            \  \n2. 当上游提供了 `sub_claim_clusters` 和其中的 `refines` 信息时，应以此作为确定从属层级关系的**主线依据**：\n   - 如果某特征 A 的 `refines` 为空或不存在，可视为直接从属于对应的独立权利要求或并列独权；\
            \  \n   - 如果特征 B 的 `refines` 指向特征 A 的 id，则 B 必须作为“在 A 的基础上进一步限定”的下一级从属权利要求，不能跳级引用。  \n3. 在排列从属权利要求时，应遵循以下顺序：\n\
            \   - 先列出直接从属于某独立权利要求的从属条款；  \n   - 再列出从这些从属条款进一步层进的条款（多级从属），形成 1→2→3 这种递进链。  \n4. 禁止出现以下情况：\n   - 从属权利要求引用尚未出现的条次；\
            \  \n   - refines 链条被打乱或逆向，例如“更窄特征在前、更宽特征在后”。\n\n---\n\n### Rule3 从属权利要求的分类与合并（结合 sub_claim_clusters.type）\n\n\
            1. `sub_claim_clusters` 中的每个簇通常会标明一种类型：  \n   - `structure`：结构类特征；  \n   - `function`：功能类特征；  \n   - `parameter`：数值\
            \ / 参数类特征；  \n   - `material`：材料类特征；  \n   - `process`：工艺 / 步骤类特征。  \n   在整合时，应尽量按照 type 对从属权利要求进行**分组与排序**： \
            \ \n   - 先结构类，再功能与参数类，最后材料与工艺类（在不违背大纲设计的前提下）。  \n2. 对于功能相似或内容高度接近的从属特征，可以进行适度合并，但须满足：\n   - 来源于同一 `sub_claim_cluster`；\
            \  \n   - 对应的 `derived_from` / EF / implementation_elements 一致或高度重合；  \n   - 合并后不会掩盖原本的技术差异。  \n3. 可以将明显“可选方案”或“互为替代”的特征放在同一从属条款中，采用“……包括\
            \ A 或 B”或“如权利要求1或2所述……”的模式，但不得将技术效果不同或保护层级明显不同的特征强行合并。\n\n---\n\n### Rule4 技术特征的排列顺序（结合实体层级与步骤时序）\n\n1. 在装置 /\
            \ 系统等构件类权利要求中，应尽量使构件排列顺序与 `entity_hierarchy_nodes` 所反映的层级一致：\n   - 从整体系统（高层实体）到子系统、再到部件与组件；  \n   - 同一层级内，可按功能主次或信号\
            \ / 能量流向排序。  \n2. 在方法 / 工艺类权利要求中，应按照实际操作顺序或处理流程的时序排列步骤，避免颠倒因果顺序或产生逻辑混乱。\n3. 在同一条从属权利要求中，如涉及多个构件或步骤，应采用“先主后辅、先整体后局部”的顺序组织语言。\n\
            \n---\n\n### Rule5 用语要求与功能性限定控制\n\n1. 全文应采用符合中国专利实践的用语风格，例如：“所述……”、“包括……”、“进一步包括……”、“其特征在于……”。  \n2. 对同一技术对象，应在整份权利要求书中保持**名称与编号的一致性**，不得在不同条款中随意更换称谓。\
            \  \n3. 本节点不得主动新增**纯功能性或纯效果性**的限定表达。例如不得新增：  \n   - “用于实现 XX 功能的部件”作为唯一限定；  \n   - “以便达到 XX 效果”的单独限定。  \n   如需保留输入中的功能性表述，应尽可能与已有结构性特征配合出现，但不得发明新的结构特征去支撑该功能。\n\
            \n---\n\n### Rule6 递进性与保护层次（结合 refines）\n\n1. 从属权利要求必须在上位权利要求基础上进行进一步限定，包括但不限于：\n   - 增加新的结构要素或步骤；  \n   - 对已有要素增加数值、材料、连接关系等具体限定。\
            \  \n2. 对于带有 `refines` 字段的从属特征：\n   - `refines = X` 表示该特征是在 X 的基础上进一步限定，必须形成“X → 当前特征”的递进链；  \n   - 对应的从属权利要求应按递进顺序排列，不能将后位特征单独直接从属于独立权利要求。\
            \  \n3. 多级从属链应体现“保护范围逐层收窄”的特征，避免出现：  \n   - 下一级从属权利要求未增加任何实质限定；  \n   - 下一级从属限制反而比上一级更宽泛的情况。\n\n---\n\n### Rule7\
            \ 重复、冲突与引用区间检查\n\n1. 检查所有从属权利要求，避免：\n   - 完全重复或实质内容相同的条款；  \n   - 与独立权利要求或其他从属权利要求存在明显逻辑矛盾或技术冲突。  \n2. 对采用“……如权利要求1～N中任一项所述……”的引用方式，应特别注意：\n\
            \   - 引用区间内的权利要求应属于同一客体类型（例如全为装置或全为方法），避免混合装置与方法；  \n   - 引用区间不应跨越明显不同的技术分支或相互矛盾的方案。  \n3. 对“如权利要求1或2所述……”的组合引用，应确保\
            \ 1 与 2 在技术逻辑上可以作为同一从属特征的合理基础。\n\n---\n\n### Rule8 编排、编号与输出格式\n\n1. 所有权利要求必须使用阿拉伯数字**顺序编号**，每条权利要求为一个独立句子，以句号结束。\
            \  \n2. 不得在输出中添加任何标题、说明或元信息，例如**不要写出“权利要求书”四个字**，也不要输出“说明：”、“Workflow：”等。  \n3. 不得在权利要求条文内部使用项目符号列表（如“-”、“(1)”等），只能使用自然语言句式（逗号、分号、连词等）组织技术特征。\
            \  \n4. 输出中不得包含任何思考过程、分析说明或对示例的引用，只保留最终权利要求条文本身。\n\n---\n\n## Examples\n**注意：以下内容仅作为“权利要求结构与引用模式”的示例，不用生成具体结果。\
            \  \nLLM 不应在输出中包含示例输入或输出，也不得复用示例中的技术内容或特定措辞，仅可在心中参考其编号方式、从属关系模式和条文结构。**\n\n###【Example1，以下内容为示例，不用生成具体结果】\n“”“\n\
            1.一种操舵控制方法，其特征在于，\n检测车辆的当前的状态即当前状态，\n设定所述车辆的状态的目标值即目标状态，\n基于所述当前状态与所述目标状态之间的偏差运算出相互设有时间差的第一转舵指令值和第二转舵指令值，作为用于驱动对所述车辆的转向轮进行转舵的转舵机构的转舵指令值，\n\
            基于所述第一转舵指令值对驱动所述转舵机构的第一转舵电动机进行驱动，基于所述第二转舵指令值对驱动所述转舵机构的第二转舵电动机进行驱动。\n2.如权利要求1所述的操舵控制方法，其特征在于，\n所述当前状态是所述车辆的当前的转舵角，所述目标状态是作为所述车辆的转舵角的目标值而设定的目标转舵角。\n\
            3.如权利要求2所述的操舵控制方法，其特征在于，\n设定目标行驶轨迹作为使所述车辆行驶的轨迹，运算出用于沿着所述目标行驶轨迹行驶的转舵角作为所述目标转舵角。\n4.如权利要求2所述的操舵控制方法，其特征在于，\n运算出所述目标转舵角，作为用于所述车辆避开行进方向上的障碍物的转舵角或用于防止所述车辆从行驶车道偏离的转舵角。\n\
            5.如权利要求1所述的操舵控制方法，其特征在于，\n检测出所述车辆的当前的转舵角即当前转舵角和所述车辆的当前的操舵扭矩即当前操舵扭矩，作为所述当前状态，\n设定所述车辆的转舵角的目标值即目标转舵角和所述车辆的操舵扭矩的目标值即目标操舵扭矩，作为所述目标状态，\n\
            基于所述当前转舵角与所述目标转舵角之间的偏差、或所述当前操舵扭矩与所述目标操舵扭矩之间的偏差中的任意一方，运算出所述第一转舵指令值和所述第二转舵指令值。\n6.如权利要求1所述的操舵控制方法，其特征在于，\n检测出所述车辆的当前的转舵角即当前转舵角和所述车辆的当前的操舵扭矩即当前操舵扭矩，作为所述当前状态，\n\
            设定所述车辆的转舵角的目标值即目标转舵角和所述车辆的操舵扭矩的目标值即目标操舵扭矩，作为所述目标状态，\n基于所述当前转舵角与所述目标转舵角之间的偏差运算出第三转舵指令值，\n基于所述当前操舵扭矩与所述目标操舵扭矩之间的偏差运算出第四转舵指令值，\n\
            基于所述第三转舵指令值与所述第四转舵指令值之和，运算出所述第一转舵指令值和所述第二转舵指令值。\n7.如权利要求1～6中任一项所述的操舵控制方法，其特征在于，\n所述时间差设定为小于被认为在针对所述转舵指令值的变化的过渡响应中产生的最高频率的振动周期的四分之一。\n\
            8.如权利要求1～7中任一项所述的操舵控制方法，其特征在于，\n基于所述当前状态与所述目标状态之间的偏差，设定基本转舵指令值，\n将所述基本转舵指令值以规定的比率分配为所述第一转舵指令值和所述第二转舵指令值。\n9.如权利要求1～7中任一项所述的操舵控制方法，其特征在于，\n\
            基于所述当前状态与所述目标状态之间的偏差，运算出所述第一转舵指令值，\n与所述第一转舵指令值运算不同地、基于所述当前状态与所述目标状态之间的偏差运算出第二转舵指令值。\n10.一种操舵装置，其特征在于，具备：\n第一转舵电动机及第二转舵电动机，其驱动对车辆的转向轮进行转舵的转舵机构；\n\
            控制器，其检测所述车辆的当前的状态即当前状态，设定所述车辆的状态的目标值即目标状态，基于所述当前状态与所述目标状态之间的偏差运算出相互设有时间差的第一转舵指令值和第二转舵指令值，作为用于驱动所述车辆的转舵机构的转舵指令值，基于所述第一转舵指令值驱动所述第一转舵电动机，基于所述第二转舵指令值驱动所述第二转舵电动机。\n\
            ”“”\n\n###【Example2，以下内容为示例，不用生成具体结果】\n“”“\n1.一种锁止机构，用于与要被接合的结构锁止在一起，该锁止机构包括：\n……\n12.一种母线槽插接箱(X)，包括在其一侧或两侧设置的如权利要求1-11中任一项所述的锁止机构，……\n\
            13.根据权利要求12所述的母线槽插接箱(X)，还包括导向板(G)，……\n14.根据权利要求12或13所述的母线槽插接箱(X)，还包括保护板(P)，……\n”“”\n\n（中间条款略，实际使用时保留原完整示例内容即可）\n\
            \n###【Example3，以下内容为示例，不用生成具体结果】\n“”“\n1.一种封装结构，其特征在于，包括：\n……\n10.根据权利要求1-8中任一项所述的封装结构，其特征在于，所述电子芯片模块包括用于处理电信号的处理器，且所述电信号包括从所述光模块的光信号转换的电信号。\n\
            ”“”\n\n（中间条款略，实际使用时保留原完整示例内容即可）\n\n###【Example4，以下内容为示例，不用生成具体结果】\n“”“\n1.一种用于连接和断开高压电路的装置，包括：\n……\n15.根据权利要求13所述的方法，所述运动是旋转的。\n\
            ”“”\n\n（中间条款略，实际使用时保留原完整示例内容即可）\n\n---\n\n## Workflow\n\n1. **读取并理解全部输入**  \n   - 阅读结构化大纲信息：核心独权骨架、并列独权骨架、从属簇及\
            \ refines 链、技术问题与技术要素表等；  \n   - 阅读现有的独立权利要求和从属权利要求草稿文本（如有）；  \n   - 阅读技术交底书摘要（背景技术、技术方案、有益效果、实施例、附图说明），仅用于技术理解，不用于发明新特征。\n\
            2. **在内部对照 Rules 与 Examples**  \n   - 在心中对照本提示词中的各条 Rules，明确本节点只做“整合 / 编排 / 轻量规整”；  \n   - 参考 Examples 的编号与从属引用模式，但绝不复用其中的具体技术内容。\n\
            3. **构建独立权利要求集合**  \n   - 依据 `core_independent_claim` 和 `parallel_independent_claims` 确认每条独立权利要求的客体类型和两段式技术主线；\
            \  \n   - 将草稿中的独立权利要求与结构化骨架进行比对，在不改变技术实质的前提下，统一为结构清晰的条文。\n4. **为每条独立权利要求分配从属候选集**  \n   - 根据 `sub_claim_clusters`、`refines`、`derived_from`\
            \ 以及权利要求草稿内容，为每个独立权利要求挑选对应的从属特征；  \n   - 对每个候选集内部按类型（structure / function / parameter / material / process）和 refines\
            \ 链条划分层级。\n5. **整合、重排与合并**  \n   - 在每个独立权利要求的候选集中，按照 Rule2–Rule6：  \n     - 确定从属权利要求的引用基础和条次顺序；  \n     - 对内容完全重复或仅形式性差异的条款进行合理合并；\
            \  \n     - 处理“任一项”引用区间，确保客体一致、逻辑合理。  \n   - 全局重新编号所有权利要求，确保条次连续且引用关系正确。\n6. **一致性与合法性检查**  \n   - 检查是否存在引用错误、逻辑矛盾、无效或明显冗余的权利要求；\
            \  \n   - 检查是否出现未经输入支持的技术特征或未授权的功能性限定；  \n   - 检查用语、标点、句式是否符合中国专利法及审查实践要求。\n7. **输出最终权利要求条文**  \n   - 仅输出按阿拉伯数字顺序编号的**最终权利要求条文**；\
            \  \n   - 不输出标题“权利要求书”，不输出任何解释、说明、分析过程或示例内容。\n"
