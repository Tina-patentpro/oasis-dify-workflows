    - data:
        code: "import re\n\nCLAIM_HEADER_RE = re.compile(r'^\\s*##\\s*\\u6743\\u5229\\u8981\\u6c42\\u4e66\\s*$', re.MULTILINE)\n\
          TREE_HEADER_RE = re.compile(r'^\\s*##\\s*\\u6743\\u5229\\u8981\\u6c42\\u4f9d\\u8d56\\u6811\\s*$', re.MULTILINE)\n\
          CLAIM_LINE_RE = re.compile(r'^\\s*(\\d+)[\\.\\uFF0E\\u3001]\\s*(.*)$')\n\ndef _normalize_newlines(text: str) ->\
          \ str:\n    return (text or '').replace('\\r\\n', '\\n').replace('\\r', '\\n')\n\ndef _normalize_claim_line(line:\
          \ str) -> tuple[str, bool]:\n    m = CLAIM_LINE_RE.match(line)\n    if not m:\n        return line.strip(), False\n\
          \    return f\"{m.group(1)}. {m.group(2).strip()}\", True\n\ndef _split_claim_and_tree(text: str) -> tuple[str,\
          \ str]:\n    marker = '\\u6743\\u5229\\u8981\\u6c42\\u4f9d\\u8d56\\u6811'\n    if marker not in text:\n        return\
          \ text, ''\n    idx = text.find(marker)\n    return text[:idx].strip(), text[idx:].strip()\n\ndef _build_fallback_claims(claim_part:\
          \ str) -> list[str]:\n    lines = [x.strip() for x in claim_part.split('\\n') if x.strip()]\n    lines = [x for\
          \ x in lines if x != '\\u6743\\u5229\\u8981\\u6c42\\u4e66']\n    if not lines:\n        return ['1. \\u6839\\u636e\\\
          u4e0a\\u6e38\\u6587\\u672c\\u81ea\\u52a8\\u751f\\u6210\\u5360\\u4f4d\\u6743\\u5229\\u8981\\u6c42\\u3002']\n    merged\
          \ = re.sub(r'\\s+', ' ', ' '.join(lines)).strip()\n    if not merged:\n        return ['1. \\u6839\\u636e\\u4e0a\\\
          u6e38\\u6587\\u672c\\u81ea\\u52a8\\u751f\\u6210\\u5360\\u4f4d\\u6743\\u5229\\u8981\\u6c42\\u3002']\n    return [f\"\
          1. {merged}\"]\n\ndef main(raw_output: str) -> dict:\n    text = _normalize_newlines(raw_output).strip()\n    text\
          \ = text.replace('<br>', '\\n')\n    text = text.replace('&nbsp;', ' ').replace('\\\\xa0', ' ')\n    text = CLAIM_HEADER_RE.sub('\\\
          u6743\\u5229\\u8981\\u6c42\\u4e66', text)\n    text = TREE_HEADER_RE.sub('\\u6743\\u5229\\u8981\\u6c42\\u4f9d\\\
          u8d56\\u6811', text)\n\n    claim_part, tree_part = _split_claim_and_tree(text)\n    claim_lines = []\n    in_claims\
          \ = False\n    claim_found = False\n\n    for raw_line in claim_part.split('\\n'):\n        stripped = raw_line.rstrip()\n\
          \        plain = stripped.strip()\n        if plain == '\\u6743\\u5229\\u8981\\u6c42\\u4e66':\n            in_claims\
          \ = True\n            continue\n        if not in_claims and not plain:\n            continue\n        if not in_claims:\n\
          \            in_claims = True\n        normalized, ok = _normalize_claim_line(plain)\n        if ok:\n         \
          \   claim_found = True\n            claim_lines.append(normalized)\n        elif plain:\n            claim_lines.append(plain)\n\
          \n    if not claim_found:\n        claim_lines = _build_fallback_claims(claim_part)\n    else:\n        claim_lines\
          \ = [line for line in claim_lines if CLAIM_LINE_RE.match(line.strip())]\n        if not claim_lines:\n         \
          \   claim_lines = _build_fallback_claims(claim_part)\n\n    output_lines = ['\\u6743\\u5229\\u8981\\u6c42\\u4e66']\
          \ + claim_lines\n    if tree_part:\n        output_lines.append('')\n        output_lines.append('\\u6743\\u5229\\\
          u8981\\u6c42\\u4f9d\\u8d56\\u6811')\n        tree_lines = [x.rstrip() for x in tree_part.split('\\n')[1:] if x.strip()]\n\
          \        output_lines.extend(tree_lines)\n\n    output = '\\n'.join(output_lines)\n    output = re.sub(r'\\n{3,}',\
          \ '\\n\\n', output).strip()\n    if not output:\n        output = '\\u6743\\u5229\\u8981\\u6c42\\u4e66\\n1. \\u5185\\\
          u5bb9\\u5f85\\u8865\\u5145\\u3002'\n    return {'output': output}\n"
