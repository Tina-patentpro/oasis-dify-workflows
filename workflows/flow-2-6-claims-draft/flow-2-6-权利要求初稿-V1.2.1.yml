          \        claims.append((match.group(1), normalized[start:end].strip()))\n    return claims\n\ndef _insert_marker_once(body:\
          \ str, alias: str, marker: str):\n    if re.search(rf'{re.escape(alias)}\\s*[\\uFF08(]\\s*{re.escape(marker)}\\\
          s*[)\\uFF09]', body):\n        return body, False\n    pattern = re.compile(rf'{re.escape(alias)}(?!\\s*[\\uFF08(]\\\
