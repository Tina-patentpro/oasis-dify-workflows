    - data:
        code: "import re\n\n\nHEADING_RE = re.compile(\n    r'^\\s*(?:'\n    r'(?P<md>#{1,6})\\s*(?P<md_title>.+?)\\s*$'\n\
          \    r'|'\n    r'(?P<num>[一二三四五六七八九十百]+|[0-9]+)[、.．]\\s*(?P<num_title>.+?)\\s*$'\n    r'|'\n    r'(?P<bare_title>技术领域|技术背景|背景技术|现有技术|行业背景|现有技术描述|现有技术缺陷|技术方案|发明内容|实用新型内容|解决方案|方案描述|有益效果|技术效果|发明效果|具体实施方式|实施方式|实施例|附图说明|图示说明)\\\
          s*[:：]?\\s*$'\n    r')',\n    re.MULTILINE,\n)\n\nTITLE_ALIASES = {\n    'technical_field': ['技术领域'],\n    'background_art':\
          \ ['技术背景', '背景技术', '现有技术', '行业背景', '现有技术描述', '现有技术缺陷'],\n    'technical_solutions': ['技术方案', '发明内容', '实用新型内容', '解决方案',\
          \ '方案描述'],\n    'beneficial_effects': ['有益效果', '技术效果', '发明效果'],\n    'embodiments': ['具体实施方式', '实施方式', '实施例'],\n\
          \    'drawings_explain': ['附图说明', '图示说明'],\n}\n\n\ndef norm(value):\n    text = str(value or '')\n    text = text.replace('\\\
          r\\n', '\\n').replace('\\r', '\\n')\n    return text.strip()\n\n\ndef normalize_heading(title):\n    title = norm(title)\n\
          \    title = re.sub(r'\\s+', '', title)\n    title = title.replace('：', '').replace(':', '')\n    return title\n\
          \n\ndef classify_heading(title):\n    normalized = normalize_heading(title)\n    for key, aliases in TITLE_ALIASES.items():\n\
          \        for alias in aliases:\n            if normalized == normalize_heading(alias):\n                return key\n\
          \    return ''\n\n\ndef merge_blocks(blocks):\n    cleaned = [norm(x) for x in blocks if norm(x)]\n    return '\\\
          n\\n'.join(cleaned)\n\n\ndef main(file_text: str = '') -> dict:\n    text = norm(file_text)\n    result = {\n  \
          \      'technical_field_by_title': '',\n        'background_art_by_title': '',\n        'technical_solutions_by_title':\
          \ '',\n        'beneficial_effects_by_title': '',\n        'embodiments_by_title': '',\n        'drawings_explain_by_title':\
          \ '',\n    }\n    if not text:\n        return result\n\n    matches = list(HEADING_RE.finditer(text))\n    if not\
          \ matches:\n        return result\n\n    buckets = {\n        'technical_field': [],\n        'background_art':\
          \ [],\n        'technical_solutions': [],\n        'beneficial_effects': [],\n        'embodiments': [],\n     \
          \   'drawings_explain': [],\n    }\n\n    for idx, match in enumerate(matches):\n        title = match.group('md_title')\
          \ or match.group('num_title') or match.group('bare_title') or ''\n        bucket = classify_heading(title)\n   \
          \     if not bucket:\n            continue\n        start = match.end()\n        end = matches[idx + 1].start()\
          \ if idx + 1 < len(matches) else len(text)\n        body = norm(text[start:end])\n        if body:\n           \
          \ buckets[bucket].append(body)\n\n    result['technical_field_by_title'] = merge_blocks(buckets['technical_field'])\n\
          \    result['background_art_by_title'] = merge_blocks(buckets['background_art'])\n    result['technical_solutions_by_title']\
          \ = merge_blocks(buckets['technical_solutions'])\n    result['beneficial_effects_by_title'] = merge_blocks(buckets['beneficial_effects'])\n\
          \    result['embodiments_by_title'] = merge_blocks(buckets['embodiments'])\n    result['drawings_explain_by_title']\
          \ = merge_blocks(buckets['drawings_explain'])\n    return result"
