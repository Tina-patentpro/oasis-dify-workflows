          \     text = \"\"\n\n    return {\n        \"clean_text\": text,\n        \"had_sanitization\": bool(removed_patterns),\n\
          \        \"removed_patterns\": \", \".join(removed_patterns),\n        \"is_effectively_empty\": text == \"\",\n\
          \    }\n"
