          text: "## 输入内容\n\n### 大纲包含以下内容（来自“2-6-Outline”节点 structured_output）\n\n{{#1764588108416.structured_output.core_independent_claim#}}\n\
            {{#1764588108416.structured_output.elementary_features#}}\n{{#1764588108416.structured_output.tech_element_table#}}\n\
            {{#1764588108416.structured_output.technical_problems#}}\n{{#1764588108416.structured_output.macro_features#}}\n\
            \n---\n\n### 输入说明（2-6-Outline 节点 structured_output 输出）\n\n1）technical_problems（技术问题列表）  \n【输入变量：technical_problems】\n\
            \n你将收到一个名为 technical_problems 的上游结构化变量（由“2-6-Outline”节点 structured_output 输出）。  \n该变量会以 JSON 形式呈现，请直接按数组理解，每个元素具有字段：\n\
            - id：技术问题编号，例如 \"TP1\"；\n- text：该技术问题的文字描述。\n\n解析后：\n1. 按原有顺序理解技术问题的先后关系，不要随意调整顺序。\n2. 引用某个技术问题时，优先使用“id + text”的形式，例如“技术问题\
            \ TP1：……描述……”。\n\n如果数组为空或内容明显无效，请在内部标记“上游未提供有效的技术问题列表”，但仍不得凭空创造新的技术问题编号或内容。\n\n---\n\n2）macro_features（宏观技术特征）\
            \  \n【输入变量：macro_features】\n\n你将收到一个名为 macro_features 的上游结构化变量（来自“2-6-Outline”节点 structured_output）。  \n该变量会以\
            \ JSON 形式呈现，请直接按数组理解，每个元素具有字段：\n- id：宏观技术特征编号，例如 \"A\"、\"B\"；\n- text：该宏观特征的文字描述。\n\n解析后：\n1. 将每个宏观特征视为“整体方案/系统级方案”的抽象描述；\n\
            2. 在内部用其 id（如 A/B）指代不同方案方向，并结合 text 理解差异；\n3. 不要发明新的宏观特征编号，只使用数组中出现的 id。\n\n---\n\n3）elementary_features（基本特征\
            \ EF）  \n【输入变量：elementary_features】\n\n你将收到一个名为 elementary_features 的上游结构化变量（来自“2-6-Outline”节点 structured_output）。\
            \  \n该变量会以 JSON 形式呈现，请直接按数组理解，每个元素表示一个基本特征 EF，字段结构如下：\n- id：EF 编号，例如 \"AA\"；\n- entities：实体列表，每个实体包含：\n  - id：实体编号，例如\
            \ \"E111\"；\n  - text：实体/构件的文字描述；\n- relations：EF 内部实体关系列表，每个关系包含：\n  - id：关系编号，通常形如 \"E111-E112\"；\n  - from：起始实体编号；\n\
            \  - to：目标实体编号；\n  - text：关系描述；\n- means：实现手段列表，每项包含：\n  - id：手段编号，例如 \"WAAa\"；\n  - text：手段描述；\n- functions：功能列表，每项包含：\n\
            \  - id：功能编号，例如 \"FAAa\"；\n  - text：功能描述；\n- effects：效果列表，每项包含：\n  - id：效果编号，例如 \"RAAa\"；\n  - text：效果描述。\n\n\
            解析后，将每个 EF 视为“实体 + 连接/关系 + 手段 + 功能 + 效果”的技术要素单元。  \n当你理解技术方案或构造权利要求骨架时，应尽量从这些 EF 中抽取和组合内容，并保持编号和含义的一致，不要随意创造新的\
            \ EF 编号或改写其技术含义。\n\n---\n\n4）tech_element_table（技术要素表）  \n【输入变量：tech_element_table】\n\n你将收到一个名为 tech_element_table\
            \ 的上游结构化变量（来自“2-6-Outline”节点 structured_output）。  \n该变量会以 JSON 形式呈现，请直接按数组理解，每个元素对应技术要素表的一行，字段：\n- tp：技术问题编号，例如\
            \ \"TP1\"；\n- macro：宏观特征编号，例如 \"A\"；\n- ef：基本特征 EF 编号，例如 \"AA\"；\n- entities_raw：原始实体串，例如 \"E111/E11211\"；\n-\
            \ entities：实体编号列表，例如 [\"E111\", \"E11211\"]；\n- means：实现手段编号或描述；\n- function：功能编号或描述；\n- effect：效果编号或描述；\n- tech_effect：技术效果编号或标识或文字描述。\n\
            \n解析后：\n1. 将每一行理解为“针对某个技术问题 TP，由某宏观特征和 EF 及其实体/手段/功能/效果共同构成的一条解决路径”；  \n2. 在你内部构建“技术问题 → 技术手段 → 技术效果”的链条时，以此表为主要依据，不要偏离表中的对应关系；\
            \  \n3. 不要编造表中不存在的新对应关系（例如新的 TP–EF 组合）。\n\n---\n\n5）core_independent_claim（核心独立权利要求骨架，两段式结构）  \n【输入变量：core_independent_claim】\n\
            \n你将收到一个名为 core_independent_claim 的上游结构化变量（来自“2-6-Outline”节点 structured_output）。  \n该字符串是一个 JSON 对象，请直接按对象理解，字段包括：\n\
            \n- object_type：权利要求客体类型，例如“装置”、“系统”、“方法”、“弓头弹簧”等；\n- preamble_features：前序部分特征列表（两段式中的“前序部分”），每项包含：\n  - id：特征编号，例如\
            \ \"PF1\"；\n  - text：该前序特征的文字描述，一般对应与“最接近的现有技术”共有的技术特征；\n- characterizing_features：特征部分特征列表（两段式中的“其特征在于部分”），每项包含：\n\
            \  - id：特征编号，例如 \"CF1\"；\n  - text：区别技术特征的文字描述；\n- essential_components：必需构件列表（旧结构，可能为空），每项包含：\n  - id：构件编号，例如\
            \ \"EC1\"；\n  - text：构件的文字描述；\n- necessary_relations：必需关系列表（旧结构，可能为空），每项：\n  - id：关系编号；\n  - text：关系描述；\n- necessary_actions：必需动作/步骤列表（旧结构，可能为空），每项：\n\
            \  - id：动作编号；\n  - text：动作描述；\n- core_conditions：核心条件列表（旧结构，可能为空），每项：\n  - id：条件编号；\n  - text：条件描述；\n- derived_from_elements：来源\
            \ EF 列表，每项：\n  - ref：对应的 EF 编号，例如 \"AA\"；\n  - text：补充说明（如有）。\n\n解析后：\n1. 将 core_independent_claim 视为“核心独立权利要求的两段式结构骨架”：\
            \  \n   - object_type + preamble_features 对应权利要求的前序部分（主题名称 + 与最近现有技术共有的结构/用途）；  \n   - characterizing_features\
            \ 对应“其特征在于”部分（区别技术特征）。  \n2. 在构建或理解核心独立权利要求时，应：  \n   - 优先基于 preamble_features 和 characterizing_features 把握前序部分和特征部分的内容边界；\
            \  \n   - 通过 derived_from_elements，将区别技术特征与具体 EF、技术要素表行关联起来，确保每一项区别特征都有明确技术来源；  \n   - essential_components /\
            \ necessary_relations / necessary_actions / core_conditions 可作为辅助线索存在，有则参考，没有则不强求。  \n3. 如果 object_type 为空，且 preamble_features\
            \ 与 characterizing_features 同时为空，应在内部标记“核心骨架信息不完整”，但仍不得凭空构造完全无关的新技术方案。\n\n---\n\n### “技术交底书” 包含以下部分（来自上游“技术交底书”节点）\n\
            \n- 技术领域：{{#1770000100003.technical_field#}}  \n- 背景技术：{{#1770000100003.background_art_TD#}}  \n- 技术方案：{{#1770000100003.technical_solutions#}}\
            \  \n- 有益效果：{{#1770000100003.beneficial_effects_TD#}}  \n- 实施例：{{#1770000100003.embodiments_TD#}}  \n- 附图说明：{{#1770000100003.drawings_explain_TD#}}\n\
            \n#### 输入说明（技术交底书）\n\n1）general 形式与整体用法  \n\n- 以上各字段通常以结构化 JSON、Markdown 或自然语言长文本形式提供，内部可能包含编号、小标题、列表或表格。  \n\
            - 你应当把这些字段作为**原始技术事实的来源**：  \n  - 用于理解发明的背景、技术问题、核心技术方案和具体实施方式；  \n  - 用于校验2-6-Outline 节点 structured_output 输出的合理性和一致性。\
            \  \n- 在生成权利要求时，只能在内部使用这些内容进行分析与推理，**不得在输出中直接复述整段交底书原文**，也不要输出“技术领域”“背景技术”等栏目标题。\n\n2）technical_field（技术领域）\n\n\
            - technical_field 提供本发明所属的技术领域或应用场景，例如“本发明涉及……领域”。  \n- 作用：  \n  - 帮助你确认权利要求客体类型是否合理（装置/系统/方法/用途等）；  \n  - 帮助你把握术语语境，避免跨领域误解。\
            \  \n- 注意：  \n  - 技术领域本身通常不构成区别技术特征，不应直接写入特征部分；  \n  - 仅在需要限定发明对象的应用环境且该限定本身具有技术意义时，才考虑在前序部分中体现在适当的位置。\n\n3）background_art_TD（背景技术）\n\
            \n- background_art_TD 描述现有技术方案、典型结构和存在的问题。  \n- 作用：  \n  - 为识别“最近现有技术”和“已有技术特征”提供依据；  \n  - 用于判断哪些特征应视为前序部分中的共有特征。\
            \  \n- 使用原则：  \n  - 将与本发明方案重合的部分视为现有技术的共有技术特征，通常放在前序部分；  \n  - 不要把背景技术中的缺陷或问题直接写进权利要求；  \n  - 不要把仅在背景技术中出现、而未进入本发明技术方案的特征写进权利要求。\n\
            \n4）technical_solutions（技术方案）\n\n- technical_solutions 是本发明或实用新型的核心方案描述，是提取技术特征的**主信息源**之一。  \n- 作用：  \n  - 与\
            \ tech_element_table、elementary_features 一起，用于识别解决技术问题的核心结构/步骤及其组合关系；  \n  - 帮助判断哪些特征属于最小必要技术特征集。  \n- 使用原则： \
            \ \n  - 若 technical_solutions 与 core_independent_claim 存在轻微措辞差异，以 core_independent_claim 为主，technical_solutions\
            \ 作为补充说明；  \n  - 如发现明显矛盾（例如某构件在一个字段中存在，在另一个字段中被否定），在内部尽量以“更具体、更一致”的描述为准，但不得自行创造全新的结构。\n\n5）beneficial_effects_TD（有益效果）\n\
            \n- beneficial_effects_TD 描述与现有技术相比所获得的技术效果、优点或性能提升。  \n- 作用：  \n  - 帮助你在内部建立“技术问题 → 技术手段 → 技术效果”的逻辑链；  \n  -\
            \ 帮助你识别哪些结构/步骤是为实现这些效果而必需的。  \n- 严格限制：  \n  - 有益效果内容**只用于内部推理，不得直接写入权利要求文本**；  \n  - 不得在权利要求中出现“本发明具有……有益效果”“提高了……性能”等句式。\
            \  \n- 你应当做的是：  \n  - 将有益效果与 tech_element_table / elementary_features 中的具体结构或步骤相对应；  \n  - 通过结构和关系特征本身间接体现效果，而不是写出效果句子。\n\
            \n6）embodiments_TD（实施例）\n\n- embodiments_TD 提供了本发明的具体实施方式、结构细节、材料选择、具体步骤等。  \n- 作用：  \n  - 为技术特征提供详细的支持和可实施性基础；\
            \  \n  - 帮助你区分“基本必要结构”与“优选或示例性结构”。  \n- 使用原则：  \n  - 结合 Rule3 的“最小必要技术特征集”思想：  \n    - 必不可少的实施例特征，可以上位概括后写入独立权利要求；\
            \  \n    - 明显属于优选特征、细节参数或特定工艺条件的，应留待后续从属权利要求或实施例使用，而不写入权利要求1。  \n  - 避免逐字照抄实施例长句，只抽取对解决技术问题至关重要的结构和关系特征。\n\n7）drawings_explain_TD（附图说明）\n\
            \n- drawings_explain_TD 对各附图和标号进行了说明，例如“图1是……的结构示意图”“1 为……，2 为……”。  \n- 作用：  \n  - 帮助你核对实体名称与结构层级，确认部件之间的连接关系、位置关系；\
            \  \n  - 为大纲中的 entity 层级和关系提供交叉验证。  \n- 使用原则：  \n  - 可以利用附图说明来确认部件之间的关系是否完整，但不得在权利要求中书写“如图1所示”“参见图2”等表述；  \n \
            \ - 不应以纯图号或附图说明中的描述作为唯一依据引入新的技术特征，必须与技术方案 / 实施例内容相一致。\n\n8）整体一致性与内部使用约束\n\n- 你应将技术交底书各字段与2-6-Outline 节点 structured_output\
            \ 输出（core_independent_claim、technical_problems、macro_features、elementary_features、tech_element_table）进行交叉验证： \
            \ \n  - 若差异仅为措辞，应统一为技术含义更清晰、与 core_independent_claim 一致的表述；  \n  - 若存在明显冲突，在内部尽量做出合理解释，但仍不得凭空创造与任一来源完全不一致的新方案。\
            \  \n- 所有交底书字段仅用于你在内部理解与推理，**最终输出中只应出现经过提炼后的权利要求文本**，不得复述交底书原文或结构化标签名称。\n"
