          }\n\n\ndef _preserve_line_breaks(text: str) -> str:\n    text = text.replace(\"\\r\\n\", \"\\n\").replace(\"\\r\"\
          , \"\\n\")\n    text = re.sub(r\"\\n{3,}\", \"\\n\\n\", text)\n    return text.strip()\n\n\ndef main(input: str)\
          \ -> dict:\n    raw = input or \"\"\n    text = raw\n    removed_patterns = []\n\n    new_text = THINK_BLOCK_RE.sub(\"\
          \", text)\n    if new_text != text:\n        removed_patterns.append(\"think_block\")\n        text = new_text\n\
          \n    new_text = FENCED_META_RE.sub(\"\", text)\n    if new_text != text:\n        removed_patterns.append(\"fenced_meta_block\"\
          )\n        text = new_text\n\n    lines = []\n    meta_line_removed = False\n    for line in text.splitlines():\n\
