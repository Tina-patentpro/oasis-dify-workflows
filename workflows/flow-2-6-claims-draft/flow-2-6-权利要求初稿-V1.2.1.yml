          text: "## 输入内容\n\n### 大纲包含以下内容（来自“2-6-Outline”节点 structured_output）\n\n{{#1764588108416.structured_output.core_independent_claim#}}\n\
            {{#1764588108416.structured_output.parallel_independent_claims#}}\n{{#1764588108416.structured_output.sub_claim_clusters#}}\n\
            {{#1764588108416.structured_output.technical_problems#}}\n{{#1764588108416.structured_output.tech_element_table#}}\n\
            {{#1764588108416.structured_output.elementary_features#}}\n{{#1764588108416.structured_output.implementation_elements#}}\n\
            {{#1764588108416.structured_output.entity_hierarchy_nodes#}}\n{{#1764588108416.structured_output.entity_relations#}}\n\
            {{#1764588108416.structured_output.tp_ts_mapping#}}\n\n---\n\n### 独立权利要求草稿（来自上游节点）\n\n{{#1769301001002.clean_text#}}\n\
            \n---\n\n### 2-6-3并列独立权利要求处理说明\n\n- 是否存在2-6-3并列独立权利要求，以及其技术主线和数量，必须以 `parallel_independent_claims` 的结构化内容为准。\n\
            - `2-6-3并列独立权利要求` 可能因条件分支被跳过，这属于合法路径，而不是异常。\n- 当 `parallel_independent_claims` 为空时，不得假设存在额外的2-6-3并列独立权利要求草稿文本。\n\
            \n---\n\n### 从属权利要求草稿（来自上游节点）\n\n{{#1769301001004.clean_text#}}\n\n---\n\n### “技术交底书”包含以下内容（来自“技术交底书”节点）\n\n背景技术\
            \  \n{{#1770000100003.background_art_TD#}}\n\n技术方案  \n{{#1770000100003.technical_solutions#}}\n\n有益效果  \n{{#1770000100003.beneficial_effects_TD#}}\n\
            \n实施例  \n{{#1770000100003.embodiments_TD#}}\n\n附图说明  \n{{#1770000100003.drawings_explain_TD#}}\n\n---\n\n## 输入说明（2-6-Outline\
            \ 节点 structured_output 输出）\n\n> 以下各输入变量均为**字符串形式的 JSON**，你需要先在心中解析为 JSON 对象或数组，再按说明使用。\n\n1）core_independent_claim（核心独立权利要求骨架，两段式）\
            \  \n【输入变量：core_independent_claim】\n\n- 类型：JSON 对象。  \n- 典型字段：  \n  - object_type：权利要求客体类型（装置 / 系统 / 方法等）；  \n\
            \  - preamble_features：前序部分特征列表，每项含 id、text；  \n  - characterizing_features：特征部分特征列表，每项含 id、text；  \n  - derived_from_elements：来源\
            \ EF 列表，每项含 ref、text（如有）。  \n- 用法：  \n  1. 将其视为**核心独立权利要求的两段式结构骨架**：object_type + preamble_features 对应前序部分，characterizing_features\
            \ 对应“其特征在于”部分；  \n  2. 在整合独立权利要求时，独权 1 应与该骨架在技术特征组合上保持一致，仅可做轻量文字规整和顺序优化；  \n  3. 如某旧字段（essential_components /\
            \ necessary_relations 等）存在，可作为内部判断“必要特征”的辅助线索，但不强制使用。\n\n---\n\n2）parallel_independent_claims（2-6-3并列独立权利要求骨架，两段式）\
            \  \n【输入变量：parallel_independent_claims】\n\n- 类型：JSON 数组。  \n- 每个元素代表一条2-6-3并列独立权利要求骨架，典型字段：  \n  - id：并列独权编号（如\
            \ \"PI1\"）；  \n  - object_type：该并列独权的客体类型；  \n  - preamble_features：前序特征列表（id、text）；  \n  - characterizing_features：特征部分列表（id、text）；\
            \  \n  - derived_from_elements：来源 EF（如有）。  \n- 用法：  \n  1. 将每个元素视为“在核心方案基础上，针对不同客体 / 分支方案的另一条独权骨架”；  \n  2. 对应生成或整合独立权利要求\
            \ 2、3…… 时，应与各自骨架匹配；  \n  3. 不得凭空增加新的并列方案，也不得删除数组中已有的并列方案。\n\n---\n\n3）sub_claim_clusters（从属权利要求簇，含层进关系）  \n【输入变量：sub_claim_clusters】\n\
            \n- 类型：JSON 数组。  \n- 每个元素代表一个从属特征簇，典型字段：  \n  - type：簇类型（\"structure\" / \"function\" / \"parameter\" / \"material\"\
            \ / \"process\"）；  \n  - id：簇编号（如 \"SC1\"）；  \n  - features：特征列表，每项通常包含：  \n    - id：从属特征编号（如 \"SC1-1\"）；  \n\
            \    - text：从属特征的文字描述；  \n    - refines：可选字段，指向被进一步限定的特征 id（如 \"SC1-1\"）；  \n  - derived_from：来源对象（如实体/功能/EF），可含\
            \ ref、text。  \n- 用法：  \n  1. 将每个簇视为围绕某一来源对象的同类从属特征集合；  \n  2. 当某 feature 带有 refines 时，应在权利要求中体现为**多级从属链条**（例如：SC1-1\
            \ 做前位，从属 SC1-2 在其基础上进一步限定）；  \n  3. 在编排从属权利要求时，应结合 type 与 refines 信息，形成合理的分组和递进层级，避免打乱层进关系或混用不同簇的特征。\n\n---\n\n\
            4）technical_problems（技术问题列表）  \n【输入变量：technical_problems】\n\n- 类型：JSON 数组。  \n- 每个元素字段：  \n  - id：技术问题编号（如 \"\
            TP1\"）；  \n  - text：技术问题描述。  \n- 用法：  \n  1. 在内部建立“技术问题 → 技术手段 → 技术效果”链条时，以该列表为起点；  \n  2. 帮助判断某些关键特征是否为“为解决该问题所必需”，从而影响独/从权特征取舍；\
            \  \n  3. 不在权利要求条文中直接写出技术问题。\n\n---\n\n5）tech_element_table（技术要素表）  \n【输入变量：tech_element_table】\n\n- 类型：JSON 数组。\
            \  \n- 每个元素对应技术要素表一行，典型字段：  \n  - tp：技术问题编号；  \n  - macro：宏特征编号；  \n  - ef：EF 编号；  \n  - entities_raw / entities：涉及的实体；\
            \  \n  - means / function / effect：手段、功能、效果的编号或描述；  \n  - tech_effect：技术效果标识或描述。  \n- 用法：  \n  1. 在内部理解“某技术问题通过哪些\
            \ EF / 实体 / 手段 / 功能 / 效果解决”；  \n  2. 辅助判断哪些特征属于核心解决路径，应该体现在独立权利要求或关键从属权中；  \n  3. 不得编造表中不存在的新组合关系。\n\n---\n\n\
            6）elementary_features（基本特征 EF）  \n【输入变量：elementary_features】\n\n- 类型：JSON 数组。  \n- 每个元素字段示例：  \n  - id：EF 编号（如\
            \ \"AA\"）；  \n  - entities / relations / means / functions / effects：各自包含 id、text 等子字段。  \n- 用法：  \n  1. 将 EF\
            \ 视为“实体 + 关系 + 手段 + 功能 + 效果”的最小技术单元；  \n  2. 在整合权利要求时，注意保持 EF 编号与说明书 / 大纲中对应关系一致，避免混淆；  \n  3. 在需要从大纲补全某一特征的结构细节时，可在内部参考\
            \ EF 描述，但不得随意改写其技术含义。\n\n---\n\n7）implementation_elements（实施要素组合）  \n【输入变量：implementation_elements】\n\n- 类型：JSON\
            \ 数组。  \n- 每个元素字段示例：  \n  - id：实施要素编号（如 \"IME1\"）；  \n  - entity：相关实体编号；  \n  - means / function / effect：手段、功能、效果的编号或描述。\
            \  \n- 用法：  \n  1. 在内部区分“核心结构特征”和“优选实施方式细节”，为从属权利要求的展开提供参考；  \n  2. 适合作为“进一步限定”或“优选方案”的特征来源，而非独立权利要求的唯一支撑；  \n\
            \  3. 不得虚构新的实施要素编号或与现有链路不一致的实现方式。\n\n---\n\n8）entity_hierarchy_nodes（实体层级树）  \n【输入变量：entity_hierarchy_nodes】\n\
            \n- 类型：JSON 数组。  \n- 字段示例：tag（L0/L1/L2…）、id（实体编号）、parent_id（父节点实体编号）。  \n- 用法：  \n  1. 在内部重建系统结构树（整体系统 → 子系统 →\
            \ 部件）；  \n  2. 在编排装置 / 系统类权利要求时，使构件的出现顺序尽量贴合该层级；  \n  3. 有助于避免结构描述杂乱、跳跃。\n\n---\n\n9）entity_relations（实体关系）  \n\
            【输入变量：entity_relations】\n\n- 类型：JSON 数组。  \n- 字段示例：  \n  - id：关系编号；  \n  - from / to：实体编号；  \n  - text：关系描述。 \
            \ \n- 用法：  \n  1. 在内部理解各构件之间“连接、安装、作用”的关系；  \n  2. 在需要限定“如何连接 / 如何相对布置”时，可用作参考，保证关系描述与大纲一致；  \n  3. 不在输出中直接使用关系编号，只用其含义。\n\
            \n---\n\n10）tp_ts_mapping（技术问题与技术方案映射）  \n【输入变量：tp_ts_mapping】\n\n- 类型：JSON 数组。  \n- 每个元素字段：  \n  - id：映射编号； \
            \ \n  - tp：技术问题编号；  \n  - ts：对应的技术方案主线描述或标识。  \n- 用法：  \n  1. 帮助在内部确认“每条主线独权 / 并列独权主要对应哪些技术问题”；  \n  2. 辅助判断从属权利要求是否围绕相同技术问题作进一步限定；\
            \  \n  3. 不在权利要求文本中显式写出 tp / ts 编号。\n\n---\n\n## 输入说明（权利要求草稿）\n\n1）独立权利要求草稿文本  \n\n- 形式：自然语言长文本，可能包含多条独立权利要求。\
            \  \n- 用法：  \n  1. 在心中拆分为独立条款列表（条号 + 条文内容），识别具有独立结构的条款；  \n  2. 将其与 core_independent_claim、parallel_independent_claims\
            \ 的骨架对照，用于调整表述和填补少量细节；  \n  3. 如草稿与骨架存在冲突，应以骨架结构为主，在不改变技术实质的前提下对草稿进行规整。\n\n---\n\n2）从属权利要求草稿文本  \n\n- 形式：自然语言长文本，包含若干从属权利要求。\
            \  \n- 用法：  \n  1. 在心中拆分为多个从属条款，识别当前引用关系（如“如权利要求1所述……”）；  \n  2. 将其与 sub_claim_clusters、refines 等结构对照，判断每条从属权的归属簇与层进位置；\
            \  \n  3. 在整合时，根据大纲确定最终的依附关系、编号和必要的合并 / 去重。\n\n---\n\n## 输入说明（技术交底书）\n\n> 以下字段仅用于你在内部理解技术方案和检查一致性，不直接复述到输出条文中。\n\
            \n1）background_art_TD（背景技术）  \n\n- 作用：帮助识别“最近现有技术”和共有技术特征；  \n- 用法：在内部判断哪些特征应出现在独权前序部分，不在权利要求中直接描述“现有技术的缺陷”。\n\
            \n---\n\n2）technical_solutions（技术方案）  \n\n- 作用：是提取技术特征的重要信息源之一；  \n- 用法：用以核对核心技术方案是否与 core_independent_claim /\
            \ parallel_independent_claims 一致；如有措辞差异，以骨架为主，technical_solutions 为补充理解。\n\n---\n\n3）beneficial_effects_TD（有益效果）\
            \  \n\n- 作用：帮助在内部建立“技术问题–手段–效果”的逻辑链；  \n- 用法：仅作内部分析，不在权利要求条文中写出效果性句子。\n\n---\n\n4）embodiments_TD（实施例）  \n\n- 作用：提供具体结构、参数和步骤的细节；\
            \  \n- 用法：帮助区分“必要技术特征”和“优选 / 可选特征”，为从属权利要求内容提供支持。\n\n---\n\n5）drawings_explain_TD（附图说明）  \n\n- 作用：帮助核对部件名称、编号与结构关系；\
            \  \n- 用法：在内部用于验证实体层级和连接关系，不在权利要求中出现“如图1所示”等表述。\n"
        - id: a37c6eb0-635e-4bfd-bcbf-efb7cc0e8501
          role: assistant
          text: '## 整合门禁


            1. `2-6-3并列独立权利要求` 可能因条件分支被跳过，这属于合法分支结果，不得视为异常。

            2. 后续节点统一从模板转换节点 `2-6-3并列独立权利要求` 的 `output` 获取并列独权文本，不得直接依赖被条件分支跳过的节点输出。

            3. 当 `parallel_independent_claims` 为空，或 `{{#1769200300001.output#}}` 为空时，你不得为并列独权或其次要权利要求组预留编号、标题、占位文本或虚构条款。

            4. 只有当结构化大纲中存在有效并列独权骨架且 `{{#1769200300001.output#}}` 非空时，才整合该并列组。

            5. 你生成的整合稿必须把“无并列组”和“有并列组”都视为正常路径，重点保持编号连续、层级稳定和引用正确。

            6. 严禁输出任何内部推理、思考痕迹或模型自述，例如 `<think>`、`</think>`、`Thought:`、`Reasoning:`、`分析：`、`推理：`。

            7. 如果内部出现上述内容，最终输出前必须全部删除；最终结果只能是权利要求条文本身。'
