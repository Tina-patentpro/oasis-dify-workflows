          s]+', '', term)\n    term = re.sub(r'[\\s\\uFF0C\\u3002,\\uFF1B;]+$', '', term)\n    term = re.sub(r'[\\uFF08(][^)\\\
          uFF09]{1,20}[)\\uFF09]$', '', term).strip()\n    return term\n\ndef _extract_term_marker_pairs(*sources: str):\n\
          \    pairs = []\n    seen = set()\n    patterns = [\n        re.compile(r'(?m)^\\s*(?:\\d+\\.\\s*)?(\\d{1,3})\\\
          s*[-\\uFF0D\\u2014:\\uFF1A]\\s*([^\\n\\r]+?)\\s*$'),\n        re.compile(r'(?m)(\\d{1,3})\\s*\\u4e3a\\s*([^\\n\\\
