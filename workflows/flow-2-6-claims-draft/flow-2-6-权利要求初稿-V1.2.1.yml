          text: "## 输入内容\n\n### 大纲包含以下内容（来自“2-6-Outline”节点 structured_output）\n\n{{#1764588108416.structured_output.parallel_independent_claims#}}\n\
            {{#1764588108416.structured_output.core_independent_claim#}}\n{{#1764588108416.structured_output.elementary_features#}}\n\
            {{#1764588108416.structured_output.tech_element_table#}}\n{{#1764588108416.structured_output.entity_hierarchy_nodes#}}\n\
            {{#1764588108416.structured_output.technical_problems#}}\n{{#1764588108416.structured_output.macro_features#}}\n\
            \n---\n\n### 输入说明（2-6-Outline 节点 structured_output 输出）\n\n1）technical_problems（技术问题列表）\n【输入变量：technical_problems】\n\
            \n你将收到一个名为 technical_problems 的上游结构化变量（由“2-6-Outline”节点 structured_output 输出）。\n该变量会以 JSON 形式呈现，请直接按数组理解，每个元素具有字段：\n\
            \n* id：技术问题编号，例如 `\"TP1\"`；\n* text：该技术问题的文字描述。\n\n解析后：\n\n1. 按原有顺序理解技术问题的先后关系，不要随意调整顺序；\n2. 在内部构建“技术问题 → 技术手段\
            \ → 技术效果”链条时，以 `id + text` 作为起点；\n3. 在撰写2-6-3并列独立权利要求时，确保每条权利要求仍然围绕这些技术问题展开，而不是引入新的、无来源的技术问题。\n\n如果数组为空或内容明显无效，请在内部标记“上游未提供有效的技术问题列表”，但**仍不得凭空创造新的技术问题编号或内容**。\n\
            \n---\n\n2）macro_features（宏观技术特征）\n【输入变量：macro_features】\n\n你将收到一个名为 macro_features 的上游结构化变量（来自“2-6-Outline”节点\
            \ structured_output）。\n该变量会以 JSON 形式呈现，请直接按数组理解，每个元素具有字段：\n\n* id：宏观技术特征编号，例如 `\"A\"`、`\"B\"`；\n* text：该宏观特征的文字描述。\n\
            \n解析后：\n\n1. 将每个宏观特征视为“整体技术方案/系统级方案”的抽象描述；\n2. 在理解不同2-6-3并列独立权利要求之间的差异时，可以结合不同的宏特征 id（如 A/B）及其 text，判断方案侧重点的不同；\n\
            3. 不要发明新的宏观特征编号，只使用数组中出现的 id。\n\n---\n\n3）elementary_features（基本特征 EF）\n【输入变量：elementary_features】\n\n你将收到一个名为\
            \ elementary_features 的上游结构化变量（来自“2-6-Outline”节点 structured_output）。\n该变量会以 JSON 形式呈现，请直接按数组理解，每个元素表示一个基本特征 EF，字段结构通常如下：\n\
            \n* id：EF 编号，例如 `\"AA\"`；\n* entities：实体列表，每个实体包含：\n\n  * id：实体编号，例如 `\"E111\"`；\n  * text：实体/构件的文字描述；\n* relations：EF\
            \ 内部实体关系列表，每个关系包含：\n\n  * id：关系编号，通常形如 `\"E111-E112\"` 或类似形式；\n  * from：起始实体编号；\n  * to：目标实体编号；\n  * text：关系描述；\n\
            * means：实现手段列表，每项包含：\n\n  * id：手段编号，例如 `\"WAAa\"`；\n  * text：手段描述；\n* functions：功能列表，每项包含：\n\n  * id：功能编号，例如 `\"\
            FAAa\"`；\n  * text：功能描述；\n* effects：效果列表，每项包含：\n\n  * id：效果编号，例如 `\"RAAa\"`；\n  * text：效果描述。\n\n解析后，将每个 EF 视为“实体\
            \ + 连接/关系 + 手段 + 功能 + 效果”的技术要素单元。\n\n在本节点中：\n\n1. 当 parallel_independent_claims 或 core_independent_claim 的 derived_from_elements\
            \ 引用某个 EF 时，应优先从该 EF 中抽取**可落地为结构特征或步骤特征**的内容，用于构造2-6-3并列独立权利要求的两段式条文；\n2. 保持 EF 的编号与含义一致，不随意改写其技术含义，不创造新的 EF 编号；\n\
            3. 功能/效果信息可以辅助理解区别特征的技术作用，但不能单独作为唯一限定内容。\n\n---\n\n4）entity_hierarchy_nodes（实体层级结构）\n【输入变量：entity_hierarchy_nodes】\n\
            \n你将收到一个名为 entity_hierarchy_nodes 的上游结构化变量（来自“2-6-Outline”节点 structured_output）。\n该变量会以 JSON 形式呈现，请直接按数组理解，每个元素代表一个层级节点，字段包括：\n\
            \n* tag：层级标签，例如 `\"L0\"`、`\"L1\"`、`\"L2\"`……，数字越小表示层级越高；\n* id：实体编号，例如 `\"E0\"`、`\"E1\"`、`\"E11\"`；\n* parent_id：父节点实体编号，顶层节点通常为空字符串。\n\
            \n解析后：\n\n1. 在心中重建系统结构树（整体系统 → 子系统 → 组件 → 子组件）；\n2. 在撰写2-6-3并列独立权利要求的前序部分时，应尊重这种层级，从上到下组织主要构件（例如先系统/装置，再关键部件）；\n\
            3. 不要随意改变层级关系或虚构新的父子关系；\n4. 当某并列方案的客体为系统/装置时，可利用该层级信息确保前序部分的结构描述自然、完整。\n\n---\n\n5）tech_element_table（技术要素表）\n\
            【输入变量：tech_element_table】\n\n你将收到一个名为 tech_element_table 的上游结构化变量（来自“2-6-Outline”节点 structured_output）。\n该变量会以\
            \ JSON 形式呈现，请直接按数组理解，每个元素对应技术要素表的一行，字段通常包括：\n\n* tp：技术问题编号，例如 `\"TP1\"`；\n* macro：宏观特征编号，例如 `\"A\"`；\n* ef：基本特征\
            \ EF 编号，例如 `\"AA\"`；\n* entities_raw：原始实体串，例如 `\"E111/E11211\"`；\n* entities：实体编号列表，例如 `[\"E111\",\"E11211\"]`；\n\
            * means：实现手段编号或描述；\n* function：功能编号或描述；\n* effect：效果编号或描述；\n* tech_effect：技术效果编号、标识或文字描述。\n\n解析后：\n\n1. 将每一行理解为“针对某个技术问题\
            \ TP，由某个宏特征和 EF 及其实体/手段/功能/效果共同构成的一条解决路径”；\n2. 在内部构建“技术问题 → 技术手段 → 技术效果”的链条时，以此表为主要依据，不要偏离表中的对应关系；\n3. 在选择2-6-3并列独立权利要求中的区别技术特征时，应尽量保证这些特征在\
            \ tech_element_table 中具有清晰的来源（对应某一或若干行的 tp + macro + ef 组合）；\n4. 不要编造表中不存在的新对应关系，例如新的 TP–EF 组合或完全无来源的技术效果。\n\n\
            ---\n\n6）core_independent_claim（核心独立权利要求骨架，两段式结构）\n【输入变量：core_independent_claim】\n\n你将收到一个名为 core_independent_claim\
            \ 的上游结构化变量（来自“2-6-Outline”节点 structured_output）。\n该变量会以 JSON 形式呈现，请直接按对象理解，字段一般包括：\n\n* object_type：核心独权的客体类型，例如“装置”、“系统”、“方法”、“弓头弹簧”等；\n\
            * preamble_features：前序部分特征列表（两段式中的“前序部分”），每项包含：\n\n  * id：特征编号，例如 `\"PF1\"`；\n  * text：前序特征的文字描述，一般对应与“最近现有技术”共有的技术特征；\n\
            * characterizing_features：特征部分特征列表（两段式中的“其特征在于部分”），每项包含：\n\n  * id：特征编号，例如 `\"CF1\"`；\n  * text：区别技术特征的文字描述；\n\
            * essential_components：必需构件列表（旧结构，可能为空），每项包含：\n\n  * id：构件编号，例如 `\"EC1\"`；\n  * text：构件的文字描述；\n* necessary_relations：必需关系列表（旧结构，可能为空），每项：\n\
            \n  * id：关系编号；\n  * text：关系描述；\n* necessary_actions：必需动作/步骤列表（旧结构，可能为空），每项：\n\n  * id：动作编号；\n  * text：动作描述；\n\
            * core_conditions：核心条件列表（旧结构，可能为空），每项：\n\n  * id：条件编号；\n  * text：条件描述；\n* derived_from_elements：来源 EF 列表，每项：\n\
            \n  * ref：对应的 EF 编号，例如 `\"AA\"`；\n  * text：补充说明（如有）。\n\n解析后：\n\n1. 将 core_independent_claim 视为“核心独立权利要求的两段式结构骨架”：\n\
            \n   * object_type + preamble_features 对应核心独权的前序部分；\n   * characterizing_features 对应“其特征在于”部分的区别技术特征；\n2. 在本节点中，它主要用于：\n\
            \n   * 确认2-6-3并列独立权利要求应当与之处于同一发明构思之下（解决的技术问题、主要技术手段、技术效果应保持一致或高度相关）；\n   * 为2-6-3并列独立权利要求提供客体类型、主要构件和术语的统一参考；\n\
            3. 你**不能**在2-6-3并列独立权利要求中通过“如权利要求1所述”方式引用该核心独权，而是要在每条2-6-3并列独立权利要求中**完整展开自己的必要技术特征**；\n4. 如果 object_type 为空，且\
            \ preamble_features 与 characterizing_features 同时为空，应在内部标记“核心骨架信息不完整”，此时仅可结合其他输入谨慎理解整体技术方案，仍不得凭空构造完全无关的新技术方案。\n\
            \n---\n\n7）parallel_independent_claims（2-6-3并列独立权利要求骨架）\n【输入变量：parallel_independent_claims】\n\n你将收到一个名为 parallel_independent_claims\
            \ 的上游结构化变量（来自“2-6-Outline”节点 structured_output）。\n该字符串是一个 JSON 数组，请直接按数组理解，每个元素表示一个并列独立方案，字段一般包括：\n\n* id：并列方案编号，例如\
            \ `\"PI1\"`；\n* object_type：该2-6-3并列独立权利要求的客体类型，例如“装置”、“系统”、“方法”、“计算机可读介质”等；\n* preamble_features：前序部分特征列表，每项包含：\n\
            \n  * id：特征编号，例如 `\"PI1-PF1\"`；\n  * text：该前序特征的文字描述；\n* characterizing_features：特征部分特征列表，每项包含：\n\n  * id：特征编号，例如\
            \ `\"PI1-CF1\"`；\n  * text：区别技术特征的文字描述；\n* derived_from_elements：来源 EF 列表（如有），每项：\n\n  * ref：对应的 EF 编号，例如 `\"\
            AB\"`；\n  * text：补充说明（如有）；\n* （可选）differential_macro_ref / differential_macro_text：相对于核心方案的差异宏观特征编号及其描述；\n* （可选）differential_elementary_ref\
            \ / differential_elementary_text：差异 EF 编号及其描述。\n\n解析后：\n\n1. 将 parallel_independent_claims 视为本节点的“目标清单”：\n\n \
            \  * 数组中每一个有效元素 → 必须生成一条对应的2-6-3并列独立权利要求；\n   * 有效元素指：object_type 合理，且 preamble_features 或 characterizing_features\
            \ 至少有一类非空；\n   * 若某元素的前序和特征列表均为空，可在内部视为“无效方案”，一般应跳过。\n2. 在撰写具体条文时：\n\n   * 使用 object_type 确定权利要求的客体形式及起句方式（“一种……装置”，“一种……方法”，“一种……系统”等）；\n\
            \   * 将 preamble_features 中的内容整合为两段式中的前序部分；\n   * 将 characterizing_features 中的内容整合为“其特征在于”之后的特征部分；\n   * 通过 derived_from_elements\
            \ 追溯到 elementary_features 和 tech_element_table，确保每一项关键区别特征都有明确技术来源。\n3. 每条2-6-3并列独立权利要求必须在**形式和实质上都是独立权利要求**：\n\
            \n   * 禁止在条文中使用“如权利要求1所述”、“如前述任一项权利要求所述”等引用方式；\n   * 必须在该条权利要求内部完整记载其必要技术特征。\n4. 2-6-3并列独立权利要求之间应具有清晰的技术边界：\n\n\
            \   * 可以从不同客体形式（装置/方法/系统/介质）、不同实施主体、不同应用层级等角度进行区分；\n   * 但都应与核心独权处于同一发明构思，不得引入完全无关的新技术方案。\n\n---\n\n### 核心独立权利要求文本（来自上游\
            \ LLM 节点）\n\n{{#1769301001002.clean_text#}}\n\n【输入说明】\n\n* 该文本是上一节点根据 core_independent_claim 骨架生成的**核心独立权利要求中文条文**；\n\
            * 在本节点中，它的主要用途是：\n\n  1. 统一术语与命名：你可以参照其中对构件、参数、步骤的命名方式，保持并列独权用语与核心独权一致；\n  2. 理解技术主线：用于确认本发明的核心技术方案、必要技术特征和整体保护思路；\n\
            * 注意：\n\n  * 2-6-3并列独立权利要求不应只是对该条文的简单改写或轻微删减，而应在并列骨架基础上构造**技术上独立的方案或不同客体**；\n  * 在并列条文中不得通过“如权利要求1所述”进行引用，每条并列独权都要写成完整的独立权利要求。\n\
            \n---\n\n### “技术交底书” 包含以下部分（来自上游“技术交底书”节点）\n\n* 技术领域：{{#1770000100003.technical_field#}}\n* 背景技术：{{#1770000100003.background_art_TD#}}\n\
            * 技术方案：{{#1770000100003.technical_solutions#}}\n* 有益效果：{{#1770000100003.beneficial_effects_TD#}}\n* 实施例：{{#1770000100003.embodiments_TD#}}\n\
            * 附图说明：{{#1770000100003.drawings_explain_TD#}}\n\n#### 输入说明（技术交底书）\n\n1）general 形式与整体用法\n\n* 以上字段可能以结构化 JSON、Markdown\
            \ 或自然语言长文本形式提供，内部可能包含编号、小标题、列表或表格；\n* 这些字段是**原始技术事实的基础来源**，你需要用它们来理解：\n\n  * 发明所属的技术领域和应用场景；\n  * 现有技术及存在的问题；\n\
            \  * 发明的核心技术方案、实施方式和技术效果。\n* 在撰写2-6-3并列独立权利要求时：\n\n  * 只能在内部使用这些内容进行分析与推理；\n  * **不得在输出中直接复述整段交底书原文**，也不要输出“技术领域”“背景技术”等栏目标题。\n\
            \n---\n\n2）technical_field（技术领域）\n\n* 描述本发明所属技术领域，例如“本发明涉及……领域”；\n* 帮助确认权利要求客体类型（装置/系统/方法/介质等）及适用场景；\n* 一般不作为区别技术特征直接写入特征部分，仅在需要限定应用环境且该限定具有技术意义时，才可能在前序部分体现。\n\
            \n---\n\n3）background_art_TD（背景技术）\n\n* 描述现有技术的典型结构、运行方式以及存在的问题；\n* 用途：\n\n  * 帮助你判断哪些特征属于现有技术的共有技术特征，可吸收进两段式前序部分；\n\
            \  * 帮助理解技术问题的具体来源。\n* 使用时注意：\n\n  * 不要把背景技术中的缺陷或问题直接写入权利要求条文；\n  * 不要把仅在背景技术中出现、而未进入本发明技术方案的特征写入权利要求。\n\n---\n\
            \n4）technical_solutions（技术方案）\n\n* 描述本发明的核心技术方案，是提取技术特征的主要信息源之一；\n* 在结合大纲数据（technical_problems、macro_features、elementary_features、tech_element_table）时：\n\
            \n  * 用它来校验并列方案是否仍然落在同一技术方案体系内；\n  * 确认某些区别特征是否在技术方案中有充分支持。\n* 若 technical_solutions 与大纲中的结构存在措辞差异，应以大纲结构和核心独权骨架为主，technical_solutions\
            \ 作解释和补充，但不得据此发明全新结构。\n\n---\n\n5）beneficial_effects_TD（有益效果）\n\n* 描述本发明相对于现有技术获得的效果或优势；\n* 用途：\n\n  * 在内部帮助你理解某些区别技术特征的目的和技术贡献；\n\
            \  * 帮助构建“技术问题 → 技术手段 → 技术效果”的逻辑链。\n* 严格限制：\n\n  * 有益效果内容**只用于内部推理，不得直接写入2-6-3并列独立权利要求文本**；\n  * 不要在权利要求中出现“本发明具有……有益效果”“提高了……性能”等表述。\n\
            \n---\n\n6）embodiments_TD（实施例）\n\n* 提供具体实施方式、结构细节、材料选择、参数范围、操作步骤等；\n* 用途：\n\n  * 支撑并列方案中的结构/步骤特征具有可实施性；\n  * 帮助你区分“基本必要结构/步骤”与“优选方案或变型方案”。\n\
            * 使用原则：\n\n  * 对于适合作为独立权利要求必要特征的部分，可在内部进行上位概括后用于并列权利要求；\n  * 明显属于优选参数、具体数值、特定工艺条件或替代方案的内容，更适合作为从属权利要求或实施例描述，不宜写入2-6-3并列独立权利要求中。\n\
            \n---\n\n7）drawings_explain_TD（附图说明）\n\n* 对各附图及其标号进行解释，如“图1是……的结构示意图”“1 为……，2 为……”等；\n* 用途：\n\n  * 与 entity_hierarchy_nodes\
            \ / elementary_features 交叉验证实体名称、结构层级和连接关系；\n  * 帮助核对部件之间的几何/安装/连接关系是否完整。\n* 使用原则：\n\n  * 不得在权利要求条文中使用“如图1所示”“参见图2”等与附图直接挂钩的表述；\n\
            \  * 不应单纯依靠图号引入新的技术特征，必须与技术方案和实施例中的文字描述相一致。\n\n---\n\n8）整体一致性与内部使用约束\n\n* 你应将技术交底书各字段与2-6-Outline 节点 structured_output\
            \ 输出（core_independent_claim、parallel_independent_claims、technical_problems、macro_features、elementary_features、tech_element_table）进行交叉验证：\n\
            \n  * 若差异仅为措辞，应统一为技术含义更清晰、与大纲结构和核心独权一致的表达；\n  * 若存在明显冲突，只能在内部做出合理解释，**不得据此构造与任一来源完全不一致的新方案**。\n* 所有交底书字段仅用于你在内部理解和推理，最终输出中**只应出现根据\
            \ user 提示词要求生成的2-6-3并列独立权利要求条文**，不得复述交底书原文或字段名称。\n\n---\n\n补充说明：\n在具体撰写2-6-3并列独立权利要求时，你不仅要正确理解本提示中对输入变量的说明，还必须**同时严格遵守本应用为\
            \ 4-1-3 节点配置的 user 提示词**中的 Goals / Rules / Format / Workflow 要求：\n\n* 基于 parallel_independent_claims 的骨架，一一生成两段式2-6-3并列独立权利要求；\n\
            * 保证每条权利要求形式上和实质上都是独立权利要求；\n* 禁止脑补、禁止跨越技术交底书和大纲的披露范围。\n\n本提示仅对输入内容的含义和用法作说明，不改变 user 提示词中已经设定的任务目标和约束。"
