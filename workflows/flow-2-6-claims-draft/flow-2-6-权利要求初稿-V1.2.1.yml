          text: "## 输入内容\n\n### 大纲包含以下内容（来自“2-6-Outline”节点 structured_output）\n\n{{#1764588108416.structured_output.elementary_features#}}\n\
            {{#1764588108416.structured_output.implementation_elements#}}\n{{#1764588108416.structured_output.tech_element_table#}}\n\
            {{#1764588108416.structured_output.sub_claim_clusters#}}\n{{#1764588108416.structured_output.preferred_ranges#}}\n\
            {{#1764588108416.structured_output.variations#}}\n\n---\n\n### 权利要求书全文（来自“权利要求书”节点）\n\n{{#1769301001005.clean_text#}}\n\
            \n---\n\n### “技术交底书”包含以下内容（来自“技术交底书”节点）\n\n背景技术：  \n{{#1770000100003.background_art_TD#}}\n\n技术方案：  \n{{#1770000100003.technical_solutions#}}\n\
            \n有益效果：  \n{{#1770000100003.beneficial_effects_TD#}}\n\n实施例：  \n{{#1770000100003.embodiments_TD#}}\n\n附图说明：  \n\
            {{#1770000100003.drawings_explain_TD#}}\n\n---\n\n## 输入说明（2-6-Outline 节点 structured_output 输出）\n\n> 说明：以下所有变量在实现中以**字符串形式**提供（通常是\
            \ JSON 字符串或自然语言长文本）。  \n> 你需要在**内部先将其解析为数组或对象再进行思考**，但不要在输出中直接粘贴原始 JSON。\n\n---\n\n### 1）elementary_features（基本特征\
            \ EF 列表）  \n【输入变量：elementary_features】\n\n你将收到一个名为 `elementary_features` 的上游结构化变量（来自“2-6-Outline”节点 structured_output）。\
            \  \n该字符串是一个 JSON 数组，请直接按数组理解，每个元素表示一个基本特征 EF，字段结构大致如下：\n\n- id：EF 编号，例如 `\"AA\"`；\n- entities：实体列表，每个实体包含：\n\
            \  - id：实体编号，例如 `\"E111\"`；\n  - text：实体/构件的文字描述；\n- relations：EF 内部实体关系列表，每个关系包含：\n  - id：关系编号，通常形如 `\"E111-E112\"\
            ` 或类似编码；\n  - from：起始实体编号；\n  - to：目标实体编号；\n  - text：关系描述（实体之间如何连接、安装、相对位置等）；\n- means：实现手段列表，每项包含：\n  - id：手段编号，例如\
            \ `\"WAAa\"`；\n  - text：手段描述（采用何种结构/动作实现某功能）；\n- functions：功能列表，每项包含：\n  - id：功能编号，例如 `\"FAAa\"`；\n  - text：功能描述（该\
            \ EF 层面的具体功能）；\n- effects：效果列表，每项包含：\n  - id：效果编号，例如 `\"RAAa\"`；\n  - text：效果描述（该 EF 层面的局部效果）。\n\n解析后，在本节点中你应：\n\
            \n1. 将每个 EF 视为“实体（E） + 连接/关系（Relation） + 手段（W） + 功能（F） + 效果（R）”的**技术要素单元**；  \n2. 当你尝试为某一处功能性/效果性描述提出结构化替代建议时，应优先从对应的\
            \ EF 中抽取：\n   - 实体及其结构特征（如名称、位置、层级）；\n   - 实体之间的连接/关系；\n   - 实现手段（means），而不是再次使用 functions/effects 的抽象语言；\n3.\
            \ 严禁随意创造新的 EF 编号或改变已有 EF 的技术含义；  \n4. 可以在内部利用 functions/effects 来确定“这段功能/效果性描述对应哪个 EF”，但在**输出的替代表述中要尽量用实体+手段+关系+参数**来替代，而不是重复功能/效果语句。\n\
            \n---\n\n### 2）implementation_elements（实施要素组合）  \n【输入变量：implementation_elements】\n\n你将收到一个名为 `implementation_elements`\
            \ 的字符串变量。  \n该字符串是一个 JSON 数组，请在心中解析为数组，每个元素表示一个实施要素组合，字段大致如下：\n\n- id：实施要素编号，例如 `\"IME1\"`；\n- entity：关联的实体/构件编号，例如\
            \ `\"E111\"` 或 `\"E121/E126/E127\"`；\n- means：实施方式采用的具体手段编号或描述；\n- function：该实施方式实现的功能编号或描述；\n- effect：该实施方式带来的效果编号或描述。\n\
            \n在本节点中，implementation_elements 的作用是：\n\n1. 帮助你从**实施例视角**理解：某个功能或效果是怎样在具体构件上通过特定手段实现的；  \n2. 当权利要求中出现“用于……的部件”“以便……”“从而实现……”等表述时，你应尝试：\n\
            \   - 在 implementation_elements 中寻找具有相同或相近 function/effect 的实施要素；\n   - 以该实施要素中的 entity + means 为核心，构造结构化替代表述（例如“某构件\
            \ + 某连接方式 + 某动作/状态”）；  \n3. 不得发明 implementation_elements 中不存在的新手段或新效果，不得改变其原有逻辑链条。\n\n---\n\n### 3）tech_element_table（技术要素表行）\
            \  \n【输入变量：tech_element_table】\n\n你将收到一个名为 `tech_element_table` 的字符串变量。  \n该字符串是一个 JSON 数组，请解析为数组，每个元素对应技术要素表的一行，字段大致如下：\n\
            \n- tp：技术问题编号，例如 `\"TP1\"`；\n- macro：宏观特征编号，例如 `\"A\"`；\n- ef：基本特征 EF 编号，例如 `\"AA\"`；\n- entities_raw：原始实体串，例如\
            \ `\"E111/E11211\"`；\n- entities：实体编号列表，例如 `[\"E111\", \"E11211\"]`；\n- means：实现手段编号或描述；\n- function：功能编号或描述；\n\
            - effect：效果编号或描述；\n- tech_effect：整体技术效果描述或标识。\n\n在本节点中，你应：\n\n1. 将每一行理解为“针对某个技术问题 TP，由某宏观特征 Macro、某 EF 以及具体实体/手段/功能/效果共同构成的一条**解决路径**”；\
            \  \n2. 当你为某处功能性或效果性描述寻找替代表述时，应确保：\n   - 替代表述仍然依托同一条或相容的解决路径（即相同的 tp/macro/ef 组合）；\n   - 不因为改写语言而改变“技术问题–技术方案–技术效果”的对应关系；\
            \  \n3. 严禁编造表中不存在的新对应关系，例如新的 TP–EF 组合；  \n4. 在“主要依据”字段中，你可以引用某行的 tp/macro/ef/tech_effect 来标明你的建议是基于哪条技术路径。\n\n\
            ---\n\n### 4）sub_claim_clusters（从属权利要求簇）  \n【输入变量：sub_claim_clusters】\n\n你将收到一个名为 `sub_claim_clusters` 的字符串变量。\
            \  \n该字符串是一个 JSON 数组，请解析为数组，每个元素表示一个从属权利要求簇，字段大致如下：\n\n- type：簇类型，通常为 `\"structure\"`、`\"function\"`、`\"parameter\"\
            `、`\"material\"`、`\"process\"` 之一；\n- id：簇编号，例如 `\"SC1\"`；\n- features：特征列表，每项包含：\n  - id：从属特征编号，例如 `\"SC1-1\"\
            `；\n  - text：从属特征的文字描述；\n  - refines：可选字段，指向被进一步限定的上一级特征编号，例如 `\"SC1-1\"`；\n- derived_from：该簇的来源对象（可以为 null），如果存在：\n\
            \  - ref：来源编号，例如某实体 ID `\"E11\"` 或某功能 ID `\"FAAa\"` 等；\n  - text：补充说明（如有）。\n\n在本节点中，你应：\n\n1. 将每个簇视为围绕某一“来源对象”（实体/功能/参数等）的同类从属特征集合；\
            \  \n2. 特别关注 type 为 `\"structure\"`、`\"parameter\"`、`\"material\"`、`\"process\"` 的特征，因为它们通常包含：\n   - 更具体的结构限定；\n\
            \   - 更精确的参数范围；\n   - 更具体的材料或工艺条件；  \n   这些都可以用来替代功能性/效果性表述。  \n3. 利用 `refines` 字段理解簇内特征的层进关系（例如：SC1-2 对 SC1-1\
            \ 进一步限定），在提出替代表述时：\n   - 可以建议用“更下层的结构特征”来限定抽象的功能/效果性描述；  \n4. 在“主要依据”中，可以写明“结构簇 SC1 / 参数簇 SC3 / 由某 refines 链条支持”等，以便后续节点追踪；\
            \  \n5. 不得将明显属于不同来源的特征混写或错误组合，也不得虚构新的 cluster 或特征编号。\n\n---\n\n### 5）preferred_ranges（优选范围）  \n【输入变量：preferred_ranges】\n\
            \n你将收到一个名为 `preferred_ranges` 的字符串变量。  \n该字符串是一个 JSON 数组，请解析为数组，每个元素表示一个优选范围或数值设定，字段：\n\n- id：范围编号，例如 `\"PR1\"\
            `；\n- text：该优选范围的文字描述，通常包含具体数值、区间或参数条件。\n\n在本节点中，你应：\n\n1. 将 preferred_ranges 视为“已被上游识别出的、可用于参数限定的数值或条件”；  \n\
            2. 当效果性描述涉及“提高/降低/减少/增强”等目标时，如果有对应的 preferred_ranges，可以将抽象效果转化为：\n   - 某个参数位于某一数值区间；\n   - 某个结构尺寸、材料属性具有特定范围；\
            \  \n3. 严禁凭空修改这些数值或虚构新的区间；  \n4. 在“主要依据”字段中，应标明使用了哪一个或多个 PR 编号，例如“PR1：弹簧预压缩量范围”。\n\n---\n\n### 6）variations（变型方案）\
            \  \n【输入变量：variations】\n\n你将收到一个名为 `variations` 的字符串变量。  \n该字符串是一个 JSON 数组，请解析为数组，每个元素表示一个变型实施方案，字段：\n\n- id：变型编号，例如\
            \ `\"V1\"`；\n- text：该变型方案的文字描述。\n\n在本节点中，你应：\n\n1. 将 variations 视为“在不改变发明构思前提下的可选结构或实现方式”；  \n2. 在为功能/效果性表述提供替代表述时：\n\
            \   - 可以以某一主要结构方案为主（通常对应实施例/EF/implementation_elements）；\n   - 在有必要时，提示可以根据 variations 采用若干可选方式，但仍需保持与核心方案属于同一发明构思；\
            \  \n3. 不得把变型方案改写成一个全新的、与核心方案无关的独立发明；  \n4. 在“主要依据”字段中，可以标明“V1/V2 作为变型实现路径的参考”。\n\n---\n\n## 输入说明（权利要求书与技术交底书）\n\
            \n### 7）权利要求书全文（claims_text）\n\n【输入变量：claims_text（在实际模板中通过 {{#1769301001005.clean_text#}} 提供】  \n\n- 该文本通常包含：\n\
            \  - 一个或多个独立权利要求；\n  - 多条从属权利要求，可能具有多层从属结构。  \n- 在本节点中，你的核心任务是：\n  1. 逐条读取权利要求，识别其中所有功能性和效果性描述片段；  \n  2. 按“独权优先→关键从属优先”的顺序，对这些片段提出结构化替代建议；\
            \  \n  3. 对每一条建议明确：\n     - 所在权利要求号（位置）；\n     - 类型（功能性/效果性/功能+效果混合）；\n     - 严重程度（高/中/低），其中：\n       - 独立权利要求中影响主解决方案的功能/效果性问题通常标记为“高”；\
            \  \n     - 原始表述；\n     - 问题分析；\n     - 替代表述建议；\n     - 主要依据。  \n\n**重要限制：**\n\n- 不得建议增删权利要求，也不得建议调整权利要求之间的从属结构和编号；\
            \  \n- 不得输出完整重写后的权利要求文本，只输出“建议清单”；  \n- 替代表述中不得再使用新的功能性或效果性限定语，须使用结构/材料/连接方式/工作方式/参数来表述。\n\n---\n\n### 8）background_art_TD（背景技术）\n\
            \n【输入变量：background_art_TD】\n\n- 提供现有技术的典型方案、结构和存在的问题；  \n- 在本节点中，它的作用主要是：\n  1. 帮助你判断某些功能/效果性表述是否实际上只是在“重复现有技术的效果”，而非本发明的特有效果；\
            \  \n  2. 帮助确认哪些技术特征属于现有技术共有特征，以避免在替代表述时错误地“抬高”本发明的技术水平。  \n\n使用原则：\n\n- 不把背景技术中的缺陷/问题直接写入替代表述；  \n- 不把背景技术中仅出现、而未进入本发明方案的特征写入建议；\
            \  \n- 仅在内部用于理解技术背景，不在输出中直接复述背景技术原文。\n\n---\n\n### 9）technical_solutions（技术方案）\n\n【输入变量：technical_solutions】\n\
            \n- 这是技术交底书中对本发明技术方案的整体描述；  \n- 在本节点中，它的作用主要是：\n  1. 协助你确认某一功能/效果性描述背后对应的实际结构或操作步骤；  \n  2. 当 EF / implementation_elements\
            \ 信息不足时，可回到 technical_solutions 以寻找具体构件、连接关系和操作条件。\n\n使用原则：\n\n- 如 technical_solutions 与大纲 structured_output 输出（特别是\
            \ EF/tech_element_table）存在轻微措辞差异，以结构化数据为主，technical_solutions 辅助理解；  \n- 不得凭 technical_solutions 单独引入 EF/表格中不存在的全新技术特征；\
            \  \n- 仅抽取与解决技术问题密切相关的结构和步骤，不在输出中复述完整段落。\n\n---\n\n### 10）beneficial_effects_TD（有益效果）\n\n【输入变量：beneficial_effects_TD】\n\
            \n- 描述相对于现有技术所实现的技术效果、性能提升或优势；  \n- 在本节点中，它特别重要，因为很多效果性描述在权利要求中与此直接对应。\n\n使用原则：\n\n1. 仅在内部用于建立“技术问题 → 技术手段 → 技术效果”的逻辑链；\
            \  \n2. 不允许在替代表述中直接写出“提高……效率”“减少……振动”“改善……性能”等效果句子，而应通过结构/参数间接体现；  \n3. 当你判断某一效果性表述是否过宽时，可以对照 beneficial_effects_TD，确认：\n\
            \   - 该效果是否已经由某一条技术路径（EF/tech_element_table）明确支撑；  \n   - 替代表述是否仍然能实现相同的有益效果，而不改变技术构思。\n\n---\n\n### 11）embodiments_TD（实施例）\n\
            \n【输入变量：embodiments_TD】\n\n- 提供结构细节、材料选择、参数设定和具体步骤；  \n- 在本节点中，它的作用主要是：\n  1. 为功能/效果性表述提供“可以落地的结构/参数实现方式”；  \n\
            \  2. 当 EF / implementation_elements 给出的信息不够具体时，可从实施例中补充关键的结构特征和参数。\n\n使用原则：\n\n- 对于被用来替代表述的特征，应确保在实施例中确有记载，且与本发明整体技术方案一致；\
            \  \n- 避免把明显是“优选但非必要”的细节（如具体数值上的微调）当作独立权利要求层面的必要特征；  \n- 不逐字照抄实施例长句，只提取必要结构和参数，用于构造简洁清晰的替代表达。\n\n---\n\n### 12）drawings_explain_TD（附图说明）\n\
            \n【输入变量：drawings_explain_TD】\n\n- 对附图及其标号的说明，如“图1为……的结构示意图，1 为……，2 为……”；  \n- 在本节点中，它的作用主要是：\n  1. 帮助你核对实体（entities）及其层级、相对位置和连接关系是否与\
            \ EF、implementation_elements 一致；  \n  2. 当你为某构件添加结构限定时，可参考附图说明中的结构或位置描述，以增强清楚性。\n\n使用原则：\n\n- 不在替代表述中使用“如图1所示”“参见图2”等附图引用语；\
            \  \n- 不单独以附图说明为依据引入完全新构件，必须与技术方案/实施例内容相一致；  \n- 可以用附图说明辅助确定构件的相对位置、排列方式等结构性特征。\n\n---\n\n### 13）整体一致性与输出约束（本节点专用）\n\
            \n在使用上述所有输入时，你还需在内部始终遵守以下几点（与 user 提示词的 Global Constraints 保持一致）：\n\n1. 不得改变权利要求的发明构思和“技术问题–技术方案–技术效果”逻辑链，只能改写表述方式（从功能/效果性改为结构/参数性）；\
            \  \n2. 不得引入输入数据中不存在的新技术特征、新结构或新的数值范围；  \n3. 替代表述中不得出现新的功能/效果性限定语，只能使用结构、材料、连接方式、工作方式、参数范围等；  \n4. 不得增删权利要求，不得建议调整权利要求之间的从属关系；\
            \  \n5. 输出必须严格遵守 user 提示词中给出的 Format 要求，以“建议1…建议n”的形式输出“替代建议清单”，字段名固定。\n\n你可以在内部自由地综合 elementary_features、implementation_elements、tech_element_table、sub_claim_clusters、preferred_ranges、variations\
            \ 和技术交底书内容进行分析和推理，但**最终输出中只应出现结构化好的“建议条目”**，不得输出原始 JSON、内部分析过程或长篇解释性文字。\n"
        retry_config:
          max_retries: 10
          retry_enabled: true
          retry_interval: '2000'
