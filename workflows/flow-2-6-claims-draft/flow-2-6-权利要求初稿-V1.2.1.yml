        code: "import re\n\nTHINK_BLOCK_RE = re.compile(r\"<think\\b[^>]*>.*?</think>\", re.IGNORECASE | re.DOTALL)\nFENCED_META_RE\
          \ = re.compile(r\"```(?:think|analysis|reasoning)[^\\n]*\\n.*?```\", re.IGNORECASE | re.DOTALL)\nMETA_LINE_RE =\
          \ re.compile(\n    r\"^(?:Reasoning\\s*:|Analysis\\s*:|思考过程\\s*[:：]?|分析过程\\s*[:：]?|内部推理\\s*[:：]?|Let's\\s+|The\\\
          s+assistant\\b|The\\s+user\\b|I\\s+need\\s+to\\b|Need\\s+to\\b|We\\s+need\\s+to\\b).*$\",\n    re.IGNORECASE,\n\
          )\n\nACK_ONLY = {\"已了解。\", \"已了解\", \"好的。\", \"好的\", \"收到。\", \"收到\", \"明白了。\", \"明白了\", \"OK\", \"Ok\", \"ok\"\
          }\n\n\ndef _preserve_line_breaks(text: str) -> str:\n    text = text.replace(\"\\r\\n\", \"\\n\").replace(\"\\r\"\
          , \"\\n\")\n    text = re.sub(r\"\\n{3,}\", \"\\n\\n\", text)\n    return text.strip()\n\n\ndef main(input: str)\
          \ -> dict:\n    raw = input or \"\"\n    text = raw\n    removed_patterns = []\n\n    new_text = THINK_BLOCK_RE.sub(\"\
          \", text)\n    if new_text != text:\n        removed_patterns.append(\"think_block\")\n        text = new_text\n\
          \n    new_text = FENCED_META_RE.sub(\"\", text)\n    if new_text != text:\n        removed_patterns.append(\"fenced_meta_block\"\
          )\n        text = new_text\n\n    lines = []\n    meta_line_removed = False\n    for line in text.splitlines():\n\
          \        if META_LINE_RE.match(line.strip()):\n            meta_line_removed = True\n            continue\n    \
          \    lines.append(line)\n    if meta_line_removed:\n        removed_patterns.append(\"meta_lines\")\n    text =\
          \ \"\\n\".join(lines)\n\n    if \"<think\" in text.lower() or \"</think>\" in text.lower():\n        text = re.sub(r\"\
          </?think\\b[^>]*>\", \"\", text, flags=re.IGNORECASE)\n        removed_patterns.append(\"think_tag\")\n\n    text\
          \ = _preserve_line_breaks(text)\n\n    if text in ACK_ONLY:\n        removed_patterns.append(\"ack_only\")\n   \
          \     text = \"\"\n\n    return {\n        \"clean_text\": text,\n        \"had_sanitization\": bool(removed_patterns),\n\
          \        \"removed_patterns\": \", \".join(removed_patterns),\n        \"is_effectively_empty\": text == \"\",\n\
          \    }\n"
