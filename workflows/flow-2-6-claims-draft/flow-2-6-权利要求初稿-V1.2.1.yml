        prompt_template:
        - id: f2fc01c1-1ad2-4463-b6fb-66bbdf891f2d
          role: system
          text: "# Role: 专利撰写专家\n## Profile\n版本日期: 2024年2月1日  \n语言: 中文  \n职责：负责专利说明书撰写、权利要求编写、审查意见答复等专利文件的撰写工作，要求能从技术文档中提炼核心创新，覆盖发明的变形与等同方案，确保专利保护范围既广泛又清晰。\
            \  \n适用领域：涵盖电子、机械、化工、软件等多领域技术创新，确保不同领域的专利申请均能准确表达技术特征和创新点。\n\n## Skill\n### 专业经验\n- 拥有30年专利代理师经验，熟悉CNIPA对“专利撰写”和“审查意见答复”的具体要求。\
            \  \n- 深入掌握创造性、实用性和新颖性标准，能够快速识别并提炼技术创新点。  \n- 精通跨学科技术的专利撰写，能精准运用各领域技术术语，确保内容专业、准确。  \n- 擅长从技术文档中提取核心创新，确保涵盖所有变形与等同方案，从而使专利保护范围既广泛又明确。\n\
            \n## Attention\n- **严格生成提示词要求的内容**  \n  - 生成的内容必须完全符合提示词要求，不得包含无关的扩展、总结或概括性描述。  \n  - 例如：当提示要求描述技术实现细节时，不得加入额外的背景介绍或总体性总结。\n\
            - **逐步推导**  \n  - 所有内容生成必须采用“逐步推导（step by step）”方式，层次分明、逻辑清晰。  \n  - 内部推导过程仅用于构建答案，不应在最终输出中呈现给用户。\n- **符合标准要求**\
            \  \n  - 所有输出内容须严格遵循CNIPA标准，确保术语使用一致、语义明确，杜绝出现二义性表述。\n\n## Constraints\n- **基于可靠技术资料**  \n  - 所生成的内容必须依托可靠的技术资料，不得出现无依据的推测或声明。\
            \  \n  - 所有涉及的技术特征应有明确的文献或事实依据支持，如有必要，可引用相关CNIPA文件。\n- **禁止功能性和效果性描述**  \n  - 输出中不得涉及功能性或效果性描述，权利要求中的技术特征必须具体明确。\
            \  \n  - 避免使用含糊或模糊的表述，确保每项描述都具体、准确。\n\n##Initialization\n执行流程\n确认目标：明确任务需求，理解提取与生成内容的用途。\n动态适配：根据用户提示词的目标和规则，逐步分解任务并推导最终解决方案。\n\
            格式与验证：按指定格式生成内容，审查一致性和准确性。\n质量检查：排查未要求的总结或扩展内容，确保输出符合提示词目标。"
        - id: 7c93754a-1e4f-4e0f-b460-276702cc09eb
          role: user
          text: '##参考技术交底书内容，按照Rules对独立权利要求进行深刻反思并生成新的核心独立权利要求。

            ##Rules

            反思核心独立权利要求中各个实体的连接关系，是否全部列出。即部件不能有”孤立“组件，组件的连接不能有“悬空”关系；

            ##Example

            注意：以下内容为示例，不用生成具体结果，LLM 不应在输出中包含示例输入或输出。

            ###Example1

            以下内容为示例，不用生成具体结果

            核心独立权利要求

            1.一种基底的多层涂层体系，其其特征在于，包括：

            基底；

            邻近所述基底的至少一部分设置的金属层，其中所述金属层包含金属、所述金属的氧化物或其组合，其中所述金属选自铬、铝、锆、不锈钢、镍、锡、铟及其组合；

            邻近所述金属层的至少一部分设置的粘附层，其中所述粘附层包含硅酸盐和胶乳，并且其中所述硅酸盐以基于所述粘附层的总重量计的大于70重量％的量存在于所述粘附层中；和邻近所述粘附层的至少一部分设置的保护涂层。

            ###Example2

            以下内容为示例，不用生成具体结果

            核心独立权利要求

            1.一种封装结构的形成方法， 包括：

            形成多个导电结构于一载体基板之中；

            形成一内连结构于该载体基板及所述导电结构上方，其中该内连结构包括一钝化层、多个介电层及多个第一导电部件；

            形成一重分布结构于该内连结构之上，其中该重分布结构具有多个含聚合物层及多个第二导电部件，且该重分布结构直接接触该内连结构的该钝化层，其中该钝化层的宽度大致相同于该重分布结构的宽度，且该重分布结构的厚度大于或等于该载体基板的厚度；

            接合多个芯片结构于该重分布结构之上；

            形成一保护层于该重分布结构之上以包围所述芯片结构；

            以及

            形成多个导电连接器于该载体基板的一表面上，其中该载体基板位于该重分布结构及所述导电连接器之间。

            ###Example3

            以下内容为示例，不用生成具体结果

            核心独立权利要求

            1.一种计算机实现的方法，包括：

            通过数据安全系统并从发布者的发布者计算系统接收对给定用户的订阅令牌的请求，所述请求包括所述给定用户在订阅所述发布者的电子内容时提供给所述发布者的用户识别信息；

            由所述数据安全系统对于所述发布者和所述给定用户生成所述订阅令牌，其中，所述订阅令牌包括(i)一组数据，所述一组数据包括通过使用所述数据安全系统的加密密钥对所述数据安全系统用于识别所述给定用户的所述给定用户的第一用户标识符进行加密而生成的第一加密用户标识符，和对于一个或多个内容平台中的每一个的(ii)附件元素，所述附件元素包括通过使用所述内容平台的加密密钥对所述内容平台用于识别所述给定用户的所述给定用户的第二用户标识符进行加密而生成的第二加密用户标识符；和

            将所述订阅令牌传输到所述发布者计算系统。

            ###Example4

            以下内容为示例，不用生成具体结果

            核心独立权利要求

            1.一种旋转轴结构，其特征在于，该旋转轴结构包括：

            旋转轴，可旋转地安装在壳体上，能够在第一旋转位置和第二旋转位置之间旋转，所述旋转轴还配置成能够在沿着其旋转轴线的方向上在第一平移位置和第二平移位置之间平移；

            阻挡组件，该阻挡组件可枢转地联接到旋转轴，能够相对于壳体在第一姿态和第二姿态之间切换；

            配合阻挡件，固定在壳体上，

            当阻挡组件处于第一姿态时，配合阻挡件处于旋转轴从第一平移位置平移至第二平移位置的平移路径之外，从而允许旋转轴平移至第二平移位置，

            当阻挡组件处于第二姿态时，配合阻挡件处于旋转轴从第一平移位置平移至第二平移位置的平移路径中，从而阻挡旋转轴平移至第二平移位置。

            ###Example5

            以下内容为示例，不用生成具体结果

            核心独立权利要求

            1.一种电力系统，包括：

            至少一个三线有源谐波滤波器(AHF)，配置为耦合到三相负载并向所述三相负载提供补偿电流；

            至少一个四线AHF，配置为耦合到所述三相负载并向所述三相负载提供补偿电流；以及

            控制器，所述控制器被配置为：

            确定要提供给所述三相负载的总补偿电流，所述总补偿电流包括零分量和非零分量；

            确定所述至少一个三线AHF和所述至少一个四线AHF的输出容量；

            基于所述至少一个三线AHF和所述至少一个四线AHF的所述输出容量来计算电流补偿比率；以及

            基于所述电流补偿比率来控制所述至少一个四线AHF以向所述三相负载提供所述总补偿电流的所述非零分量的至少一部分，

            其中，所述至少一个三线AHF与所述至少一个四线AHF并联耦合。

            ##Format

            1.<核心独立权利要求>


            ##workflow

            1、读取并深入理解独立权利要求和技术交底书。

            2、请仔细阅读所有Rules，并确保你完全理解和遵循每一条规则。在生成内容时，请严格按照规则要求执行，同时结合Examples中的示例进行参考和对比。你的目标是确保生成的输出内容既符合规则，又体现出示例中的最佳实践。

            3、提出对{{#1769301001001.clean_text#}}的改进建议

            4、基于改进建议完善核心独立权利要求并输出为<核心独立权利要求>

            注意：仅输出完善后的核心独立权利要求，不要输出任何思考过程内容或修改示例。不要在生成的独立权利要求之前添加“独立权利要求”字样。'
        - id: db51e5f4-0833-4977-b4c7-083536ba24c5
          role: assistant
          text: "##输入内容\n###大纲包含以下内容\n{{#1764588108416.structured_output.core_independent_claim#}}\n{{#1764588108416.structured_output.elementary_features#}}\n\
            {{#1764588108416.structured_output.tech_element_table#}}\n{{#1764588108416.structured_output.entity_hierarchy_nodes#}}\n\
            {{#1764588108416.structured_output.entity_relations#}}\n{{#1764588108416.structured_output.technical_problems#}}\n\
            {{#1764588108416.structured_output.macro_features#}}\n###独立权利要求\n{{#1769301001001.clean_text#}}\n\n###技术交底书\n\
            {{#1770000100003.technical_field#}}\n{{#1770000100003.background_art_TD#}}\n{{#1770000100003.technical_solutions#}}\n\
            {{#1770000100003.beneficial_effects_TD#}}\n{{#1770000100003.drawings_explain_TD#}}\n{{#1770000100003.embodiments_TD#}}\n\
            \n###输入说明（仅包含本节点需要使用的内容）\n\n1）technical_problems（技术问题列表）\n【输入变量：technical_problems】\n\n你将收到一个名为 technical_problems\
            \ 的上游结构化变量（由“2-6-Outline”节点 structured_output 输出）。  \n该变量会以 JSON 形式呈现，请直接按数组理解，每个元素具有字段：\n- id：技术问题编号，例如 \"TP1\"\
            ；\n- text：该技术问题的文字描述。\n\n解析后：\n1. 按原有顺序理解技术问题的先后关系，不要随意调整顺序。\n2. 在分析独立权利要求是否真正对应解决了这些技术问题时，优先使用“id + text”的形式进行对照，例如“技术问题\
            \ TP1：……描述……”。\n\n如果数组为空或内容明显无效，请在内部判断为“上游未提供有效的技术问题列表”，分析时不要凭空创造新的技术问题。\n\n\n2）macro_features（宏观技术特征）\n【输入变量：macro_features】\n\
            \n你将收到一个名为 macro_features 的上游结构化变量（来自“2-6-Outline”节点 structured_output）。  \n该变量会以 JSON 形式呈现，请直接按数组理解，每个元素具有字段：\n\
            - id：宏观技术特征编号，例如 \"A\"、\"B\"；\n- text：该宏观特征的文字描述。\n\n解析后：\n1. 将每个宏观特征视为“整体方案/系统级方案”的抽象描述。\n2. 在判断独立权利要求是否覆盖了发明的核心方案时，可以用宏观特征的\
            \ id（如 A/B）及 text，帮助你理清不同方案之间的差异与侧重点。\n3. 不要发明新的宏观特征编号，只使用数组中出现的 id。\n\n\n3）elementary_features（基本特征 EF）\n【输入变量：elementary_features】\n\
            \n你将收到一个名为 elementary_features 的上游结构化变量（来自“2-6-Outline”节点 structured_output）。  \n该变量会以 JSON 形式呈现，请直接按数组理解，每个元素表示一个基本特征\
            \ EF，字段结构如下：\n- id：EF 编号，例如 \"AA\"；\n- entities：实体列表，每个实体包含：\n  - id：实体编号，例如 \"E111\"；\n  - text：实体/构件的文字描述；\n\
            - relations：EF 内部实体关系列表，每个关系包含：\n  - id：关系编号，通常形如 \"E111-E112\"；\n  - from：起始实体编号；\n  - to：目标实体编号；\n  - text：关系描述；\n\
            - means：实现手段列表，每项包含：\n  - id：手段编号，例如 \"WAAa\"；\n  - text：手段描述；\n- functions：功能列表，每项包含：\n  - id：功能编号，例如 \"FAAa\"\
            ；\n  - text：功能描述；\n- effects：效果列表，每项包含：\n  - id：效果编号，例如 \"RAAa\"；\n  - text：效果描述。\n\n解析后：\n1. 将每个 EF 视为“实体 + 手段\
            \ + 功能 + 效果”的技术要素单元。\n2. 在对现有独立权利要求进行检查和完善时，应尽量基于这些 EF 来核对：\n   - 是否遗漏了重要实体或关键连接关系；\n   - 是否存在仅以功能/效果表达、缺乏结构支撑的限定。\n\
            3. 保持 EF 编号与含义的一致，不要随意创造新的 EF 编号或改变其技术含义。\n\n\n4）entity_hierarchy_nodes（实体层级）\n【输入变量：entity_hierarchy_nodes】\n\
            \n你将收到一个名为 entity_hierarchy_nodes 的上游结构化变量（来自“2-6-Outline”节点 structured_output）。  \n该变量会以 JSON 形式呈现，请直接按数组理解，每个元素代表一个层级节点，字段：\n\
            - tag：层级标签，例如 \"L0\"、\"L1\"、\"L2\"……，数字越小表示层级越高；\n- id：实体编号，例如 \"E0\"、\"E1\"、\"E11\"；\n- parent_id：父节点的实体编号，顶层节点通常为空字符串。\n\
            \n解析后：\n1. 根据 tag 和 parent_id 在心中重建系统结构树（整体系统→子系统→部件）。\n2. 在分析独立权利要求中的构件排列顺序和层级结构时，应参考该层级树，判断：\n   - 是否存在上位系统/部件在权利要求中完全缺失；\n\
            \   - 是否有下位部件在没有引入上位对象的情况下被孤立限定。\n3. 不要随意改变层级关系或虚构新的父子关系，只能基于该树结构来判断独立权利要求结构是否合理。\n\n\n5）entity_relations（实体关系）\n\
            【输入变量：entity_relations】\n\n你将收到一个名为 entity_relations 的上游结构化变量（来自“2-6-Outline”节点 structured_output）。  \n该变量会以 JSON\
            \ 形式呈现，请直接按数组理解，每个元素表示实体之间的系统级关系，字段：\n- id：关系编号，通常形如 \"E1-E2\"；\n- from：起始实体编号；\n- to：目标实体编号；\n- text：该关系的文字描述（如有）。\n\
            \n解析后：\n1. 将这些关系视为不同实体/构件之间的连接、配合或作用关系。\n2. 在检查独立权利要求中各构件的连接/安装/配合关系是否充分时，可据此对照：\n   - 是否漏掉关键的“连接到”、“安装于”、“与……相连”等关系；\n\
            \   - 是否出现与实体关系表明显不一致的错误连接描述。\n3. 如果数组为空，应在分析时标记为“系统级实体关系未显式给出”，避免杜撰复杂连接，只能基于现有权利要求和 EF 进行保守判断。\n\n\n6）tech_element_table（技术要素表）\n\
            【输入变量：tech_element_table】\n\n你将收到一个名为 tech_element_table 的上游结构化变量（来自“2-6-Outline”节点 structured_output）。  \n该变量会以\
            \ JSON 形式呈现，请直接按数组理解，每个元素对应技术要素表的一行，字段：\n- tp：技术问题编号，例如 \"TP1\"；\n- macro：宏观特征编号，例如 \"A\"；\n- ef：基本特征 EF 编号，例如\
            \ \"AA\"；\n- entities_raw：原始实体串，例如 \"E111/E11211\"；\n- entities：实体编号列表，例如 [\"E111\", \"E11211\"]；\n- means：实现手段编号或描述；\n\
            - function：功能编号或描述；\n- effect：效果编号或描述；\n- tech_effect：技术效果编号或标识，或技术效果描述。\n\n解析后：\n1. 将每一行理解为“某个技术问题 TP，由某宏观特征和\
            \ EF 以及具体实体/手段/功能/效果共同构成的解决路径”。\n2. 在分析现有独立权利要求时，用该表来检查：\n   - 是否对每个主要技术问题 TP 都至少有一条对应的解决路径被体现在权利要求中；\n   - 独立权利要求中的区别技术特征，是否可以在技术要素表中找到清晰的对应行。\n\
            3. 不要编造表中不存在的新对应关系（例如新的 TP–EF 组合），只能基于已有的行进行推理和对照。\n\n\n7）core_independent_claim（核心独立权利要求骨架 — 两段式）\n【输入变量：core_independent_claim】\n\
            \n你将收到一个名为 core_independent_claim 的上游结构化变量（来自“2-6-Outline”节点 structured_output）。  \n该变量会以 JSON 形式呈现，请直接按对象理解，字段包括（新结构\
            \ + 兼容旧结构）：\n\n- object_type：权利要求客体类型，例如“装置”、“系统”、“方法”等；\n\n- preamble_features：前序部分特征列表（两段式中的“前序部分”），每项包含：\n\
            \  - id：特征编号，例如 \"PF1\"；\n  - text：前序部分特征的文字描述，通常对应与最接近现有技术共有的技术特征。\n\n- characterizing_features：特征部分特征列表（两段式中的“特征部分”），每项包含：\n\
            \  - id：特征编号，例如 \"CF1\"；\n  - text：区别技术特征的文字描述，通常对应相对于现有技术的改进特征。\n\n（兼容旧字段，如存在则可作为辅助参考）\n- essential_components：必需构件列表，每项：\n\
            \  - id：构件编号，例如 \"EC1\"；\n  - text：构件的文字描述；\n- necessary_relations：必需关系列表，每项：\n  - id：关系编号；\n  - text：关系描述；\n\
            - necessary_actions：必需动作/步骤列表，每项：\n  - id：动作编号；\n  - text：动作描述；\n- core_conditions：核心条件列表，每项：\n  - id：条件编号；\n\
            \  - text：条件描述；\n\n- derived_from_elements：来源 EF 列表，每项：\n  - ref：对应的 EF 编号，例如 \"AA\"；\n  - text：补充说明（如有），可为空。\n\
            \n解析后：\n1. 将 object_type + preamble_features + characterizing_features 视为“当前核心独立权利要求的两段式结构骨架”，结合现有《独立权利要求》文本，判断：\n\
            \   - 前序部分是否仅包含与既有技术共有或公知的特征；\n   - 特征部分是否集中描述区别技术特征，且与对应的 EF/技术要素表行一致。\n2. 可以结合 elementary_features、tech_element_table\
            \ 和 technical_problems，分析：\n   - 是否存在技术要素表中的关键解决路径未在 current 独立权利要求中体现；\n   - 是否存在独立权利要求中的区别特征在技术要素表中找不到清晰来源。\n\
            3. essential_components、necessary_relations、necessary_actions、core_conditions 如存在，可用于辅助核查“骨架是否完整”，但在两段式结构下，前序/特征部分的划分应以\
            \ preamble_features / characterizing_features 为主。\n\n\n8）独立权利要求文本\n【输入内容：{{#1769301001001.clean_text#}}】\n\n你将收到一段自然语言文本，表示当前版本的核心独立权利要求全文，其内容通常已经由上游节点基于大纲生成。\
            \  \n\n使用方式：\n1. 将其视为“待审查和完善的现状版本”，不要忽略或全部推翻，而是：\n   - 对照 core_independent_claim 中的两段式骨架，检查前序部分与特征部分是否对应；\n  \
            \ - 对照 technical_problems、tech_element_table、elementary_features，检查每一项限定是否有技术依据。\n2. 在提出修改建议或给出优化后的权利要求表述时，应：\n\
            \   - 尽量保持编号体系和客体类型不变（除非发现明显错误并给予理由）；\n   - 对不当的功能性/效果性限定，提出用具体结构特征替代的建议；\n   - 对遗漏或表述模糊的关键技术特征，结合大纲数据提出补充建议。\n\
            3. 不要凭空创作一个与原权利要求完全无关的全新方案，只能在现有权利要求的基础上进行结构优化、措辞调整和缺失要素补全。\n\n\n9）技术交底书结构化字段\n【输入内容：technical_field / background_art_TD\
            \ / technical_solutions / beneficial_effects_TD / drawings_explain_TD / embodiments_TD】\n\n你将收到来自技术交底书的多段自然语言文本，分别对应：\n\
            - technical_field：技术领域；\n- background_art_TD：背景技术及现有技术情况；\n- technical_solutions：发明/实用新型的技术方案描述；\n- beneficial_effects_TD：本发明相对于现有技术的有益效果；\n\
            - drawings_explain_TD：附图说明相关文字；\n- embodiments_TD：具体实施方式或实施例描述。\n\n使用方式：\n1. 将技术交底书视为“技术事实的上位来源”，在评估和完善独立权利要求时，应保证：\n\
            \   - 不引入交底书中没有明确或合理推导支撑的技术特征；\n   - 不与交底书中明确记载的技术事实相矛盾。\n2. 优先用途包括：\n   - 当大纲中的某个 EF 或技术要素表行表述较为抽象时，用交底书中的原始表述来理解具体结构和工作原理；\n\
            \   - 当发现现有独立权利要求遗漏关键构件/步骤/条件时，用交底书中的技术方案段落（technical_solutions、embodiments_TD）来补足；\n   - 当需要评价区别特征带来的效果时，参考 beneficial_effects_TD\
            \ 中的有益效果描述。\n3. 不要试图在本节点扩写或重写整个交底书，只在必要时引用对应片段，用于支撑对独立权利要求的分析与修改建议。\n\n---\n\n\n"
