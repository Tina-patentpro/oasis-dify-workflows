        - id: 0ccb4c2b-3092-4517-a3d8-e6c53ff64bec
          role: system
          text: "# Role: 专利撰写专家\n## Profile\n版本日期: 2024年2月1日  \n语言: 中文  \n职责：负责专利说明书撰写、权利要求编写、审查意见答复等专利文件的撰写工作，要求能从技术文档中提炼核心创新，覆盖发明的变形与等同方案，确保专利保护范围既广泛又清晰。\
            \  \n适用领域：涵盖电子、机械、化工、软件等多领域技术创新，确保不同领域的专利申请均能准确表达技术特征和创新点。\n\n## Skill\n### 专业经验\n- 拥有30年专利代理师经验，熟悉CNIPA对“专利撰写”和“审查意见答复”的具体要求。\
            \  \n- 深入掌握创造性、实用性和新颖性标准，能够快速识别并提炼技术创新点。  \n- 精通跨学科技术的专利撰写，能精准运用各领域技术术语，确保内容专业、准确。  \n- 擅长从技术文档中提取核心创新，确保涵盖所有变形与等同方案，从而使专利保护范围既广泛又明确。\n\
            \n## Attention\n- **严格生成提示词要求的内容**  \n  - 生成的内容必须完全符合提示词要求，不得包含无关的扩展、总结或概括性描述。  \n  - 例如：当提示要求描述技术实现细节时，不得加入额外的背景介绍或总体性总结。\n\
            - **逐步推导**  \n  - 所有内容生成必须采用“逐步推导（step by step）”方式，层次分明、逻辑清晰。  \n  - 内部推导过程仅用于构建答案，不应在最终输出中呈现给用户。\n- **符合标准要求**\
            \  \n  - 所有输出内容须严格遵循CNIPA标准，确保术语使用一致、语义明确，杜绝出现二义性表述。\n\n## Constraints\n- **基于可靠技术资料**  \n  - 所生成的内容必须依托可靠的技术资料，不得出现无依据的推测或声明。\
            \  \n  - 所有涉及的技术特征应有明确的文献或事实依据支持，如有必要，可引用相关CNIPA文件。\n- **禁止功能性和效果性描述**  \n  - 输出中不得涉及功能性或效果性描述，权利要求中的技术特征必须具体明确。\
            \  \n  - 避免使用含糊或模糊的表述，确保每项描述都具体、准确。\n\n##Initialization\n执行流程\n确认目标：明确任务需求，理解提取与生成内容的用途。\n动态适配：根据用户提示词的目标和规则，逐步分解任务并推导最终解决方案。\n\
            格式与验证：按指定格式生成内容，审查一致性和准确性。\n质量检查：排查未要求的总结或扩展内容，确保输出符合提示词目标。"
        - id: c1053f74-bc39-46af-870b-ac001a3fbd97
          role: user
          text: "Goals\n编写从属权利要求：在既有独立权利要求基础上，结合“2-6-Outline”节点 structured_output 输出的结构化信息和技术交底书内容，为“核心权利要求组”和“次要权利要求组”（对应2-6-3并列独立权利要求形成的权利要求组）系统生成层次清晰、完全依赖结构/参数/材料/过程限定的从属权利要求。\n\
            \n本节点的目标包括：\n1. 围绕核心独立权利要求，利用 sub_claim_clusters 中的 type、features 与 refines 字段，以及 core_independent_claim 的两段式骨架（preamble_features\
            \ + characterizing_features），构建由上到下逐级细化的“核心权利要求组”从属权利要求；\n2. 在完成核心权利要求组之后，围绕各次要（并列）独立权利要求，结合 parallel_independent_claims\
            \ 的两段式骨架和对应的 sub_claim_clusters，生成各自“次要权利要求组”的从属权利要求；\n3. 充分利用 implementation_elements、preferred_ranges 和 variations，将关键实施方式、优选参数和典型变型方案转化为具有明确结构和参数限定的从属条款；\n\
            4. 在所有从属权利要求中严格杜绝功能性和效果性描述，仅使用结构特征、连接关系、工艺步骤和参数范围进行限定。\n\n---\n\nKey Data Sources（关键数据来源）\n\n在生成从属权利要求时，应按下列优先顺序使用结构化信息：\n\
            \n1. 核心与次要独立权利要求骨架  \n   - core_independent_claim：提供核心独立权利要求的客体类型及“两段式骨架”（preamble_features + characterizing_features）以及对应的\
            \ EF 来源；\n   - parallel_independent_claims：为每个次要（并列）独立权利要求提供自身的“两段式骨架”和 EF 来源，用于构建对应的次要权利要求组。\n\n2. 从属特征主数据源 \
            \ \n   - sub_claim_clusters：按类型（structure / parameter / material / process / function 等）组织的从属特征簇：\n     - 使用 features.id、features.text\
            \ 和 features.refines 构建“首级–中位–下位”的层进链条；\n     - 使用 derived_from 将簇绑定到具体 EF/实体/功能/参数或某一独立权利要求方案。\n\n3. 结构与参数增强来源\
            \  \n   - implementation_elements：用于从“实体 + 手段 + 功能 + 效果”的实施链条中抽取纯结构、连接关系和参数特征；\n   - preferred_ranges：用于生成具体的参数范围、数值或条件限定；\n\
            \   - variations：用于提炼替代结构或变型实施方式，但输出时必须转化为结构/材料/参数限定。\n\n4. 逻辑校验与术语对齐  \n   - technical_problems、macro_features、tp_ts_mapping、tech_element_table、entity_hierarchy_nodes、entity_relations\
            \ 以及技术交底书：\n     - 用于校验每条从属权利要求是否处于既有“技术问题–技术方案–技术效果”链路之内；\n     - 用于对齐用语、保持与技术交底书一致；\n     - 不能据此发明全新的技术特征或技术方案。\n\
            \n注意：\n- 所有从属权利要求中的技术特征都必须能在上述结构化信息中找到明确来源；\n- 严禁凭空发明大纲中未出现的全新技术特征、结构组合或参数设定。\n\n---\n\nRules：从属权利要求生成方法\n\n###\
            \ Rule0：通用要求\n\n- 明确界定保护范围，准确描述发明或实用新型的保护范围。每条权利要求的保护范围由其全部技术特征限定的技术方案作为一个整体限定，每一项权利要求只允许在其结尾处使用句号。\n- 使用明确的科技术语和逻辑结构，确保整体清晰无误，避免模糊或条件性表达。\n\
            - 撰写权利要求时，沿着“技术问题–技术手段–技术效果”的逻辑主线，并以 tech_element_table 和 tp_ts_mapping 为主要依据，确保每一条从属权利要求都在既有技术链路中。\n- 禁止使用商业性宣传用语，专注于技术特征的描述，避免不必要的重复，通过引用前述权利要求的方式撰写。\n\
            - 权利要求应简明扼要，不得包含不必要的原因或理由描述，数量应合理，避免出现实质上保护范围相同的同类权利要求。\n- 产品权利要求：必须用产品的结构特征、连接关系、相对位置、材料和参数范围等进行描述，禁止以功能或效果作为限定依据。\n\
            - 方法权利要求：用工艺过程、操作条件、步骤或流程等技术特征进行描述，可辅以工艺参数和条件，但不得以功能或效果作唯一限定。\n- 避免使用诸如“薄”、“厚”、“强”、“弱”、“高温”等含义不确定的词汇，必要时用具体数值、范围或参照对象界定。\n\
            - 权利要求中的用词应理解为相关技术领域通常具有的含义，避免使用没有公认含义的用语。\n\n### Rule1：核心原则——杜绝功能性和效果性描述\n\n- 在本节点生成的所有从属权利要求中，必须**彻底杜绝功能性和效果性描述**。\
            \  \n  具体禁止包括但不限于：\n  - 功能性词汇与结构：\n    - “用于……”、“用以……”、“实现……”、“能够……”、“可以……”、“以便……”、“以使……”、“以便于……”、“用来……”、“用以实现……”\
            \ 等；\n  - 效果性词汇与结构：\n    - “提高……”、“增强……”、“减少……”、“降低……”、“优化……”、“改善……”、“提升……”、“有利于……”、“便于……”、“从而……”、“以改善……效果” 等。\n\
            - 从属权利要求中不得以功能或效果作为限定手段，也不得在结构/参数特征后附加任何目的性或效果性从句。\n- 如果技术交底书或 implementation_elements 中存在功能/效果性描述，你必须：\n  - 利用\
            \ elementary_features、implementation_elements、entity_hierarchy_nodes、entity_relations、tech_element_table 等信息，找出支撑该功能/效果的实体结构、连接关系和参数；\n\
            \  - 仅以这些结构特征和参数限定进入从属权利要求文本，彻底屏蔽功能和效果用语。\n- 允许使用行业内公认的构件名称中暗含功能含义的情形，例如“隔热层”、“支撑件”、“导向块”等构件名称，但：\n  - 这些名称本身不得被进一步解释为“用于隔热”、“用于支撑”、“用于导向”等功能性句式；\n\
            \  - 不得以“某构件用于……功能”形式出现。\n\n> 注意：本提示词中后面给出的示例权利要求中含有“用于……”、“从而……”等功能和效果性用语，这些示例**仅用于帮助你理解权利要求组结构和引用关系**。在你实际输出的从属权利要求中，**必须严格禁止使用任何功能性和效果性用语**。\n\
            \n### Rule2：提取技术特征（识别核心组与次要组）\n\n1. 明确核心技术方案  \n- 从 core_independent_claim 中读取：\n  - object_type：核心独立权利要求客体类型；\n\
            \  - preamble_features：前序部分特征（对应与最近现有技术共有的结构特征）；\n  - characterizing_features：特征部分特征（区别技术特征）；\n  - derived_from_elements：对应的\
            \ EF 编号。\n- 使用 tech_element_table、elementary_features、entity_hierarchy_nodes、entity_relations：\n  - 为上述特征找到具体实体、连接关系、层级位置和参数细节；\n\
            \  - 后续从属权利要求应在此基础上进行细化，不得引入与该骨架无关的新主线结构。\n\n2. 识别核心权利要求组相关簇  \n- 对 sub_claim_clusters 中的每个簇，按照如下顺序判断其归属：\n  1）若\
            \ derived_from.ref 与 core_independent_claim 的 derived_from_elements.ref 存在直接匹配，则将该簇归入核心权利要求组；  \n  2）若无直接匹配，则比较该簇内\
            \ features.text 与核心独立权利要求的 characterizing_features.text 的语义相近度，匹配度最高且显然涉及核心客体或核心模块的簇归入核心组；  \n  3）不要将同一个簇拆分到多个权利要求组中使用。\n\
            \n3. 识别次要权利要求组相关簇  \n- 对 parallel_independent_claims 中的每个次要独立权利要求，按以下顺序为其寻找对应簇：\n  1）若某簇的 derived_from.ref 与该次要独权的\
            \ derived_from_elements.ref 直接匹配，则将该簇归入该次要权利要求组；  \n  2）若无直接匹配，则比较簇内 features.text 与该次要独权的 characterizing_features.text\
            \ 的相近度，匹配度最高者归入该次要组；  \n  3）避免将同一簇同时用于核心组和多个次要组。\n\n### Rule3：生成核心权利要求组从属条款（优先生成）\n\n1. 生成顺序与编号策略  \n- 本节点仅生成从属权利要求，不生成新的独立权利要求。\
            \  \n- 编号策略以“本次输出内部连续、无重复”为原则：\n  - 如输入中明确给出独立权利要求编号，则从“该编号之后的最小自然数”起按顺序为从属权利要求编号；\n  - 如输入中未明确给出编号，则可以假定核心独立权利要求为“权利要求1”，本节点生成的第一条从属权利要求从“权利要求2”开始依次递增；\n\
            \  - 你不需要处理上游可能存在的编号空档，只需保证本次输出中的编号连续、严格按自然数递增。\n- 在生成顺序上：\n  1）先完整生成“核心权利要求组”的从属权利要求；  \n  2）在核心权利要求组完成之后，再继续编号，生成“次要权利要求组”的从属权利要求。\n\
            \n2. 核心权利要求组的构造方式  \n- 对归入核心组的每个 sub_claim_cluster：\n  - 将 type=\"structure\"/\"parameter\"/\"material\"/\"process\"\
            \ 的特征作为优先素材；\n  - 使用 features.refines 构建簇内层进关系：\n    - refines 为空的 feature：作为该簇的首级从属特征，可直接从属于核心独立权利要求；\n    -\
            \ refines 指向簇内另一特征 id：作为对该特征的进一步限定，应从属于对应的上位从属权利要求。\n- 结合 implementation_elements、preferred_ranges、variations：\n\
            \  - 从 implementation_elements 中抽取与该簇相关的实体结构、连接关系、数量或布置形式；\n  - 从 preferred_ranges 中抽取与该簇相关的数值或范围限定；\n  - 从 variations\
            \ 中抽取替代结构或变型实施方式，并转化为结构/材料/参数限定。\n\n3. 自然语言层级示例（仅用于理解结构，不得复用内容）  \n- 独立权利要求：一种设备，包括外壳和传感模块，外壳内安装控制模块和传感模块，控制模块和传感模块电连接。\
            \  \n- 首级从属权利要求（对应簇中 refines 为空的结构特征）：  \n  “根据权利要求1所述的设备，其中所述外壳为矩形结构。”  \n- 下一级从属权利要求（对应 refines 指向上一条特征）：  \n\
            \  “根据权利要求2所述的设备，其中所述外壳的材质为铝合金，所述外壳的厚度为2mm，且所述外壳表面设有厚度为0.5mm的防腐涂层。”\n\n4. 自检规则（核心组）  \n- 每条下位从属权利要求必须在结构上依赖于直接引用的上位权利要求，且新增特征对技术方案具有实质性限定作用；\n\
            - 禁止简单重复上位权利要求已包含的特征；\n- 每条从属权利要求的所有技术特征，都必须在 sub_claim_clusters、implementation_elements、preferred_ranges、variations\
            \ 或 tech_element_table 中具有明确来源；\n- 严格检查是否存在任何功能性或效果性用语，一旦发现必须重写为纯结构/参数表述。\n\n### Rule4：生成次要权利要求组从属条款\n\n1. 次要权利要求组的定位\
            \  \n- 次要权利要求组基于 parallel_independent_claims 中的每个次要（并列）独立权利要求单独展开，每组仅围绕对应独立权利要求形成从属链条；\n- 不同次要权利要求组之间相互独立，不得互相引用或交叉限定。\n\
            \n2. 构造方式  \n- 对于每个次要独立权利要求：\n  - 使用其 object_type 和 preamble_features 作为基本前序特征背景；\n  - 使用其 characterizing_features\
            \ 以及归入该次要组的 sub_claim_clusters 中的结构/参数/材料/过程特征构建从属条款；\n  - 可进一步结合与该组相关的 implementation_elements、preferred_ranges、variations，丰富结构和参数限定。\n\
            - 一般情况下，每个次要权利要求组生成 1–3 条具有代表性的从属权利要求：\n  - 优先选择能够体现该次要方案特有结构布局、连接方式或参数区间的特征；\n  - 仍然完全禁止功能性和效果性描述。\n\n3. 引用与独立性\
            \  \n- 次要权利要求组内部：\n  - 从属条款只能引用该组对应的次要独立权利要求及本组内部的从属条款；\n  - 不得引用核心权利要求组中的从属条款，也不得引用其他次要权利要求组的条款。\n- 次要权利要求组之间：\n\
            \  - 禁止循环引用或交叉引用；\n  - 禁止以“根据权利要求X或权利要求Y”的方式跨不同次要权利要求组。\n\n### Rule5：自检与优化（数量、语义与结构）\n\n- 数量控制与分配建议：\n  - 所有从属权利要求的总数不得超过\
            \ 12 条；\n  - 建议将总数控制在 8–12 条之间，其中：\n    - 核心权利要求组优先生成约 6–9 条，从“结构 + 参数 + 材料 + 过程”多维度构建防护层次；\n    - 各次要权利要求组合计生成约\
            \ 1–3 条，从中挑选最具代表性的特征；\n  - 当潜在从属特征过多时，优先删减：\n    - 对保护范围贡献有限、仅为轻微补充的特征；\n    - 内容高度重复或与其他条款几乎等价的特征。\n- 功能/效果用语最终检查：\n\
            \  - 再次扫描所有拟输出条款，确认不存在任何功能性或效果性用语；\n  - 特别注意禁止出现：“用于、用以、实现、能够、可以、以便、从而、以使、提高、增强、减少、优化、改善、提升、有利于、便于”等；\n  - 禁止使用“从而实现……”或“以便……”引导的目的性从句。\n\
            - 逻辑与引用关系检查：\n  - 保证每条从属权利要求有且仅有一个直接引用来源（独立或从属条款），且引用方向单向、无循环；\n  - 检查核心组与次要组的边界清晰，不存在跨组引用；\n  - 检查编号在本次输出内部连续、无重复。\n\
            \n---\n\nExamples\n\n注意：以下内容为示例，不用生成具体结果，LLM 不应在输出中包含示例输入或输出，也不得在输出中沿用示例中的编号、术语或文本内容。  \n示例中的功能性/效果性用语仅为帮助理解权利要求结构和权利要求组之间的关系，你在实际输出中**必须彻底禁止**此类用语。\n\
            \n权利要求书示例：\n“”“\n1.一种总线控制器，包括： 第一总线端口，连接至第一通信总线；第二总线端口，连接至第二通信总线；和可寻址开关，连接于所述第一总线端口与所述第二总线端口之间，用于接通和断开所述第一总线端口和所述第二总线端口，\
            \ 其中所述可寻址开关的接通和断开由来自所述第一通信总线的控制信号基于单总线协议进行控制。\n2.根据权利要求1所述的总线控制器，其中所述第一总线端口包括： 第一子端口，连接至所述第一通信总线的第一段；以及 第二子端口，连接至所述第一通信总线的第二段，并且与所述第一子端口连通，\
            \ 其中所述控制信号来自所述第一子端口。\n3.根据权利要求2所述的总线控制器，其中所述第一通信总线的所述第一段是更靠近所述第一通信总线所连接的通信网关的一段，并且所述第一通信总线的第二段是更远离所述第一通信总线所连接的所述通信网关的一段。\n\
            4.根据权利要求3所述的总线控制器，其中所述通信网关连接至使用公有通信协议的外部网络。\n5.根据权利要求1-4中任一项所述的总线控制器，其中所述第二通信总线连接至使用私有通信协议的内部网络。\n6.根据权利要求2所述的总线控制器，其中所述第一子端口、所述第二子端口和所述第二总线端口中的每一个包括拧线接口和/或RJ45接口。\n\
            7.一种分布式通信系统，包括： 通信网关； 第一通信总线； 多个第二通信总线；以及 多个根据权利要求1-6中任一项所述的总线控制器， 其中，所述通信网关连接至所述第一通信总线以及外部网络，多个所述总线控制器的第一总线端口都连接至所述第一通信总线，每个所述总线控制器的第二总线端口各自连接至所述多个第二通信总线中的一个，每个第二通信总线用于连接一个或多个设备使得所述一个或多个设备在内部网络中基于私有通信协议通过所述第二总线通信，\
            \ 所述通信网关作为单总线主机基于单总线协议与每个所述总线控制器通信并控制每个所述总线控制器的可寻址开关的接通和断开，并且所述通信网关将基于所述外部网络所使用的公有通信协议的数据与基于所述第二通信总线上的设备所使用的私有通信协议的数据进行转换。\n\
            8.根据权利要求7所述的分布式通信系统，其中多个所述总线控制器串行连接以形成菊花链连接。\n9.根据权利要求7-8中任一项所述的分布式通信系统，其中所述一个或多个设备串行连接以形成菊花链连接。\n”“”\n\n核心权利要求组分析（示例）：\n\
            “”“\n权利要求1是独立权利要求，描述了一种总线控制器的基本结构和功能。它包括了第一总线端口、第二总线端口和一个可寻址开关，详细说明了可寻址开关如何在第一总线端口和第二总线端口之间进行接通和断开。\n权利要求2从属于权利要求1，进一步限定了第一总线端口的具体结构。它将第一总线端口细化为第一子端口和第二子端口，并指出控制信号来自第一子端口。\n\
            权利要求3从属于权利要求2，描述了第一通信总线的第一段和第二段的位置关系，进一步限定了总线的物理连接方式。\n权利要求4从属于权利要求3，进一步限定了通信网关的连接方式，说明通信网关连接至使用公有通信协议的外部网络。\n\
            权利要求5从属于权利要求1到权利要求4中的任一项，说明了第二通信总线的连接对象，即连接至使用私有通信协议的内部网络。\n权利要求6从属于权利要求2，进一步限定了第一子端口、第二子端口和第二总线端口的物理接口类型，包括拧线接口和/或RJ45接口。\n\
            ”“”\n\n次要权利要求组分析（示例）：\n“”“\n权利要求7是独立权利要求，独立描述了一种分布式通信系统，包括通信网关、第一通信总线、多个第二通信总线和多个总线控制器，并详细说明了这些组件之间的连接和通信方式。该权利要求的撰写意图是将总线控制器（核心权利要求组）应用于一个更大和更复杂的系统中，从而扩展了保护范围。通过描述一个完整的系统，不仅保护了总线控制器的具体结构，还保护了其在实际应用中的系统集成方式，防止竞争对手通过改变系统架构来规避专利保护。\n\
            权利要求8从属于权利要求7，进一步限定了总线控制器的连接方式，说明多个总线控制器可以串行连接形成菊花链连接。\n权利要求9从属于权利要求7或权利要求8，说明一个或多个设备可以串行连接形成菊花链连接。类似于权利要求8，这一要求确保了在特定设备连接方式下，系统应用同样受到保护。\n\
            次要权利要求组（以权利要求7为代表）的撰写主要基于以下原因：\n扩展保护范围：通过描述分布式通信系统，扩展了总线控制器的应用保护范围；\n具体应用场景：详细描述了总线控制器和设备在实际应用中的连接方式，确保这些具体应用场景下的保护；\n\
            系统集成保护：通过描述系统的集成和整体工作方式，进一步防止竞争对手通过改变系统架构规避专利。\n”“”\n\n---\n\nFormat\n\n- 仅输出从属权利要求条款，不输出任何标题、小节名称或说明性文字；\n- 每条从属权利要求**独占一行**，格式为：\n\
            \n  `N. 根据权利要求X所述的……，其中……。`\n\n  其中：\n  - N 为本节点生成的权利要求编号（阿拉伯数字，连续递增）；\n  - “根据权利要求X所述的……”为引用部分；\n  - “其中……”之后为本条的新增结构/参数/材料/过程特征；\n\
            \  - 每条权利要求以句号结束，不在同一行输出多条权利要求，不在条款之间插入空行。\n\n- 编号要求：\n  - 在本次输出内部，编号必须连续、无重复；\n  - 默认假定核心独立权利要求为“权利要求1”，从属权利要求从“权利要求2”开始顺次编号；\n\
            \  - 如输入中已明示其他编号安排，则以输入为准，从其后的最小自然数起顺次编号。\n- 输出顺序：\n  - 首先按编号顺序给出所有“核心权利要求组”的从属权利要求；\n  - 核心组完成后，继续编号输出各“次要权利要求组”的从属权利要求；\n\
            \  - 不要在输出中标注“核心权利要求组”或“次要权利要求组”等组名。\n\n- 禁止在输出中包含：\n  - 任何功能性和效果性用语；\n  - 任何示例内容、分析文字、说明性语句、Format 或 Workflow\
            \ 描述。\n\n---\n\nWorkflow\n\n1. 读取与理解  \n   - 读取并理解核心独立权利要求和各次要独立权利要求文本；\n   - 读取并理解“2-6-Outline”节点 structured_output\
            \ 输出的结构化结果，尤其是 core_independent_claim、parallel_independent_claims、sub_claim_clusters、implementation_elements、preferred_ranges、variations、tech_element_table、entity_hierarchy_nodes、entity_relations；\n\
            \   - 结合技术交底书相关内容，对术语和结构层级进行对齐。\n\n2. 规划从属特征集（先核心，后次要）  \n   - 按 Rule2，将 sub_claim_clusters 分配给核心权利要求组和各次要权利要求组，不拆分同一簇；\n\
            \   - 基于 core_independent_claim 的两段式骨架和核心组簇，规划核心权利要求组的层进结构；\n   - 在核心组规划完成后，再基于 parallel_independent_claims 及对应簇规划各次要权利要求组的从属结构。\n\
            \n3. 生成不超过 12 条的从属权利要求  \n   - 先为核心权利要求组生成约 6–9 条从属权利要求，再为所有次要权利要求组合计生成约 1–3 条，从中选取最具代表性的结构/参数/材料/过程特征；\n   -\
            \ 所有条款严格采用结构、连接关系、材料和参数限定，不得使用任何功能性或效果性用语；\n   - 在生成过程中，注意保持编号连续、引用关系单向、核心组与次要组边界清晰。\n\n4. 自检与输出  \n   - 按 Rule5\
            \ 检查：  \n     - 功能与效果用语是否完全剔除；  \n     - 引用关系是否正确且无循环；  \n     - 各条款是否都能在结构化信息中找到明确来源；  \n     - 总条数是否不超过 12 条，核心/次要组分配是否合理。\
            \  \n   - 最终仅按 Format 要求输出从属权利要求条款，不输出任何思考过程、解释或示例内容。\n"
