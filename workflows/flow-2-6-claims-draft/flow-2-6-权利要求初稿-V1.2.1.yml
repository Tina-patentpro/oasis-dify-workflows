    - data:
        code: "import json\nimport re\n\nFULLWIDTH_DIGITS = str.maketrans(\"０１２３４５６７８９\", \"0123456789\")\n\n\ndef _normalize_text(text:\
          \ str) -> str:\n    return (text or \"\").replace(\"\\r\\n\", \"\\n\").replace(\"\\r\", \"\\n\").replace(\"&nbsp;\"\
          , \" \").replace(\"\\xa0\", \" \")\n\n\ndef _sort_key(value):\n    text = str(value or \"\").strip().translate(FULLWIDTH_DIGITS)\n\
          \    return (0, int(text)) if text.isdigit() else (1, text)\n\n\ndef _split_claims(claims_text: str):\n    text\
          \ = _normalize_text(claims_text)\n    pattern = re.compile(r\"(?m)(?:^|\\n)\\s*([0-9０-９]+)\\s*[\\.、．]\\s*\")\n \
          \   matches = list(pattern.finditer(text))\n    claims = []\n    for idx, match in enumerate(matches):\n       \
          \ claim_no = match.group(1).translate(FULLWIDTH_DIGITS)\n        start = match.end()\n        end = matches[idx\
          \ + 1].start() if idx + 1 < len(matches) else len(text)\n        body = text[start:end].strip()\n        if body:\n\
          \            claims.append({\"claim_no\": claim_no, \"body\": body})\n    return claims\n\n\ndef _expand_range(start,\
          \ end):\n    try:\n        a = int(str(start).translate(FULLWIDTH_DIGITS))\n        b = int(str(end).translate(FULLWIDTH_DIGITS))\n\
          \    except Exception:\n        return [str(start), str(end)]\n    if a <= b and b - a <= 30:\n        return [str(i)\
          \ for i in range(a, b + 1)]\n    return [str(a), str(b)]\n\n\ndef _extract_parent_refs(body: str):\n    head = _normalize_text(body)[:260].translate(FULLWIDTH_DIGITS)\n\
          \    refs = []\n    for start, end in re.findall(r\"权利要求\\s*(\\d+)\\s*(?:至|到|～|~|-|－|—)\\s*(\\d+)\", head):\n  \
          \      refs.extend(_expand_range(start, end))\n    for segment in re.findall(r\"(?:根据|如|按照)?\\s*权利要求\\s*([^，。；;]{1,120}?)\\\
          s*所述\", head):\n        refs.extend(re.findall(r\"\\d+\", segment))\n    if not refs:\n        for segment in re.findall(r\"\
          (?:根据|如|按照)\\s*权利要求\\s*([^，。；;]{1,120})\", head):\n            refs.extend(re.findall(r\"\\d+\", segment))\n   \
          \ seen = set()\n    out = []\n    for ref in refs:\n        ref = str(ref).strip().translate(FULLWIDTH_DIGITS)\n\
          \        if ref and ref not in seen:\n            seen.add(ref)\n            out.append(ref)\n    return out\n\n\
          \ndef _label(claim_no: str, parents):\n    if not parents:\n        return f\"{claim_no}（核心独立）\" if str(claim_no)\
          \ == \"1\" else f\"{claim_no}（并列独立）\"\n    if len(parents) > 1:\n        return f\"{claim_no}（并列从属）\"\n    return\
          \ str(claim_no)\n\n\ndef _render_tree(claims, parents_by_no, children):\n    claim_nos = {row[\"claim_no\"] for\
          \ row in claims}\n    roots = [row[\"claim_no\"] for row in claims if not parents_by_no.get(row[\"claim_no\"])]\n\
          \    roots = sorted(set(roots), key=_sort_key)\n    for parent in list(children.keys()):\n        children[parent]\
          \ = sorted(set(children[parent]), key=_sort_key)\n\n    lines = [\"## 权利要求依赖树\"]\n\n    def render(claim_no, ancestor_has_more=None,\
          \ is_last=True, path=None):\n        if ancestor_has_more is None:\n            ancestor_has_more = []\n       \
          \ if path is None:\n            path = []\n        if claim_no in path:\n            lines.append(\"\".join(\"│\
          \  \" if x else \"   \" for x in ancestor_has_more[:-1]) + (\"└─\" if is_last else \"├─\") + f\"{claim_no}（循环引用）\"\
          )\n            return\n        if not ancestor_has_more:\n            prefix = \"\"\n        else:\n           \
          \ prefix = \"\".join(\"│  \" if has_more else \"   \" for has_more in ancestor_has_more[:-1])\n            prefix\
          \ += \"└─\" if is_last else \"├─\"\n        lines.append(prefix + _label(claim_no, parents_by_no.get(claim_no, [])))\n\
          \        kids = [kid for kid in children.get(claim_no, []) if kid in claim_nos]\n        for idx, child in enumerate(kids):\n\
          \            child_is_last = idx == len(kids) - 1\n            render(child, ancestor_has_more + [not child_is_last],\
          \ child_is_last, path + [claim_no])\n\n    for root in roots:\n        render(root, [], True, [])\n\n    if len(lines)\
          \ == 1:\n        lines.append(\"未解析到可渲染的权利要求节点。\")\n    return \"\\n\".join(lines).strip()\n\n\ndef main(claims_text:\
          \ str = \"\") -> dict:\n    claims = _split_claims(claims_text)\n    claim_nos = {row[\"claim_no\"] for row in claims}\n\
          \    parents_by_no = {}\n    children = {}\n    edges = []\n    warnings = []\n\n    if not claims:\n        tree_text\
          \ = \"## 权利要求依赖树\\n未解析到权利要求编号；请检查终稿正文编号格式。\"\n        return {\n            \"clean_text\": tree_text,\n       \
          \     \"tree_text\": tree_text,\n            \"dependency_edges\": \"[]\",\n            \"dependency_warnings\"\
          : json.dumps([\"未解析到权利要求编号\"], ensure_ascii=False),\n            \"dependency_parse_status\": \"fallback\",\n  \
          \      }\n\n    for row in claims:\n        claim_no = row[\"claim_no\"]\n        refs = [ref for ref in _extract_parent_refs(row[\"\
          body\"]) if ref in claim_nos and ref != claim_no]\n        raw_refs = _extract_parent_refs(row[\"body\"])\n    \
          \    missing_refs = [ref for ref in raw_refs if ref not in claim_nos and ref != claim_no]\n        if missing_refs:\n\
          \            warnings.append(f\"权利要求{claim_no}引用了未出现在最终正文中的权利要求：{','.join(missing_refs)}。\")\n        parents_by_no[claim_no]\
          \ = refs\n        for parent in refs:\n            children.setdefault(parent, []).append(claim_no)\n          \
          \  edges.append({\"parent\": parent, \"child\": claim_no})\n\n    tree_text = _render_tree(claims, parents_by_no,\
          \ children)\n    status = \"warning\" if warnings else \"ok\"\n    return {\n        \"clean_text\": tree_text,\n\
          \        \"tree_text\": tree_text,\n        \"dependency_edges\": json.dumps(edges, ensure_ascii=False),\n     \
          \   \"dependency_warnings\": json.dumps(warnings, ensure_ascii=False),\n        \"dependency_parse_status\": status,\n\
          \    }\n"
