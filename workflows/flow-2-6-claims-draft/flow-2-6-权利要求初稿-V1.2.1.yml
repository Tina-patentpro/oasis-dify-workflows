          role: user
          text: "## 任务定位\n\n本节点只负责“权利要求正文定稿”，不负责生成依赖树。\n你的任务不是重新发明一份新权利要求书，而是以“待定稿正文”为基线，结合结构化大纲、技术交底书和完善建议，做最小必要修订，输出稳定的正文终稿。\n\
            \n## 输入\n\n1. 待定稿正文（主基线）\n{{#1769301001005.clean_text#}}\n\n2. 完善建议\n{{#1769301001006.clean_text#}}\n{{#1769301001007.clean_text#}}\n\
            \n3. 6.2高优先级闭环清单（硬门）\n高优先级问题数量：{{#1769301001007.high_priority_issue_count#}}\n解析状态：{{#1769301001007.priority_parse_status#}}\n\
            必须闭环指令：\n{{#1769301001007.must_close_instructions#}}\n\n3. 结构化大纲\n{{#1764588108416.structured_output.core_independent_claim#}}\n\
            {{#1764588108416.structured_output.parallel_independent_claims#}}\n{{#1764588108416.structured_output.sub_claim_clusters#}}\n\
            {{#1764588108416.structured_output.tech_element_table#}}\n{{#1764588108416.structured_output.elementary_features#}}\n\
            {{#1764588108416.structured_output.implementation_elements#}}\n{{#1764588108416.structured_output.preferred_ranges#}}\n\
            {{#1764588108416.structured_output.variations#}}\n{{#1764588108416.structured_output.outline_quality#}}\n{{#1764588108416.structured_output.error#}}\n\
            \n4. 技术交底书\n背景技术：{{#1770000100003.background_art_TD#}}\n技术方案：{{#1770000100003.technical_solutions#}}\n有益效果：{{#1770000100003.beneficial_effects_TD#}}\n\
            实施例：{{#1770000100003.embodiments_TD#}}\n附图说明：{{#1770000100003.drawings_explain_TD#}}\n\n## 内部决策顺序（只在心中执行，不输出）\n\
            \n1. 先锁定“待定稿正文”的四个基线：\n   - 总权利要求条数；\n   - 独立权利要求条数；\n   - 各条的大体顺序；\n   - 主要依附关系和权利要求组结构。\n2. 先逐条扫描待定稿正文中残留的功能性和效果性表述，建立“必须处理清单”；凡是出现“用于、实现、以、从而、提高、降低、抑制、破坏、优化、改善、增强”等目的或效果性限定的，默认列入必须处理清单。\n\
            3. 逐条审查完善建议，并在心中分成三类：\n   - 必采纳：与结构化大纲/交底书直接一致，且能修复明确缺陷；\n   - 可采纳：只涉及术语统一、轻量清理、非结构性微调；\n   - 不采纳：会引入新特征、改乱条数结构、扩大改写范围，或与大纲/交底书冲突。\n\
            4. 先处理“必须处理清单”和“必采纳”，再做“可采纳”；对“不采纳”不输出解释，直接忽略。\n5. 修订完成后，再回看一次：条数、独权数量、主要依附结构是否仍与基线一致。\n\n## 强制不变量\n\n1. 默认保持总权利要求条数不变。\n\
            2. 默认保持独立权利要求条数不变。\n3. 默认保持权利要求组结构不变，不得把从属改成独立，也不得把独立改成从属。\n4. 默认保持主要排序不变，不得随意重排整份正文。\n5. 若 `parallel_independent_claims`\
            \ 为空、无效或数量为 0，不得新建2-6-3并列独立权利要求。\n6. 不得新增结构化大纲、技术交底书和待定稿正文均未披露的新技术特征。\n7. 不得保留任何未经结构或参数落地的功能性或效果性限定语；若无法合法改写，则应删除该限定片段，而不是继续保留。\n\
            \n## 仅在以下情况允许破例改动条数\n\n1. 某条与结构化大纲或技术交底书明显冲突，且不删改该条就无法修复；\n2. 某条与其他条款实质重复；\n3. 某条同时承载多个并列主题，必须拆分才合法；\n4. 某条存在错位引用或缺失关键承接，必须合并/拆分才可闭合。\n\
            \n若触发上述破例：\n- 仍应优先控制在相对待定稿 ±1 条范围内；\n- 独立权利要求条数原则上仍保持不变，除非存在明确冲突；\n- 必须同步修正全部编号、区间引用和并列引用。\n\n## 允许的修改类型\n\n1.\
            \ 删除明显不受支持、明显重复或明显冲突的局部表述；\n2. 按大纲和交底书做定点补强，但仅限已有披露；\n3. 统一术语、清理语病、修正错号和错引；对附图标记仅删除非法、错配或游离的括号编号，不得删除合法的“技术特征（附图标记）”表达；\n\
            4. 对功能性/效果性表达做强制结构化落地，但不得因此引入新特征。\n5. 若某个功能/效果片段缺乏足够结构支撑，可以删除该片段或改写为更窄的已披露结构限定，但不得因“少改稳改”而继续保留原表述。\n\n## 禁止的修改类型\n\
            \n1. 整份重写或大面积改写；\n2. 无依据新增2-6-3并列独立权利要求；\n3. 无依据新增从属层级；\n4. 将建议当作新的技术事实来源；\n5. 输出解释、总结、变量名、JSON、过程说明或任何额外标题。\n\
            \n## 输出规则\n\n1. 第一行必须是 `## 权利要求书`。\n2. 只输出一个部分：标题 `## 权利要求书` 及其下方正文；不得输出依赖树。\n3. 每条权利要求单独成段，使用 `1\\. `、`2\\. `、`3\\\
            . ` 的编号格式，条与条之间保留一个空行。\n4. 允许在单条内部使用 `<br>` 换行，但不得使用 Markdown 列表、代码块或表格。\n5. 删除内部变量名、JSON 字段名、游离图号和任何过程性文字；如保留附图标记，只能写成“相应技术特征（附图标记）”并紧随该技术特征，不得单独写图号或以标记替代技术特征。\n\
            6. 附图标记仅用于帮助理解权利要求，不得解释为对权利要求保护范围的限制。\n7. 保持术语一致，不得引入新的客体类型，不得写入技术效果句或过程说明句。\n8. 最终正文中不得保留“用于、实现、从而、以抑制、以降低、以提高、以破坏、以优化、以改善、以增强”等目的性或效果性限定语，除非其属于构件名称本身且不承担限定作用。\n\
            \n## 回退规则\n\n如果 `outline_quality.status` 为 `partial` 或 `insufficient`，或 `error` 非空，你仍应以“待定稿正文”作为第一基线，以技术方案、实施例、附图说明和完善建议为补充，做最小必要修订；不得因为大纲异常而把正文压缩成极少条款，除非待定稿本身已经明显不成立。\n\
            \n## 6.2闭环执行规则\n\n1. 先读取“6.2高优先级闭环清单”，逐项判断终稿正文是否已经通过条文修改消除问题。\n2. 对清单中的每一项，必须在最终权利要求正文中完成闭环；不得仅保留原文、不得仅输出解释、不得把问题转交依赖树。\n\
            3. 若闭环与“默认保持条数/独权数量/依附结构”冲突，以高优先级闭环为先，但只允许做最小必要调整。\n4. 如果闭环需要新增从属层级或调整依附关系，必须同步修正全部编号和“根据权利要求X”的引用。\n5. 输出前进行最后自检：高优先级问题是否仍可在终稿正文中直接观察到；如仍存在，继续修订，不得输出。\n"
        - id: 5669558d-f820-479a-b166-0d17f23c35d6
          role: assistant
          text: '## 输出硬约束


            1. 你的回答必须从 `## 权利要求书` 开始。

            2. 你的回答只能包含正文这一部分，严禁输出 `## 权利要求依赖树`。

            3. 先在心中锁定 `{{#1769301001005.clean_text#}}` 的总条数、独立权利要求条数、排序和主要依附结构，再开始修订。

            4. 若无明确冲突，总条数必须与 `{{#1769301001005.clean_text#}}` 完全一致，独立权利要求条数必须完全一致。

            5. 如果必须调整条数，只能做最小改动，优先控制在 ±1 条，并同步修正所有引用编号。

            6. 若 `parallel_independent_claims` 为空或无效，不得生成新的2-6-3并列独立权利要求。

            7. 非必要不改句，非必要不改序，非必要不改依附结构。

            8. 优先局部修订，不做整份重写；不得输出解释、变量名、JSON、过程说明或任何额外标题。

            9. 严禁输出 `<think>`、`</think>`、思考过程、分析过程、模型自述或任何推理痕迹；若内部出现此类内容，必须在最终输出前全部删除。

            10. 最终输出中若仍存在功能性或效果性限定语，必须继续改写，直到转化为已披露的结构、连接、材料、步骤或参数限定；若无法转化，则删除该限定片段。'
