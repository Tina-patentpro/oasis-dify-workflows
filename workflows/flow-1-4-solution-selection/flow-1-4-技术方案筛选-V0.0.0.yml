    # ==================== Node-1-4-3: closest_pa匹配 ====================
    - data:
        desc: 'Node-1-4-3: 为每个方案匹配最接近的现有技术,提取共同特征和差异点'
        selected: false
        title: closest_pa匹配
        type: code
        # Python代码实现
        code: |
          def _default_unmatched():
              return {
                  'patent_id': 'N/A',
                  'title': '未找到匹配的现有技术',
                  'link': '',
                  'common_features': [],
                  'differences': [],
                  'd1_score': 0,
                  'match_status': 'unmatched',
              }

          def _build_reference_candidate(pa_table):
              reference_candidate = pa_table.get('default_closest_pa', {})
              if reference_candidate:
                  return reference_candidate

              comparison_table = pa_table.get('comparison_table', [])
              if not comparison_table:
                  return {}

              first_item = comparison_table[0] or {}
              return {
                  'patent_id': first_item.get('patent_id') or first_item.get('publicationNumber') or first_item.get('title', 'N/A'),
                  'title': first_item.get('title', '未找到匹配的现有技术'),
                  'link': first_item.get('link', ''),
                  'common_features': first_item.get('common_features', []),
                  'differences': first_item.get('differences', []),
                  'd1_score': first_item.get('d1_score', first_item.get('score', 0)),
                  'match_status': 'reference_candidate',
              }

          def _reference_only_closest_pa(reference_candidate):
              closest_pa = {
                  'patent_id': 'REFERENCE_ONLY',
                  'title': '未形成逐方案closest_pa匹配',
                  'link': '',
                  'common_features': [],
                  'differences': [],
                  'd1_score': 0,
                  'match_status': 'reference_only',
              }
              if reference_candidate:
                  closest_pa['reference_candidate'] = reference_candidate
              return closest_pa

          def main(args):
              """
              closest_pa匹配节点主处理函数
              """
              import json
              from datetime import datetime

              graded_data = json.loads(args.get('graded_solutions', '{}'))
              pa_table = json.loads(args.get('closest_pa_table', '{}'))

              pa_mapping = {}
              for mapping in pa_table.get('closest_pa_mapping', []):
                  solution_id = mapping.get('solution_id')
                  if solution_id:
                      pa_mapping[solution_id] = mapping.get('closest_pa', {})

              reference_candidate = _build_reference_candidate(pa_table)

              matched_solutions = []
              match_stats = {'matched': 0, 'reference_only': 0, 'unmatched': 0}

              for solution in graded_data.get('graded_solutions', []):
                  solution_id = solution.get('solution_id', '')
                  closest_pa = pa_mapping.get(solution_id, {})
                  solution_with_pa = solution.copy()

                  if closest_pa:
                      exact_closest_pa = closest_pa.copy() if isinstance(closest_pa, dict) else {}
                      exact_closest_pa.setdefault('match_status', 'exact')
                      solution_with_pa['closest_pa'] = exact_closest_pa
                      match_stats['matched'] += 1
                  elif reference_candidate:
                      solution_with_pa['closest_pa'] = _reference_only_closest_pa(reference_candidate)
                      match_stats['reference_only'] += 1
                  else:
                      solution_with_pa['closest_pa'] = _default_unmatched()
                      match_stats['unmatched'] += 1

                  matched_solutions.append(solution_with_pa)

              output_data = {
                  'graded_solutions': matched_solutions,
                  'metadata': {
                      'total_solutions': len(matched_solutions),
                      'matched_count': match_stats['matched'],
                      'reference_only_count': match_stats['reference_only'],
                      'fallback_count': match_stats['reference_only'],
                      'unmatched_count': match_stats['unmatched'],
                      'match_rate': round(match_stats['matched'] / len(matched_solutions) * 100, 1) if matched_solutions else 0,
                      'matching_date': datetime.now().strftime('%Y-%m-%d'),
                  },
              }

              matching_report = generate_matching_report(matched_solutions, match_stats)

              return {
                  'graded_solutions_with_pa_json': json.dumps(output_data, ensure_ascii=False, indent=2),
                  'matching_report_md': matching_report,
              }

          def generate_matching_report(matched_solutions, match_stats):
              """生成匹配报告"""
              from datetime import datetime

              total_count = len(matched_solutions)
              reference_only_count = match_stats.get('reference_only', match_stats.get('fallback', 0))

              report_lines = [
                  "# closest_pa匹配报告",
                  f"\n**生成时间**: {datetime.now().strftime('%Y-%m-%d %H:%M:%S')}",
                  "\n## 匹配统计",
                  f"\n- **总方案数**: {total_count}",
                  f"- **成功匹配**: {match_stats['matched']}",
                  f"- **参考候选（非逐方案匹配）**: {reference_only_count}",
                  f"- **未匹配**: {match_stats['unmatched']}",
                  f"- **匹配率**: {match_stats['matched'] / total_count * 100:.1f}%" if total_count > 0 else "",
                  "\n## 匹配详情",
                  "\n| 方案ID | 方案名称 | 等级 | 匹配状态 | closest_pa | 共同特征数 | 差异数 | D1分数 |",
                  "|---|---|---|---|---|---|---|---|",
              ]

              for sol in matched_solutions:
                  closest_pa = sol.get('closest_pa', {})
                  match_status = closest_pa.get('match_status', 'exact')
                  closest_pa_label = closest_pa.get('patent_id', 'N/A')
                  if match_status == 'reference_only':
                      reference_candidate = closest_pa.get('reference_candidate', {})
                      reference_id = reference_candidate.get('patent_id') or reference_candidate.get('publicationNumber') or reference_candidate.get('title', 'N/A')
                      closest_pa_label = f"REFERENCE_ONLY ({reference_id})"
                  report_lines.append(
                      f"| {sol.get('solution_id', '')} | {sol.get('solution_name', '')} | "
                      f"{sol.get('grade', '')} | {match_status} | {closest_pa_label} | "
                      f"{len(closest_pa.get('common_features', []))} | "
                      f"{len(closest_pa.get('differences', []))} | "
                      f"{closest_pa.get('d1_score', 0)} |"
                  )

              return '\n'.join(report_lines)
        # 输出变量配置
        outputs:
        - value_selector:
          - graded_solutions_with_pa_json
          variable: graded_solutions_with_pa_json
        - value_selector:
          - matching_report_md
          variable: matching_report_md
        # 输入变量映射
        title: closest_pa匹配
        variables:
        - value_selector:
          - graded_solutions_json
          variable: graded_solutions
        - value_selector:
          - closest_pa_table
          variable: closest_pa_table
