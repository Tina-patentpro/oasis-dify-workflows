                  patent_app = {
                      'solution_id': solution.get('solution_id', ''),
                      'solution_name': solution.get('solution_name', ''),
                      'grade': grade,
                      'overall_score': solution.get('scores', {}).get('overall_score', 0),
                      'scores': solution.get('scores', {}),
                      'closest_pa': solution.get('closest_pa', {}),
                      'oasis_mapping': solution.get('oasis_mapping', {}),
                      'innovation_level': solution.get('decision_support', {}).get('innovation_level', ''),
                      'trl': solution.get('maturity', {}).get('trl', 1),
                      'priority_score': solution.get('decision_support', {}).get('priority_score', 0),
                  }

                  if 'cross_domain_transfer' in solution:
                      patent_app['cross_domain_transfer'] = solution.get('cross_domain_transfer', {})

                  patent_applications.append(patent_app)

              list_patent = {
                  'patent_applications': patent_applications,
                  'metadata': {
                      'total_solutions': len(patent_applications),
                      'grade_a_count': grade_counts.get('A', 0),
                      'grade_b_count': grade_counts.get('B', 0),
                      'grade_c_count': grade_counts.get('C', 0),
                      'selection_date': datetime.now().strftime('%Y-%m-%d'),
                      'version': 'V2.4',
                  },
              }

              selection_report = generate_selection_report(patent_applications, grade_counts)
              decision_report = generate_decision_report(patent_applications)

              return {
                  'list_patent_json': json.dumps(list_patent, ensure_ascii=False, indent=2),
                  'selection_report_md': selection_report,
                  'decision_report_md': decision_report,
              }

          def generate_selection_report(patent_applications, grade_counts):
              """生成方案筛选报告"""
              from datetime import datetime

              total = len(patent_applications) or 1
              report_lines = [
                  "# 方案筛选报告",
                  f"\n**生成时间**: {datetime.now().strftime('%Y-%m-%d %H:%M:%S')}",
                  "\n## 筛选结果总览",
                  "\n### 分级统计",
                  f"\n- **A级方案**: {grade_counts.get('A', 0)}个 (优先推荐) - {grade_counts.get('A', 0) / total * 100:.1f}%",
                  f"- **B级方案**: {grade_counts.get('B', 0)}个 (备选方案) - {grade_counts.get('B', 0) / total * 100:.1f}%",
                  f"- **C级方案**: {grade_counts.get('C', 0)}个 (探索级) - {grade_counts.get('C', 0) / total * 100:.1f}%",
                  "\n## A级方案详情",
              ]

              a_grade_apps = [app for app in patent_applications if app.get('grade') == 'A']
              if a_grade_apps:
                  for app in a_grade_apps:
                      scores = app.get('scores', {})
                      report_lines.extend([
                          f"\n### {app.get('solution_name', '')}",
                          f"- **方案ID**: {app.get('solution_id', '')}",
                          f"- **综合评分**: {scores.get('overall_score', 0):.1f}",
                          f"- **TRL**: {app.get('trl', 1)}",
                          f"- **创新等级**: {app.get('innovation_level', '')}",
                          f"- **可实施性**: {scores.get('implementability', 0):.1f}",
                          f"- **可专利性**: {scores.get('patentability', 0):.1f}",
                          f"- **差异性**: {scores.get('differentiation', 0):.1f}",
                          f"- **ROI**: {scores.get('roi', 0):.1f}" if 'roi' in scores else "",
                          f"- **创新性**: {scores.get('innovation', 0):.1f}" if 'innovation' in scores else "",
                          f"- **路线图对齐**: {scores.get('alignment', 0):.1f}" if 'alignment' in scores else "",
                      ])
              else:
                  report_lines.append("\n暂无A级方案")

              return '\n'.join(report_lines)

          def generate_decision_report(patent_applications):
              """生成决策支撑报告"""
              from datetime import datetime

              report_lines = [
                  "# 决策支撑报告",
                  f"\n**生成时间**: {datetime.now().strftime('%Y-%m-%d %H:%M:%S')}",
                  "\n## 评分维度说明",
                  "\n### V2.2七维评分体系",
                  "1. **可实施性** (权重20%): 基于TRL评级",
                  "2. **可专利性** (权重20%): 基于D1/D2分析",
                  "3. **差异性** (权重20%): TP-EF驱动的差异化",
                  "4. **ROI** (权重30%): 基于priority_score",
                  "5. **创新性** (权重20%): 基于innovation_level",
                  "6. **路线图对齐度** (权重10%): 基于alignment_with_roadmap",
                  "\n## 分级标准",
                  "\n### A级(优先推荐)",
                  "- 综合评分 ≥ 80",
                  "- TRL ≥ 6",
                  "- 创新等级 ≥ ⭐⭐⭐⭐",
                  "- **建议**: 优先申请专利",
                  "\n### B级(备选方案)",
                  "- 综合评分 ≥ 60",
                  "- TRL ≥ 4",
                  "- 创新等级 ≥ ⭐⭐⭐",
                  "- **建议**: 根据资源情况选择",
                  "\n### C级(探索级)",
                  "- 其他方案",
                  "- **建议**: 仅作参考或继续研发",
              ]

              return '\n'.join(report_lines)
