          \ 根据资源情况选择\",\n        \"\\n## C级 (探索级)\",\n        \"- 其他方案\",\n       \
          \ \"- 含义: 低质量或高风险方案\",\n        \"- 建议: 仅作参考或继续研发\",\n        \"\\n## A级方案详情\"\
          \n    ]\n\n    # 列出所有A级方案\n    a_grade_solutions = [s for s in graded_solutions\
          \ if s.get('grade') == 'A']\n\n    if a_grade_solutions:\n        for sol\
