        type: code
        # Python代码实现
        code: |
          def main(args):
              """
              oasis_mapping生成节点主处理函数
              """
              import json
              from datetime import datetime

              graded_data = json.loads(args.get('graded_solutions_with_pa', '{}'))
              problem_effect = json.loads(args.get('problem_effect', '{}'))

              solutions_with_oasis = []
              oasis_stats = {
                  'total_solutions': 0,
                  'with_tp_mapping': 0,
                  'with_ef_mapping': 0,
                  'complete_mapping': 0,
              }

              for solution in graded_data.get('graded_solutions', []):
                  oasis_stats['total_solutions'] += 1

                  existing_oasis = solution.get('oasis_mapping', {})
                  if not isinstance(existing_oasis, dict):
                      existing_oasis = {}

                  oasis_mapping = {
                      'technical_problems': existing_oasis.get('technical_problems', []),
                      'technical_effects': existing_oasis.get('technical_effects', []),
                      'solutions': [solution.get('solution_id', '')],
                      'embodiments': generate_embodiment_ids(solution.get('solution_id', '')),
                  }

                  if oasis_mapping['technical_problems']:
                      oasis_stats['with_tp_mapping'] += 1
                  if oasis_mapping['technical_effects']:
                      oasis_stats['with_ef_mapping'] += 1
                  if oasis_mapping['technical_problems'] and oasis_mapping['technical_effects']:
                      oasis_stats['complete_mapping'] += 1

                  solution_with_oasis = solution.copy()
                  solution_with_oasis['oasis_mapping'] = oasis_mapping
                  if problem_effect:
                      solution_with_oasis['problem_effect_context'] = problem_effect
                  solutions_with_oasis.append(solution_with_oasis)

              total_count = oasis_stats['total_solutions'] or 1
              tp_mapping_rate = round(oasis_stats['with_tp_mapping'] / total_count * 100, 1)
              ef_mapping_rate = round(oasis_stats['with_ef_mapping'] / total_count * 100, 1)
              complete_mapping_rate = round(oasis_stats['complete_mapping'] / total_count * 100, 1)

              output_data = {
                  'graded_solutions': solutions_with_oasis,
                  'metadata': {
                      'total_solutions': oasis_stats['total_solutions'],
                      'tp_mapping_rate': tp_mapping_rate,
                      'ef_mapping_rate': ef_mapping_rate,
                      'complete_mapping_rate': complete_mapping_rate,
                      'generation_date': datetime.now().strftime('%Y-%m-%d'),
                  },
              }

              oasis_report = generate_oasis_report(solutions_with_oasis, {
                  'total_solutions': oasis_stats['total_solutions'],
                  'tp_mapping_rate': tp_mapping_rate,
                  'ef_mapping_rate': ef_mapping_rate,
                  'complete_mapping_rate': complete_mapping_rate,
              })

              return {
                  'graded_solutions_with_oasis_json': json.dumps(output_data, ensure_ascii=False, indent=2),
                  'oasis_report_md': oasis_report,
              }


          def generate_embodiment_ids(solution_id):
              """
              生成实施例ID
              """
              parts = str(solution_id or '').split('-')
              num = parts[1] if len(parts) >= 2 else '001'
              return [
                  f"EMB-{num}-1",
                  f"EMB-{num}-2",
              ]


          def generate_oasis_report(solutions_with_oasis, oasis_stats):
              """生成oasis映射报告"""
              from datetime import datetime

              report_lines = [
                  "# oasis_mapping生成报告",
                  f"\n**生成时间**: {datetime.now().strftime('%Y-%m-%d %H:%M:%S')}",
                  "\n## 映射统计",
                  f"\n- **总方案数**: {oasis_stats.get('total_solutions', 0)}",
                  f"- **TP映射率**: {oasis_stats.get('tp_mapping_rate', 0):.1f}%",
                  f"- **EF映射率**: {oasis_stats.get('ef_mapping_rate', 0):.1f}%",
                  f"- **完整映射率**: {oasis_stats.get('complete_mapping_rate', 0):.1f}%",
                  "\n## oasis_mapping详情",
                  "\n| 方案ID | 方案名称 | TP数量 | EF数量 | 实施例数量 |",
