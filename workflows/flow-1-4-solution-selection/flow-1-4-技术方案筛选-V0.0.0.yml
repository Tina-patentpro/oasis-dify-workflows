          \ 含义: 高质量、高创新、高可专利性方案\",\n        \"- 建议: 优先申请专利\",\n        \"\\n##\
          \ B级 (备选方案)\",\n        \"- 综合评分 ≥ 60\",\n        \"- TRL ≥ 4\",\n     \
