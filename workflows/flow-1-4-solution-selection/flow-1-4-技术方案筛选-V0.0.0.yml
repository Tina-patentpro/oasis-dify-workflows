              list_patent生成节点主处理函数
              """
              import json
              from datetime import datetime

              graded_data = json.loads(args.get('graded_solutions_with_oasis', '{}'))
              user_input = args.get('user_input', '')

              patent_applications = []
              grade_counts = {'A': 0, 'B': 0, 'C': 0}

              for solution in graded_data.get('graded_solutions', []):
                  grade = solution.get('grade', 'C')
