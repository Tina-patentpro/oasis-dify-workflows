app:
  description: 'Flow-1-4: 方案筛选与分级(V2.4增强版)。基于七维评分体系筛选候选方案，生成A/B/C分级方案列表，为每个方案匹配closest_pa，生成list_patent.json（专利申请方向表），提供决策支撑数据。'
  icon: 🎯
  icon_background: '#FFF3E0'
  mode: workflow
  name: Flow-1-4-方案筛选与分级
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.5.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    edges:
    # Start → Node-1-4-1 (五维评分计算)
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: code
      id: start-node-1-4-1
      source: 'start_node'
      sourceHandle: source
      target: 'node_1_4_1'
      targetHandle: target
      type: custom
      zIndex: 0
    # Node-1-4-1 → Node-1-4-2 (A/B/C分级判定)
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: code
        targetType: code
      id: node-1-4-1-node-1-4-2
      source: 'node_1_4_1'
      sourceHandle: source
      target: 'node_1_4_2'
      targetHandle: target
      type: custom
      zIndex: 0
    # Node-1-4-2 → Node-1-4-3 (closest_pa匹配)
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: code
        targetType: code
      id: node-1-4-2-node-1-4-3
      source: 'node_1_4_2'
      sourceHandle: source
      target: 'node_1_4_3'
      targetHandle: target
      type: custom
      zIndex: 0
    # Node-1-4-3 → Node-1-4-4 (oasis_mapping生成)
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: code
        targetType: code
      id: node-1-4-3-node-1-4-4
      source: 'node_1_4_3'
      sourceHandle: source
      target: 'node_1_4_4'
      targetHandle: target
      type: custom
      zIndex: 0
    # Node-1-4-4 → Node-1-4-5 (list_patent生成)
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: code
        targetType: code
      id: node-1-4-4-node-1-4-5
      source: 'node_1_4_4'
      sourceHandle: source
      target: 'node_1_4_5'
      targetHandle: target
      type: custom
      zIndex: 0
    # Node-1-4-5 → End
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: code
        targetType: end
      id: node-1-4-5-end
      source: 'node_1_4_5'
      sourceHandle: source
      target: 'end_node'
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    # ==================== Start节点 ====================
    - data:
        desc: '输入: 从Flow-1-1/Flow-1-2/Flow-1-3获取的输入数据'
        selected: false
        title: 开始
        type: start
        variables:
        # 来自Flow-1-2 (TRIZ问题分析)
        - label: 候选方案列表(JSON)
          max_length: 128000
          options: []
          required: true
          type: paragraph
          variable: candidate_principles
        # 来自Flow-1-2 (V2.3新增)
        - label: TP-EF清单(JSON,可选)
          max_length: 128000
          options: []
          required: false
          type: paragraph
          variable: problem_effect
        # 来自Flow-1-3 (专利检索)
        - label: 检索数据表(JSON)
          max_length: 128000
          options: []
          required: true
          type: paragraph
          variable: prior_art_set
        # 来自Flow-1-3 (专利检索)
        - label: 最接近现有技术表(JSON)
          max_length: 128000
          options: []
          required: true
          type: paragraph
          variable: closest_pa_table
        # 来自Flow-1-1 (技术背景研究)
        - label: 技术检索信息(JSON,可选)
          max_length: 128000
          options: []
          required: false
          type: paragraph
          variable: tech_landscape
        # 来自Flow-1-2 (术语表生成)
        - label: 技术术语表(JSON,可选)
          max_length: 128000
          options: []
          required: false
          type: paragraph
          variable: terms_master
        # 来自Flow-1-2 (TRIZ分析,可选)
        - label: TRIZ分析结果(JSON,可选)
          max_length: 128000
          options: []
          required: false
          type: paragraph
          variable: triz_contradictions
        # 用户输入
        - label: 用户偏好与约束
          max_length: 128000
          options: []
          required: true
          type: paragraph
          variable: user_input
        # 政策优先方向(JSON,可选) - P0-0新增
        - label: 政策优先方向(JSON,可选)
          max_length: 128000
          options: []
          required: false
          type: paragraph
          variable: policy_directions
          default: |
            {
              "关键数字技术": ["人工智能", "AI", "机器学习", "深度学习", "高端芯片", "半导体", "芯片设计", "量子信息", "量子计算", "量子通信", "物联网", "IoT", "传感器", "区块链", "分布式账本", "工业互联网", "智能制造", "元宇宙", "虚拟现实", "增强现实"],
              "绿色技术": ["清洁能源", "太阳能", "风能", "水能", "储能", "锂电池", "钠离子电池", "节能", "节水", "氢能", "燃料电池", "光伏", "太阳能电池", "碳捕集", "CCUS", "循环利用", "回收", "绿色交通", "电动车辆"],
              "新三样": ["电动汽车", "EV", "混动", "动力电池", "储能电池", "光伏组件", "太阳能电池"],
              "战略性新兴产业": ["新一代信息技术", "5G", "6G", "高端装备制造", "数控机床", "新材料", "复合材料", "生物技术", "基因工程", "新能源汽车", "智能网联汽车"]
            }
      height: 480
      id: 'start_node'
      position:
        x: 30
        y: 282
      positionAbsolute:
        x: 30
        y: 282
      selected: false
      sourcePosition: right
      type: custom
      width: 244

    # ==================== Node-1-4-1: 五维评分计算 ====================
    - data:
        desc: 'Node-1-4-1: 基于七个维度对候选方案进行综合评分(可实施性/可专利性/差异性/ROI/创新性/路线图对齐度/政策对齐度) - P0修复版'
        selected: false
        title: 七维评分计算
        type: code
        # Python代码实现
        code: "def main(args):\n    \"\"\"\n    五维评分计算节点主处理函数\n\
          \n    Args:\n        args: 输入参数字典\n            - candidate_principles: JSON字符串\n\
          \            - problem_effect: JSON字符串 (可选)\n            - prior_art_set: JSON字符串\n\
          \            - tech_landscape: JSON字符串 (可选)\n            - terms_master: JSON字符串\
          \ (可选)\n            - triz_contradictions: JSON字符串 (可选)\n            - user_input:\
          \ 字符串\n\n    Returns:\n        dict: 包含以下字段\n            - scored_solutions_json:\
          \ JSON字符串\n            - scoring_report_md: Markdown字符串\n    \"\"\"\n  \
          \  import json\n    from datetime import datetime\n\n    # 1. 解析输入数据\n\
          \    candidate_principles = json.loads(args.get('candidate_principles', '{}'))\n\
          \    problem_effect = json.loads(args.get('problem_effect', '{}'))\n    prior_art_set\
          \ = json.loads(args.get('prior_art_set', '{}'))\n    tech_landscape = json.loads(args.get('tech_landscape',\
          \ '{}'))\n    terms_master = json.loads(args.get('terms_master', '{}'))\n   \
          \ triz_contradictions = json.loads(args.get('triz_contradictions', '{}'))\n\
          \    user_input = args.get('user_input', '')\n    policy_directions = json.loads(args.get('policy_directions',\
          \ '{}'))  # P0-0新增: 政策优先方向\n\n    # 2. 检查V2.2数据可用性\n\
          \    has_v22_data = bool(problem_effect) and \\\n                   any('decision_support'\
          \ in sol for sol in\n                       candidate_principles.get('candidate_solutions',\
          \ []))\n\n    # P0-1修复: 七维评分标准化权重 (总和100%)\n    NORMALIZED_WEIGHTS = {\n        \
          \ 'implementability': 0.15,    # 15% 可实施性\n        'patentability': 0.20,       #\
          \ 20% 可专利性\n        'differentiation': 0.15,     # 15% 差异性\n        'roi': 0.20,\
          \                 # 20% ROI\n        'innovation': 0.10,          # 10% 创新性\n\
          \        'alignment': 0.10,           # 10% 路线图对齐度\n        'policy_alignment':\
          \ 0.10     # 10% 政策对齐度 (P0-0新增)\n    }\n\n    # 3. 遍历所有方案进行评分\n    scored_solutions\
          \ = []\n    scoring_details = []\n\n    for solution in candidate_principles.get('candidate_solutions',\
          \ []):\n        solution_id = solution.get('solution_id', '')\n\n        # 维度1:
          \ 可实施性评分 (20%)\n        implementability = calculate_implementability(solution)\n\
          \n        # 维度2: 可专利性评分 (20%) - P0-2修复\n        patentability = calculate_patentability(solution,\
          \ prior_art_set)\n\n        # 维度3: 差异性评分 (15%)\n        differentiation\
          \ = calculate_differentiation(\n            solution, prior_art_set, problem_effect,\
          \ has_v22_data\n        )\n\n        # 维度4: ROI评分 (20%)\n    \
          \    roi = calculate_roi(solution, has_v22_data)\n\n        # 维度5: 创新性评分\
          \ (20%) - V2.3新增\n        innovation = calculate_innovation(solution, has_v22_data)\n\
          \n        # 维度6: 路线图对齐度 (10%)\n        alignment = calculate_alignment(solution,\
          \ has_v22_data)\n\n        # 综合评分计算\n        if has_v22_data:\n       \
          \     final_score = (\n                implementability * 0.20 +\n       \
          \         patentability * 0.20 +\n                differentiation * 0.20 +\n\
          \                roi * 0.30 +\n                innovation * 0.20 +\n      \
          \          alignment * 0.10\n            )\n        else:\n            # V2.1兼容:\
          \ 仅三维评分\n            final_score = (\n                implementability +\
          \ patentability + differentiation\n            ) / 3\n\n        # 构建评分结果\n\
          \        scores = {\n            'implementability': round(implementability,\
          \ 2),\n            'patentability': round(patentability, 2),\n          \
          \  'differentiation': round(differentiation, 2),\n            'overall_score':\
          \ round(final_score, 2)\n        }\n\n        if has_v22_data:\n        \
          \    scores['roi'] = round(roi, 2)\n            scores['innovation'] = round(innovation,\
          \ 2)\n            scores['alignment'] = round(alignment, 2)\n\n        # 添加评分到方案\n\
          \        solution_with_score = solution.copy()\n        solution_with_score['scores']\
          \ = scores\n\n        scored_solutions.append(solution_with_score)\n\n    \
          \    # 记录评分详情\n        scoring_details.append({\n            'solution_id':\
          \ solution_id,\n            'solution_name': solution.get('solution_name',\
          \ ''),\n            'scores': scores,\n            'data_version': 'V2.4' if\
          \ has_v22_data else 'V2.1'\n        })\n\n    # 4. 生成输出结构\n    output_data\
          \ = {\n        'scored_solutions': scored_solutions,\n        'metadata':\
          \ {\n            'total_solutions': len(scored_solutions),\n            'scoring_date':\
          \ datetime.now().strftime('%Y-%m-%d'),\n            'data_version': 'V2.4'\
          \ if has_v22_data else 'V2.1',\n            'has_v22_data': has_v22_data\n\
          \        }\n    }\n\n    # 5. 生成评分报告\n    scoring_report = generate_scoring_report(scoring_details,\
          \ has_v22_data)\n\n    # 6. 返回结果\n    return {\n        'scored_solutions_json':\
          \ json.dumps(output_data, ensure_ascii=False, indent=2),\n        'scoring_report_md':\
          \ scoring_report\n    }\n\n\ndef calculate_implementability(solution):\n\
          \    \"\"\"\n    基于TRL评分\n\n    评分标准:\n    - TRL 7-9: 90-100分\n    - TRL\
          \ 4-6: 70-89分\n    - TRL 1-3: 50-69分\n    \"\"\"\n    trl = solution.get('maturity',\
          \ {}).get('trl', 1)\n\n    if trl >= 7:\n        return min(100, 90 + (trl\
          \ - 7) * 5)\n    elif trl >= 4:\n        return 70 + (trl - 4) * 6\n    else:\n\
          \        return 50 + trl * 6\n\n\ndef calculate_patentability(solution,\
          \ prior_art_set):\n    \"\"\"\n    基于D1冲突评分\n\n    评分标准:\n    - 无D1冲突:\
          \ 90-100分\n    - D1差异明显: 70-89分\n    - D1高度相似: 50-69分\n    \"\"\"\n    #\
          \ 简化实现: 基于方案独特性\n    cross_domain = solution.get('cross_domain_transfer',\
          \ {})\n    if cross_domain.get('transferability') == '高':\n        return\
          \ 90\n    elif cross_domain.get('transferability') == '中':\n        return\
          \ 80\n    else:\n        return 70\n\n\ndef calculate_differentiation(solution,\
          \ prior_art_set, problem_effect, has_v22_data):\n    \"\"\"\n    基于TP-EF驱动的差异化评分\n\
          \n    V2.3: 70%原有结构差异化 + 30%TP-EF差异化\n    \"\"\"\n    # 原有结构差异化 (70%)\n\
          \    structural_diff = 70  # 简化实现\n\n    if has_v22_data and problem_effect:\n\
          \        # TP-EF差异化 (30%)\n        tp_ef_diff = calculate_tp_ef_differentiation(solution,\
          \ problem_effect)\n        return structural_diff * 0.7 + tp_ef_diff * 0.3\n\
          \    else:\n        return structural_diff\n\n\ndef calculate_tp_ef_differentiation(solution,\
          \ problem_effect):\n    \"\"\"\n    TP-EF差异化评分\n\n    评分标准:\n    - 未覆盖+量化:\
          \ 100分\n    - 未覆盖+未量化: 70分\n    - 已覆盖: 30分\n    \"\"\"\n    oasis_mapping\
          \ = solution.get('oasis_mapping', {})\n    solution_ef_ids = oasis_mapping.get('technical_effects',\
          \ [])\n\n    if not solution_ef_ids:\n        return 50  # 无EF映射\n\n    effects\
          \ = problem_effect.get('technical_effects', [])\n\n    quantifiable_count\
          \ = 0\n    for ef_id in solution_ef_ids:\n        for effect in effects:\n\
          \            if effect.get('ef_id') == ef_id and effect.get('quantifiable'):\n\
          \                quantifiable_count += 1\n                break\n\n    if\
          \ quantifiable_count == len(solution_ef_ids):\n        return 100  # 全部量化\n\
          \    elif quantifiable_count > 0:\n        return 70  # 部分量化\n    else:\n\
          \        return 50  # 未量化\n\n\ndef calculate_roi(solution, has_v22_data):\n\
          \    \"\"\"\n    基于priority_score评分\n\n    评分标准:\n    - priority_score ≥\
          \ 80: 100分\n    - priority_score ≥ 60: 80分\n    - priority_score ≥ 40: 60分\n\
          \    - priority_score < 40: 40分\n    \"\"\"\n    if not has_v22_data:\n  \
          \      return 0\n\n    priority_score = solution.get('decision_support', {}).get('priority_score',\
          \ 50)\n\n    if priority_score >= 80:\n        return 100\n    elif priority_score\
          \ >= 60:\n        return 80\n    elif priority_score >= 40:\n        return\
          \ 60\n    else:\n        return 40\n\n\ndef calculate_innovation(solution,\
          \ has_v22_data):\n    \"\"\"\n    基于innovation_level评分\n\n    评分标准:\n    - ⭐⭐⭐⭐⭐:\
          \ 100分\n    - ⭐⭐⭐⭐: 85分\n    - ⭐⭐⭐: 70分\n    - ⭐⭐: 50分\n    - ⭐: 30分\n\
          \    \"\"\"\n    if not has_v22_data:\n        return 0\n\n    innovation_level\
          \ = solution.get('decision_support', {}).get('innovation_level', '')\n    star_count\
          \ = innovation_level.count('⭐')\n\n    score_map = {\n        5: 100,\n  \
          \      4: 85,\n        3: 70,\n        2: 50,\n        1: 30\n    }\n\n \
          \   return score_map.get(star_count, 50)\n\n\ndef calculate_alignment(solution,\
          \ has_v22_data):\n    \"\"\"\n    基于alignment_with_roadmap评分\n\n    评分标准:\n\
          \    - \"是\": 100分\n    - \"否\": 0分\n    \"\"\"\n    if not has_v22_data:\n\
          \        return 0\n\n    alignment = solution.get('decision_support', {}).get('alignment_with_roadmap',\
          \ '否')\n    return 100 if alignment == '是' else 0\n\n\ndef generate_scoring_report(scoring_details,\
          \ has_v22_data):\n    \"\"\"生成评分报告(Markdown格式)\"\"\"\n    from datetime import\
          \ datetime\n\n    report_lines = [\n        \"# 五维评分计算报告\",\n        f\"\\n**生成时间**:\
          \ {datetime.now().strftime('%Y-%m-%d %H:%M:%S')}\",\n        f\"**数据版本**: {'V2.2\
          \ (七维评分)' if has_v22_data else 'V2.1 (三维评分)'}\",\n        \"\\n## 评分体系说明\"\
          \n    ]\n\n    if has_v22_data:\n        report_lines.extend([\n        \
          \    \"\\n### V2.2 七维评分体系\",\n            \"1. **可实施性** (权重20%): 基于TRL评级\"\
          ,\n            \"2. **可专利性** (权重20%): 基于D1/D2分析\",\n            \"3. **差异性**\
          \ (权重20%): TP-EF驱动的差异化\",\n            \"4. **ROI** (权重30%): 基于priority_score\"\
          ,\n            \"5. **创新性** (权重20%): 基于innovation_level\",\n            \"6.\
          \ **路线图对齐度** (权重10%): 基于alignment_with_roadmap\",\n        ])\n    else:\n\
          \        report_lines.extend([\n            \"\\n### V2.1 三维评分体系\",\n   \
          \         \"1. **可实施性** (33%): 基于TRL评级\",\n            \"2. **可专利性** (33%):\
          \ 基于D1/D2分析\",\n            \"3. **差异性** (33%): 结构差异化\",\n        ])\n\n\
          \    report_lines.extend([\n        \"\\n## 方案评分详情\",\n        \"\\n| 排名\
          \ | 方案ID | 方案名称 | 可实施性 | 可专利性 | 差异性\"\n    ])\n\n    if has_v22_data:\n\
          \        report_lines[-1] += \" | ROI | 创新性 | 路线图对齐 | **综合评分** |\"\n    else:\n\
          \        report_lines[-1] += \" | **综合评分** |\"\n\n    report_lines.append(\"\
          |---|---|---|---|---|---\" + (\"|---|---|---|---|\" if has_v22_data else \"\
          |--|\"))\n\n    # 按综合评分排序\n    sorted_details = sorted(scoring_details, key=lambda\
          \ x: x['scores']['overall_score'], reverse=True)\n\n    for idx, detail in\
          \ enumerate(sorted_details, 1):\n        scores = detail['scores']\n    \
          \    row = f\"| {idx} | {detail['solution_id']} | {detail['solution_name']}\
          \ | {scores['implementability']:.1f} | {scores['patentability']:.1f} | {scores['differentiation']:.1f}\"\
          \n\n        if has_v22_data:\n            row += f\" | {scores['roi']:.1f}\
          \ | {scores['innovation']:.1f} | {scores['alignment']:.1f} | **{scores['overall_score']:.1f}**\
          \ |\"\n        else:\n            row += f\" | **{scores['overall_score']:.1f}**\
          \ |\"\n\n        report_lines.append(row)\n\n    return '\\n'.join(report_lines)\n\
          \    'tech_landscape': tech_landscape,\n    'terms_master': terms_master,\n\
          \    'triz_contradictions': triz_contradictions,\n    'user_input': user_input\n\
          })\n"
        # 输出变量配置
        outputs:
        - value_selector:
          - scored_solutions_json
          variable: scored_solutions_json
        - value_selector:
          - scoring_report_md
          variable: scoring_report_md
        # 输入变量映射
        title: 七维评分计算
        variables:
        - value_selector:
          - candidate_principles
          variable: candidate_principles
        - value_selector:
          - problem_effect
          variable: problem_effect
        - value_selector:
          - prior_art_set
          variable: prior_art_set
        - value_selector:
          - tech_landscape
          variable: tech_landscape
        - value_selector:
          - terms_master
          variable: terms_master
        - value_selector:
          - triz_contradictions
          variable: triz_contradictions
        - value_selector:
          - user_input
          variable: user_input
        - value_selector:
          - policy_directions
          variable: policy_directions
      height: 580
      id: 'node_1_4_1'
      position:
        x: 280
        y: 282
      positionAbsolute:
        x: 280
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244

    # ==================== Node-1-4-2: A/B/C分级判定 ====================
    - data:
        desc: 'Node-1-4-2: 基于综合评分和关键指标进行方案分级(A级:优先推荐/B级:备选方案/C级:探索级)'
        selected: false
        title: A/B/C分级判定
        type: code
