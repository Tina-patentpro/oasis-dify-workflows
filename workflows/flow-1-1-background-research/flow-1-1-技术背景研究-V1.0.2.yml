    - data:
        code: |-
          FAIL_MESSAGE = "本次调研报告生成失败，原因是返回内容结构不完整，请重试。"
          
          def text_or_empty(value):
              if value is None:
                  return ""
              return str(value).strip()
          
          def normalize_newlines(text):
              return text_or_empty(text).replace("\r\n", "\n").replace("\r", "\n")
          
          def extract_title_and_body(report_text):
              normalized = normalize_newlines(report_text)
              if not normalized:
                  return "# 技术背景研究报告", FAIL_MESSAGE
              lines = normalized.split("\n")
              first_index = None
              for index, line in enumerate(lines):
                  if line.strip():
                      first_index = index
                      break
              if first_index is None:
                  return "# 技术背景研究报告", FAIL_MESSAGE
              first_line = lines[first_index].strip()
              body_lines = lines[first_index:]
              title_text = "技术背景研究报告"
              if first_line.startswith("#"):
                  title_text = first_line.lstrip("#").strip() or title_text
                  body_lines = lines[first_index + 1:]
              elif first_line.startswith("**") and first_line.endswith("**") and len(first_line) > 4:
                  title_text = first_line.strip("*").strip() or title_text
                  body_lines = lines[first_index + 1:]
              body = "\n".join(body_lines).strip()
              if not body:
                  body = FAIL_MESSAGE if FAIL_MESSAGE in normalized else "正文暂无可展示内容。"
              return f"# {title_text}", body
          
          def fallback_summary_lines(report_text):
              fallback = FAIL_MESSAGE if FAIL_MESSAGE in text_or_empty(report_text) else "未明确。"
              return "\n".join([
                  f"- 研究主题：{fallback}",
                  f"- 核心问题：{fallback}",
                  f"- 技术路径：{fallback}",
                  f"- 阶段判断：{fallback}",
                  f"- 趋势建议：{fallback}",
              ])
          
          def normalize_summary(summary_markdown, report_text):
              summary = normalize_newlines(summary_markdown)
              if not summary:
                  return fallback_summary_lines(report_text)
              return summary
          
          def main(report_body=None, summary_markdown=None) -> dict:
              raw_report = text_or_empty(report_body)
              if FAIL_MESSAGE in raw_report:
                  return {"combined_markdown": FAIL_MESSAGE}
              if not text_or_empty(summary_markdown):
                  return {"combined_markdown": raw_report or FAIL_MESSAGE}
              title_line, body = extract_title_and_body(raw_report)
              summary = normalize_summary(summary_markdown, raw_report)
              parts = [
                  title_line,
                  "",
                  "## 报告摘要",
                  "",
                  summary,
                  "",
                  "## 报告正文",
                  "",
                  body,
              ]
              return {"combined_markdown": "\n".join(parts)}
