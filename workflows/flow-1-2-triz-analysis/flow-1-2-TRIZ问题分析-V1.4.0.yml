    - data:
        code: "import re\n\n\ndef _clean_text(text):\n    if text is None:\n        return \"\"\n    text = str(text).replace(\"\\r\\n\", \"\\n\").replace(\"\\r\", \"\\n\").strip()\n    text = re.sub(r\"^```[a-zA-Z0-9_-]*\\n?\", \"\", text)\n    text = re.sub(r\"\\n?```$\", \"\", text)\n    return text.strip()\n\n\ndef _strip_heading(text, expected_heading):\n    text = _clean_text(text)\n    if not text:\n        return \"\"\n    lines = [line.rstrip() for line in text.split(\"\\n\")]\n    while lines and not lines[0].strip():\n        lines.pop(0)\n    if lines and lines[0].strip() == expected_heading:\n        return \"\\n\".join(lines[1:]).strip()\n    return \"\\n\".join(lines).strip()\n\n\ndef _split_blocks(text):\n    text = _clean_text(text)\n    if not text:\n        return []\n    raw_blocks = re.split(r\"\\n\\s*\\n\", text)\n    return [block.strip() for block in raw_blocks if block.strip()]\n\n\ndef _norm_key(block):\n    return re.sub(r\"\\s+\", \"\", block)\n\n\ndef _dedupe_blocks(blocks, seen):\n    result = []\n    for block in blocks:\n        key = _norm_key(block)\n        if key in seen:\n            continue\n        seen.add(key)\n        result.append(block)\n    return result\n\n\ndef _section(heading, body_blocks):\n    if not body_blocks:\n        return \"\"\n    return heading + \"\\n\\n\" + \"\\n\\n\".join(body_blocks).strip()\n\n\ndef main(s01_summary=None, s02_patent=None, s03_part1=None, s03_part2=None, s03_part3=None):\n    seen = set()\n\n    s01_blocks = _dedupe_blocks(_split_blocks(_strip_heading(s01_summary, \"## S-01 概要\")), seen)\n    s02_blocks = _dedupe_blocks(_split_blocks(_strip_heading(s02_patent, \"## S-02 专利（含检索式）\")), seen)\n    s03_1_blocks = _dedupe_blocks(_split_blocks(_strip_heading(s03_part1, \"### S-03-1 技术（上篇）\")), seen)\n    s03_2_blocks = _dedupe_blocks(_split_blocks(_strip_heading(s03_part2, \"### S-03-2 技术（中篇）\")), seen)\n    s03_3_blocks = _dedupe_blocks(_split_blocks(_strip_heading(s03_part3, \"### S-03-3 技术（下篇）\")), seen)\n\n    s03_blocks = []\n    for blocks in (s03_1_blocks, s03_2_blocks, s03_3_blocks):\n        s03_blocks.extend(blocks)\n\n    parts = [\"# Triz分析报告\"]\n\n    s01_section = _section(\"## 报告概要\", s01_blocks)\n    if s01_section:\n        parts.extend([\"\", s01_section])\n\n    s02_section = _section(\"## 专利方向分析（含检索式）\", s02_blocks)\n    if s02_section:\n        parts.extend([\"\", s02_section])\n\n    s03_section = _section(\"## 技术方向分析\", s03_blocks)\n    if s03_section:\n        parts.extend([\"\", s03_section])\n\n    report = \"\\n\".join(parts)\n    report = re.sub(r\"\\n{3,}\", \"\\n\\n\", report).strip() + \"\\n\"\n    return {\"triz_report_markdown\": report}\n"
