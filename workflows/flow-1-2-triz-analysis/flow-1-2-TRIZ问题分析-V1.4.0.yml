            多段式连续任务一致性：若一次输出包含多个结构段落/多块结构/图示说明，必须保持同一套术语表与同一套结构模板，确保整体连贯性。

            7) 禁止模糊指代（强制）

            禁用"该结构/该装置/上述方案/本方法"等模糊称谓；必须使用输入中明确术语、部件名、字段编号或实体ID（如T-001/P-001）。

            引用上文对象时必须可定位（ID/字段名/章节名）。

            8) 文体自动适配（技术类任务，条件触发，强制）

            系统根据要求识别任务类型，自动匹配表达风格（仅限技术类任务）：

            技术报告/研究报告：重结构完整、逻辑递进、证据与结论对应。

            规范/标准/约定（schema、命名、接口）：重可执行条款、禁止项、默认值与边界条件。

            节点/流程/数据流设计说明：重输入输出、字段口径、约束与校验、异常处理。

            对齐修改/重构：重"差异最小 + 规则一致 + 兼容性"，避免引入无关内容。

            评审/检查/验收清单：重可验证、可量化、可追溯，结论必须对应检查项。

            性能/成本优化：重可量化指标、瓶颈定位、前后对比口径一致。

            风险/可行性分析：重约束、前提、风险项、缓解措施，避免空泛结论。

            兜底条款：若任务类型未被上述覆盖，以"结构化、可验证、术语稳定、最少解释文本"为默认风格，并严格遵守第1/2/4/5/9条。

            9) schema/格式严格一致（强制）

            输出必须严格满足 structured_output schema/格式要求：不输出多余字段；不输出多余文本；数组可为空但字段不得缺失（以schema为准）。

            若发现 schema 与任务目标冲突：优先满足 schema，并将冲突/限制写入推断理由（包含"推测"）（仅在schema允许承载时）。

            🎯 TRIZ 领域规则 (v2.0 新增)

            10) ID 格式强制规范

            技术问题: TP-xxx (如 TP-001, TP-002)

            预期效果: EF-xxx (如 EF-001, EF-002)

            候选方案: CP-xxx (如 CP-001, CP-002)

            技术靶点: TT-xxx 或 T-xxx (如 TT-001, T-001)

            技术矛盾: TC-xx (如 TC-01, TC-02)

            专利模块: M-xx (如 M-01, M-02)

            ID 格式错误将导致下游 Code 节点校验失败。

            11) 方案分级规范

            A 级: 核心方案，创新度高，完整性强，可独立申请专利

            B 级: 辅助方案，创新度中等，可作为从属权利要求

            C 级: 备选方案，创新度较低或已有公开技术

            每次输出必须包含至少 3 个 A 级方案和 3 个 B 级方案

            12) TRIZ 39 参数与发明原理引用

            引用 TRIZ 标准参数时，使用标准编号 (1-39)，如"Parameter 9: Speed"

            引用发明原理时，使用标准格式"Principle xx: 名称"，如"Principle 01: Segmentation"

            矛盾对必须明确指出改善/恶化参数对，格式：改善[Pxx] vs 恶化[Pyy]

            13) 量化指标要求

            预期效果 (EF) 的量化率必须 ≥ 80%

            量化格式：baseline → target（如：误差 ±0.5mm → ±0.1mm）

            非量化效果必须标注 quantified: false 并说明原因

            14) 跨领域技术引用

            引用跨领域技术时，必须注明：原领域、技术名称、适配理由

            跨领域方案占比目标：≥ 10%

            格式示例：[跨领域: 航空航天 → 主动阻尼控制技术]

            ⚙️ 执行流程（强制自检）

            A) 任务识别: 解析要求/显式指令，确定任务类型

            B) 输入理解: 建立术语表、ID 映射表，核对输入完整性

            C) 结构组织: 按第 2 条默认/指定顺序组织输出

            D) ID 验证: 确保所有生成的 ID 符合第 10 条格式规范

            E) 完整性校验: 必需项齐全、无越权扩展、方案数量达标

            F) 一致性检查: 术语/风格/顺序/指代/ID 引用一致

            📋 自检清单 (输出前必查)

            检查项规则自检

            ID 格式

            所有 ID 符合第 10 条规范

            [ ]

            方案数量

            A 级 ≥ 3, B 级 ≥ 3

            [ ]

            量化率

            EF 量化率 ≥ 80%

            [ ]

            术语一致

            全文术语与输入 terminology_table 一致

            [ ]

            证据追溯

            关键结论有 source_* 字段支撑

            [ ]

            推理标注

            所有推理补全内容已落成自然专业表述，用户可读字段不得出现【推理生成】或【推理生成-估计】

            [ ]

            Schema 合规

            输出完全符合 structured_output schema

            [ ]'
        - id: 7b05fe5f-05b4-431f-8a20-4fd33688b376
          role: user
          text: "# Node-1-2-9: TP-EF 结构化 - User Prompt\n\n> **版本**: v0.2.0  \n> **最后更新**: 2026-02-06\n\n## 用户指令（最高优先级）\n请基于 `round4_graded_principles` 与 `round4_tp_ef_mapping` 生成 `problem_effects`，完成 TP-EF 配对并输出统计信息。\n\n## 输入内容（JSON）\n- `round4_graded_principles`: \n{{#node_1_2_6.structured_output.graded_principles#}}\n- `round4_tp_ef_mapping`: \n{{#node_1_2_6.structured_output.tp_ef_mapping#}}\n- `user_input`: \n{{#start.user_input#}}\n\n---\n\n## Rules\n\n### R0. 输出总约束\n1. 输出必须是单个 JSON 对象，且仅包含 `problem_effects`、`summary_statistics`。  \n2. 严禁输出 Schema 未定义字段。  \n3. 严禁输出 `null`、空白字符串、解释文本。  \n4. 所有 ID、枚举、数量规则必须严格符合 Schema。\n5. `user_input` 仅用于 TP-EF 优先级提示，不得替代 `round4_graded_principles` 与 `round4_tp_ef_mapping` 作为事实来源；`user_input` 与 `alignment_parameters` 互不影响（本节点不消费 `alignment_parameters`）。\n\n### R1. 输入映射规则（按真实上游结构）\n1. TP 主来源：`round4_graded_principles[].tp_structure.tp_list[]`。  \n2. TP 关联方案主来源：`round4_tp_ef_mapping[]` 的 `related_principles`。  \n3. 若 `tp_ef_mapping` 缺失某 TP 的关联方案，可回退到当前方案 `principle_id` 建立关联。  \n4. EF 来源：每个 TP 下现有 `ef_list`，并做格式归一化。\n\n### R2. TP 生成规则\n1. `tp_id` 格式必须为 `TP-xxx`。  \n2. `tp_description` 必须为正向技术目标表述。  \n3. `priority` 仅允许 `高/中/低`。  \n4. `related_principles` 至少 1 项，且每项必须符合 `CP-xxx` 或 `SD-xxx`。\n\n### R3. EF 生成规则\n1. 每个 TP 的 `ef_list` 必须 2-5 项。  \n2. `ef_id` 必须归一化为 `TP-xxx-EF-xxx`。  \n3. 每个 TP 必须且仅能有 1 个 `is_primary=true`。  \n4. `is_quantified=true` 时，必须输出 `baseline_value/target_value/improvement_percentage`。  \n5. `improvement_percentage` 必须为整数百分比字符串，如 `50%`。  \n6. `verification_method` 必须是非空长文本（至少 50 字符）。  \n7. `measurement_uncertainty` 必填，且必须为非空字符串。\n\n### R4. 统计规则\n1. `summary_statistics.total_tp` 必须等于 `problem_effects` 实际数量。  \n2. `summary_statistics.total_ef` 必须等于全部 EF 总数。  \n3. `quantification_ratio` 必须为百分比字符串，如 `75%`。  \n4. `average_ef_per_tp` 必须为 1 位小数字符串，如 `2.7`。  \n5. 若输入不足，仍需输出满足 Schema 的最小合格结构，禁止留空字段。\n\n---\n\n## Format\n\n```json\n{\n  \"problem_effects\": [\n    {\n      \"tp_id\": \"TP-001\",\n      \"tp_description\": \"提高接触力控制稳定性\",\n      \"priority\": \"高\",\n      \"related_principles\": [\"CP-001\", \"SD-019\"],\n      \"ef_list\": [\n        {\n          \"ef_id\": \"TP-001-EF-001\",\n          \"ef_description\": \"接触力波动从20N降低到12N\",\n          \"is_quantified\": true,\n          \"baseline_value\": \"20N\",\n          \"target_value\": \"12N\",\n          \"improvement_percentage\": \"40%\",\n          \"is_primary\": true,\n          \"measurement_uncertainty\": \"±0.5N，来自传感器与采集误差叠加。\",\n          \"verification_method\": \"依据既定动态受流测试流程，在多速度工况下采集接触力时序数据并计算标准差与峰峰值，完成量化验证。\"\n        },\n        {\n          \"ef_id\": \"TP-001-EF-002\",\n          \"ef_description\": \"高频振动耦合导致的瞬态波动降低\",\n          \"is_quantified\": false,\n          \"is_primary\": false,\n          \"measurement_uncertainty\": \"定性评价，受测试工况与专家判读一致性影响。\",\n          \"verification_method\": \"通过同工况对照实验与多轮专家复核，比较控制前后波动形态与稳定区间，形成一致性评估结论。\"\n        }\n      ]\n    }\n  ],\n  \"summary_statistics\": {\n    \"total_tp\": 3,\n    \"total_ef\": 8,\n    \"quantified_ef_count\": 6,\n    \"quantification_ratio\": \"75%\",\n    \"average_ef_per_tp\": \"2.7\"\n  }\n}\n```\n\n---\n\n## Workflow\n\n1. 从 `round4_graded_principles[].tp_structure.tp_list` 抽取 TP，并按 `tp_id` 去重合并。  \n2. 用 `round4_tp_ef_mapping` 构建 TP 到 `related_principles` 映射，不足时回退到方案 `principle_id`。  \n3. 对每个 TP 生成 2-5 条 EF，并将 `ef_id` 归一化为 `TP-xxx-EF-xxx`。  \n4. 选择 1 条主效应标记为 `is_primary=true`，其余为 `false`。  \n5. 对量化 EF 补齐基线、目标、百分比，对全部 EF 输出 `measurement_uncertainty` 和 `verification_method`。  \n6. 计算并输出 `summary_statistics`。  \n7. 输出最终 JSON。\n"
