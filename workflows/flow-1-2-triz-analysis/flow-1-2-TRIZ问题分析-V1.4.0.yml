    - data:
        code: "import json\nfrom typing import Any, Dict, List\n\n\ndef _parse(value: Any) -> Any:\n    if isinstance(value, str):\n        try:\n            return json.loads(value)\n        except json.JSONDecodeError:\n            return {}\n    return value if isinstance(value, (dict, list)) else {}\n\n\ndef _ensure_list(value: Any) -> List[Any]:\n    if isinstance(value, list):\n        return value\n    if value is None:\n        return []\n    return [value]\n\n\ndef _text(value: Any) -> str:\n    if isinstance(value, str):\n        return value.strip()\n    if isinstance(value, (dict, list)):\n        return json.dumps(value, ensure_ascii=False)\n    return \"\"\n\n\ndef _manifest_root(payload: Any) -> Dict[str, Any]:\n    if isinstance(payload, list):\n        return {\"target_list\": payload}\n    if isinstance(payload, dict) and isinstance(payload.get(\"technical_targets_manifesto\"), dict):\n        return payload[\"technical_targets_manifesto\"]\n    return payload if isinstance(payload, dict) else {}\n\n\ndef _build_target_map(manifesto: Dict[str, Any]) -> Dict[str, List[str]]:\n    root = _manifest_root(manifesto)\n    result: Dict[str, List[str]] = {}\n    for item in _ensure_list(root.get(\"target_list\")):\n        if not isinstance(item, dict):\n            continue\n        target_id = _text(item.get(\"target_id\"))\n        if not target_id:\n            continue\n        if isinstance(item.get(\"solution_ids\"), list):\n            for solution_id in [_text(v) for v in item.get(\"solution_ids\")]:\n                if solution_id:\n                    result.setdefault(solution_id, []).append(target_id)\n            continue\n        for mapping in _ensure_list(item.get(\"solution_mapping\")):\n            if not isinstance(mapping, dict):\n                continue\n            solution_id = _text(mapping.get(\"solution_id\"))\n            if not solution_id:\n                continue\n            result.setdefault(solution_id, []).append(target_id)\n    return {k: sorted(set(v)) for k, v in result.items()}\n\n\ndef _build_effect_map(problem_effect: Dict[str, Any]) -> Dict[str, List[str]]:\n    mapping: Dict[str, List[str]] = {}\n    for item in _ensure_list(problem_effect.get(\"problem_effects\")):\n        if not isinstance(item, dict):\n            continue\n        principle_id = _text(item.get(\"principle_id\")) or _text(item.get(\"solution_id\"))\n        effect_id = _text(item.get(\"effect_id\")) or _text(item.get(\"ef_id\"))\n        if principle_id and effect_id:\n            mapping.setdefault(principle_id, []).append(effect_id)\n    return {k: sorted(set(v)) for k, v in mapping.items()}\n\n\ndef _clean_row(row: Dict[str, Any]) -> Dict[str, Any]:\n    clean: Dict[str, Any] = {}\n    for key, value in row.items():\n        if value is None:\n            continue\n        if isinstance(value, str):\n            value = value.strip()\n            if not value:\n                continue\n        if isinstance(value, list):\n            value = [item for item in value if item not in (None, \"\", [])]\n        clean[key] = value\n    return clean\n\n\ndef main(\n    round4_final_result=None,\n    problem_effect=None,\n    technical_targets_manifesto=None,\n    round1_candidate_principles=None,\n):\n    round4 = _parse(round4_final_result)\n    problem_effect_obj = _parse(problem_effect)\n    manifesto = _parse(technical_targets_manifesto)\n    round1 = _parse(round1_candidate_principles)\n\n    round1_map: Dict[str, Dict[str, Any]] = {}\n    for item in _ensure_list(round1):\n        if isinstance(item, dict):\n            pid = _text(item.get(\"principle_id\"))\n            if pid:\n                round1_map[pid] = item\n\n    target_map = _build_target_map(manifesto)\n    effect_map = _build_effect_map(problem_effect_obj)\n\n    merged_rows: List[Dict[str, Any]] = []\n    for item in _ensure_list(round4.get(\"graded_principles\")):\n        if not isinstance(item, dict):\n            continue\n        principle_id = _text(item.get(\"principle_id\"))\n        if not principle_id:\n            continue\n        round1_item = round1_map.get(principle_id, {})\n        row = _clean_row(\n            {\n                \"principle_id\": principle_id,\n                \"principle_name\": _text(item.get(\"principle_name\")) or _text(round1_item.get(\"principle_name\")),\n                \"grade\": _text(item.get(\"grade\")),\n                \"triz_principle\": _text(item.get(\"triz_principle\")) or _text(round1_item.get(\"triz_principle\")),\n                \"technical_description\": _text(round1_item.get(\"technical_description\"))\n                or _text(item.get(\"technical_description\")),\n                \"mapped_targets\": target_map.get(principle_id, []),\n                \"mapped_effects\": effect_map.get(principle_id, []),\n            }\n        )\n        if row:\n            merged_rows.append(row)\n\n    payload = {\"candidate_principles\": merged_rows}\n    return {\n        \"candidate_principles_json\": json.dumps(payload, ensure_ascii=False, indent=2),\n        \"candidate_principles_obj\": payload,\n    }\n"
