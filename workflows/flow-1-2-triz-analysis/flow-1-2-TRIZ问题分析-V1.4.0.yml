          text: "# Node-1-2-7: 技术靶点清单生成 - User Prompt\n\n> **版本**: v1.0.0\n> **最后更新**: 2026-04-19\n\n## 节点目标\n把 Node-1-2-3 的四维度靶点池和 Node-1-2-6 的最终方案层，压缩成“可执行、可追溯、可下游分字段消费”的技术靶点包。\n\n本节点不再输出冗长的 `technical_targets_manifesto` 大对象，而是拆成 4 个顶层字段：\n- `recommended_targets`\n- `target_list`\n- `summary_statistics`\n- `traceability_verification`\n\n## 用户指令（最高优先级）\n请基于 `round2_core_parameters / round2_parameter_refinement / round2_scamper_derivatives`、\n`targets_technical_targets / targets_dimension_distribution`、\n`round4_decision_summary / round4_graded_principles / round4_grading_summary / round4_tp_ef_mapping`\n生成轻量技术靶点包，并确保靶点与方案、参数建立最小充分的可追溯映射。\n\n## 输入内容（JSON）\n- `round2_core_parameters`: {{#node_1_2_4.structured_output.core_parameters#}}\n- `round2_parameter_refinement`: {{#node_1_2_4.structured_output.parameter_refinement#}}\n- `round2_scamper_derivatives`: {{#node_1_2_4.structured_output.scamper_derivatives#}}\n- `targets_technical_targets`: {{#node_1_2_3.structured_output.technical_targets#}}\n- `targets_dimension_distribution`: {{#node_1_2_3.structured_output.dimension_distribution#}}\n- `round4_decision_summary`: {{#node_1_2_6.structured_output.decision_summary#}}\n- `round4_graded_principles`: {{#node_1_2_6.structured_output.graded_principles#}}\n- `round4_grading_summary`: {{#node_1_2_6.structured_output.grading_summary#}}\n- `round4_tp_ef_mapping`: {{#node_1_2_6.structured_output.tp_ef_mapping#}}\n- `user_input`: {{#start.user_input#}}\n\n---\n\n## Core Rules\n\n### R1. 输出结构\n1. 只允许输出 4 个顶层键：`recommended_targets`、`target_list`、`summary_statistics`、`traceability_verification`。\n2. 不得输出旧的 `technical_targets_manifesto` 包装层。\n3. 不得输出 schema 外字段，不得输出 Markdown 解释文字。\n\n### R2. target_list 规则\n1. `target_list` 是完整靶点表，优先控制在 `36-42` 条，仅当输入存在明确高区分度靶点时才扩展到 `43-60`。\n2. 每条只保留轻量必要字段：\n   - `target_id`\n   - `target_description`\n   - `dimension`\n   - `sub_dimension`\n   - `priority`\n   - `overall_ranking`\n   - `is_recommended`\n   - `solution_ids`\n   - `parameter_ids`\n3. 不再输出冗长 `solution_mapping` / `parameter_mapping` 嵌套对象。\n4. `solution_ids` 只能来自 `round4_graded_principles[].principle_id`。\n5. `parameter_ids` 只能来自 `round2_core_parameters / round2_parameter_refinement / round2_scamper_derivatives` 的参数集合。\n\n### R3. recommended_targets 规则\n1. `recommended_targets` 必须是 `target_list` 的子集。\n2. 仅保留最值得下游 LLM 使用的核心靶点，优先控制在 `8-12` 条。\n3. 推荐优先级：\n   - 高优先级\n   - 高参数相关性\n   - 多方案覆盖\n   - 更强专利/技术推进价值\n4. `recommended_targets` 中每条字段结构必须与 `target_list` 完全一致。\n\n### R4. summary_statistics 规则\n1. 必须输出：\n   - `total_targets`\n   - `high_priority_targets`\n   - `recommended_targets`\n   - `high_correlation_targets`\n   - `dimension_distribution`\n2. `dimension_distribution` 四项求和必须等于 `total_targets`。\n\n### R5. traceability_verification 规则\n1. 必须输出：\n   - `source_consistency_check`\n   - `parameter_coverage_ratio`\n   - `solution_coverage_ratio`\n2. 该字段只保留最短必要追溯结论，不写成长段说明。\n\n### R6. 压缩与 token 控制\n1. `target_description` 最多 1 句，优先控制在 24 字以内。\n2. `solution_ids` 仅保留 ID，不带名称。\n3. `parameter_ids` 仅保留 ID，不带名称。\n4. 禁止为了美观扩写说明文字。\n\n### R7. 输出前自检\n1. 校验 `recommended_targets` 是否真的是 `target_list` 的子集。\n2. 校验 `overall_ranking` 连续且唯一。\n3. 校验 `summary_statistics.dimension_distribution` 求和正确。\n4. 校验最终 JSON 无 `null`、无 schema 外字段。\n\n---\n\n## Format\n\n```json\n{\n  \"recommended_targets\": [\n    {\n      \"target_id\": \"TT-001\",\n      \"target_description\": \"提高接触稳定性\",\n      \"dimension\": \"系统维度\",\n      \"sub_dimension\": \"控制靶点\",\n      \"priority\": \"高\",\n      \"overall_ranking\": 1,\n      \"is_recommended\": true,\n      \"solution_ids\": [\"CP-001\", \"SD-002\"],\n      \"parameter_ids\": [1, 12]\n    }\n  ],\n  \"target_list\": [\n    {\n      \"target_id\": \"TT-001\",\n      \"target_description\": \"提高接触稳定性\",\n      \"dimension\": \"系统维度\",\n      \"sub_dimension\": \"控制靶点\",\n      \"priority\": \"高\",\n      \"overall_ranking\": 1,\n      \"is_recommended\": true,\n      \"solution_ids\": [\"CP-001\", \"SD-002\"],\n      \"parameter_ids\": [1, 12]\n    }\n  ],\n  \"summary_statistics\": {\n    \"total_targets\": 36,\n    \"high_priority_targets\": 12,\n    \"recommended_targets\": 10,\n    \"high_correlation_targets\": 15,\n    \"dimension_distribution\": {\n      \"system_dimension\": 10,\n      \"time_dimension\": 8,\n      \"space_dimension\": 8,\n      \"application_dimension\": 10\n    }\n  },\n  \"traceability_verification\": {\n    \"source_consistency_check\": \"靶点、方案、参数均可追溯到输入数据。\",\n    \"parameter_coverage_ratio\": 1.0,\n    \"solution_coverage_ratio\": 1.0\n  }\n}\n```\n\n---\n\n## Workflow\n1. 从 `targets_technical_targets / targets_dimension_distribution` 提取基础靶点，并按维度与优先级标准化。\n2. 从 `round4_decision_summary / round4_graded_principles / round4_grading_summary / round4_tp_ef_mapping` 建立靶点到 `solution_ids` 的映射。\n3. 从 `round2_core_parameters / round2_parameter_refinement / round2_scamper_derivatives` 建立 `parameter_ids` 的最小充分映射。\n4. 先生成完整 `target_list`，再从中筛选 `recommended_targets`。\n5. 最后生成 `summary_statistics` 与 `traceability_verification`，输出最终 JSON。\n"
