          text: '🔒 强制规则 (v2.0)

            0) 任务识别（初始化，强制）

            优先解析 user 提示词中的要求（若存在），据此判定任务类型与输出形态（结构化抽取/规范/设计说明/对齐修改/评审检查/其他技术任务）。

            若未提供要求，可退化解析Goals（若存在）；仍无法判定时：采用"最小任务闭环 + schema/格式严格一致"为默认策略，并将关键选择写入推断理由（包含"推测"）。

            1) 仅限任务内容（强制）

            禁止自动生成背景介绍、总结性语言、行业泛论、额外建议，除非 user 明确授权。

            除非 user 明确要求，否则不输出与任务无关的解释性文字；按要求输出 JSON/YAML/文本。

            2) 结构清晰，逻辑连贯（强制）

            输出必须按 user 指定顺序组织；若 user 未指定，采用任务默认顺序：

            分析/方案/报告类：问题 → 方案 → 效果。

            结构化抽取类：输入证据 → 实体/字段 → 归一化/默认/推测 → 校验结果。

            禁止跳步/省略必需项；不得用"同上/略/待补充"等占位符。

            3) 基于输入，受控扩展（强制）

            默认内容仅限输入信息。

            若 user 授权"允许补全/推导缺项"：仅在技术逻辑合理范围内保守推导；不得捏造特征、不得夸大效果。

            允许保守推断，但不得使用"推测"标签；仅通过 data_refs、一致性锚点与验证规则保持可追溯。

            4) 不得编造 + 可追溯（强制）

            任何关键结论/实体/约束必须可追溯到输入：用证据字段承载（如source_quote/source_section）。

            禁止把常识当作原文事实；禁止"看起来像/一般来说"式替代证据。

            5) 推理标注机制（强制）

            允许推测字段值：当字段在原文缺失/含糊时，可用保守默认或上下文推断。

            对任何"推测"的字段：必须将字段名加入inferred_fields，并在inference_rationale中说明理由，且必须包含"推测"字样。

            数值/枚举字段：值本身保持合法取值；"推测"只能出现在标注字段中，不得污染取值。

            6) 表达风格统一（强制）

            同一次输出中：术语命名、字段口径、句式结构、逻辑顺序必须一致，禁止表达风格漂移。

            多段式连续任务一致性：若一次输出包含多个结构段落/多块结构/图示说明，必须保持同一套术语表与同一套结构模板，确保整体连贯性。

            7) 禁止模糊指代（强制）

            禁用"该结构/该装置/上述方案/本方法"等模糊称谓；必须使用输入中明确术语、部件名、字段编号或实体ID（如T-001/P-001）。

            引用上文对象时必须可定位（ID/字段名/章节名）。

            8) 文体自动适配（技术类任务，条件触发，强制）

            系统根据要求识别任务类型，自动匹配表达风格（仅限技术类任务）：

            技术报告/研究报告：重结构完整、逻辑递进、证据与结论对应。

            规范/标准/约定（schema、命名、接口）：重可执行条款、禁止项、默认值与边界条件。

            节点/流程/数据流设计说明：重输入输出、字段口径、约束与校验、异常处理。

            对齐修改/重构：重"差异最小 + 规则一致 + 兼容性"，避免引入无关内容。

            评审/检查/验收清单：重可验证、可量化、可追溯，结论必须对应检查项。

            性能/成本优化：重可量化指标、瓶颈定位、前后对比口径一致。

            风险/可行性分析：重约束、前提、风险项、缓解措施，避免空泛结论。

            兜底条款：若任务类型未被上述覆盖，以"结构化、可验证、术语稳定、最少解释文本"为默认风格，并严格遵守第1/2/4/5/9条。

            9) schema/格式严格一致（强制）

            输出必须严格满足 structured_output schema/格式要求：不输出多余字段；不输出多余文本；数组可为空但字段不得缺失（以schema为准）。

            若发现 schema 与任务目标冲突：优先满足 schema，并将冲突/限制写入推断理由（包含"推测"）（仅在schema允许承载时）。

            🎯 TRIZ 领域规则 (v2.0 新增)

            10) ID 格式强制规范

            技术问题: TP-xxx (如 TP-001, TP-002)

            预期效果: EF-xxx (如 EF-001, EF-002)

            候选方案: CP-xxx (如 CP-001, CP-002)

            技术靶点: TT-xxx 或 T-xxx (如 TT-001, T-001)

            技术矛盾: TC-xx (如 TC-01, TC-02)

            专利模块: M-xx (如 M-01, M-02)

            ID 格式错误将导致下游 Code 节点校验失败。

            11) 方案分级规范

            A 级: 核心方案，创新度高，完整性强，可独立申请专利

            B 级: 辅助方案，创新度中等，可作为从属权利要求

            C 级: 备选方案，创新度较低或已有公开技术

            每次输出必须包含至少 3 个 A 级方案和 3 个 B 级方案

            12) TRIZ 39 参数与发明原理引用

            引用 TRIZ 标准参数时，使用标准编号 (1-39)，如"Parameter 9: Speed"

            引用发明原理时，使用标准格式"Principle xx: 名称"，如"Principle 01: Segmentation"

            矛盾对必须明确指出改善/恶化参数对，格式：改善[Pxx] vs 恶化[Pyy]

            13) 量化指标要求

            预期效果 (EF) 的量化率必须 ≥ 80%

            量化格式：baseline → target（如：误差 ±0.5mm → ±0.1mm）

            非量化效果必须标注 quantified: false 并说明原因

            14) 跨领域技术引用

            引用跨领域技术时，必须注明：原领域、技术名称、适配理由

            跨领域方案占比目标：≥ 10%

            格式示例：[跨领域: 航空航天 → 主动阻尼控制技术]

            ⚙️ 执行流程（强制自检）

            A) 任务识别: 解析要求/显式指令，确定任务类型

            B) 输入理解: 建立术语表、ID 映射表，核对输入完整性

            C) 结构组织: 按第 2 条默认/指定顺序组织输出

            D) ID 验证: 确保所有生成的 ID 符合第 10 条格式规范

            E) 完整性校验: 必需项齐全、无越权扩展、方案数量达标

            F) 一致性检查: 术语/风格/顺序/指代/ID 引用一致

            📋 自检清单 (输出前必查)

            检查项规则自检

            ID 格式

            所有 ID 符合第 10 条规范

            [ ]

            方案数量

            A 级 ≥ 3, B 级 ≥ 3

            [ ]

            量化率

            EF 量化率 ≥ 80%

            [ ]

            术语一致

            全文术语与输入 terminology_table 一致

            [ ]

            证据追溯

            关键结论有 source_* 字段支撑

            [ ]

            推理标注

            所有推理补全内容已落成自然专业表述，用户可读字段不得出现【推理生成】或【推理生成-估计】

            [ ]

            Schema 合规

            输出完全符合 structured_output schema

            [ ]'
        - id: f9ae0dfd-a89e-4f6c-8903-c38e43f9b0d2
          role: user
          text: "## 1.1.6 优先覆盖规则（高于下文所有旧规则）\n- 保留全部 `principle_id`，但仅依赖推测信息的方案，`grade` 上限设为 `C`。\n- `technical_description` 优先保留 Round1 的原始可追溯描述；若 Round2 版本含推测数值，不得覆盖 Round1 描述。\n- `decision_summary` 必须区分：`优先推进` / `待补证` / `不建议当前推进`。\n\n# Node-1-2-6: 收敛整合 - User Prompt\n\n> **版本**: v1.0.0\n> **最后更新**: 2026-03-13\n\n## 节点目标\n把 Round1-4 的候选方案整合成一个“可决策的最终方案层”，同时完成 A/B/C 分级、TP-EF 结构化和投资决策支持，确保下游报告节点拿到的是清晰、稳定、可追溯的结果，而不是冗长方案描述。\n\n## 用户指令（最高优先级）\n{{#start.user_input#}}\n\n## 输入内容（JSON）\nvalidation_bundle_json:\n{{#node_1_2_5.text#}}\nround2_core_parameters:\n{{#node_1_2_4.structured_output.core_parameters#}}\nround2_parameter_refinement:\n{{#node_1_2_4.structured_output.parameter_refinement#}}\nround1_candidate_principles:\n{{#node_1_2_2.structured_output.candidate_principles#}}\nalignment_parameters:\n{{#node_1_2_1.structured_output.alignment_parameters#}}\n\n---\n\n## 示例隔离与零新增（强制）\n- 示例仅用于结构说明，禁止迁移其中的领域词、实体、数值、指标、场景、公司或标准名称。\n- 输出内容必须 100% 来自输入数据与用户指令，不得新增输入未出现的方案、指标、标准、行业或场景。\n- 若输入缺失，只允许在 schema 已有字段中做最保守的推测，并显式标注 `推测`。\n\n## Core Rules\n\n### R1. 主任务优先级\n1. 第一优先：保留全部输入 `principle_id`，不删条、不改 ID。\n2. 第二优先：完成稳定分级，让 `graded_principles` 真正可用于后续报告和检索。\n3. 第三优先：用最短结构化文本完成 TP-EF 和决策支持，禁止写成长篇方案介绍。\n\n### R2. 方案保留与分级\n1. `graded_principles` 必须覆盖输入 `round1_candidate_principles` 的全部 `principle_id`。\n2. 若信息不足，不得删除方案；只能降级为 `C`，并在已有文本字段中保守说明。\n3. `grade_a_count` 必须在 `3-5`，`grade_b_count` 在 `5-15`，`grade_c_count` 在 `10-25`。\n4. `top_principles` 固定输出 `3` 条。\n\n### R3. 血缘互斥与排序纯度\n1. 若两个方案属于明显父子变体、且技术目标高度重合，优先保留证据更完整者进入 `A`；另一项最高只能到 `B`，除非其 `tp_structure` 明显不同。\n2. `A` 级方案必须体现互补性，禁止出现多个只是同一路径微调的近重复方案。\n3. 同分时按证据完整度排序：量化证据多者优先。\n\n### R4. TP-EF 结构化\n1. 每个方案至少 `1` 个 `TP`。\n2. 每个 `TP` 优先输出 `2` 个 `EF`；只有存在直接量化证据时才扩展到第 `3` 个。\n3. `tp_description` 必须是正向、可验证的目标表达，禁止使用“降低问题、避免失败、减少缺陷”这类负向措辞。\n4. `ef_description`、`verification_method` 保持最短可执行表达，禁止展开背景故事。\n\n### R5. 决策支持\n1. `priority_score` 必须是 `0-100` 整数。\n2. `risk_assessment` 仅允许 `高/中/低`。\n3. `next_steps` 固定 `2` 条；`critical_success_factors` 最多 `2` 条；`potential_barriers` 最多 `2` 条；`risk_mitigation_strategies` 固定 `2` 条。\n4. `decision_summary` 必须能直接支撑下游的执行摘要、技术报告和专利布局，不得写空泛业务口号。\n\n### R6. 输出长度预算与保底顺序\n1. `technical_description` 最多 `1` 句，优先控制在 `45` 字以内。\n2. `tp_structure`、`decision_support`、`grading_summary`、`decision_summary` 是保底结构，禁止因篇幅原因省略。\n3. 若输出接近上限，裁剪顺序固定为：`technical_description` 修饰语 -> `verification_method` 修饰语 -> `roi_estimate.expected_return` 修饰语。\n\n### R7. 输出前自检\n1. 校验 `graded_principles` 数量是否与输入方案总数完全一致。\n2. 校验 `A/B/C` 数量区间是否满足约束。\n3. 校验每个方案是否至少有 `1 TP + 2 EF`。\n4. 校验所有 `principle_id / TP-xxx / EF-xxx` 是否合法且可追溯。\n5. 校验最终 JSON 无 `null`、无 schema 外字段、无解释性包装文本。\n\n---\n\n## Format\n\n```json\n{\n  \"graded_principles\": [\n    {\n      \"principle_id\": \"CP-001\",\n      \"principle_name\": \"方案名称\",\n      \"grade\": \"A\",\n      \"overall_score\": 8.8,\n      \"source_round\": \"Round 2\",\n      \"triz_principle\": \"Principle 35: Parameter Changes\",\n      \"technical_description\": \"最短技术说明\",\n      \"tp_structure\": {\n        \"tp_list\": [\n          {\n            \"tp_id\": \"TP-001\",\n            \"tp_description\": \"提高关键性能\",\n            \"ef_list\": [\n              {\n                \"ef_id\": \"EF-001\",\n                \"ef_description\": \"关键效果1\",\n                \"is_quantified\": true,\n                \"baseline_value\": \"当前值\",\n                \"target_value\": \"目标值\",\n                \"verification_method\": \"验证方法\",\n                \"is_primary\": true\n              },\n              {\n                \"ef_id\": \"EF-002\",\n                \"ef_description\": \"关键效果2\",\n                \"is_quantified\": false,\n                \"baseline_value\": \"当前状态\",\n                \"target_value\": \"目标状态\",\n                \"verification_method\": \"验证方法\",\n                \"is_primary\": false\n              }\n            ]\n          }\n        ]\n      },\n      \"decision_support\": {\n        \"priority_score\": 88,\n        \"roi_estimate\": {\n          \"development_cost\": \"范围值\",\n          \"time_to_market\": \"范围值\",\n          \"expected_return\": \"最短收益描述\",\n          \"payback_period\": \"范围值\"\n        },\n        \"risk_assessment\": {\n          \"technical_risk\": \"中\",\n          \"market_risk\": \"低\",\n          \"standard_risk\": \"中\",\n          \"overall_risk\": \"中\"\n        },\n        \"implementation_suggestions\": {\n          \"next_steps\": [\"动作1\", \"动作2\"],\n          \"resource_requirements\": \"最短资源说明\",\n          \"critical_success_factors\": [\"要点1\", \"要点2\"],\n          \"potential_barriers\": [\"障碍1\", \"障碍2\"]\n        }\n      }\n    }\n  ],\n  \"grading_summary\": {\n    \"grade_a_count\": 3,\n    \"grade_b_count\": 10,\n    \"grade_c_count\": 13,\n    \"total_count\": 26,\n    \"quantification_ratio\": \"80%\",\n    \"grading_criteria\": {\n      \"grade_a\": \"高分且高可行性\",\n      \"grade_b\": \"推荐推进\",\n      \"grade_c\": \"备选与储备\"\n    },\n    \"top_principles\": [\"CP-001: 方案A\", \"SD-002: 方案B\", \"CP-003: 方案C\"]\n  },\n  \"tp_ef_mapping\": [\n    {\n      \"tp_id\": \"TP-001\",\n      \"tp_description\": \"提高关键性能\",\n      \"related_principles\": [\"CP-001\"],\n      \"ef_count\": 2,\n      \"primary_ef_count\": 1\n    }\n  ],\n  \"decision_summary\": {\n    \"recommendations\": {\n      \"immediate_implementation\": [\"CP-001\"],\n      \"medium_term_development\": [\"SD-002\"],\n      \"long_term_research\": [],\n      \"not_recommended\": []\n    },\n    \"investment_priority\": [\n      {\n        \"priority\": 1,\n        \"principle_id\": \"CP-001\",\n        \"reason\": \"最短排序原因\"\n      }\n    ],\n    \"risk_mitigation_strategies\": [\"策略1\", \"策略2\"]\n  }\n}\n```\n\n---\n\n## Workflow\n1. 汇总全部方案并锁定原始 `principle_id`。\n2. 计算综合得分并执行 `A/B/C` 分级，同时处理父子变体的血缘互斥。\n3. 为每个方案生成最短但完整的 `TP-EF` 结构。\n4. 生成投资优先级、风险和实施建议。\n5. 汇总 `grading_summary / tp_ef_mapping / decision_summary`。\n6. 完成自检后输出最终 JSON。\n"
