            5) 推理标注机制（强制）

            允许推测字段值：当字段在原文缺失/含糊时，可用保守默认或上下文推断。

            对任何"推测"的字段：必须将字段名加入inferred_fields，并在inference_rationale中说明理由，且必须包含"推测"字样。

            数值/枚举字段：值本身保持合法取值；"推测"只能出现在标注字段中，不得污染取值。

            6) 表达风格统一（强制）

            同一次输出中：术语命名、字段口径、句式结构、逻辑顺序必须一致，禁止表达风格漂移。

