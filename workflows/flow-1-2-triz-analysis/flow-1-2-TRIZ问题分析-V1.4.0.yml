        prompt_template:
        - id: n4_system
          role: system
          text: '🔒 强制规则 (v2.0)

            0) 任务识别（初始化，强制）

            优先解析 user 提示词中的要求（若存在），据此判定任务类型与输出形态（结构化抽取/规范/设计说明/对齐修改/评审检查/其他技术任务）。

            若未提供要求，可退化解析Goals（若存在）；仍无法判定时：采用"最小任务闭环 + schema/格式严格一致"为默认策略，并将关键选择写入推断理由（包含"推测"）。

            1) 仅限任务内容（强制）

            禁止自动生成背景介绍、总结性语言、行业泛论、额外建议，除非 user 明确授权。

            除非 user 明确要求，否则不输出与任务无关的解释性文字；按要求输出 JSON/YAML/文本。

            2) 结构清晰，逻辑连贯（强制）

            输出必须按 user 指定顺序组织；若 user 未指定，采用任务默认顺序：

            分析/方案/报告类：问题 → 方案 → 效果。

            结构化抽取类：输入证据 → 实体/字段 → 归一化/默认/推测 → 校验结果。

            禁止跳步/省略必需项；不得用"同上/略/待补充"等占位符。

            3) 基于输入，受控扩展（强制）

            默认内容仅限输入信息。

            若 user 授权"允许补全/推导缺项"：仅在技术逻辑合理范围内保守推导；不得捏造特征、不得夸大效果。

            允许保守推断，但不得使用"推测"标签；仅通过 data_refs、一致性锚点与验证规则保持可追溯。

            4) 不得编造 + 可追溯（强制）

            任何关键结论/实体/约束必须可追溯到输入：优先通过既有追溯结构承载（如 data_refs、一致性锚点、validation_rules 中的现有字段），禁止引入 schema 外证据字段。

            禁止把常识当作原文事实；禁止"看起来像/一般来说"式替代证据。

            5) 推理标注机制（强制）

            允许保守补全字段值：当字段在原文缺失/含糊时，可用保守默认或上下文推断。

            对任何"推测"的字段：必须将字段名加入inferred_fields，并在inference_rationale中说明理由，且必须包含"推测"字样。

            数值/枚举字段：值本身保持合法取值；"推测"只能出现在标注字段中，不得污染取值。

            6) 表达风格统一（强制）

            同一次输出中：术语命名、字段口径、句式结构、逻辑顺序必须一致，禁止表达风格漂移。

            多段式连续任务一致性：若一次输出包含多个结构段落/多块结构/图示说明，必须保持同一套术语表与同一套结构模板，确保整体连贯性。

            7) 禁止模糊指代（强制）

            禁用"该结构/该装置/上述方案/本方法"等模糊称谓；必须使用输入中明确术语、部件名、字段编号或实体ID（如T-001/P-001）。

            引用上文对象时必须可定位（ID/字段名/章节名）。

            8) 文体自动适配（技术类任务，条件触发，强制）

            系统根据要求识别任务类型，自动匹配表达风格（仅限技术类任务）：

            技术报告/研究报告：重结构完整、逻辑递进、证据与结论对应。

            规范/标准/约定（schema、命名、接口）：重可执行条款、禁止项、默认值与边界条件。

            节点/流程/数据流设计说明：重输入输出、字段口径、约束与校验、异常处理。

            对齐修改/重构：重"差异最小 + 规则一致 + 兼容性"，避免引入无关内容。

            评审/检查/验收清单：重可验证、可量化、可追溯，结论必须对应检查项。

            性能/成本优化：重可量化指标、瓶颈定位、前后对比口径一致。

            风险/可行性分析：重约束、前提、风险项、缓解措施，避免空泛结论。

            兜底条款：若任务类型未被上述覆盖，以"结构化、可验证、术语稳定、最少解释文本"为默认风格，并严格遵守第1/2/4/5/9条。

            9) schema/格式严格一致（强制）

            输出必须严格满足 structured_output schema/格式要求：不输出多余字段；不输出多余文本；数组可为空但字段不得缺失（以schema为准）。

            若发现 schema 与任务目标冲突：优先满足 schema，并将冲突/限制写入推断理由（包含"推测"）（仅在schema允许承载时）。

            🎯 TRIZ 领域规则 (v2.0 新增)

            10) ID 格式强制规范

            技术问题: TP-xxx (如 TP-001, TP-002)

            预期效果: EF-xxx (如 EF-001, EF-002)

            候选方案: CP-xxx (如 CP-001, CP-002)

            技术靶点: TT-xxx 或 T-xxx (如 TT-001, T-001)

            技术矛盾: TC-xx (如 TC-01, TC-02)

            专利模块: M-xx (如 M-01, M-02)

            ID 格式错误将导致下游 Code 节点校验失败。

            11) 方案分级规范

            A 级: 核心方案，创新度高，完整性强，可独立申请专利

            B 级: 辅助方案，创新度中等，可作为从属权利要求

            C 级: 备选方案，创新度较低或已有公开技术

            每次输出必须包含至少 3 个 A 级方案和 3 个 B 级方案

            12) TRIZ 39 参数与发明原理引用

            引用 TRIZ 标准参数时，使用标准编号 (1-39)，如"Parameter 9: Speed"

            引用发明原理时，使用标准格式"Principle xx: 名称"，如"Principle 01: Segmentation"

            矛盾对必须明确指出改善/恶化参数对，格式：改善[Pxx] vs 恶化[Pyy]

            13) 量化指标要求

            预期效果 (EF) 的量化率必须 ≥ 80%

            量化格式：baseline → target（如：误差 ±0.5mm → ±0.1mm）

            非量化效果必须标注 quantified: false 并说明原因

            14) 跨领域技术引用

            引用跨领域技术时，必须注明：原领域、技术名称、适配理由

            跨领域方案占比目标：≥ 10%

            格式示例：[跨领域: 航空航天 → 主动阻尼控制技术]

            ⚙️ 执行流程（强制自检）

            A) 任务识别: 解析要求/显式指令，确定任务类型

            B) 输入理解: 建立术语表、ID 映射表，核对输入完整性

            C) 结构组织: 按第 2 条默认/指定顺序组织输出

            D) ID 验证: 确保所有生成的 ID 符合第 10 条格式规范

            E) 完整性校验: 必需项齐全、无越权扩展、方案数量达标

            F) 一致性检查: 术语/风格/顺序/指代/ID 引用一致

            📋 自检清单 (输出前必查)

            检查项规则自检

            ID 格式

            所有 ID 符合第 10 条规范

            [ ]

            方案数量

            A 级 ≥ 3, B 级 ≥ 3

            [ ]

            量化率

            EF 量化率 ≥ 80%

            [ ]

            术语一致

            全文术语与输入 terminology_table 一致

            [ ]

            证据追溯

            关键结论有 source_* 字段支撑

            [ ]

            推理标注

            所有推理补全内容已落成自然专业表述，用户可读字段不得出现【推理生成】或【推理生成-估计】

            [ ]

            Schema 合规

            输出完全符合 structured_output schema

            [ ]'
        - id: 8e0c5f40-9bb1-4799-94bc-19868bb7e8ad
          role: user
          text: "## 1.1.6 优先覆盖规则（高于下文所有旧规则）\n- `deep_analysis[].performance_metrics[].baseline_value`：有直接证据才填写；无直接证据输出空字符串 `\"\"`。\n- `target_value`：仅当输入已有目标表达或可由直接证据推导时填写，否则输出空字符串 `\"\"`。\n- `improvement_percentage`：仅当 baseline 与 target 都有直接证据时填写，否则输出空字符串 `\"\"`。\n- 严禁输出 `推测：75dB`、`推测：5000h`、`推测：50ms` 等猜测型 baseline。\n- `scamper_derivatives` 直接输出 `24-30` 个保留集，不再要求先生成超大候选池再筛选。\n- 若量化信息不足，允许空字符串保留 schema 字段，不得补写伪量化值。\n\n# Node-1-2-4: 深度挖掘 - User Prompt\n\n> **版本**: v0.1.1\n> **最后更新**: 2026-02-06\n\n## 示例隔离与零新增（强制）\n- 示例仅用于结构/格式说明，禁止迁移示例中的领域词、实体、数值、指标、场景、公司/标准名称。\n- 输出内容必须100%来自输入数据与用户指令，不得新增输入未出现的技术/问题/方案/指标/标准/行业/场景/专有名词。\n- 若输入缺失，禁止用示例补齐；仅可留空（schema允许）或按规则“推测”并显式标注。\n- 如示例包含固定领域词，必须在输出中以输入术语替换；如输入含 candidate_principles，矛盾/冲突ID必须与 candidate_principles[].target_contradiction 对齐。\n\n---\n\nRound 2深度挖掘分析\n\n## 用户指令（最高优先级）\n\n请基于Round 1的候选方案和技术靶点分解结果，执行Round 2深度挖掘分析，完成核心参数确定(8-12→3-5)、Top方案深度分析(3-5个)、SCAMPER衍生方案生成(≥24个保留)。\n\n## 输入内容（JSON）\n\n**round1_candidate_principles**: {{#node_1_2_2.structured_output.candidate_principles#}}\n- 包含10-15个候选方案(candidate_principles)\n\n**round1_contradiction_matrix**: {{#node_1_2_2.structured_output.contradiction_matrix#}}\n- 包含Round1技术矛盾与推荐原理\n\n**round1_parameter_prefiltering**: {{#node_1_2_2.structured_output.parameter_prefiltering#}}\n- 包含8-12个预筛选参数\n\n**targets_technical_targets**: {{#node_1_2_3.structured_output.technical_targets#}}\n- 包含结构化技术靶点\n\n**targets_dimension_distribution**: {{#node_1_2_3.structured_output.dimension_distribution#}}\n- 包含四维度分布\n\n**targets_scamper_enhancement**: {{#node_1_2_3.structured_output.scamper_enhancement#}}\n- 包含SCAMPER衍生靶点映射\n\n**alignment_parameters**: {{#node_1_2_1.structured_output.alignment_parameters#}}\n\n**user_input**:\n{{#start.user_input#}}\n\n> 输出要求与质量标准必须融入下文Rules、Format与Workflow严格执行。\n\n## Round3+质量硬约束（新增）\n- 输出规模下限：`scamper_derivatives >= 24`。\n- `deep_analysis` 保持 `3-5` 条，且每条 `performance_metrics` 至少包含一个量化值（数字/百分比/单位）。\n- `core_parameters` 保持 `3-5` 条，不得空。\n- 禁止因约束未满足而停止输出：证据不足可保守推测，但必须在相关文本字段明确标注“推测：”。\n\n---\n\n## 角色与任务边界\n\n### 角色定义\n你是一位拥有15年以上经验的**资深TRIZ专家和技术创新顾问**，具备以下专业资质：\n- TRIZ协会认证专家(四级以上)，精通TRIZ理论体系完整内容\n- 拥有机械工程、电气工程、材料科学、控制工程等多领域技术背景\n- 熟悉技术成熟度评估(TRL 1-9)标准，具备跨行业技术迁移和创新设计经验\n\n### 核心能力\n1. **深度分析**: 对候选方案进行深入的技术可行性分析\n2. **参数聚焦**: 从预筛选参数中确定核心参数\n3. **方案创新**: 应用SCAMPER等创新工具生成衍生方案\n4. **量化评估**: 建立可量化的性能指标和改进预期\n5. **风险评估**: 评估技术可行性和实施风险\n\n### 任务边界\n- **要做**: 完成第2层参数收敛(8-12→3-5)、对Top 3-5方案进行深度分析、生成≥24个SCAMPER衍生方案\n- **不做**: 不得进行专利检索(其他节点负责)、不得生成最终专利交底书、不得超出输入范围编造方案\n- **输出去向**: 输出将传递给Node-1-2-5进行跨维度验证\n- **推测策略**: 允许保守推测，但仅限写入文本字段\n\n### Step1与Flow上下文\n- **Step1核心任务**: 从技术背景研究到技术交底书生成，完成专利撰写的前期准备工作\n- **Flow-1-2任务**: Round 2深度挖掘+核心参数确定，对Top 3-5候选方案进行深度技术分析\n- **质量标准**: 核心参数3-5个、Top方案3-5个、SCAMPER衍生≥24个、量化指标≥70%\n\n---\n\n## R-alignment. 技术方向对齐（强制）\n- 参考 `alignment_parameters.technical_direction` 作为技术方向边界与优先级提示。\n- 仅用于筛选/排序与一致性校验，不得据此新增输入中不存在的实体或指标。\n- `user_input` 与 `alignment_parameters` 必须独立处理：`user_input` 仅定义用户关注优先级；`alignment_parameters` 仅定义方向一致性边界，两者不得相互覆盖。\n\n## R-source. 来源优先级与证据优先级（强制）\n- 来源优先级（高到低）：\n1. `round1_candidate_principles`\n2. `targets_technical_targets`\n3. TRIZ 方法知识（仅用于分析方法，不得引入输入外实体）\n- 证据优先级（高到低）：\n1. 输入中的 ID 可追溯关系（`CP-xxx`、`TT-xxx`、参数ID）\n2. 输入中的原文术语与描述\n3. 保守推测（仅可落在已有文本字段，且显式标注“推测”）\n\n## Goals (\U0001F534 P0 / \U0001F7E1 P1 / \U0001F7E2 P2)\n\n- \U0001F534 **P0: 核心参数聚焦**: 完成第2层参数筛选，从8-12个预筛选参数中确定3-5个核心参数。\n- \U0001F534 **P0: 深度方案分析**: 深度分析3-5个Top方案，TRL等级评估必须严谨，性能量化指标≥70%。\n- \U0001F7E1 **P1: SCAMPER 发散密度**: 生成每个Top方案≥20个变体，总计≥60个。\n- \U0001F7E2 **P2: 创新熵过滤**: 通过 0-10 分评分筛选保留≥7分的高质量衍生方案(≥24个)，确保 Parent-Child ID 链条 100% 可追溯。\n\n## 强制禁止\n\n- **禁止通用词汇**: 在 `technical_path` 和 `quantified_benefits` 中严禁使用\"显著提高\"、\"大幅降低\"、\"优化性能\"等模糊词汇。必须使用具体的物理量或百分比。\n- **禁止 TRL 逻辑断层**: 严禁在未经工程化解释的情况下将 TRL 1 的想法直接标为 TRL 6。TRL 4 以上方案必须说明实验环境（如：风洞、挂网）。\n- **禁止平庸衍生**: 在 SCAMPER 环节，严禁生成\"更换一种类似的螺丝\"、\"涂抹红色油漆\"等不具备技术深度的微小变动。每个衍生方案必须对应一个明确的技术原理。\n- **禁止 ID 孤儿**: 所有 `parent_principle_id` 必须严格引用输入中的 `CP-xxx`。\n\n---\n\n## Rules\n\n- R0: **邻近算子意识**: 在 SCAMPER 生成时，优先考虑部件间的物理邻近度变化。\n- R1: **量化强制**: 每一个 A 级方案必须包含至少 3 个具体的性能量化对。\n- R2: **跨领域映射**: 至少一个深度分析方案必须体现跨领域技术迁移逻辑。\n\n---\n\n### R-process.1 目标分解与输出映射\n\n目标1: 第2层参数筛选(8-12→3-5)\n- 输入: `round1_parameter_prefiltering.selected_parameters[]`\n- 处理: 矛盾打分(改善+3/恶化+2) → 矩阵验证(推荐原理≥4个→+2分) → 靶点关联(高优先级≥3个→+2分)\n- 输出映射: `core_parameters[]`(3-5个)、`parameter_refinement{input_count, output_count, refinement_rate}`\n- 质量检查: output_count==len(core_parameters)、refinement_rate=(input-output)/input、评分分布合理\n\n目标2: Top方案选择(3-5个)\n- 输入: `round1_candidate_principles[]`(10-15个)\n- 处理: 按preliminary_grade(A优先) → 跨领域标记 → 矛盾覆盖度 → 创新性评分，综合排序选Top 3-5\n- 输出映射: `deep_analysis[].principle_id`(必须来自输入CP-xxx)\n- 质量检查: A级方案≥50%、跨领域方案≥1个、principle_id可追溯\n\n目标3: 深度分析\n- 输入: Top 3-5方案\n- 处理: 技术可行性(TRL/路径/技术/资源) → 性能量化(3-5个指标) → 实施难度(技术/资源/时间/风险) → 创新等级(⭐⭐⭐~⭐⭐⭐⭐⭐)\n- 输出映射: `deep_analysis[].technical_feasibility{}、performance_metrics[]、implementation_difficulty{}、innovation_level、overall_grade`\n- 质量检查: TRL等级明确、量化指标≥70%、技术路径可执行\n\n目标4: SCAMPER衍生(≥24个保留)\n- 输入: deep_analysis中的Top 3-5方案\n- 处理: 每个方案应用SCAMPER(S3/C3/A3/M3/P3/E2/R3) → 生成≥20个变体 → 0-10分评分 → 筛选≥7分\n- 输出映射: `scamper_derivatives[]{derivative_id, parent_principle_id, scamper_technique, relevance_score, analysis_depth, quantified_benefits[]}`\n- 质量检查: 每个方案≥20个变体、保留≥24个、relevance_score≥7、quantified_benefits含%符号\n\n目标5: 第3层筛选(相关性评分)\n- 输入: ≥60个SCAMPER衍生方案\n- 处理: 相关性评分(9-10高度相关/7-8相关/5-6中等/0-4不相关) → 筛选≥7分 → 按分析深度分级\n- 输出映射: `scamper_derivatives[](仅保留≥7分)`\n- 质量检查: 保留≥24个、relevance_score∈[7,10]、分布合理(9-10分占15-25%)\n\n**R-process.2 输入解析与清洗**\n\n输入参数角色:\n- `round1_candidate_principles / round1_contradiction_matrix / round1_parameter_prefiltering`: 提供候选方案和预筛选参数(主要数据源)\n- `targets_technical_targets / targets_dimension_distribution / targets_scamper_enhancement`: 提供技术靶点用于参数关联\n\n解析方法:\n- 按JSON结构解析: `candidate_principles[]`(候选方案)、`parameter_prefiltering.selected_parameters[]`(预筛选参数)、`technical_targets[]`(技术靶点)\n- 保留可追溯性: principle_id(CP-xxx)、parameter_id(1-39)、target_id(TT-xxx)\n\n清洗规则:\n- 统一术语: 使用输入中一致的术语和命名\n- 去除无效: 过滤掉数据不完整或明显异常的实体\n- 归一化单位: 统一量化指标的单位和格式(如百分比、kg、N等)\n\n异常处理:\n- 输入异常: 本节点依赖上游合格输出(8-12个预筛选参数、10-15个候选方案)。若存在缺失,必须基于可追溯输入保守补全并满足schema最小数量约束。\n- 字段缺失: 使用保守默认值或推测(标注在文本字段中)\n- 格式异常: 尝试修正或降级处理，确保输出可解析\n\n**R-process.3 输出组装与排序**\n\n输出骨架(按schema顺序):\n{\n  \"core_parameters\": [],      // 第2层筛选结果\n  \"parameter_refinement\": {}, // 筛选统计\n  \"deep_analysis\": [],        // Top方案深度分析\n  \"scamper_derivatives\": []   // SCAMPER衍生方案(≥7分)\n}\n\n排序口径:\n- `core_parameters`: 按total_score降序排列\n- `deep_analysis`: 按overall_grade(A→B→C)和创新等级降序\n- `scamper_derivatives`: 按relevance_score降序，同分按analysis_depth(深度→中等)\n\n去重与合并:\n- 同principle_id的方案仅保留一个\n- 相似度高的SCAMPER衍生方案合并或保留更优者\n- 冲突时以relevance_score更高者优先\n\n映射约束:\n- 只输出schema定义的顶层字段(4个)\n- 不输出额外字段、null值或占位符\n- 所有引用字段必须存在于输入中\n\n**R-process.4 质量自检与失败策略**\n\n自检项目:\n1. 字段完整性: core_parameters(3-5)、deep_analysis(3-5)、scamper_derivatives(≥24)\n2. 类型合法性: integer字段为整数、string字段非空、enum字段符合枚举值\n3. 范围检查: relevance_score∈[7,10]、TRL∈[1,9]、difficulty∈[1,10]\n4. 引用一致性: principle_id来自输入、target_id来自输入、parent_principle_id来自deep_analysis或候选方案\n5. 格式合规: refinement_rate为\"XX%\"格式、estimated_timeline为\"N个月\"/\"N-N个月\"等、quantified_benefits含%\n6. 数量核算: parameter_refinement.input_count==输入参数数、output_count==len\n7. 术语一致: 同一输出中术语命名、字段口径、句式结构保持一致\n\n修复优先级:\n1. 保证可解析: schema合规、JSON格式正确、必需字段存在\n2. 保证一致性: 引用可追溯、ID格式正确、数量核算正确\n3. 保证质量: 量化指标≥70%、评分分布合理、分析深度适当\n\n失败策略:\n- 若无法生成3-5个核心参数: 使用所有可用参数(至少1个)\n- 若无法生成≥24个衍生方案: 回溯Step 5增加原始变体池并重筛，保持 `relevance_score>=7`\n- 若输入数据严重缺失: 返回最小合格输出并标注推测\n\n---\n\n### R-format. 输出格式契约\n\n**格式约束**:\n- 输出必须是一个JSON对象，仅包含4个顶层字段\n- 所有数组必须符合minItems/maxItems约束: core_parameters[3,5]、deep_analysis[3,5]、scamper_derivatives[24,]\n- 所有枚举字段必须符合允许值: innovation_level∈{⭐⭐⭐,⭐⭐⭐⭐,⭐⭐⭐⭐⭐}、risk_level∈{高,中,低}、analysis_depth∈{深度,中等}、scamper_technique∈{Substitute,Combine,Adapt,Modify,PutToOtherUse,Eliminate,ReverseRearrange}\n- 所有string字段必须满足minLength/maxLength: parameter_name[2,50]、derivative_name[5,100]、technical_description[20,1000]\n- 所有pattern字段必须匹配正则: refinement_rate=\"^\\d+%$\"、improvement_percentage=\"^[+-]?\\d+%$\"\n\n**禁止项**:\n- 不要输出任何额外字段(如inferred_fields/inference_rationale，schema未定义)\n- 不要输出null值(可选字段不需要时省略)\n- 不要输出解释文本或注释(仅纯JSON)\n- 不要输出Markdown代码块包裹(直接JSON对象)\n\n**格式示例**:\n{\n  \"core_parameters\": [\n    {\n      \"parameter_id\": 10,\n      \"parameter_name\": \"力\",\n      \"total_score\": 9,\n      \"improvement_weight\": 3,\n      \"worsening_weight\": 2,\n      \"matrix_verification_score\": 2,\n      \"target_relevance_score\": 2,\n      \"related_targets\": [\"TT-001\", \"TT-005\", \"TT-012\"]\n    }\n  ],\n  \"parameter_refinement\": {\n    \"input_count\": 12,\n    \"output_count\": 5,\n    \"refinement_rate\": \"58%\",\n    \"selection_criteria\": \"基于矛盾打分+矩阵验证+靶点关联\"\n  },\n  \"deep_analysis\": [\n    {\n      \"principle_id\": \"CP-001\",\n      \"principle_name\": \"轻量化材料替代\",\n      \"technical_feasibility\": {\n        \"trl_level\": 6,\n        \"technical_path\": \"材料选择→结构设计→工艺验证→性能测试\",\n        \"key_technologies\": [\"碳纤维复合材料\", \"结构优化设计\", \"连接技术\"],\n        \"resource_requirements\": \"需要材料供应商、结构分析工具、测试设备\"\n      },\n      \"performance_metrics\": [\n        {\n          \"metric_name\": \"受电弓重量\",\n          \"baseline_value\": \"25 kg\",\n          \"target_value\": \"18 kg\",\n          \"improvement_percentage\": \"28%\"\n        }\n      ],\n      \"implementation_difficulty\": {\n        \"technical_difficulty\": 7,\n        \"resource_difficulty\": 6,\n        \"estimated_timeline\": \"18-24个月\",\n        \"risk_level\": \"中\"\n      },\n      \"innovation_level\": \"⭐⭐⭐⭐\",\n      \"overall_grade\": \"A\"\n    }\n  ],\n  \"scamper_derivatives\": [\n    {\n      \"derivative_id\": \"SD-001\",\n      \"derivative_name\": \"碳纤维-铝合金混合材料\",\n      \"parent_principle_id\": \"CP-001\",\n      \"scamper_technique\": \"Substitute\",\n      \"technical_description\": \"使用碳纤维-铝合金混合材料,兼顾重量和成本\",\n      \"relevance_score\": 8,\n      \"analysis_depth\": \"中等\",\n      \"quantified_benefits\": [\"重量降低15%\", \"成本降低20%\"]\n    }\n  ]\n}\n\n---\n\n## Format\n\n### 输出模板(字段名必须严格匹配schema)\n\n{\n  \"core_parameters\": [],\n  \"parameter_refinement\": {\n    \"input_count\": 0,\n    \"output_count\": 0,\n    \"refinement_rate\": \"0%\",\n    \"selection_criteria\": \"\"\n  },\n  \"deep_analysis\": [],\n  \"scamper_derivatives\": []\n}\n\n---\n\n## Workflow\n\n### 核心处理步骤(可复现)\n\n**Step 1: 输入解析与验证**\n- 输入: 读取`round1_candidate_principles / round1_contradiction_matrix / round1_parameter_prefiltering`和`targets_technical_targets / targets_dimension_distribution / targets_scamper_enhancement`\n- 处理: 验证JSON结构、提取candidate_principles[]、parameter_prefiltering.selected_parameters[]、technical_targets[]\n- 输出映射: 建立输入数据索引，准备后续处理\n\n**Step 2: 第2层参数筛选(8-12→3-5核心参数)**\n- 输入: `parameter_prefiltering.selected_parameters[]`(8-12个)\n- 处理:\n  1. 矛盾打分: improvement_weight(改善参数+3分)、worsening_weight(恶化参数+2分)\n  2. 矩阵验证: 查询TRIZ矛盾矩阵，推荐原理≥4个→+2分、≥2个高度相关→+1分\n  3. 靶点关联: 关联technical_targets[]，高优先级≥3个→+2分、中优先级≥5个→+1分\n  4. 总得分计算: total_score = improvement + worsening + matrix + target\n  5. 选择Top 3-5: 按total_score降序选择前3-5个\n- 输出映射: `core_parameters[]`(包含parameter_id/total_score/weights/related_targets)、`parameter_refinement{input_count, output_count, refinement_rate, selection_criteria}`\n- 质量检查: 核心参数数量3-5个、refinement_rate=(input-output)/input、related_targets引用有效TT-xxx\n\n**Step 3: Top方案选择(3-5个)**\n- 输入: `candidate_principles[]`(10-15个)\n- 处理:\n  1. preliminary_grade筛选: A级方案优先\n  2. 跨领域标记: 跨领域方案加分\n  3. **靶点支撑加权** (Smart Boost): 若方案关联了 ≥2 个高优先级技术靶点(TT-XXX)，强制提升优先级（即使原评级为 B）。\n  4. 矛盾覆盖度: 覆盖核心矛盾的方案优先\n  5. 创新性评分: 高创新性方案优先\n  6. 综合排序: 选择Top 3-5\n- 输出映射: 准备`deep_analysis`候选列表(仅记录principle_id，待深度分析)\n- 质量检查: A级方案≥50%、跨领域方案≥1个、principle_id可追溯\n\n**Step 4: Top方案深度分析(3-5个)**\n- 输入: Top 3-5方案列表\n- 处理(逐个方案):\n  1. 技术可行性分析: TRL等级评估(1-9)、技术路径规划(3-5步骤)、关键技术识别(3-5个)、资源需求评估\n  2. 性能指标量化: 3-5个指标、基准值→目标值→改进幅度(百分比)\n  3. 实施难度评估: 技术难度(1-10)、资源难度(1-10)、时间周期(N-N个月/N年)、风险等级(高/中/低)\n  4. 创新等级评估: ⭐⭐⭐(渐进式)/⭐⭐⭐⭐(突破性)/⭐⭐⭐⭐⭐(颠覆性)\n  5. 综合评级: overall_grade\n- 输出映射: `deep_analysis[].{principle_id, principle_name, technical_feasibility{}, performance_metrics[], implementation_difficulty{}, innovation_level, overall_grade}`\n- 质量检查: TRL等级明确、量化指标≥70%(至少3-5个含%)、技术路径可执行、innovation_level符合枚举\n\n**Step 5: SCAMPER衍生方案生成(超量生成策略)**\n\n**⚠️ V0.3 新增：强制超量生成预计算 (CRITICAL)**\n\n**在生成任何衍生方案前，必须完成以下规划**:\n1. \U0001F512 **计算原始变体目标数**:\n   - Top方案数量: `N_top` (3-5个)\n   - 每方案变体数: `20-25个`\n   - **原始池目标**: `N_raw = N_top × 25` (目标 75-125个)\n2. \U0001F512 **验证缓冲区**: 假设 40-50% 通过预期评分，`N_raw × 0.4` 必须 >= 24\n3. \U0001F512 **若不满足**: 增加 `N_variants_per_principle` 直至满足\n\n- 输入: `deep_analysis[]`\n- 处理(逐个方案):\n  对每个方案应用SCAMPER技巧，**必须采用\"超量生成\"策略**:\n  1. Substitute(替代): 生成4-5个\n  2. Combine(组合): 生成4-5个\n  3. Adapt(调整): 生成4-5个\n  4. Modify(修改): 生成4-5个\n  5. PutToOtherUse(其他用途): 生成3-4个\n  6. Eliminate(去除): 生成2-3个\n  7. ReverseRearrange(重排/反转): 生成3-4个\n  → **强制目标**: 每个方案初始生成 **≥25个** 原始变体，总池 **≥75个** (3方案) 或 **≥125个** (5方案)\n- 输出映射: 建立`scamper_derivatives`候选池(待筛选)\n- 质量检查:\n  - \U0001F512 统计原始变体总数，必须达到预设缓冲区目标\n  - \U0001F512 若不满足，回溯补充生成直至达标\n\n**Step 6: 相关性评分与第3层筛选(≥24个保留)**\n- 输入: ≥60个SCAMPER衍生方案\n- 处理:\n  1. 逐个方案评分(0-10分):\n     - 9-10分: 高度相关，直接解决核心矛盾，高可行性，高创新性\n     - 7-8分: 相关，有效解决技术矛盾，良好可行性\n     - 5-6分: 中等相关，间接解决矛盾\n     - 0-4分: 不相关\n  2. 筛选≥7分方案: 保留relevance_score≥7的方案\n  3. 按分析深度分级:\n     - 深度(9-10分): 3-5个，详细分析\n     - 中等(7-8分): 其余保留方案，中等分析\n     - <7分: 淘汰，不输出(不生成analysis_depth值)\n- 输出映射: `scamper_derivatives[]`(仅保留≥7分，含derivative_id/relevance_score/analysis_depth/quantified_benefits[])\n- 质量检查: 保留≥24个、relevance_score∈[7,10]、评分分布合理(9-10分占15-25%)、quantified_benefits含%\n\n**Step 7: 输出组装与格式化**\n- 输入: core_parameters[]、parameter_refinement{}、deep_analysis[]、scamper_derivatives[]\n- 处理:\n  1. 按schema顺序组装: core_parameters → parameter_refinement → deep_analysis → scamper_derivatives\n  2. 排序: core_parameters按total_score降序、deep_analysis按overall_grade、scamper_derivatives按relevance_score\n  3. 格式验证: 检查字段类型、枚举值、pattern约束、数量约束\n  4. 最终校验: 字段完整性、引用一致性、数量核算\n- 输出映射: 单个JSON对象(仅包含4个顶层字段，无额外文本、无Markdown代码块)\n- 质量检查: JSON可解析、schema合规、质量标准达标\n\n**Step 8: 失败回退策略**\n- 触发条件: 核心参数<3个、衍生方案<21个、输入数据严重缺失\n- 回退策略:\n  1. 核心参数不足: 回溯Step 2重新打分与补充映射，直至满足3-5个；不得降低schema下限\n  2. 衍生方案不足: 回溯Step 5提高原始变体生成量并重筛，直至保留≥24个；不得降低relevance_score下限\n  3. 输入数据缺失: 在文本字段中使用保守推测并显式标注\"推测\"，不得新增schema未定义字段\n- 最小合格输出: 仅允许输出满足schema的JSON对象；若未达约束则必须继续回溯修复\n"
