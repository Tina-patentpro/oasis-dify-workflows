        - id: a10cb142-0bfc-488e-ad94-be877350b7de
          role: user
          text: "## 示例隔离与零新增（强制）\n- 示例仅用于结构/格式说明，禁止迁移示例中的领域词、实体、数值、指标、场景、公司/标准名称。\n- 输出内容必须100%来自输入数据与用户指令，不得新增输入未出现的技术/问题/方案/指标/标准/行业/场景/专有名词。\n- 若输入缺失，禁止用示例补齐；仅可留空（schema允许）或按规则“推测”并显式标注。\n- 如示例包含固定领域词，必须在输出中以输入术语替换；如输入含 candidate_principles，矛盾/冲突ID必须与 candidate_principles[].target_contradiction 对齐。\n\n# Node-1-2-1: Markdown解析任务\n\n> **版本**: v0.2.2\n> **最后更新**: 2026-02-06\n\n## 用户指令（最高优先级）\n{{#start.user_input#}}\n\n## 输入内容（Markdown）\n{{#1775100100003.normalized_tech_landscape#}}\n\n> 输出要求（严格）与用户指令解析规则必须被融入下文 `Rules` 与 `Format`（严格执行），避免重复与冲突。\n\n## Round3+质量硬约束（新增）\n- 目标下限：`technologies>=5`、`problems>=4`、`solutions>=4`。\n- 输入基线主题召回：优先覆盖 `受流稳定/弓网/噪声/滑板/电弧/接触力/FBG/SMA/CNT/石墨烯/仿生/结冰/紫外/机器视觉/Ti3SiC2/空气动力` 中输入已出现的主题。\n- 禁止因约束未满足而停止输出：若证据不足，可做保守推测，但必须在相关 `source_quote` 中显式标注“推测：”。\n\n---\n\n## 角色与任务边界（强制）\n你是结构化技术信息解析专家。任务是把 `tech_landscape` 的 Markdown 内容解析为结构化 JSON：\n- `alignment_parameters`\n- `technologies`\n- `problems`\n- `solutions`\n- `standards`\n\n边界要求：\n- 只输出 schema 定义字段，禁止额外字段。\n- 禁止输出解释文本、注释、Markdown 代码块。\n- 对证据不足的实体，优先不输出该实体；不得使用占位符（如 `[待补充]`）。\n- `user_input` 与 `alignment_parameters` 互不影响：`user_input` 仅定义用户关注重点；`alignment_parameters` 仅由本节点生成技术方向边界。\n\n---\n\n## Goals\n- 识别并提取技术/问题/方案/标准四类实体。\n- 生成可追溯的实体字段，所有实体必须包含 `source_quote`。\n- 输出与 schema 完全一致且可解析的 JSON。\n- 在输入不足且无法抽取实体时，返回结构完整的最小合格输出（仅此时允许空数组）。\n\n---\n\n## 术语定义\n\n### 枚举值定义\n- `tech_category`: 控制系统 / 机械结构 / 材料科学 / 传感器技术 / 通信技术 / 其他\n- `problem_category`: 技术矛盾 / 物理矛盾 / 管理矛盾\n- `severity`: 高 / 中 / 低\n- `solution_type`: 技术创新 / 流程优化 / 管理改进\n- `implementation_difficulty`: 高 / 中 / 低\n- `standard_type`: 国际标准 / 国家标准 / 行业标准 / 企业标准\n\n---\n\n## Rules\n\n### R0. 用户指令优先规则\n\n**R0.1 用户指令解析（条件执行）**\n- 若提供 `{{#start.user_input#}}`：提取筛选边界与优先级，仅用于排序和保留策略，不可替代原文证据。\n- 若未提供 `{{#start.user_input#}}`：按输入全文均衡抽取，不做优先级偏置。\n\n**R0.2 冲突处理**\n- 当用户指令与 schema 冲突时，以 schema 为准。\n- 若用户要求输出额外字段、解释文本、非 JSON 内容：忽略该要求。\n\n### R-process.1 目标分解与输出映射\n- 目标1：提取技术实体 -> `technologies[]`\n- 目标2：提取问题实体 -> `problems[]`\n- 目标3：提取方案实体 -> `solutions[]`\n- 目标4：提取标准实体 -> `standards[]`\n- 目标5：提取技术方向一句话 -> `alignment_parameters.technical_direction`\n\n每类实体必达项：\n- 必填字段必须完整；缺少关键证据时不生成该实体。\n- 每个实体必须包含 `source_quote`。\n- `source_section` 为可选字段，建议提供。\n\n### R-process.2 输入解析与清洗\n- 解析 Markdown 标题层级（H1/H2/H3）与段落，保留章节定位用于 `source_section`。\n- 清洗规则：去重、术语归一、单位归一；删除与任务无关内容。\n- ID 生成：\n- `tech_id`: `T-001` 起连续递增\n- `problem_id`: `P-001` 起连续递增\n- `solution_id`: `S-001` 起连续递增\n- `standard_id`: `STD-001` 起连续递增\n\n### R-process.3 字段填充规则\n- 文本类必填字段缺失：不输出该实体。\n- 枚举/数值类字段缺失：允许保守推测，并在该实体内输出：\n- `inferred_fields`\n- `inference_rationale`（必须包含“推测”）\n- 关联字段规则：\n- `problems[].related_tech` 必须引用已存在 `technologies[].tech_id`\n- `solutions[].target_problems` 必须引用已存在 `problems[].problem_id`\n\n### R-process.4 空输入与异常处理\n- 若 `tech_landscape` 为空或无法解析出实体：\n- `alignment_parameters.technical_direction` 输出固定字符串：`输入文本未提供明确技术方向`\n- `technologies` / `problems` / `solutions` / `standards` 输出空数组 `[]`\n- 顶层字段必须完整存在，不得缺失。\n\n### R-format. 输出格式契约（严格）\n- 输出必须是一个 JSON 对象，且仅包含以下 5 个顶层字段：\n- `alignment_parameters`\n- `technologies`\n- `problems`\n- `solutions`\n- `standards`\n- 顶层四个实体字段类型必须为数组；仅在无法抽取实体时允许为空数组。\n- 所有实体对象禁止额外字段（仅使用 schema 定义字段）。\n- 禁止输出 `null`、占位符、解释文本。\n\n---\n\n## Format\n\n### 输出模板（字段名必须一致）\n```json\n{\n  \"alignment_parameters\": {\n    \"technical_direction\": \"输入文本未提供明确技术方向\"\n  },\n  \"technologies\": [],\n  \"problems\": [],\n  \"solutions\": [],\n  \"standards\": []\n}\n```\n\n### 实体示例（字段对齐 schema）\n```json\n{\n  \"alignment_parameters\": {\n    \"technical_direction\": \"围绕关键部件稳定性与控制精度优化\"\n  },\n  \"technologies\": [\n    {\n      \"tech_id\": \"T-001\",\n      \"tech_name\": \"多传感器融合控制\",\n      \"tech_category\": \"控制系统\",\n      \"tech_description\": \"融合多源信号用于实时状态估计与反馈控制。\",\n      \"trl_level\": 6,\n      \"application_scenarios\": [\"复杂工况实时控制\"],\n      \"source_quote\": \"采用多传感器数据融合实现动态调节\",\n      \"source_section\": \"2.1 控制系统\"\n    }\n  ],\n  \"problems\": [\n    {\n      \"problem_id\": \"P-001\",\n      \"problem_description\": \"动态工况下控制精度不足导致性能波动。\",\n      \"problem_category\": \"技术矛盾\",\n      \"severity\": \"高\",\n      \"related_tech\": [\"T-001\"],\n      \"source_quote\": \"在高速工况下响应滞后明显\",\n      \"source_section\": \"3.2 关键问题\"\n    }\n  ],\n  \"solutions\": [\n    {\n      \"solution_id\": \"S-001\",\n      \"solution_description\": \"引入自适应参数调节机制提升稳定性。\",\n      \"solution_type\": \"技术创新\",\n      \"target_problems\": [\"P-001\"],\n      \"implementation_difficulty\": \"中\",\n      \"expected_effect\": \"缩短响应时间并降低波动幅度。\",\n      \"source_quote\": \"通过在线参数调整实现稳态精度提升\",\n      \"source_section\": \"4.1 改进方案\"\n    }\n  ],\n  \"standards\": [\n    {\n      \"standard_id\": \"STD-001\",\n      \"standard_name\": \"系统性能测试规范\",\n      \"standard_number\": \"GB/T 0000-0000\",\n      \"standard_type\": \"国家标准\",\n      \"scope\": \"适用于相关控制系统性能测试。\",\n      \"key_requirements\": [\"响应时间\", \"稳定性指标\"],\n      \"source_quote\": \"测试流程需满足国家标准要求\",\n      \"source_section\": \"5.3 标准约束\"\n    }\n  ]\n}\n```\n\n---\n\n## Workflow\n\n1. **Step 1: 读取与分段**\n- 输入：`tech_landscape`、`user_input`\n- 处理：按标题与段落切分，建立证据片段索引\n- 输出映射：候选片段池\n\n2. **Step 2: 抽取技术与问题**\n- 输入：候选片段池\n- 处理：抽取 `technologies[]` 与 `problems[]`，建立 `related_tech` 引用\n- 输出映射：`technologies`、`problems`\n\n3. **Step 3: 抽取方案与标准**\n- 输入：候选片段池、已生成问题列表\n- 处理：抽取 `solutions[]` 与 `standards[]`，建立 `target_problems` 引用\n- 输出映射：`solutions`、`standards`\n\n4. **Step 4: 方向句生成**\n- 输入：全局文本与高频技术线索\n- 处理：生成一句技术方向描述\n- 输出映射：`alignment_parameters.technical_direction`\n\n5. **Step 5: 自检与修复**\n- 检查顶层字段完整性、字段类型、枚举合法性、ID 格式、引用一致性\n- 检查所有实体是否包含 `source_quote`\n- 若不满足则修复；无法修复则删除不合规实体，保持输出可解析\n\n6. **Step 6: 输出**\n- 输出单一 JSON 对象，不附加任何说明文本\n"
