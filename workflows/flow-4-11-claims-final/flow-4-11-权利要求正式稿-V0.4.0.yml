    - data:
        code: "import json\n\n\nOPEN_SELECTOR_MARKER = \"{\" + \"{\" + \"#\"\nBROKEN_SELECTOR_MARKER = \"变量\" + \"结束符\" + \"片段\"\n\n\ndef _stringify(value):\n    if value is None:\n        return \"\"\n    if isinstance(value, str):\n        return value\n    try:\n        return json.dumps(value, ensure_ascii=False)\n    except Exception:\n        return str(value)\n\n\ndef _has_placeholder(value):\n    text = _stringify(value)\n    return OPEN_SELECTOR_MARKER in text or BROKEN_SELECTOR_MARKER in text\n\n\ndef _section(title, value):\n    text = _stringify(value).strip()\n    if not text:\n        text = \"未提供\"\n    return f\"## {title}\\n{text}\"\n\n\ndef main(\n    claim_strategy_packet: str = \"\",\n    strategy_closure_checklist: str = \"\",\n    required_dependency_edges: str = \"\",\n    forbidden_slot_drift: str = \"\",\n    delivery_blockers: str = \"\",\n    target_claim_count_range: str = \"\",\n    support_risk_items: str = \"\",\n    claim_1_change_delta: str = \"\",\n    claim_1_anchor_summary:\
          \ str = \"\",\n    claim_2_technical_carrier_requirement: str = \"\",\n    claim_3_technical_carrier_requirement: str = \"\",\n    functional_effect_risk_items: str = \"\",\n    terminal_layout_recheck_required: str = \"\",\n    revision_action_list=None,\n    claim_slot_plan=None,\n    manifest_adjustment_plan=None,\n    unsupported_guardrails=None,\n    candidate_claim_quality_status: str = \"\",\n    candidate_claim_quality_warnings: str = \"\",\n    candidate_required_rewrite_instructions: str = \"\",\n    candidate_slot_drift_findings: str = \"\",\n    candidate_placeholder_guard_status: str = \"\",\n    candidate_must_rewrite_flags: str = \"\",\n) -> dict:\n    items = {\n        \"claim_strategy_packet\": claim_strategy_packet,\n        \"strategy_closure_checklist\": strategy_closure_checklist,\n        \"required_dependency_edges\": required_dependency_edges,\n        \"forbidden_slot_drift\": forbidden_slot_drift,\n        \"delivery_blockers\": delivery_blockers,\n \
          \       \"target_claim_count_range\": target_claim_count_range,\n        \"support_risk_items\": support_risk_items,\n        \"claim_1_change_delta\": claim_1_change_delta,\n        \"claim_1_anchor_summary\": claim_1_anchor_summary,\n        \"claim_2_technical_carrier_requirement\": claim_2_technical_carrier_requirement,\n        \"claim_3_technical_carrier_requirement\": claim_3_technical_carrier_requirement,\n        \"functional_effect_risk_items\": functional_effect_risk_items,\n        \"terminal_layout_recheck_required\": terminal_layout_recheck_required,\n        \"revision_action_list\": revision_action_list,\n        \"claim_slot_plan\": claim_slot_plan,\n        \"manifest_adjustment_plan\": manifest_adjustment_plan,\n        \"unsupported_guardrails\": unsupported_guardrails,\n        \"candidate_claim_quality_status\": candidate_claim_quality_status,\n        \"candidate_claim_quality_warnings\": candidate_claim_quality_warnings,\n        \"candidate_required_rewrite_instructions\"\
          : candidate_required_rewrite_instructions,\n        \"candidate_slot_drift_findings\": candidate_slot_drift_findings,\n        \"candidate_placeholder_guard_status\": candidate_placeholder_guard_status,\n        \"candidate_must_rewrite_flags\": candidate_must_rewrite_flags,\n    }\n    placeholder_keys = [key for key, value in items.items() if _has_placeholder(value)]\n    placeholder_guard_status = \"fail\" if placeholder_keys else \"pass\"\n\n    required = [\n        \"claim_strategy_packet\",\n        \"strategy_closure_checklist\",\n        \"claim_slot_plan\",\n        \"candidate_claim_quality_status\",\n        \"candidate_required_rewrite_instructions\",\n        \"claim_1_change_delta\",\n        \"claim_1_anchor_summary\",\n        \"claim_2_technical_carrier_requirement\",\n        \"claim_3_technical_carrier_requirement\",\n    ]\n    missing = [key for key in required if not _stringify(items.get(key)).strip()]\n\n    status = str(candidate_claim_quality_status or\
          \ \"\").strip().lower()\n    flags = []\n    if missing:\n        flags.append(\"缺失关键终稿修订上下文：\" + \", \".join(missing) + \"；终稿节点必须保守重写，不得原样交付。\")\n    if status in (\"warning\", \"fail\"):\n        flags.append(f\"候选质量门状态为 {status}，终稿节点必须结构性修复，不得原样输出候选稿。\")\n    if placeholder_guard_status == \"fail\":\n        flags.append(\"检测到未解析变量或变量残片：\" + \", \".join(placeholder_keys) + \"；终稿节点必须重新组织正文。\")\n    if str(candidate_slot_drift_findings or \"\").strip():\n        flags.append(\"候选稿存在槽位漂移或依附链风险，必须逐项闭合。\")\n    layout_recheck_value = str(terminal_layout_recheck_required or \"\").strip().lower()\n    if layout_recheck_value in (\"recheck_required\", \"required\", \"必须重检\", \"需要重检\"):\n        flags.append(\"2-6-13A要求终稿布局重检：必须重新核对claim 1保护中心、claim 2/3技术载体、并列独权价值和从属依附关系。\")\n    if str(functional_effect_risk_items or \"\").strip():\n        flags.append(\"存在功能性/效果性风险项：终稿必须将其转化为可验证技术载体，或下沉到说明书补强/报告说明。\")\n    if str(candidate_must_rewrite_flags or \"\").strip():\n        flags.append(_stringify(candidate_must_rewrite_flags))\n\
          \    if not flags:\n        flags.append(\"未触发结构性强制重写标志；终稿仍需按策略包和槽位规划完成一致性复核。\")\n\n    sections = [\n        _section(\"最高优先级：无支撑内容防线\", unsupported_guardrails),\n        _section(\"最高优先级：交付阻断项\", delivery_blockers),\n        _section(\"最高优先级：候选必须重写标志\", candidate_must_rewrite_flags),\n        _section(\"目标权利要求数量范围\", target_claim_count_range),\n        _section(\"支持风险\", support_risk_items),\n        _section(\"13A claim 1变化摘要\", claim_1_change_delta),\n        _section(\"13A claim 1锚点摘要\", claim_1_anchor_summary),\n        _section(\"13A claim 2技术载体要求\", claim_2_technical_carrier_requirement),\n        _section(\"13A claim 3技术载体要求\", claim_3_technical_carrier_requirement),\n        _section(\"13A 功能性/效果性风险项\", functional_effect_risk_items),\n        _section(\"13A 终稿布局重检要求\", terminal_layout_recheck_required),\n        _section(\"统一策略包\", claim_strategy_packet),\n        _section(\"策略闭合检查清单\", strategy_closure_checklist),\n        _section(\"必须满足的依附关系\", required_dependency_edges),\n\
