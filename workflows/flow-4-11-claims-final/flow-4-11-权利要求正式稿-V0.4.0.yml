          \ beneficial_effects_by_title, beneficial_effects_by_semantic),\n        'embodiments_TD': choose(embodiments_TD, embodiments_by_title, embodiments_by_semantic),\n        'drawings_explain_TD': choose(drawings_explain_TD, drawings_explain_by_title, drawings_explain_by_semantic),\n    }"
