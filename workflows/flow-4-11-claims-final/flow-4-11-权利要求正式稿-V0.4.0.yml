        code: "def norm(value):\n    text = str(value or '')\n    text = text.replace('\\r\\n', '\\n').replace('\\r', '\\n').strip()\n    return text\n\n\ndef compact(text):\n    text = norm(text)\n    if not text:\n        return ''\n    lines = [line.rstrip() for line in text.split('\\n')]\n    normalized = []\n    blank = False\n    for line in lines:\n        if line.strip():\n            normalized.append(line.strip())\n            blank = False\n        else:\n            if not blank:\n                normalized.append('')\n            blank = True\n    return '\\n'.join(normalized).strip()\n\n\ndef choose(direct_value, title_value, semantic_value):\n    for candidate in (direct_value, title_value, semantic_value):\n        normalized = compact(candidate)\n        if normalized:\n            return normalized\n    return ''\n\n\ndef main(\n    technical_field: str = '',\n    background_art_TD: str = '',\n    technical_solutions: str = '',\n    beneficial_effects_TD: str = '',\n  \
