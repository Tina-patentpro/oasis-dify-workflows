            不得把“需要说明书补强”写成“权利要求错误”；也不得写成“当前已经充分支持”。



            ## 九、可选优化项


            列出可选优化建议。每条建议需说明：建议调整哪类权利要求、为什么有助于保护范围、是否涉及进一步合理上位、预期带来什么保护效果。建议应具体、可执行，不得写空泛建议。可在本节补充说明书具体实施方式生成指导，但不得另起第十个二级标题。


