          \ dict):\n            continue\n        claim_no = str(item.get('claim_no') or '').strip()\n        if not claim_no:\n            continue\n        parent_refs = item.get('parent_refs')\n        if not isinstance(parent_refs, list):\n            parent_refs = []\n        out.append({\n            'claim_no': claim_no,\n            'claim_type': str(item.get('claim_type') or '').strip(),\n            'group_kind': str(item.get('group_kind') or '').strip(),\n            'parent_refs': [str(x).strip() for x in parent_refs if str(x).strip()],\n        })\n    return out\n\n\ndef main(claims_text: str, claim_manifest: str) -> dict:\n    manifest = _normalize_manifest(_loads(claim_manifest))\n    children = {}\n    row_map = {row['claim_no']: row for row in manifest}\n    roots = []\n\n    for row in manifest:\n        refs = [ref for ref in row['parent_refs'] if ref in row_map]\n        parent = refs[0] if refs else ''\n        if parent:\n            children.setdefault(parent, []).append(row['claim_no'])\n\
          \        else:\n            roots.append(row['claim_no'])\n\n    roots = sorted(set(roots), key=_sort_key)\n    for parent, kid_list in list(children.items()):\n        children[parent] = sorted(set(kid_list), key=_sort_key)\n\n    lines = ['## 权利要求依赖树']\n\n    def label(row):\n        no = row['claim_no']\n        claim_type = str(row.get('claim_type') or '').strip()\n        group_kind = str(row.get('group_kind') or '').strip()\n        refs = row.get('parent_refs') or []\n        if claim_type == 'independent':\n            if str(no) == '1':\n                return f'{no}（核心独立）'\n            return f'{no}（并列独立）'\n        if len(refs) > 1:\n            return f'{no}（依附权利要求{_compress_refs(refs)}任一项）'\n        if group_kind in ('core_independent', '核心独立', '核心独立权利要求', '独立权利要求'):\n            return f'{no}（核心独立）'\n        if group_kind in ('parallel_independent', '并列独立', '并列独立权利要求'):\n            return f'{no}（并列独立）'\n        return no\n\n    def render(claim_no, ancestors_has_more=None,\
          \ is_last=True):\n        if ancestors_has_more is None:\n            ancestors_has_more = []\n        row = row_map.get(claim_no, {'claim_no': claim_no, 'group_kind': '', 'parent_refs': []})\n        if not ancestors_has_more:\n            prefix = ''\n        else:\n            prefix = ''.join('│  ' if has_more else '   ' for has_more in ancestors_has_more[:-1])\n            prefix += '└─' if is_last else '├─'\n        lines.append(f'{prefix}{label(row)}')\n        kids = children.get(claim_no, [])\n        for idx, child in enumerate(kids):\n            child_is_last = idx == len(kids) - 1\n            render(child, ancestors_has_more + [not child_is_last], child_is_last)\n\n    for root in roots:\n        render(root, [], True)\n\n    return {'tree_text': '\\n'.join(lines).strip()}\n"
