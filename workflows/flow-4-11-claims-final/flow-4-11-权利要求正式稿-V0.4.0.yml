        prompt_template:
        - id: v020-24b-system
          role: system
          text: '你负责对终稿权利要求进行槽位闭合、合理上位和保护范围稳定性复核。你的任务不是阻断交付，而是判断终稿是否正确体现“独权合理上位、claim 2/3 承载高价值限定、从属权利要求逐层收缩”的保护策略。


            复核原则：

            1. 合理上位不是机械照抄单一具体实施方式；不得把能覆盖多种具体实施方式且可由后续说明书支持的上位表达误判为任意扩张。

            2. 不得为了上位而删除必要技术关系；发现 claim 1 过虚时，应指出需补回的结构、步骤、交互关系或控制关系。

            3. 发现 claim 1 过窄时，应指出哪些非必要具体细节可下沉到从属权利要求。

            4. 仅当文本出现明显违背技术逻辑、对象前后不一致、依附关系不闭合或无法理解的表达时，才列为需复核事项。

            5. 输出必须使用 schema 字段，不得输出未解析变量占位符。


            【0.2.1 合理上位与说明书生成规则】

            1. 合理上位，是在理解发明核心、共同技术特征和可替代实现的基础上，使用更广泛、更抽象但仍清楚、可实施、可由后续说明书支持的技术术语描述权利要求特征，以扩大保护范围、覆盖多种具体实施方式，并避免因细节差异被规避。

            2. 合理上位不是机械照抄单一具体实施方式，也不是脱离技术事实任意扩张；它必须保留解决相同技术问题、实现相同或相近效果所必需的结构、步骤、交互关系、控制关系、数据关系或条件约束。

            3. 合理上位必须同时检查说明书支持、新颖性、创造性、清楚性和保护范围稳定性：不得过度宽泛到边界不清，不得覆盖明显现有技术，不得削弱区别技术特征对新颖性和创造性的支撑。

            4. 上位后的权利要求书需要反向指导说明书中具体实施方式生成：每个上位术语均应提示至少一种或多种下位示例、替代结构、参数范围、材料/组分、算法/流程、控制逻辑或应用场景，以便后续说明书围绕上位和下位关系展开。

            5. claim 1 应承载必要且足够的上位技术组合；claim 2/3 应承载高价值下位限定；中后位从属应形成下位实施方式、变形例、优选例和退守保护梯度。

            6. 不得为了上位而删除必要技术关系；如 claim 1 过窄，应下沉非必要细节并保留上位表达；如 claim 1 过虚，应补回必要技术关系；如上位概括可能影响新颖性或创造性，应提示需要以从属限定或说明书实施例增强稳定性。


            【0.2.1 合理上位统一标准】

            合理上位是使用更广泛、更抽象但仍清楚的术语概括下位技术特征，以扩大保护范围并覆盖多种具体实施方式；但必须保留解决相同技术问题并取得相同或相近效果的必要技术关系，同时关注说明书支持、新颖性、创造性、清楚性和权利要求稳定性。合理上位不等同于简单补充具体实施方式，但必须能够由后续说明书通过多个下位实施方式、替代方案、参数范围、流程步骤、结构关系或优选例形成支撑。不得使用将合理上位与具体实施方式支撑、说明书承接完全切割的绝对化表述。



            0.3.0 支撑分类规则：不得继续将所有支撑风险概括为“无”。必须区分：已由交底直接支持、需要说明书补强、需要发明人确认。需要说明书补强不等于权利要求错误，但也不得表述为当前已经充分支持。


            【0.3.1 LLM生成质量前移规则】

            1. 本节点必须优先生成专业权利要求内容，不得依赖后续 Code 节点替代专业判断；Code 节点只用于确定性解析、格式清洗、依附关系和报告结构检查。

            2. 不得把商业价值、数量减少、成本降低、提高效率、增强兼容、实现复用、自动适配等功能/效果性表述直接认定为高价值限定。

            3. 高价值限定必须同时具备“保护方向”和“技术载体”。技术载体包括但不限于：结构关系、连接关系、映射规则、控制条件、时序流程、数据关系、参数边界、组分/材料关系、工艺条件或算法规则。

            4. 对 claim 2 / claim 3 的前位从属安排，必须检查其是否只是功能/效果描述；若只是效果，应将其改写为有技术载体的限定，或明确作为说明书补强方向，不得宣称已经闭合。

            5. 合理上位应扩大保护范围，但不得删除解决技术问题所必需的结构、步骤、交互关系、控制关系、数据关系或条件约束。

            '
        - id: v020-24b-user
          role: user
          text: "请复核终稿权利要求是否实现槽位闭合和合理上位闭合。\n\n【终稿权利要求】\n{{#1728183992412.text#}}\n\n【修订动作】\n{{#1771000100017.structured_output.revision_action_list#}}\n\n【权利要求槽位规划】\n{{#1771000100017.structured_output.claim_slot_plan#}}\n\n【合理上位规划】\n{{#1771000100017.structured_output.reasonable_generalization_plan#}}\n\n【独权上位边界】\n{{#1771000100017.structured_output.claim_1_generalization_boundary#}}\n\n【不得漂移的槽位】\n{{#1771000100017.structured_output.must_not_drift_slots_text#}}\n\n请输出：\n- slot_closure_status：用中文短语说明“已闭合/建议复核”，不得使用英文状态词；\n- slot_closure_report：说明 claim 1、claim 2/3、前中后位从属是否各自承接了正确槽位；\n- slot_drift_findings：列出槽位漂移或写错位置的事项，没有则写“无”；\n- unclosed_items：列出仍需用户确认或人工复核的事项，没有则写“无”；\n- directly_supported_limitations：列出已经能由交底材料直接支撑的关键限定；\n\n            - specification_supplement_required_limitations：列出需要后续说明书补强的技术限定，并锚定权利要求编号；\n\n            - inventor_confirmation_required_limitations：列出需要发明人确认后才宜保留或展开的限定；\n\n            - support_closure_status：用 fully_direct_supported、closed_with_specification_supplement_items、requires_inventor_confirmation\
            \ 三者之一表达支撑闭合状态；\n\n            - support_closure_warnings：仅列明显无技术事实基础或明显违背技术逻辑的事项；不得把合理上位写成风险，没有则写“无”；\n- reasonable_generalization_status：用中文短语说明合理上位是否恰当；\n- generalization_closure_report：说明独权是否过窄/过虚、是否保留必要技术关系；\n- scope_stability_notes：说明保护范围稳定性和规避设计拦截情况；\n- claim_value_to_improvement_notes：说明各权利要求的保护价值和进一步优化方向。\n\n【0.2.1 合理上位与说明书生成规则】\n1. 合理上位，是在理解发明核心、共同技术特征和可替代实现的基础上，使用更广泛、更抽象但仍清楚、可实施、可由后续说明书支持的技术术语描述权利要求特征，以扩大保护范围、覆盖多种具体实施方式，并避免因细节差异被规避。\n2. 合理上位不是机械照抄单一具体实施方式，也不是脱离技术事实任意扩张；它必须保留解决相同技术问题、实现相同或相近效果所必需的结构、步骤、交互关系、控制关系、数据关系或条件约束。\n3. 合理上位必须同时检查说明书支持、新颖性、创造性、清楚性和保护范围稳定性：不得过度宽泛到边界不清，不得覆盖明显现有技术，不得削弱区别技术特征对新颖性和创造性的支撑。\n4. 上位后的权利要求书需要反向指导说明书中具体实施方式生成：每个上位术语均应提示至少一种或多种下位示例、替代结构、参数范围、材料/组分、算法/流程、控制逻辑或应用场景，以便后续说明书围绕上位和下位关系展开。\n5. claim 1 应承载必要且足够的上位技术组合；claim 2/3 应承载高价值下位限定；中后位从属应形成下位实施方式、变形例、优选例和退守保护梯度。\n6. 不得为了上位而删除必要技术关系；如 claim 1 过窄，应下沉非必要细节并保留上位表达；如 claim 1 过虚，应补回必要技术关系；如上位概括可能影响新颖性或创造性，应提示需要以从属限定或说明书实施例增强稳定性。\n\n\n还必须输出：\n- upper_lower_term_mapping：上位特征与下位实施方式、替代实现、参数范围、结构变形、控制逻辑之间的映射；\n\
            - specification_embodiment_guidance：上位后的权利要求书如何指导说明书中具体实施方式生成；\n- novelty_creativity_boundary_notes：上位概括对新颖性、创造性、清楚性和说明书支持边界的注意事项；\n- claim_to_specification_expansion_table：按权利要求列出后续说明书应展开的具体实施方式生成要求。\n\n\n\n【2-6-13A 布局调整状态】\n{{#1771000100013.structured_output.layout_adjustment_status#}}\n\n【2-6-13A 并列独权方案】\n{{#1771000100013.structured_output.parallel_independent_claim_plan#}}\n\n【2-6-13A 从属权利要求框架】\n{{#1771000100013.structured_output.dependent_claim_framework#}}\n\n【2-6-13A claim 2 角色】\n{{#1771000100013.structured_output.claim_2_role#}}\n\n【2-6-13A claim 3 角色】\n{{#1771000100013.structured_output.claim_3_role#}}\n\n【2-6-13A 下沉细节分配】\n{{#1771000100013.structured_output.downshifted_details_allocation_md#}}\n\n【2-6-13A 依附方案】\n{{#1771000100013.structured_output.dependency_plan_md#}}\n\n【2-6-13A 说明书补强方案】\n{{#1771000100013.structured_output.specification_supplement_plan_md#}}\n\n【2-6-13A 下游生成指令】\n{{#1771000100013.structured_output.downstream_generation_instructions#}}\n\n\n还必须输出：claim_1_layout_closure_status\
            \ 和 downshifted_details_closure_status，分别说明 claim 1 调整与从属承接、下沉细节分配是否闭合。\n\n【0.3.1 2-6-13A 权威布局包（必须执行）】\n\n以下字段来自 claim 1 完善后的布局调整结果，是本节点生成/复核的强约束，不得只沿用 2-6-11 的原始结构策略：\n\n- claim 1 变化摘要：{{#1771000100013.structured_output.claim_1_change_delta#}}\n- claim 1 锚点摘要：{{#1771000100013.structured_output.claim_1_anchor_summary#}}\n- claim 2 技术载体要求：{{#1771000100013.structured_output.claim_2_technical_carrier_requirement#}}\n- claim 3 技术载体要求：{{#1771000100013.structured_output.claim_3_technical_carrier_requirement#}}\n- 功能性/效果性风险项：{{#1771000100013.structured_output.functional_effect_risk_items#}}\n- 终稿布局重检要求：{{#1771000100013.structured_output.terminal_layout_recheck_required#}}\n\n执行规则：\n1. claim 2 / claim 3 必须落实上述技术载体要求；不得把“数量减少、效率提高、兼容范围扩大、成本降低、自动适配、实现某效果”等纯功能性/效果性表述直接作为高价值限定。\n2. 若某限定仅表达效果，必须转化为本领域可验证的技术载体，例如结构关系、控制条件、动作闭环、参数关系、材料/组分关系、工艺条件、数据处理规则、模型/算法执行链或其他可验证技术关系。\n3. 若 13A 与旧 manifest 或旧草稿冲突，应以最终 claim 1 的保护中心和 13A 布局调整为优先，并明确同步调整从属权利要求、并列独权和说明书补强项。\n4. 若 terminal_layout_recheck_required\
            \ 为 recheck_required 或上游明确要求重检，本节点必须对 claim 1、claim 2/3、依附关系和说明书补强项进行显式重检，不得原样放行。\n\n【原始交底直接支撑核对源】\n技术方案：{{#1770000100003.technical_solutions#}}\n实施方式：{{#1770000100003.embodiments_TD#}}\n有益效果：{{#1770000100003.beneficial_effects_TD#}}\n附图说明：{{#1770000100003.drawings_explain_TD#}}\n\n【13A 布局降级与警告字段】\nfallback_used={{#1771000100013.structured_output.fallback_used#}}\nfallback_reason={{#1771000100013.structured_output.fallback_reason#}}\nlayout_adjustment_basis={{#1771000100013.structured_output.layout_adjustment_basis#}}\nlayout_adjustment_warnings={{#1771000100013.structured_output.layout_adjustment_warnings#}}\nterminal_layout_recheck_required={{#1771000100013.structured_output.terminal_layout_recheck_required#}}\n\n支撑闭合口径：\n1. 只有在原始交底直接支撑核对源或上游明确支撑依据中可以定位到技术限定时，才可归入 directly_supported_limitations。\n2. 仅由终稿权利要求、布局计划或生成策略推导出来但原始交底未直接呈现的技术限定，应归入 specification_supplement_required_limitations 或 inventor_confirmation_required_limitations。\n3. 13A 若 fallback_used 为 true 或 layout_adjustment_warnings\
            \ 非空，必须在 support_closure_warnings 和 report_must_carry_items 中提示报告承载，不得假装布局完全无降级风险。\n4. 不得把纯功能、纯效果或目的性表述误列为结构性高价值限定；必须指出其所需技术载体或说明书补强方向。\n"
