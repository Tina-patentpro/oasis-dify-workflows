            请严格遵守以下代理师式规划原则：

            1. claim 1 只承载最小必要技术方案、核心结构/步骤/数据/组分/控制关系，不得用效果、目的、黑盒功能或实施例清单承担核心区别点。

            2. claim 2 和 claim 3 应优先承载当前领域中最有价值、且由输入材料支撑的收窄轴；不得被品牌、型号、标准名、材料名、普通优选参数、场景词或实施例清单占位。

            3. 中位从属优先承载参数窗口、检测、反馈、状态迁移、控制联动、工艺条件、异常处理、校准、容错、回退、补偿等稳定限定。

            4. 后位从属才承载低价值枚举、优选材料、等效替换、场景、型号、标准、界面细节或非关键实施方式。

            5. 若非绑定 claim_manifest 提示与最佳槽位分配冲突，允许提出受控调整方案；默认保持独权数量；权利要求数量不得被旧 provisional manifest 锁死，不随意新增无支撑特征。

            6. 对 high severity issue 和影响 claim 1 / claim 2 / claim 3 价值布局的 medium issue，应设为 must_fix=true。

            7. 若缺乏权利要求保护边界，必须在 unsupported_guardrails 或 report_only 动作中说明，不得编造鲁棒性链或高价值限定。


            只输出 schema，不输出正文、解释、标题或 markdown。


            槽位规划补充规则：claim 1 应锁定核心基础前提与最小必要技术链；claim 2/3 应优先承载与 claim 1 组合后能提高授权稳定性的高价值限定。若现有权利要求数量不足以覆盖有支撑的 fallback 梯度，可建议新增从属权利要求，但新增内容必须来自交底书事实，不得来自测试用例、常识或其他领域模板。


            0.1.17 策略承接补强：

            1. claim_slot_plan 必须显式承接 2-6-11 的 claim_1_core_boundary、claim_1_forbidden_content、claim_2_high_value_axis、claim_3_high_value_axis、front/middle/back_dependent_roles。

            2. manifest_adjustment_plan 不得只围绕旧 claim_manifest 调整；若旧 manifest 与策略边界冲突，必须提出受控调整。

            3. unsupported_guardrails 必须记录支撑风险，避免后续节点用常识、测试用例或其他领域模板补充技术事实。


            0.1.17 槽位闭合目标：除现有字段外，必须输出 slot_closure_targets_text、dependency_closure_targets_text 和 must_not_drift_slots_text。三者用普通字符串承载，避免深层 schema。slot_closure_targets_text 应逐项说明 claim 1/2/3、系统项、方法项的期望角色和闭合标准；dependency_closure_targets_text 应明确 claim 2/3 和多重依附的必要关系；must_not_drift_slots_text 应列出禁止漂移情形。


            【0.1.18证据支持闭环】

            1. support_basis 不得写“根据领域规则”“根据行业常识”“可推知”等空泛依据；必须指向技术交底书、技术方案、实施方式中的事实或其直接概括。

            2. 如果某限定属于合理上位判断、领域知识库启发或行业常见实现，必须写入 unsupported_guardrails，不得写入 claim_slot_plan.preferred_content。

            3. claim_slot_plan.preferred_content 只能包含有支持的技术内容；无支持但有商业价值的内容只能进入报告补强建议。

            4. unsupported_guardrails 后续会被质量门和终稿节点消费，请用可被文本匹配的明确术语列出禁写机制。


            【0.2.1 合理上位与说明书生成规则】

            1. 合理上位，是在理解发明核心、共同技术特征和可替代实现的基础上，使用更广泛、更抽象但仍清楚、可实施、可由后续说明书支持的技术术语描述权利要求特征，以扩大保护范围、覆盖多种具体实施方式，并避免因细节差异被规避。

            2. 合理上位不是机械照抄单一具体实施方式，也不是脱离技术事实任意扩张；它必须保留解决相同技术问题、实现相同或相近效果所必需的结构、步骤、交互关系、控制关系、数据关系或条件约束。

            3. 合理上位必须同时检查说明书支持、新颖性、创造性、清楚性和保护范围稳定性：不得过度宽泛到边界不清，不得覆盖明显现有技术，不得削弱区别技术特征对新颖性和创造性的支撑。

            4. 上位后的权利要求书需要反向指导说明书中具体实施方式生成：每个上位术语均应提示至少一种或多种下位示例、替代结构、参数范围、材料/组分、算法/流程、控制逻辑或应用场景，以便后续说明书围绕上位和下位关系展开。

            5. claim 1 应承载必要且足够的上位技术组合；claim 2/3 应承载高价值下位限定；中后位从属应形成下位实施方式、变形例、优选例和退守保护梯度。

            6. 不得为了上位而删除必要技术关系；如 claim 1 过窄，应下沉非必要细节并保留上位表达；如 claim 1 过虚，应补回必要技术关系；如上位概括可能影响新颖性或创造性，应提示需要以从属限定或说明书实施例增强稳定性。



            【0.2.1 修订动作口径】

            1. 修订动作不再把“交底材料未直接写明”自动等同为不得写入；应区分“合理上位”“高价值保护性限定”“明显无技术事实基础的任意扩张”。

            2. 对合理上位，应在 reasonable_generalization_plan 中说明：上位前的具体限定是什么、上位后的表达是什么、为什么不会丢失必要技术关系。

            3. 对 claim 1，应优先判断是否过窄或过虚；过窄时下沉非必要细节，过虚时补回必要结构/步骤/交互关系。

            4. 对 claim 2/3，应确保其承接高价值具体限定，而不是低价值材料替换或简单用途描述。



            【0.2.1 说明书生成联动】

            1. reasonable_generalization_basis 必须说明上位依据：共同技术特征、可替代实现、相同技术问题、相同或相近效果。

            2. upper_lower_mapping 必须输出“上位术语—下位示例”映射，用于指导后续说明书中具体实施方式生成。

            3. specification_generation_requirements 必须列出说明书需要生成的具体实施方式、变形例、优选例、参数范围或替代实现。

            4. novelty_creativity_risk_notes 必须提示过度上位可能带来的新颖性、创造性、清楚性或说明书支持边界问题。


            【0.2.1 合理上位统一标准】

            合理上位是使用更广泛、更抽象但仍清楚的术语概括下位技术特征，以扩大保护范围并覆盖多种具体实施方式；但必须保留解决相同技术问题并取得相同或相近效果的必要技术关系，同时关注说明书支持、新颖性、创造性、清楚性和权利要求稳定性。合理上位不等同于简单补充具体实施方式，但必须能够由后续说明书通过多个下位实施方式、替代方案、参数范围、流程步骤、结构关系或优选例形成支撑。不得使用将合理上位与具体实施方式支撑、说明书承接完全切割的绝对化表述。


            【0.3.1 LLM生成质量前移规则】

            1. 本节点必须优先生成专业权利要求内容，不得依赖后续 Code 节点替代专业判断；Code 节点只用于确定性解析、格式清洗、依附关系和报告结构检查。

            2. 不得把商业价值、数量减少、成本降低、提高效率、增强兼容、实现复用、自动适配等功能/效果性表述直接认定为高价值限定。

            3. 高价值限定必须同时具备“保护方向”和“技术载体”。技术载体包括但不限于：结构关系、连接关系、映射规则、控制条件、时序流程、数据关系、参数边界、组分/材料关系、工艺条件或算法规则。

            4. 对 claim 2 / claim 3 的前位从属安排，必须检查其是否只是功能/效果描述；若只是效果，应将其改写为有技术载体的限定，或明确作为说明书补强方向，不得宣称已经闭合。

