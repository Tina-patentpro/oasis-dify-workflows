    - data:
        code: "import json\nimport re\n\nOPEN_SELECTOR_MARKER = \"{\" + \"{\" + \"#\"\nBROKEN_SELECTOR_MARKER = \"变量\" + \"结束符\" + \"片段\"\nCLOSE_SELECTOR_MARKER = \"#\" + \"}\" + \"}\"\n\n\ndef _split_claims(claims_text):\n    text = str(claims_text or '').replace('\\r\\n', '\\n').replace('\\r', '\\n')\n    pattern = re.compile(r'(?m)(?:^|\\n)\\s*(\\d+)\\s*[\\.、．]\\s*')\n    matches = list(pattern.finditer(text))\n    claims = []\n    for idx, match in enumerate(matches):\n        claim_no = match.group(1)\n        start = match.end()\n        end = matches[idx + 1].start() if idx + 1 < len(matches) else len(text)\n        body = text[start:end].strip()\n        if body:\n            claims.append({'claim_no': claim_no, 'body': body})\n    return claims\n\n\ndef _expand_range(start, end):\n    try:\n        a = int(start)\n        b = int(end)\n    except Exception:\n        return [str(start), str(end)]\n    if a <= b and b - a <= 30:\n        return [str(i) for i in range(a, b + 1)]\n\
          \    return [str(start), str(end)]\n\n\ndef _extract_parent_refs(body):\n    head = str(body or '')[:220]\n    refs = []\n    for start, end in re.findall(r'权利要求\\s*(\\d+)\\s*(?:至|到|～|-)\\s*(\\d+)', head):\n        refs.extend(_expand_range(start, end))\n    for segment in re.findall(r'权利要求\\s*((?:\\d+\\s*(?:、|,|，|和|或|及)?\\s*){1,10})\\s*所述', head):\n        refs.extend(re.findall(r'\\d+', segment))\n    if not refs:\n        for segment in re.findall(r'(?:根据|如|按照)\\s*权利要求\\s*([^，。；;]{1,100})', head):\n            refs.extend(re.findall(r'\\d+', segment))\n    seen = set()\n    out = []\n    for ref in refs:\n        ref = str(ref).strip()\n        if ref and ref not in seen:\n            seen.add(ref)\n            out.append(ref)\n    return out\n\n\ndef _claim_order(value):\n    value = str(value or '')\n    return int(value) if value.isdigit() else 9999\n\n\ndef _json_loads(value, default):\n    if not value:\n        return default\n    try:\n        parsed = json.loads(value)\
          \ if isinstance(value, str) else value\n    except Exception:\n        return default\n    return parsed if parsed is not None else default\n\n\ndef _text_units(value):\n    text = re.sub(r'\\s+', '', str(value or ''))\n    units = set()\n    units.update(re.findall(r'[A-Za-z0-9_\\-]{2,}', text))\n    units.update(re.findall(r'[\\u4e00-\\u9fff]{2,8}', text))\n    for i in range(max(0, len(text) - 1)):\n        gram = text[i:i + 2]\n        if re.match(r'[\\w\\u4e00-\\u9fff]{2}', gram):\n            units.add(gram)\n    stop = {'权利要求', '所述', '一种', '包括', '其特征在于', '用于', '进行', '可以', '至少', '一个', '多个'}\n    return {item for item in units if item and item not in stop}\n\n\ndef _claim_slot_strategy_text(claim_slot_plan, slot_names):\n    parsed = _json_loads(claim_slot_plan, claim_slot_plan or [])\n    if not isinstance(parsed, list):\n        return ''\n    wanted = {str(x) for x in slot_names}\n    chunks = []\n    for row in parsed:\n        if not isinstance(row, dict):\n         \
          \   continue\n        slot = str(row.get('claim_slot') or '')\n        if slot in wanted or any(name in slot for name in wanted):\n            chunks.extend(str(row.get(k) or '') for k in ('value_role', 'preferred_content', 'forbidden_content', 'reorder_instruction'))\n    return '\\n'.join(chunks)\n\n\ndef _strategy_text_matches(claim_text, *strategy_texts):\n    strategy = '\\n'.join(str(x or '') for x in strategy_texts if str(x or '').strip())\n    if not strategy.strip():\n        return None\n    claim_blob = re.sub(r'\\s+', '', str(claim_text or ''))\n    claim_units = _text_units(claim_text)\n    strategy_units = _text_units(strategy)\n    if not strategy_units:\n        return None\n    hits = [unit for unit in strategy_units if unit in claim_blob or unit in claim_units]\n    return bool(hits)\n\n\ndef _has_high_value_axis(text, *strategy_texts):\n    strategy_match = _strategy_text_matches(text, *strategy_texts)\n    if strategy_match is not None:\n        return strategy_match\n\
          \    # 0.1.17：高价值轴不再由代码节点静态关键词判断；若上游领域化策略缺失，\n    # 代码门仅保持结构性硬检查，避免对生命科学、食品、软件算法、文创等领域误报低价值。\n    return True\n\n\n\ndef _parse_count_range(text):\n    nums = [int(x) for x in re.findall(r'\\d+', str(text or ''))]\n    if len(nums) >= 2:\n        a, b = nums[0], nums[1]\n        if a > b:\n            a, b = b, a\n        return a, b\n    if len(nums) == 1:\n        return nums[0], nums[0]\n    return None\n\n\ndef _flatten_guardrail_items(value):\n    if value is None:\n        return []\n    if isinstance(value, str):\n        stripped = value.strip()\n        if not stripped:\n            return []\n        try:\n            parsed = json.loads(stripped)\n            if parsed is not value:\n                return _flatten_guardrail_items(parsed)\n        except Exception:\n            pass\n        return [line.strip('- \\t\\r\\n') for line in re.split(r'[\\n；;]+', stripped) if line.strip('- \\t\\r\\n')]\n    if isinstance(value, dict):\n        return ['；'.join(str(v) for\
          \ v in value.values() if str(v).strip())]\n    if isinstance(value, (list, tuple)):\n        out = []\n        for item in value:\n            out.extend(_flatten_guardrail_items(item))\n        return [x for x in out if str(x).strip()]\n    return [str(value)]\n\n\ndef _guardrail_hits(claims_blob, guardrail_source, code='UNSUPPORTED_GUARDRAIL_HIT', severity='blocking'):\n    blob = re.sub(r'\\s+', '', str(claims_blob or ''))\n    if not blob:\n        return []\n    hits = []\n    for raw in _flatten_guardrail_items(guardrail_source):\n        text = str(raw or '').strip()\n        if not text:\n            continue\n        quoted = re.findall(r'[“「《](.*?)[”」》]', text)\n        quoted += re.findall(r'[\"\\']([^\"\\']{3,40})[\"\\']', text)\n        direct_terms = [q for q in quoted if len(q.strip()) >= 3]\n        if any(re.sub(r'\\s+', '', term) in blob for term in direct_terms):\n            hits.append(_issue(code, severity, '', f'权利要求文本命中无支撑/阻断限定：{text[:120]}', '删除、上位化或下沉该限定；仅在原始技术交底有明确支持时才可保留。'))\n\
          \            continue\n        units = [u for u in _text_units(text) if len(u) >= 3 and u not in {'权利要求', '技术方案', '实施方式', '领域规则', '支持不足', '不得写入', '只能作为', '人工补强'}]\n        if units:\n            matched = [u for u in units if u in blob]\n            threshold = 3 if len(units) >= 6 else max(2, min(3, len(units)))\n            if len(matched) >= threshold:\n                hits.append(_issue(code, severity, '', f'权利要求文本疑似命中无支撑/阻断限定：{text[:120]}', '核对原始交底支持；无明确支持时必须删除、上位化或仅写入报告补强建议。'))\n    return hits\n\ndef _overlap_ratio(left, right):\n    def grams(text):\n        text = re.sub(r'\\s+', '', str(text or ''))\n        return {text[i:i + 2] for i in range(max(0, len(text) - 1)) if re.match(r'[\\w\\u4e00-\\u9fff]{2}', text[i:i + 2])}\n    a = grams(left)\n    b = grams(right)\n    if not a or not b:\n        return 0.0\n    return len(a & b) / max(1, min(len(a), len(b)))\n\n\ndef _issue(code, severity, claim_no, message, action):\n    return {\n        'code': code,\n        'severity':\
          \ severity,\n        'claim_no': str(claim_no or ''),\n        'message': message,\n        'action': action,\n    }\n\n\ndef _format_issue(issue):\n    claim_part = f\"[claim {issue.get('claim_no')}]\" if issue.get('claim_no') else \"[全局]\"\n    return f\"[{str(issue.get('severity') or '').upper()}][{issue.get('code')}]{claim_part} {issue.get('message')}；处理要求：{issue.get('action')}\"\n\n\ndef _format_instructions(issues, status='pass'):\n    if issues:\n        return [\n            f\"[{str(item.get('severity') or '').upper()}][{item.get('code')}][claim {item.get('claim_no') or '全局'}] {item.get('action')}\"\n            for item in issues\n        ]\n    if status == 'warning':\n        return ['候选稿存在结构风险；必须依据 candidate_claim_quality_warnings 逐项修订，不得视为完全通过。']\n    if status == 'fail':\n        return ['候选稿未通过结构质量门；禁止原样输出，必须进行结构性重写。']\n    return ['候选稿通过结构质量门；终稿节点仍需核对说明书支撑、术语一致性和法条风险。']\n\ndef _ancestor_claim_nos(claim_no, parents):\n    out = []\n    seen = set()\n\n    def visit(no):\n\
          \        for parent in parents.get(no, []):\n            if parent in seen:\n                continue\n            seen.add(parent)\n            out.append(parent)\n            visit(parent)\n\n    visit(claim_no)\n    return out\n\n\ndef _antecedent_terms(body):\n    text = str(body or '')\n    pattern = re.compile(r'(所述|该|上述|前述)的?([一-龥A-Za-z0-9]{2,12}?)(?=与|和|及|为|是|在|具有|包括|连接|设置|形成|，|。|；|、|,|;|$)')\n    ignore = {'权利要求', '装置', '方法', '系统', '设备', '组合物', '材料', '结构', '组件', '部件'}\n    terms = []\n    for match in pattern.finditer(text):\n        qualifier = match.group(1)\n        term = match.group(2).strip()\n        if term.startswith('的'):\n            term = term[1:].strip()\n        if term in ignore or len(term) < 2:\n            continue\n        terms.append({'qualifier': qualifier, 'term': term, 'start': match.start()})\n    return terms\n\n\ndef _find_antecedent_basis_issues(claims, parents):\n    claim_by_no = {row['claim_no']: row['body'] for row in claims}\n    issues\
          \ = []\n    for row in claims:\n        claim_no = row['claim_no']\n        body = row['body']\n        for item in _antecedent_terms(body):\n            term = item['term']\n            prior_in_same_claim = body[:item['start']]\n            ancestor_context = '\\n'.join(claim_by_no.get(no, '') for no in _ancestor_claim_nos(claim_no, parents))\n            if term in prior_in_same_claim or term in ancestor_context:\n                continue\n            issues.append(_issue(\n                'ANTECEDENT_BASIS_MISSING',\n                'blocking',\n                claim_no,\n                f'“{item[\"qualifier\"]}{term}”缺少前置基础或首次引入顺序不清。',\n                '修复该对象的首次引入或删除无前置基础的指代；修复前不得作为终稿直接交付。',\n            ))\n    return issues\n\n\ndef _analyze(claims_text, final_claim_manifest='', include_formal_checks=False, source_dependent_claims_text='', claim_2_high_value_axis='', claim_3_high_value_axis='', front_dependent_roles='', claim_slot_plan=None, target_claim_count_range='',\
          \ support_risk_items='', delivery_blockers='', unsupported_guardrails=None):\n    claims = sorted(_split_claims(claims_text), key=lambda row: _claim_order(row['claim_no']))\n    source_claims = sorted(_split_claims(source_dependent_claims_text), key=lambda row: _claim_order(row['claim_no']))\n    claim_nos = {row['claim_no'] for row in claims}\n    manifest_rows = _json_loads(final_claim_manifest, [])\n    manifest_by_no = {str(row.get('claim_no')): row for row in manifest_rows if isinstance(row, dict)}\n\n    parents = {}\n    for row in claims:\n        no = row['claim_no']\n        if no in manifest_by_no and isinstance(manifest_by_no[no].get('parent_refs'), list):\n            refs = [str(ref) for ref in manifest_by_no[no].get('parent_refs') if str(ref) in claim_nos and str(ref) != no]\n        else:\n            refs = [ref for ref in _extract_parent_refs(row['body']) if ref in claim_nos and ref != no]\n        parents[no] = refs\n\n    independent = [row['claim_no'] for row\
          \ in claims if not parents.get(row['claim_no'])]\n    dependent = [row['claim_no'] for row in claims if parents.get(row['claim_no'])]\n    all_direct_to_1 = bool(len(dependent) >= 3 and all(parents.get(no) == ['1'] for no in dependent))\n    has_multilevel_chain = any(any(ref != '1' for ref in parents.get(no, [])) for no in dependent)\n    claim_by_no = {row['claim_no']: row['body'] for row in claims}\n    claim1 = claim_by_no.get('1', '')\n    functional_hits = len(re.findall(r'用于|以便|从而|实现|提高|改善|优化|适配|确定|识别|处理|控制', claim1))\n\n    issues = []\n    score = 100\n\n    if not claims:\n        issues.append(_issue(\n            'CLAIM_PARSE_FAILED',\n            'blocking',\n            '',\n            '未解析到权利要求编号，无法完成权利要求结构质量审计。',\n            '请先恢复连续编号的权利要求文本。',\n        ))\n        return {\n            'claim_count': 0,\n            'independent_claims': [],\n            'dependent_claims': [],\n            'parents': {},\n            'all_direct_to_1': False,\n            'has_multilevel_chain':\
          \ False,\n            'claim1_functional_hits': 0,\n            'issues': issues,\n            'warnings': [_format_issue(item) for item in issues],\n            'instructions': _format_instructions(issues, 'fail'),\n            'score': 0,\n            'status': 'fail',\n        }\n\n    target_range = _parse_count_range(target_claim_count_range)\n    if target_range:\n        min_count, max_count = target_range\n        if len(claims) < min_count or len(claims) > max_count:\n            score -= 10\n            issues.append(_issue(\n                'CLAIM_COUNT_OUTSIDE_TARGET_RANGE',\n                'warning',\n                '',\n                f'权利要求数量为{len(claims)}项，偏离上游规划范围{min_count}-{max_count}项。',\n                '终稿节点必须压回规划范围；若确因说明书支持而保留偏离数量，报告中必须给出实质理由。',\n            ))\n\n    if len(claims) <= 5:\n        score -= 22\n        issues.append(_issue(\n            'CLAIM_COUNT_THIN',\n            'blocking',\n            '',\n            '权利要求数量偏薄：终稿只有5项左右，通常不足以承载有支撑的\
          \ fallback 梯度。',\n            '在说明书有支撑时，将从属权利要求扩展到6-10项，覆盖关键结构/条件/参数/步骤、异常处理和替代实现；无支撑时必须在报告中说明。',\n        ))\n    elif len(claims) < 7:\n        score -= 10\n        issues.append(_issue(\n            'CLAIM_COUNT_LOW',\n            'warning',\n            '',\n            '权利要求数量偏少：从属保护层级可能不足。',\n            '核对说明书是否支持补充 fallback 层；若无支撑，应在报告中说明人工补强方向。',\n        ))\n\n    if source_claims and len(source_claims) >= 6 and len(claims) <= 5:\n        score -= 24\n        issues.append(_issue(\n            'CANDIDATE_REGRESSED_FROM_DEPENDENT_DRAFT',\n            'blocking',\n            '',\n            '候选稿比从属权利要求生成结果明显变薄：上游已生成6项以上从属/候选权利要求，但候选稿退化为5项以内且未给出删除理由。',\n            '恢复有支撑的从属项和多级依附链；仅能因无支撑、重复或冲突而删除，并应保留可报告的删除理由。',\n        ))\n\n    if all_direct_to_1:\n        score -= 28\n        issues.append(_issue(\n            'ALL_DEPENDENTS_DIRECT_TO_CLAIM_1',\n            'blocking',\n            '',\n            '全从属直依 claim 1：三个以上从属项全部直接依附 claim 1，claim 2/3 未形成组合保护链。',\n    \
          \        '重排依附关系；若 claim 3 的限定依赖 claim 2 才能形成更强保护，claim 3 优先依附 claim 2，并保留必要的并列收缩轴。',\n        ))\n    elif len(dependent) >= 3 and not has_multilevel_chain:\n        score -= 14\n        issues.append(_issue(\n            'NO_MULTI_LEVEL_DEPENDENCY_CHAIN',\n            'warning',\n            '',\n            '从属权利要求缺少多级组合链，授权回退层级偏弱。',\n            '补充至少一条 claim 2 → claim 3 或同等价值的多级依附链；若无支撑，应在报告中说明。',\n        ))\n\n    if '2' not in claim_by_no:\n        score -= 16\n        issues.append(_issue(\n            'CLAIM_2_MISSING',\n            'warning',\n            '2',\n            '缺少 claim 2，无法承载第一优先级高价值限定。',\n            '补充 claim 2 作为第一优先级高价值限定，或说明说明书无支撑。',\n        ))\n    elif not _has_high_value_axis(claim_by_no.get('2', ''), claim_2_high_value_axis, front_dependent_roles, _claim_slot_strategy_text(claim_slot_plan, ['claim_2', 'front_dependent'])):\n        score -= 10\n        issues.append(_issue(\n            'CLAIM_2_LOW_VALUE_AXIS',\n            'warning',\n     \
          \       '2',\n            'claim 2 未明显响应领域化高价值限定轴、前位从属角色或槽位规划，可能被低价值实施例细节占位。',\n            '将 claim 2 调整为第一优先级高价值限定，或在终稿报告中说明无支撑。',\n        ))\n    if '3' in claim_by_no:\n        if parents.get('3') == ['1'] and '2' in claim_by_no and len(dependent) >= 3:\n            score -= 8\n            issues.append(_issue(\n                'CLAIM_3_SHOULD_DEPEND_FROM_CLAIM_2',\n                'warning',\n                '3',\n                'claim 3 直接依附 claim 1；需确认是否应与 claim 2 形成组合链。',\n                '若 claim 3 的限定依赖 claim 2 后更有组合保护价值，应将 claim 3 调整为依附 claim 2。',\n            ))\n        if not _has_high_value_axis(claim_by_no.get('3', ''), claim_3_high_value_axis, front_dependent_roles, _claim_slot_strategy_text(claim_slot_plan, ['claim_3', 'front_dependent'])):\n            score -= 8\n            issues.append(_issue(\n                'CLAIM_3_LOW_VALUE_AXIS',\n                'warning',\n                '3',\n                'claim 3 未明显响应领域化第二优先级限定轴、前位从属角色或槽位规划。',\n         \
          \       '将 claim 3 调整为第二优先级高价值限定或与 claim 2 形成组合链；无支撑时必须报告人工补强方向。',\n            ))\n    else:\n        score -= 10\n        issues.append(_issue(\n            'CLAIM_3_MISSING',\n            'warning',\n            '3',\n            '缺少 claim 3，前位从属保护梯度不完整。',\n            '补充 claim 3 承载第二优先级限定或组合链限定；无支撑时必须报告人工补强方向。',\n        ))\n\n    for no in dependent:\n        if no == '1':\n            continue\n        if _overlap_ratio(claim1, claim_by_no.get(no, '')) > 0.72:\n            score -= 8\n            issues.append(_issue(\n                'DEPENDENT_DUPLICATES_CLAIM_1',\n                'warning',\n                no,\n                f'从属项重复 claim 1：权利要求{no}与独权重合度过高，增量技术贡献偏弱。',\n                '重写该从属项，使其增加新的结构、条件、参数、步骤、组分、异常处理或替代实现限定。',\n            ))\n            break\n\n    claims_blob = '\\n'.join(row.get('body', '') for row in claims)\n    support_hits = []\n    support_hits.extend(_guardrail_hits(claims_blob, unsupported_guardrails, code='UNSUPPORTED_GUARDRAIL_HIT',\
          \ severity='blocking'))\n    support_hits.extend(_guardrail_hits(claims_blob, delivery_blockers, code='DELIVERY_BLOCKER_TEXT_HIT', severity='blocking'))\n    support_hits.extend(_guardrail_hits(claims_blob, support_risk_items, code='SUPPORT_RISK_TEXT_HIT', severity='warning'))\n    if support_hits:\n        issues.extend(support_hits[:6])\n        blocking_support_hits = sum(1 for item in support_hits if item.get('severity') == 'blocking')\n        warning_support_hits = len(support_hits) - blocking_support_hits\n        score -= min(35, 16 * blocking_support_hits + 6 * warning_support_hits)\n\n    if functional_hits >= 6:\n        score -= 14\n        issues.append(_issue(\n            'CLAIM_1_FUNCTIONAL_OVERLOAD',\n            'warning',\n            '1',\n            'claim 1 功能/结果性动作偏多，可能未以结构、条件、参数、步骤或对象关系承载保护中心。',\n            '核对 claim 1 是否已写入主发明点、最小必要区别技术特征和核心基础前提。',\n        ))\n    elif functional_hits >= 4:\n        score -= 7\n        issues.append(_issue(\n       \
          \     'CLAIM_1_FUNCTIONAL_RISK',\n            'warning',\n            '1',\n            'claim 1 功能性动作较多，应核对最小必要区别技术特征是否清楚。',\n            '将功能动作回写为有支撑的结构、条件、参数、步骤、组分或对象关系。',\n        ))\n\n    for term in ['目标终端', '目标对象', '外部对象', '待处理对象']:\n        if term in claim1 and claim1.find(term) > 80:\n            score -= 6\n            issues.append(_issue(\n                'UNDEFINED_EXTERNAL_OBJECT',\n                'warning',\n                '1',\n                f'独权中的外部对象“{term}”引入偏晚或连接关系不清，应补足外部对象连接关系。',\n                '补足该对象的首次引入、连接关系或交互边界。',\n            ))\n            break\n\n    if include_formal_checks:\n        issues.extend(_find_antecedent_basis_issues(claims, parents))\n        formal_blocking_count = sum(1 for item in issues if item.get('code') == 'ANTECEDENT_BASIS_MISSING')\n        if formal_blocking_count:\n            score -= min(40, 20 * formal_blocking_count)\n\n    score = max(0, min(100, score))\n    has_blocking = any(item.get('severity') == 'blocking'\
          \ for item in issues)\n    status = 'fail' if has_blocking or score < 70 else ('warning' if issues or score < 85 else 'pass')\n    return {\n        'claim_count': len(claims),\n        'independent_claims': independent,\n        'dependent_claims': dependent,\n        'parents': parents,\n        'all_direct_to_1': all_direct_to_1,\n        'has_multilevel_chain': has_multilevel_chain,\n        'claim1_functional_hits': functional_hits,\n        'issues': issues,\n        'warnings': [_format_issue(item) for item in issues],\n        'instructions': _format_instructions(issues, status),\n        'score': score,\n        'status': status,\n    }\n\n\ndef main(candidate_claims_text: str = '', source_dependent_claims_text: str = '', claim_2_high_value_axis: str = '', claim_3_high_value_axis: str = '', front_dependent_roles: str = '', claim_slot_plan=None, target_claim_count_range: str = '', support_risk_items: str = '', delivery_blockers: str = '', unsupported_guardrails=None) ->\
          \ dict:\n    result = _analyze(candidate_claims_text, source_dependent_claims_text=source_dependent_claims_text, claim_2_high_value_axis=claim_2_high_value_axis, claim_3_high_value_axis=claim_3_high_value_axis, front_dependent_roles=front_dependent_roles, claim_slot_plan=claim_slot_plan, target_claim_count_range=target_claim_count_range, support_risk_items=support_risk_items, delivery_blockers=delivery_blockers, unsupported_guardrails=unsupported_guardrails)\n    dependency_shape = {\n        'parents': result['parents'],\n        'all_direct_to_1': result['all_direct_to_1'],\n        'has_multilevel_chain': result['has_multilevel_chain'],\n        'independent_claims': result['independent_claims'],\n        'dependent_claims': result['dependent_claims'],\n    }\n    instructions = result.get('instructions') or []\n    if result['status'] in ('warning', 'fail') and (not instructions or any('通过结构质量门' in str(x) for x in instructions)):\n        instructions = _format_instructions(result.get('issues')\
          \ or [], result['status'])\n    placeholder_values = [candidate_claims_text, source_dependent_claims_text, claim_2_high_value_axis, claim_3_high_value_axis, front_dependent_roles, target_claim_count_range, support_risk_items, delivery_blockers, json.dumps(claim_slot_plan, ensure_ascii=False) if claim_slot_plan is not None else '', json.dumps(unsupported_guardrails, ensure_ascii=False) if unsupported_guardrails is not None else '']\n    placeholder_guard_status = 'fail' if any(OPEN_SELECTOR_MARKER in str(v) or BROKEN_SELECTOR_MARKER in str(v) or CLOSE_SELECTOR_MARKER in str(v) for v in placeholder_values) else 'pass'\n    slot_codes = ('CLAIM_2_LOW_VALUE_AXIS', 'CLAIM_3_LOW_VALUE_AXIS', 'CLAIM_3_SHOULD_DEPEND_FROM_CLAIM_2', 'NO_MULTI_LEVEL_DEPENDENCY_CHAIN', 'ALL_DEPENDENTS_DIRECT_TO_CLAIM_1')\n    slot_findings = [w for w in result.get('warnings', []) if any(code in str(w) for code in slot_codes)]\n    must_flags = []\n    if result['status'] in ('warning', 'fail'):\n        must_flags.append(f\"\
          candidate quality status is {result['status']}; final rewrite must handle warnings/failures\")\n    if placeholder_guard_status == 'fail':\n        must_flags.append('unresolved variable placeholder detected in candidate quality inputs')\n    if slot_findings:\n        must_flags.append('slot drift or high-value claim 2/3 risk detected')\n    if any(code in str(w) for w in result.get('warnings', []) for code in ('UNSUPPORTED_GUARDRAIL_HIT', 'DELIVERY_BLOCKER_TEXT_HIT', 'SUPPORT_RISK_TEXT_HIT', 'CLAIM_COUNT_OUTSIDE_TARGET_RANGE')):\n        must_flags.append('support boundary, delivery blocker, or claim-count deviation detected; final rewrite must close it')\n    return {\n        'candidate_claim_quality_status': result['status'],\n        'candidate_claim_quality_score': result['score'],\n        'candidate_claim_quality_warnings': json.dumps(result['warnings'], ensure_ascii=False),\n        'candidate_claim_count': result['claim_count'],\n        'candidate_dependency_shape':\
          \ json.dumps(dependency_shape, ensure_ascii=False),\n        'candidate_required_rewrite_instructions': '\\n'.join(f'- {item}' for item in instructions),\n        'candidate_slot_drift_findings': json.dumps(slot_findings, ensure_ascii=False),\n        'candidate_placeholder_guard_status': placeholder_guard_status,\n        'candidate_must_rewrite_flags': '\\n'.join(f'- {item}' for item in must_flags),\n    }\n"
