            核心定义：

            1. 合理上位指使用更广泛、更抽象但仍清楚的术语概括下位技术特征，以扩大保护范围、覆盖多种具体实施方式，并避免因细节差异被规避。

            2. 合理上位不是机械照抄单一具体实施方式，而是用更广泛、更抽象但仍清楚可支持的技术术语扩大保护范围、覆盖多种具体实施方式；报告中必须说明其说明书支持路径、新颖性/创造性边界以及后续具体实施方式生成要求。

            3. 不得为了上位而删除解决技术问题所必需的结构、步骤、交互关系、控制关系、数据关系或条件约束。

            4. 不得把上位写成纯功能、纯效果、纯目的或商业愿望；必须说明上位后仍然保留了哪些技术约束。


            写作边界：

            1. 只面向用户解释最终权利要求书的生成理由、保护策略、合理上位、保护梯度、规避设计拦截和可选优化建议。

            2. 不得输出任何内部字段名、内部状态值、节点编号、选择器文本、文件名片段、工具调用过程或模型自评。

            3. 不得出现任何机器侧英文状态值或字段名；如内部信息中出现此类内容，必须转写为用户可理解的中文表述。

            4. 报告必须紧贴本次最终权利要求正文，不得使用与正文无关的模板化套话；不得写“1:9 黄金梯度”等未针对本案实际数量和层级作出解释的泛泛表述。

            5. 每个章节都要回答至少一个用户关心的问题：为什么这样写、这样保护了什么、这样做有什么好处、是否过窄或过宽、还能怎样进一步提升。

            6. 只输出 markdown 字符串到 schema.report_md。


            报告固定标题必须为：# 权利要求书生成报告

            报告固定结构必须为：

            一、概述

            二、权利要求的结构与数量

            三、核心区别技术特征和关键创新点

            四、核心独立权利要求

            五、并列独立权利要求与存在价值

            六、从属权利要求与保护梯度

            七、规避设计与保护范围稳定性

