          \ except Exception:\n        return [str(start), str(end)]\n    if a <= b and b - a <= 30:\n        return [str(i) for i in range(a, b + 1)]\n    return [str(start), str(end)]\n\n\ndef _extract_parent_refs(body):\n    head = str(body or '')[:180]\n    refs = []\n    for start, end in re.findall(r'权利要求\\s*(\\d+)\\s*(?:至|到|～|-)\\s*(\\d+)', head):\n        refs.extend(_expand_range(start, end))\n    for segment in re.findall(r'权利要求\\s*((?:\\d+\\s*(?:、|,|，|和|或|及)?\\s*){1,8})\\s*所述', head):\n        refs.extend(re.findall(r'\\d+', segment))\n    if not refs:\n        for segment in re.findall(r'(?:根据|如|按照)\\s*权利要求\\s*([^，。；;]{1,80})', head):\n            refs.extend(re.findall(r'\\d+', segment))\n    seen = set()\n    out = []\n    for ref in refs:\n        ref = str(ref).strip()\n        if ref and ref not in seen:\n            seen.add(ref)\n            out.append(ref)\n    return out\n\n\ndef _looks_dependent_claim(body):\n    head = str(body or '')[:80]\n    return bool(re.search(r'^\\\
          s*(?:根据|如|按照)\\s*权利要求', head))\n\n\ndef _contains_any(text, words):\n    return any(word in text for word in words)\n\n\ndef _infer_group_kind(body, claim_type):\n    if claim_type == 'independent':\n        return '独立权利要求', 'final_claim_text'\n\n    text = str(body or '')\n    checks = [\n        ('数量/范围限定', ['数量', '数目', '个数', '比例', '小于', '大于', '少于', '多于', '范围', '阈值', '窗口', '浓度', '温度', '时间', '压力', '粒径', '含量']),\n        ('复用/共享关系', ['复用', '共用', '共享', '重用', '复合承载']),\n        ('状态切换/路径限定', ['切换', '状态', '模式', '路径', '通路', '导通', '连通', '断开', '连接关系']),\n        ('检测反馈/闭环控制', ['检测', '监测', '反馈', '响应', '校准', '补偿', '比对', '判断']),\n        ('异常安全/鲁棒性限定', ['异常', '故障', '回退', '容错', '保护', '安全', '联锁', '失效']),\n        ('材料/组分限定', ['材料', '组分', '配比', '层', '涂层', '合金', '聚合物']),\n        ('实现细节/外部交互限定', ['端子', '引脚', '电平', '端口', '接头', '界面', '触发信号']),\n        ('替代实现/等效结构限定', ['替代', '等效', '可选', '选自', '包括以下之一']),\n    ]\n    labels = []\n    for label, words in checks:\n        if _contains_any(text,\
          \ words):\n            labels.append(label)\n        if len(labels) >= 2:\n            break\n    if labels:\n        return ' + '.join(labels), 'final_claim_text'\n    return 'unknown', 'fallback_unknown'\n\n\ndef main(claims_text: str = '') -> dict:\n    claims = _split_claims(claims_text)\n    dependency_warnings = []\n    semantic_warnings = []\n\n    if not claims:\n        dependency_warnings.append('未能从最终权利要求正文解析出权利要求编号；不再回退套用旧 claim_manifest，请人工核对依附关系。')\n        semantic_warnings.append('未能从最终权利要求正文解析出权利要求编号；无法识别权利要求语义类别。')\n        return {\n            'final_claim_manifest': '[]',\n            'dependency_parse_status': 'fallback',\n            'dependency_parse_warnings': json.dumps(dependency_warnings, ensure_ascii=False),\n            'semantic_label_status': 'fallback',\n            'semantic_label_warnings': json.dumps(semantic_warnings, ensure_ascii=False),\n        }\n\n    final_rows = []\n    claim_nos = {row['claim_no'] for row in claims}\n    for row in claims:\n\
          \        claim_no = row['claim_no']\n        parent_refs = [ref for ref in _extract_parent_refs(row['body']) if ref in claim_nos and ref != claim_no]\n        claim_type = 'dependent' if parent_refs else 'independent'\n        if claim_no != '1' and not parent_refs and _looks_dependent_claim(row['body']):\n            dependency_warnings.append(f'权利要求{claim_no}表述为从属权利要求但未解析到有效依附关系，按独立权利要求处理；请人工核对。')\n        group_kind, group_kind_source = _infer_group_kind(row['body'], claim_type)\n        if group_kind_source != 'final_claim_text':\n            semantic_warnings.append(f'权利要求{claim_no}未能从最终正文可靠识别语义类别，group_kind 标记为 unknown。')\n        final_rows.append({\n            'claim_no': claim_no,\n            'claim_type': claim_type,\n            'group_kind': group_kind,\n            'group_kind_source': group_kind_source,\n            'parent_refs': parent_refs,\n        })\n\n    final_rows = sorted(final_rows, key=lambda item: _sort_key(item.get('claim_no')))\n    dependency_status\
