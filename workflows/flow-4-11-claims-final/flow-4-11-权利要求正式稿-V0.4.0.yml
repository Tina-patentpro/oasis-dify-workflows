    - data:
        code: "import json\nimport re\nfrom typing import Any\n\n\ndef _text(value: Any) -> str:\n    if value is None:\n        return \"\"\n    if isinstance(value, (dict, list)):\n        return json.dumps(value, ensure_ascii=False)\n    return str(value).replace(\"\\r\\n\", \"\\n\").replace(\"\\r\", \"\\n\").strip()\n\n\ndef _items(value: Any) -> list[str]:\n    if value is None:\n        return []\n    if isinstance(value, list):\n        return [str(v).strip() for v in value if str(v).strip()]\n    if isinstance(value, dict):\n        return [f\"{k}：{v}\" for k, v in value.items()]\n    text = _text(value)\n    if not text:\n        return []\n    parts = re.split(r\"[\\n；;]+\", text)\n    return [p.strip(\" -•\\t\") for p in parts if p.strip(\" -•\\t\")]\n\n\ndef _split_claims(claims_text: str) -> list[dict[str, Any]]:\n    text = _text(claims_text)\n    matches = list(re.finditer(r\"(?m)^\\s*(\\d+)[\\.、]\\s*\", text))\n    if not matches:\n        return []\n    claims: list[dict[str,\
          \ Any]] = []\n    for idx, match in enumerate(matches):\n        start = match.start()\n        end = matches[idx + 1].start() if idx + 1 < len(matches) else len(text)\n        number = int(match.group(1))\n        body = text[start:end].strip()\n        is_dependent = bool(re.search(r\"根据权利要求\\s*\\d+|如权利要求\\s*\\d+|权利要求\\s*\\d+\\s*所述\", body))\n        claims.append({\"number\": number, \"text\": body, \"is_dependent\": is_dependent})\n    return claims\n\n\ndef _join_section(title: str, items: list[str], fallback: str) -> str:\n    clean = [str(x).strip() for x in items if str(x).strip()]\n    if not clean:\n        clean = [fallback]\n    return title + \"\\n\" + \"\\n\".join(f\"- {x}\" for x in clean)\n\n\ndef _claim_summary(claims: list[dict[str, Any]]) -> str:\n    if not claims:\n        return \"未能从终稿中稳定解析权利要求编号，报告应提示用户以权利要求正文为准复核结构。\"\n    independent = [c for c in claims if not c[\"is_dependent\"]]\n    dependent = [c for c in claims if c[\"is_dependent\"]]\n    return\
          \ f\"终稿共解析到 {len(claims)} 项权利要求，其中独立权利要求约 {len(independent)} 项，从属权利要求约 {len(dependent)} 项；报告应围绕实际正文解释上位、下位和保护梯度。\"\n\n\ndef _generalization_observations(\n    claims: list[dict[str, Any]],\n    claim_1_generalization_boundary: str,\n    reasonable_generalization_plan: str,\n    reasonable_generalization_basis: str,\n    novelty_creativity_risk_notes: str,\n) -> str:\n    claim1 = next((c[\"text\"] for c in claims if c[\"number\"] == 1), \"\")\n    items: list[str] = []\n    if claim_1_generalization_boundary:\n        items.append(\"独权上位边界：\" + claim_1_generalization_boundary[:500])\n    if reasonable_generalization_plan:\n        items.append(\"合理上位规划：\" + reasonable_generalization_plan[:500])\n    if reasonable_generalization_basis:\n        items.append(\"合理上位依据：\" + reasonable_generalization_basis[:500])\n    if novelty_creativity_risk_notes:\n        items.append(\"新颖性/创造性边界提示：\" + novelty_creativity_risk_notes[:500])\n    if claim1:\n        lower_level_patterns = [\n   \
          \         r\"(?:型号|牌号|批号|版本|规格|编号)[^，。；;\\n]{0,24}\",\n            r\"(?:唯一|特定|固定|预设)[^，。；;\\n]{0,24}\",\n            r\"\\d+(?:\\.\\d+)?\\s*(?:毫米|厘米|米|微米|纳米|克|千克|毫克|升|毫升|摩尔|摄氏度|伏|安|欧|赫兹|秒|分钟|小时|%|％)\",\n            r\"(?:具体为|优选为|限定为)[^，。；;\\n]{1,36}\",\n        ]\n        broad_tokens = [\"用于\", \"以便\", \"实现\", \"提高\", \"降低\", \"优化\", \"增强\", \"减少\", \"避免\", \"满足\", \"适配\", \"复用\"]\n        carrier_pattern = (\n            r\"连接|耦合|生成|获取|确定|控制|比较|转换|发送|接收|配置|调节|\"\n            r\"反应|混合|固化|培养|检测|训练|计算|匹配|过滤|分离|支撑|固定|密封|\"\n            r\"导向|传递|形成|沉积|发酵|提取|识别|定位|包覆|释放|测量|排序|编码|解码\"\n        )\n        if any(re.search(pattern, claim1) for pattern in lower_level_patterns):\n            items.append(\"claim 1 中存在可能偏下位的具体化表达，报告应判断是否可上位为更广泛、更抽象但仍清楚的技术术语，并将具体表达下沉为从属限定或说明书实施例。\")\n        if any(t in claim1 for t in broad_tokens) and not re.search(carrier_pattern, claim1):\n            items.append(\"claim 1 中存在可能偏功能化或效果化的表达，报告应确认是否保留了足够结构、步骤、交互关系、控制关系、材料/组分关系、工艺条件或数据关系。\")\n    items.append(\"\
          合理上位应扩大保护范围、覆盖多种具体实施方式，同时保留解决相同技术问题并取得相同或相近效果的必要技术关系。\")\n    items.append(\"合理上位后的权利要求应指导后续说明书中具体实施方式生成，尤其是上位术语对应的下位示例、替代实现和优选例。\")\n    return \"\\n\".join(f\"- {x}\" for x in items)\n\n\ndef _parent_refs_from_text(text: str) -> list[str]:\n    refs: list[str] = []\n    for raw in re.findall(r\"(?:根据|如)?权利要求\\s*([0-9０-９一二三四五六七八九十、,\\-至到和及~～\\s]+)\", text):\n        nums = [int(x) for x in re.findall(r\"\\d+\", raw)]\n        if \"至\" in raw or \"到\" in raw or \"-\" in raw or \"~\" in raw or \"～\" in raw:\n            if len(nums) >= 2:\n                start, end = nums[0], nums[1]\n                if start <= end and end - start <= 80:\n                    refs.extend(str(i) for i in range(start, end + 1))\n                    continue\n        refs.extend(str(n) for n in nums)\n    seen: list[str] = []\n    for ref in refs:\n        if ref not in seen:\n            seen.append(ref)\n    return seen\n\n\ndef _claim_type_grounding_table(claims: list[dict[str, Any]]) -> str:\n\
          \    lines = [\n        \"权利要求类型事实表：报告必须以最终正文和依附关系为准，不得只根据主题名称或保护意图判断权利要求类型。\",\n        \"| 权利要求 | 正文事实 | 报告中允许的称谓 | 禁止称谓 |\",\n        \"|---|---|---|---|\",\n    ]\n    if not claims:\n        lines.append(\"| 未解析 | 未能稳定解析最终权利要求编号 | 提示用户以正文复核 | 不得臆称独权 |\")\n        return \"\\n\".join(lines)\n    for claim in claims:\n        no = str(claim[\"number\"])\n        text = claim[\"text\"]\n        refs = _parent_refs_from_text(text)\n        is_system = \"系统\" in text[:80]\n        if refs:\n            allowed = \"引用型系统保护项\" if is_system else \"从属权利要求\"\n            fact = \"引用其他权利要求：\" + \"、\".join(refs[:12])\n            banned = \"独立权利要求、并列独立权利要求、系统独立权利要求\"\n        else:\n            allowed = \"独立权利要求\"\n            fact = \"未引用其他权利要求\"\n            banned = \"从属权利要求\"\n        lines.append(f\"| {no} | {fact} | {allowed} | {banned} |\")\n    lines.append(\"硬规则：只要引用其他权利要求，即不得称为独立权利要求；若系统项引用产品权利要求，应称为引用型系统保护项或系统应用型保护项。\")\n    return \"\\n\".join(lines)\n\n\ndef _subject_type_clarity(claims:\
          \ list[dict[str, Any]]) -> str:\n    first = claims[0][\"text\"] if claims else \"\"\n    topic = \"未能解析\"\n    if \"方法\" in first[:80]:\n        topic = \"方法类\"\n    elif \"系统\" in first[:80]:\n        topic = \"系统类\"\n    elif \"装置\" in first[:80] or \"设备\" in first[:80]:\n        topic = \"装置/设备类\"\n    elif \"组合物\" in first[:80] or \"材料\" in first[:80]:\n        topic = \"组合物/材料类\"\n    elif \"产品\" in first[:80] or \"制品\" in first[:80] or \"设备\" in first[:80] or \"装置\" in first[:80] or \"一种\" in first[:20]:\n        topic = \"产品类\"\n    return (\n        \"限定的发明主题类型是否明确：核心独立权利要求初步判断为\"\n        + topic\n        + \"权利要求。若产品项中出现控制、发送、接收、调整、遍历等动作，应解释为对部件功能配置或工作能力的限定，而不是把产品项误写成方法步骤。报告还必须说明引用型系统项与真正系统独立权利要求的区别。\"\n    )\n\n\ndef _extract_key_terms(claims: list[dict[str, Any]]) -> list[str]:\n    text = \"\\n\".join(_text(c.get(\"text\", \"\")) for c in claims if isinstance(c, dict))\n    terms: list[str] = []\n\n    def add(term: str):\n        clean = str(term or \"\").strip(\"\
          \ ：:，,。；;、()（）[]【】\")\n        if 2 <= len(clean) <= 30 and clean not in terms:\n            terms.append(clean)\n\n    for match in re.findall(r\"所述([\\u4e00-\\u9fffA-Za-z0-9]{2,30})\", text):\n        add(match)\n    for match in re.findall(r\"一种([\\u4e00-\\u9fffA-Za-z0-9]{2,30}?)(?:，|,|。|；|;|包括|包含|其特征)\", text):\n        add(match)\n    for match in re.findall(r\"([\\u4e00-\\u9fffA-Za-z0-9]{2,30}(?:模块|单元|部件|组件|机构|装置|系统|方法|步骤|材料|组合物|参数|阈值|条件|序列|模型|网络|通道|层|膜|涂层))\", text):\n        add(match)\n    return terms[:8]\n\n\ndef _feature_meaning_clarity(claims: list[dict[str, Any]]) -> str:\n    terms = _extract_key_terms(claims)\n    if terms:\n        term_text = \"、\".join(terms)\n        return (\n            \"技术特征含义是否能够合理确定：报告应围绕最终权利要求中的关键术语（\"\n            + term_text\n            + \"）解释其技术含义，并说明这些术语可如何通过下位实施方式、替代结构、参数范围、流程步骤、组分/材料、控制逻辑或数据关系在后续说明书中展开。若存在偏目标、效果或结果的表达，应确认其是否由具体技术载体承接，避免黑盒化或纯功能化。\"\n        )\n    return (\n        \"技术特征含义是否能够合理确定：报告应围绕最终权利要求中的关键上位术语、关键结构或步骤限定、关键参数或条件限定、关键交互关系或控制关系进行解释；若无法稳定抽取具体术语，应提示后续说明书围绕这些技术限定补充下位实施方式和替代实现。\"\
          \n    )\n\n\ndef _feature_consistency(claims: list[dict[str, Any]]) -> str:\n    dependent_refs = []\n    for claim in claims:\n        refs = _parent_refs_from_text(claim[\"text\"])\n        if refs:\n            dependent_refs.append(f\"权{claim['number']}依附/引用{','.join(refs[:8])}\")\n    dep_text = \"；\".join(dependent_refs[:8]) if dependent_refs else \"未解析到从属依附关系\"\n    return (\n        \"技术特征之间是否存在明显矛盾且无法合理解释：报告应检查独权内部结构关系、从属项与依附基础、上位概括与下位限定、条件性限定之间是否冲突。\"\n        + dep_text\n        + \"。若某限定只在特定条件下触发，应说明触发条件，避免被理解为与常态功能矛盾。\"\n    )\n\n\ndef _reasonable_generalization_report_basis_text(\n    upper_lower_term_mapping: str,\n    specification_embodiment_guidance: str,\n    novelty_creativity_boundary_notes: str,\n) -> str:\n    return _join_section(\n        \"合理上位报告依据：\",\n        [\n            \"说明书支持：上位术语必须由后续说明书通过多个下位实施方式、替代方案、参数范围、结构关系、流程步骤或控制逻辑形成支撑；交底未逐字记载但基于交底技术方案合理扩展的内容，应在报告中标明后续说明书展开责任。\",\n            \"新颖性/创造性边界：合理上位不得宽泛到覆盖明显现有技术；报告应说明哪些区别技术特征维持新颖性和创造性，哪些从属限定提供退守。\"\
          ,\n            \"相同技术问题：上位特征覆盖的各下位实施方式应服务于同一核心技术问题，不能把技术作用不同的方案混入同一上位概念。\",\n            \"相同或相近效果：下位实施方式应取得相同或相近技术效果；若效果差异过大，应提示收束为从属限定或说明书可选例。\",\n            \"上位特征到下位实施方式：\" + (_text(upper_lower_term_mapping)[:700] if _text(upper_lower_term_mapping) else \"报告应列出上位术语、下位示例、上位目的和说明书具体实施方式生成要求。\"),\n            \"说明书生成指导：\" + (_text(specification_embodiment_guidance)[:700] if _text(specification_embodiment_guidance) else \"后续说明书应围绕每个上位术语展开至少一个下位实施例、替代实现或优选例。\"),\n            \"边界提示：\" + (_text(novelty_creativity_boundary_notes)[:700] if _text(novelty_creativity_boundary_notes) else \"报告应提示新颖性、创造性、清楚性和支持风险。\"),\n        ],\n        \"报告必须完整解释合理上位的依据、边界和后续说明书承接要求。\",\n    )\n\n\ndef main(\n    claims_text: str = \"\",\n    final_claim_manifest: str = \"\",\n    tree_text: str = \"\",\n    claim_2_high_value_axis: str = \"\",\n    claim_3_high_value_axis: str = \"\",\n    front_dependent_roles: str = \"\",\n    claim_slot_plan: list[dict[str, Any]] | None = None,\n    slot_closure_status:\
          \ str = \"\",\n    slot_closure_report: str = \"\",\n    slot_drift_findings: str = \"\",\n    unclosed_items: str = \"\",\n    placeholder_guard_status: str = \"\",\n    terminal_revision_context: str = \"\",\n    support_closure_warnings: str = \"\",\n    target_claim_count_range: str = \"\",\n    support_risk_items: str = \"\",\n    delivery_blockers: str = \"\",\n    unsupported_guardrails: list[str] | None = None,\n    reasonable_generalization_status: str = \"\",\n    generalization_closure_report: str = \"\",\n    scope_stability_notes: str = \"\",\n    claim_value_to_improvement_notes: str = \"\",\n    reasonable_generalization_plan: str = \"\",\n    claim_1_generalization_boundary: str = \"\",\n    reasonable_generalization_basis: str = \"\",\n    upper_lower_mapping: str = \"\",\n    specification_generation_requirements: str = \"\",\n    novelty_creativity_risk_notes: str = \"\",\n    upper_term_strategy: str = \"\",\n    lower_term_examples: str = \"\",\n    specification_embodiment_guidance_from_11:\
          \ str = \"\",\n    novelty_creativity_boundary: str = \"\",\n    upper_lower_term_mapping_from_24b: str = \"\",\n    specification_embodiment_guidance_from_24b: str = \"\",\n    novelty_creativity_boundary_notes_from_24b: str = \"\",\n    claim_to_specification_expansion_table_from_24b: str = \"\",\n) -> dict[str, Any]:\n    claims = _split_claims(claims_text)\n    structure_summary = _claim_summary(claims)\n\n    claim_type_grounding_table = _claim_type_grounding_table(claims)\n    subject_type_clarity_observation = _subject_type_clarity(claims)\n    feature_meaning_clarity_observation = _feature_meaning_clarity(claims)\n    feature_consistency_observation = _feature_consistency(claims)\n\n    slot_items = _items(claim_slot_plan or [])\n    claim_strategy_observations = _join_section(\n        \"权利要求结构与保护策略观察：\",\n        [\n            structure_summary,\n            _text(tree_text),\n            _text(final_claim_manifest),\n            \"权利要求2高价值方向：\" + _text(claim_2_high_value_axis)\
          \ if _text(claim_2_high_value_axis) else \"\",\n            \"权利要求3高价值方向：\" + _text(claim_3_high_value_axis) if _text(claim_3_high_value_axis) else \"\",\n            \"前位从属角色：\" + _text(front_dependent_roles) if _text(front_dependent_roles) else \"\",\n        ],\n        \"应以最终权利要求正文为准解释独权、并列独权和从属权利要求的保护分工。\",\n    )\n\n    reasonable_generalization_observations = _generalization_observations(\n        claims,\n        _text(claim_1_generalization_boundary),\n        _text(reasonable_generalization_plan),\n        _text(reasonable_generalization_basis),\n        _text(novelty_creativity_risk_notes),\n    )\n\n    upper_lower_term_mapping = _join_section(\n        \"上位术语与下位示例映射：\",\n        _items(upper_lower_mapping) + _items(upper_lower_term_mapping_from_24b) + _items(lower_term_examples) + _items(upper_term_strategy),\n        \"报告应列明每个上位特征对应的下位示例、替代结构、参数范围、材料/组分、算法/流程或控制逻辑。\",\n    )\n    specification_embodiment_guidance = _join_section(\n        \"说明书具体实施方式生成指导：\",\n   \
          \     _items(specification_generation_requirements)\n        + _items(specification_embodiment_guidance_from_11)\n        + _items(specification_embodiment_guidance_from_24b),\n        \"后续说明书应围绕上位特征生成多个具体实施方式、变形例、优选例和可替代实现，以支持权利要求保护范围。\",\n    )\n    novelty_creativity_boundary_notes = _join_section(\n        \"新颖性/创造性与上位边界提示：\",\n        _items(novelty_creativity_risk_notes) + _items(novelty_creativity_boundary) + _items(novelty_creativity_boundary_notes_from_24b),\n        \"上位概括应避免覆盖明显现有技术，并保留区别技术特征对新颖性和创造性的支撑。\",\n    )\n    claim_to_specification_expansion_table = _join_section(\n        \"权利要求到说明书展开表：\",\n        _items(claim_to_specification_expansion_table_from_24b)\n        + [\n            \"claim 1：说明书应展开其上位术语的多个下位实施方式，证明其可解决相同技术问题并取得相同或相近效果。\",\n            \"claim 2/3：说明书应作为优选例或关键变形例展开其高价值下位限定。\",\n            \"中后位从属：说明书应展开参数范围、替代结构、流程细节、材料/组分或控制策略，以形成退守支撑。\",\n        ],\n        \"报告应说明每类权利要求如何反向指导说明书具体实施方式生成。\",\n    )\n    generalization_improvement_items = _join_section(\n\
          \        \"可继续上位或需收束的事项：\",\n        _items(generalization_closure_report) + _items(scope_stability_notes) + _items(slot_closure_report) + _items(slot_drift_findings) + _items(unclosed_items),\n        \"如 claim 1 含非必要细节，建议评估是否下沉至从属权利要求；如 claim 1 过虚，建议补回必要技术关系。\",\n    )\n    inventor_confirmation_items = _join_section(\n        \"需要用户确认的保护方向：\",\n        _items(support_risk_items) + _items(unsupported_guardrails or []) + _items(support_closure_warnings),\n        \"建议用户确认希望重点覆盖的替代实现、商业化版本、关键参数范围或竞争对手规避方向。\",\n    )\n    design_around_observations = _join_section(\n        \"规避设计观察：\",\n        _items(scope_stability_notes)\n        + [\"报告应说明竞争对手可能通过替换具体部件、参数、步骤顺序、控制策略、材料/组分关系、工艺条件或数据关系进行规避，以及当前权利要求如何通过合理上位和从属梯度降低该风险。\"],\n        \"报告应围绕最终权利要求正文分析可能规避路径。\",\n    )\n    claim_value_explanations = _join_section(\n        \"权利要求价值解释素材：\",\n        slot_items + _items(claim_value_to_improvement_notes),\n        \"报告应逐项解释每类权利要求的保护价值，而不是只描述生成过程。\",\n    )\n\n    reasonable_generalization_report_basis\
          \ = _reasonable_generalization_report_basis_text(\n        upper_lower_term_mapping,\n        specification_embodiment_guidance,\n        novelty_creativity_boundary_notes,\n    )\n\n    report_priority_items = _join_section(\n        \"报告优先说明事项：\",\n        [\n            \"优先解释 claim 1 的合理上位边界、必要技术特征和说明书具体实施方式生成要求。\",\n            \"优先解释 claim 2/3 是否承接高价值下位限定。\",\n            \"优先解释从属权利要求如何提供退守保护和说明书实施例索引。\",\n            \"避免展示任何内部状态值、字段名或工作流过程。\",\n        ],\n        \"报告应面向用户说明生成理由、保护价值和可选优化方向。\",\n    )\n\n    structure_json = {\n        \"claim_count\": len(claims),\n        \"independent_claim_count\": len([c for c in claims if not c[\"is_dependent\"]]),\n        \"dependent_claim_count\": len([c for c in claims if c[\"is_dependent\"]]),\n        \"reasonable_generalization_status\": _text(reasonable_generalization_status) or \"以报告解释为准\",\n    }\n\n    return {\n        \"claim_strategy_observations\": claim_strategy_observations,\n        \"claim_type_grounding_table\"\
          : claim_type_grounding_table,\n        \"subject_type_clarity_observation\": subject_type_clarity_observation,\n        \"feature_meaning_clarity_observation\": feature_meaning_clarity_observation,\n        \"feature_consistency_observation\": feature_consistency_observation,\n        \"reasonable_generalization_report_basis\": reasonable_generalization_report_basis,\n        \"reasonable_generalization_observations\": reasonable_generalization_observations,\n        \"generalization_improvement_items\": generalization_improvement_items,\n        \"inventor_confirmation_items\": inventor_confirmation_items,\n        \"design_around_observations\": design_around_observations,\n        \"claim_value_explanations\": claim_value_explanations,\n        \"report_priority_items\": report_priority_items,\n        \"upper_lower_term_mapping\": upper_lower_term_mapping,\n        \"specification_embodiment_guidance\": specification_embodiment_guidance,\n        \"novelty_creativity_boundary_notes\"\
          : novelty_creativity_boundary_notes,\n        \"claim_to_specification_expansion_table\": claim_to_specification_expansion_table,\n        \"final_claim_structure_json\": json.dumps(structure_json, ensure_ascii=False),\n    }\n"
