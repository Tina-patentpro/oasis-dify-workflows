            请输出非绑定结构策略；claim_manifest 仅作 provisional 兼容提示，不能作为最终结构锁定。


            请额外输出：

            claim_strategy_packet：统一策略包，合并 claim 1 边界、claim 1 禁止内容、claim 2/3 高价值轴、前/中/后位从属角色、支撑风险和下游阻断指令。

            strategy_closure_checklist：终稿必须逐项闭合的检查清单。

            required_dependency_edges：必须保留或优先形成的依附关系，例如 claim 3 是否应依附 claim 2。

            forbidden_slot_drift：禁止出现的槽位漂移。

            delivery_blockers：若未闭合则不得直接交付的阻断事项。

            不得输出任何 未解析变量占位符文本 占位符。


            【0.2.1 合理上位与说明书生成规则】

            1. 合理上位，是在理解发明核心、共同技术特征和可替代实现的基础上，使用更广泛、更抽象但仍清楚、可实施、可由后续说明书支持的技术术语描述权利要求特征，以扩大保护范围、覆盖多种具体实施方式，并避免因细节差异被规避。

            2. 合理上位不是机械照抄单一具体实施方式，也不是脱离技术事实任意扩张；它必须保留解决相同技术问题、实现相同或相近效果所必需的结构、步骤、交互关系、控制关系、数据关系或条件约束。

            3. 合理上位必须同时检查说明书支持、新颖性、创造性、清楚性和保护范围稳定性：不得过度宽泛到边界不清，不得覆盖明显现有技术，不得削弱区别技术特征对新颖性和创造性的支撑。

            4. 上位后的权利要求书需要反向指导说明书中具体实施方式生成：每个上位术语均应提示至少一种或多种下位示例、替代结构、参数范围、材料/组分、算法/流程、控制逻辑或应用场景，以便后续说明书围绕上位和下位关系展开。

            5. claim 1 应承载必要且足够的上位技术组合；claim 2/3 应承载高价值下位限定；中后位从属应形成下位实施方式、变形例、优选例和退守保护梯度。

            6. 不得为了上位而删除必要技术关系；如 claim 1 过窄，应下沉非必要细节并保留上位表达；如 claim 1 过虚，应补回必要技术关系；如上位概括可能影响新颖性或创造性，应提示需要以从属限定或说明书实施例增强稳定性。



            还必须输出：

            upper_term_strategy：列明哪些术语采用更广泛、更抽象的上位表达及其扩大保护范围的目的。

            lower_term_examples：列明每个上位术语对应的下位示例、替代结构、参数范围、材料/组分、算法/流程或控制逻辑。

            specification_embodiment_guidance：说明上位后的权利要求书应如何指导后续说明书中具体实施方式生成。

            novelty_creativity_boundary：说明上位概括应如何避免覆盖现有技术并保留新颖性/创造性支撑。

