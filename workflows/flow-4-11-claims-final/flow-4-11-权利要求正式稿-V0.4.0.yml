        - id: v020-report-user
          role: user
          text: '请基于下列材料生成面向用户的《权利要求书生成报告》。必须使用固定结构，不得新增“流程说明”“节点说明”“质量门说明”等章节。


            # 权利要求书生成报告


            ## 一、概述

            说明本次权利要求书围绕什么技术方案建立保护，为什么采用当前独权/从权布局，以及该布局对用户后续申请、维权或商业化保护有什么实际价值。必须结合最终权利要求正文，不得泛泛评价。


            ## 二、权利要求的结构与数量

            说明本次权利要求书包含哪些独立权利要求、哪些从属权利要求、依附层级如何展开。必须解释“为什么这样分布”，例如是否为了覆盖核心方案、高价值具体限定、替代实现、参数/结构/流程退守层级或规避设计拦截。不得使用固定比例套话。


            ## 三、核心区别技术特征和关键创新点

            从最终权利要求中提炼真正支撑保护价值的区别技术特征，并说明这些特征为什么重要、与技术效果之间的关系是什么。不得新增权利要求正文中不存在的技术特征。


            ## 四、核心独立权利要求

            分析核心独立权利要求的保护中心、必要技术特征和合理上位边界：为什么这些特征放入独权，哪些具体限定被下沉给从属权利要求，这样安排如何兼顾保护范围宽度和稳定性。必须说明合理上位如何使用更广泛、更抽象的表达扩大保护范围、覆盖多种具体实施方式，同时如何指导后续说明书中具体实施方式生成。不得为了上位而省略必要技术关系。


            ## 五、并列独立权利要求与存在价值

            如存在真正并列独立权利要求，说明其保护对象、与核心独权的差异、为什么有单独存在价值、能够覆盖哪些不同实施或侵权场景。如不存在，说明基于当前权利要求布局为何暂不设置。若某系统项或场景项引用其他权利要求，必须称为引用型系统保护项或系统应用型保护项，不得称为系统独立权利要求或并列独立权利要求。


            ## 六、从属权利要求与保护梯度

            逐层解释从属权利要求如何围绕核心独权形成保护梯度：前位从属承载哪些高价值限定，中位从属如何补强可实施路径，后位从属如何形成退守或商业化细节保护。第六节必须实质包含权利要求编号或编号范围、保护价值、进一步优化方向；可以采用表格或清晰分项，表头不要求逐字固定。


            ## 七、规避设计与保护范围稳定性

            分析竞争对手可能采取的规避方向，以及当前权利要求如何通过合理上位、必要技术特征、从属梯度、并列保护或限定组合降低规避风险。指出是否存在可继续上位的过窄特征，或需要补回技术约束的过虚表达。必须加入“审查稳定性说明”，分别回应：限定的发明主题类型是否明确；技术特征含义是否能够合理确定；技术特征之间是否存在明显矛盾且无法合理解释。必须结合本次权利要求正文分析，不得只列标题。


            ## 八、需要在说明书中补强的技术限定


            本节必须专门说明：为使权利要求中经过合理上位、下沉承接或策略性扩展的技术限定获得充分支撑，后续说明书应围绕哪些内容补充具体实施方式。必须包含下列表格，且至少锚定一个具体权利要求编号；若没有补强项，应说明“未识别出需要额外补强的技术限定”并给出依据。


            | 权利要求 | 需补强的技术限定 | 当前定位 | 说明书补强方向 | 补强目的 |

