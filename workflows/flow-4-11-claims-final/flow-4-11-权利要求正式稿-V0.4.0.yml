            九、可选优化项


            报告第六节必须实质包含权利要求编号或编号范围、保护价值、进一步优化方向；可以采用表格或清晰分项，表头不要求逐字固定。建议表头为：

            | 权利要求 | 主要限定 | 保护价值 | 是否存在进一步合理上位空间 | 进一步优化方向 |


            【0.2.1 合理上位与说明书生成规则】

            1. 合理上位，是在理解发明核心、共同技术特征和可替代实现的基础上，使用更广泛、更抽象但仍清楚、可实施、可由后续说明书支持的技术术语描述权利要求特征，以扩大保护范围、覆盖多种具体实施方式，并避免因细节差异被规避。

            2. 合理上位不是机械照抄单一具体实施方式，也不是脱离技术事实任意扩张；它必须保留解决相同技术问题、实现相同或相近效果所必需的结构、步骤、交互关系、控制关系、数据关系或条件约束。

            3. 合理上位必须同时检查说明书支持、新颖性、创造性、清楚性和保护范围稳定性：不得过度宽泛到边界不清，不得覆盖明显现有技术，不得削弱区别技术特征对新颖性和创造性的支撑。

            4. 上位后的权利要求书需要反向指导说明书中具体实施方式生成：每个上位术语均应提示至少一种或多种下位示例、替代结构、参数范围、材料/组分、算法/流程、控制逻辑或应用场景，以便后续说明书围绕上位和下位关系展开。

            5. claim 1 应承载必要且足够的上位技术组合；claim 2/3 应承载高价值下位限定；中后位从属应形成下位实施方式、变形例、优选例和退守保护梯度。

            6. 不得为了上位而删除必要技术关系；如 claim 1 过窄，应下沉非必要细节并保留上位表达；如 claim 1 过虚，应补回必要技术关系；如上位概括可能影响新颖性或创造性，应提示需要以从属限定或说明书实施例增强稳定性。



            报告还必须说明：权利要求负责确定保护边界，合理上位负责扩大保护范围，从属权利要求负责形成下位梯度，后续说明书负责围绕上位和下位关系生成足够具体的实施方式。



            【0.2.1 报告事实优先硬规则】

            1. 报告必须以最终权利要求正文、终稿依附解析和依赖树为事实基础；不得为了策略表达而改变权利要求类型。

            2. 只要引用其他权利要求，即不得称为独立权利要求、并列独立权利要求或系统独立权利要求；系统项引用其他权利要求时，应称为引用型系统保护项或系统应用型保护项。

            3. 第五节在不存在真正并列独立权利要求时，仍保留标题，但必须说明“本次未设置真正并列独立权利要求”，并解释引用型系统保护项的价值。

            4. 第七节必须包含“审查稳定性说明”，并分别回应：限定的发明主题类型是否明确、技术特征含义是否能够合理确定、技术特征之间是否存在明显矛盾且无法合理解释。

            5. 第八节必须专门列出需要在说明书中补强的技术限定，并锚定具体权利要求编号；第九节再提出可选优化项。

            6. 严格保持九个二级章节；不得输出第十个二级标题；说明书补强内容必须作为第八节，其他优化建议放入第九节。


            【0.3.1 报告专业性补充规则】

            1. 报告必须说明 claim 2 / claim 3 是否真正具备技术载体；不得把功能/效果性表述误称为结构限定或高价值结构特征。

            2. 第八节必须完整承接终稿中所有说明书补强项、功能/效果性残余项和发明人确认项；每一项必须锚定具体权利要求编号。

            3. 如前位从属只选择了高价值方向但技术载体不足，报告应明确说明“方向正确但需说明书补强/进一步技术化”，不得宣称已经充分闭合。

            4. 引用其他权利要求的方法、系统或应用项，不得称为真正并列独立权利要求。

