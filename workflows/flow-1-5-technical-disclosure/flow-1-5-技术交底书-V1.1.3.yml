            # Node-1-5-12 输入证据分层


            > 版本：1.0.0 Prompt Upgrade


            ## 任务边界


            在原有中文证据分层基础上，额外输出主构件与候选/参考构件边界，供第7节和最终成文节点稳定判断哪些构件可以进入正文。


            ## 当前输入


            综合资料正文（Markdown）：{{#1745495528138.output#}}


            ## 生成目标


            - 保留 0.2.9 的证据治理能力。

            - 为第7.2节提供主构件准入边界。

            - 避免旧技术构件、候选构件和参考构件混入主披露正文。


            ## 输出要求


            - 最终答案必须是严格符合 structured_output schema 的单个 JSON 对象。

            - 只允许输出字段：`disclosure_fact_base`、`engineering_constraints_and_validation`、`numeric_claim_status_basis`、`report_gap_materials`、`candidate_only_materials`、`forbidden_materials`、`main_disclosure_component_items`、`candidate_or_reference_component_items`、`input_completeness_diagnostics`。

            - `main_disclosure_component_items` 与 `candidate_or_reference_component_items` 必须是对象数组，每项固定字段为：`component_name`、`component_role_scope`、`is_main_invention_component`。


            ## Rules


            - 只有输入中已被描述为当前发明核心构件、并与主技术方案直接对应的部件，才能进入 `main_disclosure_component_items`。

            - 凡属于旧技术构件、候选方案构件、对比对象构件、参考构件或正文未吸收构件，一律进入 `candidate_or_reference_component_items`。

            - `main_disclosure_component_items` 中每项 `is_main_invention_component` 必须为 true；`candidate_or_reference_component_items` 中必须为 false。

            - 不得新增输入中不存在的构件、作用或层级。


            ## Workflow


            1. 先完成原有 6 个证据分层字段。

            2. 再从方案事实层、图示线索和对象关系中识别主构件。

            3. 最后把旧技术/候选/参考构件隔离到候选或参考构件数组。


            ## 最终自检


            - 是否保留了原 6 字段、新增 2 个构件数组字段，并输出 input_completeness_diagnostics。

            - 是否主构件与候选/参考构件没有混淆。

            - 是否没有创造新构件。


            ## Basic-1.1.3 输入完整性诊断（强制）


            - 必须输出 `input_completeness_diagnostics`。

            - 若权利要求文本出现“包括以下步骤：”但后续没有实质步骤，应诊断为空壳独立权利要求，并标为高优先级缺口。

            - 若综合资料中存在用户直接输入事实（例如搅拌器对比、离心、上清液、沉淀物），不得被摘要覆盖或丢弃。

            - 若附图或附图说明缺失，应诊断为“附图待补/可推导但待确认”，不得视为已明确事实。


            ## Basic-1.1.3 字段合同一致性（强制）


            - 当前 structured_output 共 9 个字段，必须包含 `input_completeness_diagnostics`。

            - 输出字段数量、字段名和 required 列表必须以当前 structured_output schema 为准。

            - 不得因历史提示词口径遗漏输入完整性诊断字段。

            '
