    - data:
        code: "import re\n\nFORBIDDEN_TERMS = (\n    \"top 3\",\n    \"trl\",\n    \"tt-\",\n    \"三元超系统\",\n    \"core fault chain\",\n    \"fault chain\",\n)\n\nALLOWED_ASCII_TOKENS = (\n    \"HIL\",\n    \"EMC\",\n    \"PCT\",\n    \"IPC\",\n    \"CP\",\n    \"SC\",\n    \"MCU\",\n    \"GPIO\",\n    \"RS\",\n)\n\ndef text_or_empty(value):\n    if value is None:\n        return \"\"\n    return str(value).strip()\n\nSOURCE_REPLACEMENTS = (\n    (\"node 1 5 14 任务要求\", \"完善建议生成规则\"),\n    (\"node 1 5 14\", \"完善建议生成规则\"),\n    (\"report gap materials\", \"输入资料缺口诊断\"),\n    (\"report gap source\", \"补料诊断依据\"),\n    (\"gap materials\", \"输入资料缺口诊断\"),\n    (\"input missing items\", \"输入完全缺失项\"),\n    (\"critical gap items ranked\", \"高优先级缺口清单\"),\n    (\"source bucket\", \"来源类别\"),\n    (\"medium\", \"中\"),\n    (\"low\", \"低\"),\n    (\"report signal\", \"报告信号\"),\n    (\"summary pack\", \"摘要素材包\"),\n    (\"evidence source\", \"证据来源\"),\n    (\"evidence\", \"证据\"),\n    (\"input package\", \"输入材料\"),\n    (\"input\", \"输入\"),\n    (\"source\", \"来源\"),\n    (\"main body\", \"正文\"),\n    (\"body\", \"正文\"),\n    (\"draft disclosure\", \"交底书草稿\"),\n    (\"draft\", \"草稿\"),\n    (\"section\", \"第\"),\n    (\"node output\", \"节点输出\"),\n    (\"output\", \"输出\"),\n    (\"report\", \"报告\"),\n    (\"table\", \"表格\"),\n    (\"cross-check\", \"交叉核对\"),\n    (\"cross check\", \"交叉核对\"),\n    (\"comparison\", \"比对\"),\n)\n\ndef normalize_items(items):\n    if not items:\n        return []\n    return [item for item in items if isinstance(item, dict)]\n\ndef strip_allowed_ascii_tokens(text):\n    cleaned = text_or_empty(text)\n    for token in ALLOWED_ASCII_TOKENS:\n        cleaned = re.sub(rf\"\\b{re.escape(token)}\\b\", \"\", cleaned, flags=re.IGNORECASE)\n    cleaned = re.sub(r\"S\\d+\", \"\", cleaned)\n    return cleaned\n\ndef is_english_heavy(text):\n    cleaned = strip_allowed_ascii_tokens(text)\n    english_words = re.findall(r\"[A-Za-z]{3,}\", cleaned)\n    chinese_chars = re.findall(r\"[\\u4e00-\\u9fff]\", cleaned)\n    return len(english_words) >= 3 and len(chinese_chars) < max(8, len(english_words) * 2)\n\ndef assert_user_facing_chinese(label, text):\n    cleaned = text_or_empty(text)\n    if not cleaned:\n        return\n    lower = cleaned.lower()\n    for term in FORBIDDEN_TERMS:\n        if term in lower:\n            raise ValueError(f\"{label} contains forbidden internal or English term: {term}\")\n    if is_english_heavy(cleaned):\n        raise ValueError(f\"{label} is not Chinese-dominant enough for user-facing report output\")\n\ndef normalize_evidence_source(text):\n    cleaned = text_or_empty(text)\n    if not cleaned:\n        return \"\"\n    normalized = cleaned.replace(\"_\", \" \").replace(\"-\", \" \")\n    lower = normalized.lower()\n    for english, chinese in SOURCE_REPLACEMENTS:\n        lower = lower.replace(english, chinese)\n    lower = re.sub(r\"\\bsection\\s*(\\d+(?:\\.\\d+)*)\\b\", r\"第\\1节\", lower, flags=re.IGNORECASE)\n    lower = re.sub(r\"\\s+\", \" \", lower).strip()\n    if is_english_heavy(lower):\n        return \"输入材料与节点输出交叉核对结果\"\n    return lower\n\ndef render_core_section(text):\n    cleaned = text_or_empty(text)\n    return cleaned or \"待补充。\"\n\ndef render_critical_gaps(items):\n    normalized = normalize_items(items)\n    if not normalized:\n        return \"暂无已排序的最高优先级缺口条目。\"\n    blocks = []\n    for index, item in enumerate(normalized, 1):\n        gap_title = text_or_empty(item.get(\"gap_title\"))\n        gap_reason = text_or_empty(item.get(\"gap_reason\"))\n        gap_category = text_or_empty(item.get(\"gap_category\"))\n        gap_priority = text_or_empty(item.get(\"gap_priority\"))\n        recommended_action = text_or_empty(item.get(\"recommended_action\"))\n        assert_user_facing_chinese(f\"critical_gaps[{index}].gap_title\", gap_title)\n        assert_user_facing_chinese(f\"critical_gaps[{index}].gap_reason\", gap_reason)\n        assert_user_facing_chinese(f\"critical_gaps[{index}].gap_category\", gap_category)\n        assert_user_facing_chinese(f\"critical_gaps[{index}].gap_priority\", gap_priority)\n        assert_user_facing_chinese(f\"critical_gaps[{index}].recommended_action\", recommended_action)\n        lines = [\n            f\"{index}. {gap_title or '最高优先级缺口'}\",\n            \"\",\n            f\"原因：{gap_reason or '待补充。'}\",\n            \"\",\n            f\"类别：{gap_category or '待补充'}｜优先级：{gap_priority or '待补充'}\",\n            \"\",\n            f\"建议：{recommended_action or '待补充。'}\",\n        ]\n        blocks.append(\"\\n\".join(lines))\n    return \"\\n\\n\".join(blocks)\n\ndef render_diagnostic_items(items, empty_text, label_prefix):\n    normalized = normalize_items(items)\n    if not normalized:\n        return empty_text\n    blocks = []\n    for index, item in enumerate(normalized, 1):\n        item_title = text_or_empty(item.get(\"item_title\"))\n        evidence_source = normalize_evidence_source(item.get(\"evidence_source\"))\n        current_absorption_state = text_or_empty(item.get(\"current_absorption_state\"))\n        recommendation = text_or_empty(item.get(\"recommendation\"))\n        assert_user_facing_chinese(f\"{label_prefix}[{index}].item_title\", item_title)\n        assert_user_facing_chinese(f\"{label_prefix}[{index}].current_absorption_state\", current_absorption_state)\n        assert_user_facing_chinese(f\"{label_prefix}[{index}].recommendation\", recommendation)\n        lines = [\n            f\"{index}. {item_title or '待补充条目'}\",\n            \"\",\n            f\"证据来源：{evidence_source or '待补充。'}\",\n            \"\",\n            f\"当前吸收状态：{current_absorption_state or '待补充。'}\",\n            \"\",\n            f\"建议：{recommendation or '待补充。'}\",\n        ]\n        blocks.append(\"\\n\".join(lines))\n    return \"\\n\\n\".join(blocks)\n\n\ndef render_confirmation_required_items(items):\n    normalized = normalize_items(items)\n    if not normalized:\n        return \"暂无待发明人确认清单。\"\n    blocks = []\n    for index, item in enumerate(normalized, 1):\n        item_title = text_or_empty(item.get(\"item_title\"))\n        reason = text_or_empty(item.get(\"reason\"))\n        confirmation_question = text_or_empty(item.get(\"confirmation_question\"))\n        priority = text_or_empty(item.get(\"priority\"))\n        assert_user_facing_chinese(f\"confirmation_required_items[{index}].item_title\", item_title)\n        assert_user_facing_chinese(f\"confirmation_required_items[{index}].reason\", reason)\n        assert_user_facing_chinese(f\"confirmation_required_items[{index}].confirmation_question\", confirmation_question)\n        assert_user_facing_chinese(f\"confirmation_required_items[{index}].priority\", priority)\n        lines = [\n            f\"{index}. {item_title or '待确认事项'}\",\n            \"\",\n            f\"确认原因：{reason or '待补充。'}\",\n            \"\",\n            f\"需确认问题：{confirmation_question or '待发明人确认。'}\",\n            \"\",\n            f\"优先级：{priority or '待补充'}\",\n        ]\n        blocks.append(\"\\n\".join(lines))\n    return \"\\n\\n\".join(blocks)\n\ndef render_claim_layout_guidance():\n    return \"\\n\".join([\n        \"以下仅为代理师撰写前的保护主题规划，不替代正式权利要求文本：\",\n        \"\",\n        \"1. 线缆结构权利要求：围绕5芯线缆、插头A/插头B、MCU、矩阵开关切换芯片及线芯复用关系建立主保护对象。\",\n        \"2. MCU控制矩阵开关的装置权利要求：围绕GPIO电平组合、矩阵开关线序映射和多接口物理层适配形成从属或并列保护层。\",\n        \"3. 通信速率自适应方法权利要求：围绕默认速率探查、应答解析、速率调整和协商完成条件形成方法保护主题。\",\n        \"4. 终端间透明传输方法权利要求：围绕终端A、线缆内部MCU、终端B/C/D/E之间的数据转发链路形成应用场景保护。\",\n        \"5. 从属特征补强项：建议补充芯片型号、引脚连接、GPIO映射表、探查/应答帧格式、超时重试、错误反馈和瞬态保护机制。\",\n    ])\n\ndef main(section_1=None, critical_gaps=None, absorbed_gaps=None, missing_gaps=None, confirmation_required_items=None, section_6=None) -> dict:\n    assert_user_facing_chinese(\"section_1\", text_or_empty(section_1))\n    assert_user_facing_chinese(\"section_6\", text_or_empty(section_6))\n    parts = [\n        \"# 技术交底书完善建议报告\",\n        \"\",\n        \"## 1. 核心结论\",\n        \"\",\n        render_core_section(section_1),\n        \"\",\n        \"## 2. 最高优先级缺口\",\n        \"\",\n        render_critical_gaps(critical_gaps),\n        \"\",\n        \"## 3. 已输入但正文未充分吸收的信息\",\n        \"\",\n        render_diagnostic_items(absorbed_gaps, \"暂无“已输入但正文未充分吸收”的条目。\", \"absorbed_gaps\"),\n        \"\",\n        \"## 4. 输入完全缺失且必须补齐的信息\",\n        \"\",\n        render_diagnostic_items(missing_gaps, \"暂无“输入完全缺失且必须补齐”的条目。\", \"missing_gaps\"),\n        \"\",\n        \"## 5. 待发明人确认清单\",\n        \"\",\n        render_confirmation_required_items(confirmation_required_items),\n        \"\",\n        \"## 6. 建议权利要求保护布局\",\n        \"\",\n        render_claim_layout_guidance(),\n        \"\",\n        \"## 7. 下一步补料建议\",\n        \"\",\n        render_core_section(section_6),\n    ]\n    return {\"output\": \"\\n\".join(parts)}\n"
