    - data:
        code: "def text_or_empty(value):\n    if value is None:\n        return \"\"\n    return str(value).strip()\n\ndef normalize_bool(value):\n    if value is True:\n        return True\n    if value is False or value is None:\n        return False\n    normalized = str(value).strip().lower()\n    if normalized in (\"true\", \"1\", \"yes\", \"y\"):\n        return True\n    if normalized in (\"false\", \"0\", \"no\", \"n\", \"\"):\n        return False\n    return False\n\ndef is_true(value):\n    return normalize_bool(value)\n\ndef normalize_items(items):\n    if not items:\n        return []\n    return [item for item in items if isinstance(item, dict)]\n\ndef normalize_string_items(items):\n    if not items:\n        return []\n    result = []\n    for item in items:\n        text = text_or_empty(item)\n        if text:\n            result.append(text)\n    return result\n\ndef normalize_status(value):\n    status = text_or_empty(value)\n    allowed = {\"已明确事实\", \"输入事实-已明确\", \"设计目标\", \"仿真/估计\", \"待确认\", \"基于输入推导，待发明人确认\", \"待发明人确认\"}\n    return status if status in allowed else \"\"\n\ndef format_status_prefix(status):\n    normalized = normalize_status(status)\n    if not normalized or normalized == \"已明确事实\":\n        return \"\"\n    return f\"【{normalized}】\"\n\ndef render_string_with_status(text, status):\n    cleaned = text_or_empty(text)\n    if not cleaned:\n        return \"待补充。\"\n    prefix = format_status_prefix(status)\n    return f\"{prefix}{cleaned}\" if prefix else cleaned\n\ndef prefix_block(index, block):\n    lines = [line.strip() for line in text_or_empty(block).split(\"\\n\") if line.strip()]\n    if not lines:\n        return \"\"\n    lines[0] = f\"{index}. {lines[0]}\"\n    return \"\\n\".join(lines)\n\ndef render_numbered_blocks(items, builder, empty_text):\n    rendered = []\n    for item in items:\n        block = text_or_empty(builder(item))\n        if block:\n            rendered.append(block)\n    if not rendered:\n        return empty_text\n    return \"\\n\\n\".join(prefix_block(index, block) for index, block in enumerate(rendered, 1))\n\ndef render_string_list(items, empty_text):\n    normalized = normalize_string_items(items)\n    if not normalized:\n        return empty_text\n    return \"\\n\\n\".join(f\"{index}. {item}\" for index, item in enumerate(normalized, 1))\n\ndef build_innovation(item):\n    if text_or_empty(item.get(\"item_type\")) != \"主创新\":\n        return \"\"\n    if text_or_empty(item.get(\"admission_scope\")) != \"正文保留\":\n        return \"\"\n    if text_or_empty(item.get(\"body_admission\")) != \"keep\":\n        return \"\"\n    title = text_or_empty(item.get(\"item_title\"))\n    body = text_or_empty(item.get(\"item_body\"))\n    status = normalize_status(item.get(\"status_bucket\"))\n    if not title and not body:\n        return \"\"\n    lines = [title or \"关键创新点\"]\n    if body:\n        lines.append(f\"技术要点：{body}\")\n    if status:\n        lines.append(f\"状态：{status}\")\n    return \"\\n\".join(lines)\n\ndef build_optional_scheme(item):\n    if text_or_empty(item.get(\"admission_scope\")) != \"正文保留\":\n        return \"\"\n    if text_or_empty(item.get(\"body_admission\")) != \"keep\":\n        return \"\"\n    title = text_or_empty(item.get(\"scheme_title\"))\n    body = text_or_empty(item.get(\"scheme_body\"))\n    status = normalize_status(item.get(\"status_bucket\"))\n    if not title and not body:\n        return \"\"\n    lines = [title or \"可选方案\"]\n    if body:\n        lines.append(f\"方案要点：{body}\")\n    if status:\n        lines.append(f\"状态：{status}\")\n    return \"\\n\".join(lines)\n\ndef build_effect(item):\n    title = text_or_empty(item.get(\"benefit_title\"))\n    mechanism = text_or_empty(item.get(\"benefit_mechanism\"))\n    evidence = text_or_empty(item.get(\"benefit_evidence_note\"))\n    status = normalize_status(item.get(\"benefit_status_bucket\"))\n    if not title and not mechanism and not evidence:\n        return \"\"\n    lines = [title or \"有益效果\"]\n    if mechanism:\n        lines.append(f\"作用机理：{mechanism}\")\n    status_and_evidence = []\n    if status:\n        status_and_evidence.append(status)\n    if evidence:\n        status_and_evidence.append(evidence)\n    if status_and_evidence:\n        lines.append(f\"状态/依据：{'；'.join(status_and_evidence)}\")\n    return \"\\n\".join(lines)\n\ndef build_drawing(item):\n    title = text_or_empty(item.get(\"drawing_title\"))\n    caption = text_or_empty(item.get(\"caption_text\"))\n    status = normalize_status(item.get(\"status_bucket\"))\n    if not title and not caption:\n        return \"\"\n    lines = [title or \"附图\"]\n    if caption:\n        lines.append(caption)\n    if status:\n        lines.append(f\"状态：{status}\")\n    return \"\\n\".join(lines)\n\ndef build_component(item):\n    if not is_true(item.get(\"display_in_main_disclosure\")):\n        return \"\"\n    if text_or_empty(item.get(\"component_scope\")) not in (\"main\", \"主构件\"):\n        return \"\"\n    code = text_or_empty(item.get(\"component_code\"))\n    name = text_or_empty(item.get(\"component_name\"))\n    role = text_or_empty(item.get(\"component_role\"))\n    status = normalize_status(item.get(\"status_bucket\"))\n    if not code and not name and not role:\n        return \"\"\n    first_line = \" - \".join(part for part in [code, name] if part) or \"主构件\"\n    lines = [first_line]\n    if role:\n        lines.append(f\"作用：{role}\")\n    if status:\n        lines.append(f\"状态：{status}\")\n    return \"\\n\".join(lines)\n\ndef build_section_8_item(item):\n    title = text_or_empty(item.get(\"scenario_title\"))\n    steps = text_or_empty(item.get(\"implementation_steps\"))\n    result = text_or_empty(item.get(\"expected_result_or_status\"))\n    status = normalize_status(item.get(\"status_bucket\"))\n    if not title and not steps and not result:\n        return \"\"\n    lines = [title or \"工况\"]\n    if steps:\n        lines.append(f\"实施步骤：{steps}\")\n    if result:\n        lines.append(f\"结果/状态：{result}\")\n    if status:\n        lines.append(f\"确认口径：{status}\")\n    return \"\\n\".join(lines)\n\ndef build_section_9_item(item):\n    text = text_or_empty(item.get(\"item_text\"))\n    status = normalize_status(item.get(\"status_bucket\"))\n    if not text:\n        return \"\"\n    lines = [text]\n    if status:\n        lines.append(f\"状态：{status}\")\n    return \"\\n\".join(lines)\n\ndef main(section_1_text=None, section_2_text=None, section_3_problem_items=None, section_3_goal_items=None, section_4_text=None, section_4_status_bucket=None, section_5_1_text=None, section_5_1_status_bucket=None, section_5_2_text=None, section_5_2_status_bucket=None, section_5_3_items=None, section_5_4_items=None, section_6_benefit_items=None, section_7_drawings=None, section_7_components=None, section_8_1_text=None, section_8_1_status_bucket=None, section_8_2_items=None, section_8_3_text=None, section_8_3_status_bucket=None, section_9_current_solution_items=None, section_9_difference_items=None, section_9_confirmation_items=None) -> dict:\n    parts = [\n        \"# 标准化技术交底书\",\n        \"\",\n        \"## 1. 技术领域\",\n        \"\",\n        render_string_with_status(section_1_text, \"已明确事实\"),\n        \"\",\n        \"## 2. 背景技术\",\n        \"\",\n        render_string_with_status(section_2_text, \"已明确事实\"),\n        \"\",\n        \"## 3. 现有技术存在的问题\",\n        \"\",\n        \"### 3.1 现有问题\",\n        \"\",\n        render_string_list(section_3_problem_items, \"现有问题待补充。\"),\n        \"\",\n        \"### 3.2 改进目标\",\n        \"\",\n        render_string_list(section_3_goal_items, \"改进目标待补充。\"),\n        \"\",\n        \"## 4. 发明目的 / 要解决的技术问题\",\n        \"\",\n        render_string_with_status(section_4_text, section_4_status_bucket),\n        \"\",\n        \"## 5. 技术方案\",\n        \"\",\n        \"### 5.1 整体方案概述\",\n        \"\",\n        render_string_with_status(section_5_1_text, section_5_1_status_bucket),\n        \"\",\n        \"### 5.2 核心结构/步骤/逻辑\",\n        \"\",\n        render_string_with_status(section_5_2_text, section_5_2_status_bucket),\n        \"\",\n        \"### 5.3 关键创新点\",\n        \"\",\n        render_numbered_blocks(normalize_items(section_5_3_items), build_innovation, \"暂无允许进入正文的关键创新点条目。\"),\n        \"\",\n        \"### 5.4 可选方案\",\n        \"\",\n        render_numbered_blocks(normalize_items(section_5_4_items), build_optional_scheme, \"暂无允许进入正文的可选方案条目。\"),\n        \"\",\n        \"## 6. 有益效果\",\n        \"\",\n        render_numbered_blocks(normalize_items(section_6_benefit_items), build_effect, \"暂无明确有益效果条目（待补充）。\"),\n        \"\",\n        \"## 7. 附图说明\",\n        \"\",\n        \"### 7.1 附图说明\",\n        \"\",\n        render_numbered_blocks(normalize_items(section_7_drawings), build_drawing, \"图项待补充。\"),\n        \"\",\n        \"### 7.2 附图标记说明\",\n        \"\",\n        render_numbered_blocks(normalize_items(section_7_components), build_component, \"主构件编号清单待补充。\"),\n        \"\",\n        \"## 8. 具体实施方式\",\n        \"\",\n        \"### 8.1 典型实施流程或装配过程\",\n        \"\",\n        render_string_with_status(section_8_1_text, section_8_1_status_bucket),\n        \"\",\n        \"### 8.2 关键参数与配合关系\",\n        \"\",\n        render_numbered_blocks(normalize_items(section_8_2_items), build_section_8_item, \"关键工况与验证路径待补充。\"),\n        \"\",\n        \"### 8.3 可替代实施方式\",\n        \"\",\n        render_string_with_status(section_8_3_text, section_8_3_status_bucket),\n        \"\",\n        \"## 9. 现有技术对比说明\",\n        \"\",\n        \"### 9.1 现有方案\",\n        \"\",\n        render_numbered_blocks(normalize_items(section_9_current_solution_items), build_section_9_item, \"现有方案待补充。\"),\n        \"\",\n        \"### 9.2 本方案区别\",\n        \"\",\n        render_numbered_blocks(normalize_items(section_9_difference_items), build_section_9_item, \"本方案区别待补充。\"),\n        \"\",\n        \"### 9.3 当前确认状态\",\n        \"\",\n        render_numbered_blocks(normalize_items(section_9_confi