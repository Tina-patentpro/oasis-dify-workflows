            # Node-1-5-14 完善建议报告结构化生成


            > 版本：1.0.0 Prompt Upgrade


            ## 任务边界


            在用户化表达前提下，补足高优先级缺口的结构化字段，供 1-5-15、1-5-25、1-5-5 复用。


            ## 当前输入


            完整技术交底书（Markdown）：{{#1769200000001.output#}}


            技术要素表初稿（Markdown）：{{#1733319005558.text#}}


            综合资料正文（Markdown）：{{#1745495528138.output#}}


            输入证据分层（JSON）：{{#1769200000003.structured_output#}}


            ## 生成目标


            - 保留用户化报告。

            - 显式提炼 Top 3 缺口。

            - 把验证、接口、失效链条、EMC 缺口单独沉淀。


            ## 输出要求


            - 在既有字段基础上，新增 `critical_gap_items_ranked`、`validation_gap_items`、`interface_parameter_gap_items`、`failure_chain_gap_items`、`emc_gap_items`。


            ## Rules


            - `critical_gap_items_ranked` 最多 3 项，必须给出优先级和建议动作。

            - 最终用户化正文不得出现 `TRL`、`TT`、`三元超系统`。

            - 具体缺口不能退化成泛化表述。

            - 所有结构化字段必须使用中文，不允许输出英文标题、英文建议、英文分类名或英文优先级。

            - 若只存在 1 个最高优先级强缺口，可以只输出 1 项，不强行补第二项弱缺口。


            ## Workflow


            1. 先做原有差异诊断。

            2. 再抽取最高优先级缺口及分类。

            3. 最后检查用户化表达和全中文输出。


            ## 最终自检


            - 新增字段完整。

            - Top 缺口具体。

            - 无内部方法论术语。

            - 全字段中文。


            ## Basic-1.1.3 确认清单与阻断缺口（强制）


            - 必须输出 `confirmation_required_items`。

            - 对所有“基于输入推导，待发明人确认”的补全内容，必须进入确认清单。

            - 若发现空壳独立权利要求、直接用户输入事实未被正文吸收、无附图输入但需要附图表达，应列为高优先级或阻断性补料项。

            - 完善建议报告必须明确区分：已输入事实、基于输入推导、必须发明人确认、输入完全缺失。


            ## Basic-1.1.3 失效链条与接口参数优先级（强制）


            - 对速率协商超时、矩阵开关切换失败、探查/应答帧格式缺失、重试机制、错误反馈、瞬态保护等问题，必须至少列为中高优先级补料项。

            - 不得把失效链条逻辑、切换失败保护和通信错误反馈降为低优先级泛化建议。

            - 若输入未给出具体参数，应明确写成“必须发明人确认/补充”，不得用常识补齐为既成事实。'
