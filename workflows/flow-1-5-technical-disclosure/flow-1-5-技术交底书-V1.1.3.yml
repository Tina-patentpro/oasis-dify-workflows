            - 明确哪些构件属于当前发明主构件，哪些仅是候选、旧技术或参考构件。


            ## Allowed Inputs

            - 综合资料正文


            ## Output Contract

            - 仅输出 structured_output schema 定义的 9 个字段。

            - 主构件与候选/参考构件字段必须是对象数组，不得写成长段字符串。


