            - 所有构件都必须来自输入已有名称、关系或图示线索。

            - 不得为了完善编号清单而新增输入中不存在的构件。


            ## Forbidden Behavior

            - 禁止把旧技术、候选方案、比较对象或推理构件误记为当前发明主构件。

            - 禁止新增输入中不存在的部件作用或结构关系。


            ## Writing Rules

            - 主构件数组中的 `is_main_invention_component` 必须为 true。

            - 候选/参考构件数组中的 `is_main_invention_component` 必须为 false。

            - `component_role_scope` 应短、稳、可直接复用到后续节点。


