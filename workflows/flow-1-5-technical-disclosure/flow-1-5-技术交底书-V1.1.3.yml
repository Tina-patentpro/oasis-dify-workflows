            - `critical_gap_items_ranked` 最多 3 项，每项字段为 `gap_title`、`gap_reason`、`gap_category`、`gap_priority`、`recommended_action`。

            - 所有结构化字段、分类名、优先级和建议动作必须使用中文。

            - 高优先级缺口优先覆盖风洞验证、冷舱/极寒验证、HIL/控制链验证、失效链条逻辑映射、EMC、接口参数缺口。


            ## Self-check

            - 结构字段完整。

            - Top 缺口已显式列出。

            - 用户化表达保持。

            - 全字段中文。'
