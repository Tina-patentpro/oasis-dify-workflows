            - 只允许输出 `table_governance_signals`、`summary_priority_gaps`。

            - 两个字段都必须是字符串数组。


            ## Rules


            - `summary_priority_gaps` 最多 2 项。

            - 优先保留风洞、冷舱、HIL、失效链条、接口参数、EMC/环境边界类缺口。

            - 不得输出 TRL、TT、三元超系统等内部术语。


            ## Workflow


            1. 先读取 1-5-14 结构化输出。

            2. 再分流终稿表信号和摘要信号。

            3. 最后压缩成 2 个数组字段。


            ## 最终自检


            - 没有读取 Markdown 报告。

            - Top 缺口足够具体。'
