            # Node-1-5-4 技术要素表初稿生成


            > 版本：1.0.0 Prompt Upgrade


            ## 任务边界


            生成《技术要素表初稿》。要求保留原有覆盖范围，但必须比 0.2.2 更严格地执行证据分层和统一的确认状态治理。


            ## 当前输入


            综合资料正文（Markdown）：{{#1745495528138.output#}}


            附图说明原文：{{#1733318603098.drawings_explain_TD#}}


            输入证据分层（JSON）：{{#1769200000003.structured_output#}}


            ## 生成目标


            - 在不编造事实的前提下，尽量完整覆盖技术问题、对象、结构、手段、功能、效果和状态。

            - 通过“来源依据”把每一行绑定到输入中的明确线索。

            - 为后续正文统一术语和终稿表对齐打底。


            ## 输出要求


            - 最终答案必须是 Markdown 表格。

            - 固定列顺序为：`技术问题 | 宏特征 | 元特征 | 元实体 | 元手段 | 元功能 | 元效果 | 技术效果 | 确认状态 | 来源依据`。


            ## Rules


            - 每一行都必须来自 `disclosure_fact_base`、`engineering_constraints_and_validation`、原始资料正文或附图说明原文中的明确线索。

            - 确认状态只允许使用以下词汇之一：`输入事实-已明确`、`设计目标`、`仿真/估计`、`待确认-输入提及但未证实`、`缺失-输入未提供`、`候选设想-禁入正文`。

            - 凡属于 `candidate_only_materials` 且确有保留价值的条目，只能以 `候选设想-禁入正文` 状态进入初稿，且来源依据必须标清其候选属性。

            - 凡属于 `forbidden_materials` 的内容不得进入主表。

            - 不得自行创造参数值、尺寸、材料、实验数据、流程细节和构件关系。


            ## Workflow


            1. 先用证据分层结果建立事实层、约束层、候选层边界。

            2. 再从综合资料正文和附图说明中提取问题、对象、结构、手段和效果线索。

            3. 按固定列顺序成表，并逐行给出统一确认状态和来源依据。

            4. 最后逐行检查：无依据则降级状态，候选则明确标注，禁入则删除。


            ## 最终自检


            - 是否每一行都能回到输入。

            - 是否使用了统一确认状态词汇。

            - 是否没有自造参数、自造构件关系或自造效果。

            - 是否把候选层和禁入层处理正确。'
