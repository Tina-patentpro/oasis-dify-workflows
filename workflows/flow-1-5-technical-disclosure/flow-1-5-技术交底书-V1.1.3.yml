            - 为 1-5-5 提供 Top 缺口信号。


            ## Allowed Inputs

            - 完善建议报告结构化输出


            ## Output Contract

            - 仅输出 `table_governance_signals`、`summary_priority_gaps`。


            ## Evidence Boundary

            - 只基于 1-5-14 的结构化字段。

            - 不得读取 1-5-15 Markdown。


