    - data:
        code: "import re\n\nFORBIDDEN_CLIENT_TOKENS = (\n    \"Basic-1.0.2\",\n    \"...\",\n    \"Numeric_claim_status_basis\",\n    \"Main_disclosure_component_items\",\n    \"Engineering_constraints\",\n    \"disclosure_fact_base\",\n    \"input_completeness_diagnostics\",\n    \"gap materials\",\n    \"node 1 5 14\",\n    \"structured_output\",\n    \"schema\",\n    \"accepted_rows\",\n    \"excluded_rows\",\n    \"reasoning_content\",\n    chr(8230),\n)\n\nEMAIL_RE = re.compile(r\"[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}\")\nPHONE_RE = re.compile(r\"(?<!\\d)1[3-9]\\d{9}(?!\\d)\")\n\ndef normalize_text(value):\n    if value is None:\n        return \"\"\n    return str(value).replace(\"\\r\\n\", \"\\n\").strip()\n\ndef strip_first_heading(text, expected_heading):\n    cleaned = normalize_text(text)\n    if not cleaned:\n        return \"\"\n    lines = cleaned.split(\"\\n\")\n    first_non_empty = 0\n    while first_non_empty < len(lines) and not lines[first_non_empty].strip():\n        first_non_empty += 1\n    if first_non_empty >= len(lines):\n        return \"\"\n    if lines[first_non_empty].strip() == expected_heading:\n        lines = lines[first_non_empty + 1 :]\n        while lines and not lines[0].strip():\n            lines.pop(0)\n        return \"\\n\".join(lines).strip()\n    return cleaned\n\n\ndef render_delivery_status():\n    return \"\\n\".join([\n        \"## 当前交付状态\",\n        \"\",\n        \"当前交付状态：发明人确认稿，尚不能作为最终专利撰写定稿。\",\n        \"\",\n        \"主要原因：芯片型号、引脚映射、指令帧格式、超时重试、切换失败保护和错误反馈机制仍需发明人确认或补充。\",\n    ])\n\ndef render_section(title, body, placeholder):\n    cleaned = normalize_text(body) or placeholder\n    return f\"## {title}\\n\\n{cleaned}\"\n\ndef validate_delivery_quality(text):\n    problems = []\n    for token in FORBIDDEN_CLIENT_TOKENS:\n        if token in text:\n            problems.append(f\"禁止出现在客户可见文本中的标记：{token}\")\n    if EMAIL_RE.search(text):\n        problems.append(\"客户可见文本中疑似包含邮箱地址\")\n    if PHONE_RE.search(text):\n        problems.append(\"客户可见文本中疑似包含手机号\")\n    if problems:\n        raise ValueError(\"客户可见交付质量门禁未通过：\" + \"；\".join(problems))\n\ndef main(brief_summary=None, technical_disclosure_markdown=None, improvement_report_markdown=None, tech_elements_table_markdown=None) -> dict:\n    parts = [\n        \"# 技术交底书完善交付阅读版\",\n        \"\",\n        render_delivery_status(),\n        \"\",\n        \"---\",\n        \"\",\n        render_section(\"最终简报\", brief_summary, \"暂无最终简报。\"),\n        \"\",\n        \"---\",\n        \"\",\n        render_section(\n            \"标准化技术交底书\",\n            strip_first_heading(technical_disclosure_markdown, \"# 标准化技术交底书\"),\n            \"技术交底书正文暂未生成。\",\n        ),\n        \"\",\n        \"---\",\n        \"\",\n        render_section(\n            \"技术交底书完善建议报告\",\n            strip_first_heading(improvement_report_markdown, \"# 技术交底书完善建议报告\"),\n            \"完善建议报告正文暂未生成。\",\n        ),\n        \"\",\n        \"---\",\n        \"\",\n        render_section(\n            \"技术要素表终稿\",\n            strip_first_heading(tech_elements_table_markdown, \"# 技术要素表终稿\"),\n            \"技术要素表正文暂未生成。\",\n        ),\n    ]\n    output = \"\\n\".join(parts)\n    validate_delivery_quality(output)\n    return {\"brief_summary\": output}\n"
