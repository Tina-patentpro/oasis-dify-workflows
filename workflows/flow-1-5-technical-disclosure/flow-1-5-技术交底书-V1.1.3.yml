    - data:
        code: "import re\n\nINTERNAL_SOURCE_MAP = {\n    \"Numeric_claim_status_basis\": \"发明简述中的数量与状态依据\",\n    \"Main_disclosure_component_items\": \"主要构件与技术方案说明\",\n    \"Engineering_constraints\": \"工程约束与实施条件\",\n}\n\nSOURCE_BUCKET_MAP = {\n    \"input_missing_items\": \"输入完全缺失项\",\n    \"report_gap_materials\": \"补料诊断依据\",\n    \"critical_gap_items_ranked\": \"高优先级缺口清单\",\n    \"already_input_but_not_absorbed_items\": \"已输入但正文未充分吸收项\",\n}\n\nFORBIDDEN_CLIENT_TOKENS = (\n    \"Numeric_claim_status_basis\",\n    \"Main_disclosure_component_items\",\n    \"Engineering_constraints\",\n    \"disclosure_fact_base\",\n    \"input_completeness_diagnostics\",\n    \"input_missing_items\",\n    \"report_gap_materials\",\n    \"source_bucket\",\n    \"excluded_rows\",\n    \"...\",\n    chr(8230),\n)\n\ndef text_or_empty(value):\n    if value is None:\n        return \"\"\n    return str(value).strip()\n\ndef remove_ellipsis(text):\n    return text_or_empty(text).replace(\"...\", \"\").replace(chr(8230), \"\").strip()\n\ndef normalize_cell(value):\n    text = remove_ellipsis(value)\n    text = text.replace(\"\\r\\n\", \"<br>\").replace(\"\\n\", \"<br>\")\n    text = text.replace(\"|\", \"\\\\|\")\n    return text\n\ndef normalize_phrase(value):\n    text = remove_ellipsis(value)\n    text = text.replace(\"\\r\\n\", \"；\").replace(\"\\n\", \"；\")\n    text = text.replace(\"|\", \"/\")\n    text = re.sub(r\"\\s+\", \" \", text)\n    text = re.sub(r\"；+\", \"；\", text)\n    return text.strip(\"； \")\n\ndef join_parts(parts):\n    cleaned = []\n    for part in parts:\n        text = normalize_phrase(part)\n        if text and text not in cleaned:\n            cleaned.append(text)\n    return \"；\".join(cleaned)\n\ndef map_source_basis(value):\n    source = normalize_phrase(value)\n    if not source:\n        return \"综合技术资料正文\"\n    for internal, readable in INTERNAL_SOURCE_MAP.items():\n        source = source.replace(internal, readable)\n    if re.search(r\"[A-Za-z]+_[A-Za-z0-9_]+\", source):\n        return \"综合技术资料正文\"\n    return source\n\ndef validate_no_client_leak(markdown):\n    for token in FORBIDDEN_CLIENT_TOKENS:\n        if token in markdown:\n            raise ValueError(f\"final technical-elements table contains client-visible forbidden token: {token}\")\n\ndef row_to_delivery_markdown(row):\n    columns = [\n        row.get(\"technical_problem\", \"\"),\n        join_parts([row.get(\"macro_feature\"), row.get(\"meta_feature\"), row.get(\"meta_entity\")]),\n        join_parts([row.get(\"meta_means\"), row.get(\"meta_function\")]),\n        join_parts([row.get(\"meta_effect\"), row.get(\"technical_effect\")]),\n        row.get(\"status\", \"\"),\n        row.get(\"source_tag\", \"\"),\n    ]\n    return \"| \" + \" | \".join(normalize_cell(value) for value in columns) + \" |\"\n\ndef validate_row(row):\n    required_columns = [\n        \"technical_problem\",\n        \"macro_feature\",\n        \"meta_feature\",\n        \"meta_entity\",\n        \"meta_means\",\n        \"meta_function\",\n        \"meta_effect\",\n        \"technical_effect\",\n        \"status\",\n        \"source_basis\",\n    ]\n    for column in required_columns:\n        if column not in row:\n            return False\n    return True\n\ndef assign_source_tags(rows):\n    mapping = {}\n    ordered_tags = []\n    for row in rows:\n        source_basis = map_source_basis(row.get(\"source_basis\"))\n        if source_basis not in mapping:\n            tag = f\"S{len(mapping) + 1}\"\n            mapping[source_basis] = tag\n            ordered_tags.append((tag, source_basis))\n    return mapping, ordered_tags\n\n\ndef map_source_bucket(value):\n    source = normalize_phrase(value)\n    if not source:\n        return \"补料诊断\"\n    for internal, readable in SOURCE_BUCKET_MAP.items():\n        source = source.replace(internal, readable)\n    if re.search(r\"[A-Za-z]+_[A-Za-z0-9_]+\", source):\n        return \"补料诊断\"\n    return source\n\ndef validate_excluded_row(row):\n    required_columns = [\n        \"original_title\",\n        \"exclusion_reason\",\n        \"source_bucket\",\n        \"suggested_destination\",\n    ]\n    return all(column in row for column in required_columns)\n\ndef render_excluded_rows_summary(excluded_rows):\n    rows = excluded_rows or []\n    if not rows:\n        return []\n    if any(not isinstance(row, dict) for row in rows):\n        raise ValueError(\"excluded rows summary contains non-object row; cannot render supplement summary\")\n    if any(not validate_excluded_row(row) for row in rows):\n        raise ValueError(\"excluded rows summary contains incomplete row; cannot render supplement summary\")\n    lines = [\"\", \"## 未进入终稿表但建议补充的技术要素\", \"\"]\n    for index, row in enumerate(rows, 1):\n        title = normalize_phrase(row.get(\"original_title\")) or \"待补充事项\"\n        reason = normalize_phrase(row.get(\"exclusion_reason\")) or \"未满足终稿准入条件。\"\n        source = map_source_bucket(row.get(\"source_bucket\"))\n        destination = normalize_phrase(row.get(\"suggested_destination\")) or \"发明人补料清单\"\n        lines.extend([\n            f\"{index}. {title}\",\n            \"\",\n            f\"未进入原因：{reason}\",\n            \"\",\n            f\"建议去向：{destination}\",\n            \"\",\n            f\"来源说明：{source}\",\n            \"\",\n        ])\n    return lines\n\ndef render_empty_table(excluded_row_count=0, excluded_rows=None):\n    count = int(excluded_row_count or 0)\n    lines = [\n        \"# 技术要素表终稿\",\n        \"\",\n        \"本次未形成可采纳技术要素。\",\n        \"\",\n        \"## 诊断说明\",\n        \"\",\n        \"终稿采纳条目：0\",\n        f\"未进入终稿表的补充事项数量：{count}\",\n        \"可能原因：输入资料缺少可直接进入技术要素表的技术问题、关键特征、手段、功能、效果或来源依据。\",\n        \"建议补充：独立权利要求完整步骤、实施例参数、可验证技术效果、替代方案和来源证据。\",\n    ]\n    lines.extend(render_excluded_rows_summary(excluded_rows))\n    markdown = \"\\n\".join(lines)\n    validate_no_client_leak(markdown)\n    return markdown, f\"accepted=0; excluded={count}; fallback_rendered=true\"\n\ndef main(accepted_rows: list, accepted_row_count: int = 0, excluded_rows: list = None, excluded_row_count: int = 0) -> dict:\n    raw_rows = accepted_rows or []\n    if any(not isinstance(row, dict) for row in raw_rows):\n        raise ValueError(\"accepted_rows contains non-object row; cannot render final table markdown\")\n    expected_row_count = int(accepted_row_count or 0)\n    if expected_row_count != len(raw_rows):\n        raise ValueError(\"accepted_row_count does not match accepted_rows length\")\n    valid_rows = raw_rows\n    if not valid_rows:\n        markdown, warning = render_empty_table(excluded_row_count, excluded_rows)\n        return {\"table_markdown\": markdown, \"row_count\": 0, \"warning_summary\": warning}\n    if len(valid_rows) > 6:\n        raise ValueError(\"accepted_rows exceeds max allowed 6; cannot render final table markdown\")\n    if any(not validate_row(row) for row in valid_rows):\n        raise ValueError(\"accepted_rows contains incomplete row; cannot render final table markdown\")\n    raw_excluded_rows = excluded_rows or []\n    if excluded_row_count and int(excluded_row_count or 0) != len(raw_excluded_rows):\n        raise ValueError(\"excluded row count does not match supplement rows length\")\n    source_mapping, ordered_tags = assign_source_tags(valid_rows)\n    delivery_rows = []\n    for row in valid_rows:\n        cloned = dict(row)\n        source_basis = map_source_basis(cloned.get(\"source_basis\"))\n        cloned[\"source_tag\"] = source_mapping[source_basis]\n        delivery_rows.append(cloned)\n    header = \"| 技术问题 | 关键技术特征 | 关键手段与功能 | 关键效果 | 确认状态 | 来源标签 |\"\n    divider = \"| :--- | :--- | :--- | :--- | :--- | :--- |\"\n    lines = [\"# 技术要素表终稿\", \"\", header, divider]\n    for row in delivery_rows:\n        lines.append(row_to_delivery_markdown(row))\n    if ordered_tags:\n        lines.extend([\"\", \"来源依据对照说明\", \"\"])\n        for index, (tag, source_basis) in enumerate(ordered_tags, 1):\n            lines.append(f\"{index}. {tag}：{source_basis}\")\n    warning_summary = \"\"\n    if excluded_row_count and excluded_row_count > 0:\n        warning_summary = f\"excluded={excluded_row_count}\"\n    lines.extend(render_excluded_rows_summary(raw_excluded_rows))\n    markdown = \"\\n\".join(lines)\n    validate_no_client_leak(markdown)\n    return {\"table_markdown\": markdown, \"row_count\": len(valid_rows), \"warning_summary\": warning_summary}\n"
