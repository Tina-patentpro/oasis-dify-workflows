    - data:
        code: |
          def main(
              application_title: str,
              user_input: str,
              drawings_images: list,
              claims_text_input: str,
              claims_file_text: str,
              specification_text_input: str,
              specification_file_text: str,
          ) -> dict:
              import json
              import re

              def normalize_text(value):
                  return re.sub(r"\s+", " ", str(value or "")).strip()

              def normalize_long_text(value):
                  text = str(value or "").replace("\r\n", "\n").replace("\r", "\n")
                  text = re.sub(r"</?(?:details|summary|blockquote|p|div|span|code|pre)[^>]*>", "", text, flags=re.IGNORECASE)
                  text = re.sub(r"&nbsp;?", " ", text, flags=re.IGNORECASE)
                  text = re.sub(r"[ \t]+\n", "\n", text)
                  text = re.sub(r"\n{3,}", "\n\n", text)
                  return text.strip()

              def dense_length(value):
                  return len(re.sub(r"\s+", "", str(value or "")))

              def ensure_file_list(value):
                  if isinstance(value, list):
                      return [item for item in value if item]
                  return []

              def add_warning(code_list, fact_list, code, fact):
                  normalized_code = normalize_text(code)
                  normalized_fact = normalize_text(fact)
                  if normalized_code and normalized_code not in code_list:
                      code_list.append(normalized_code)
                  if normalized_fact and normalized_fact not in fact_list:
                      fact_list.append(normalized_fact)

              def heading_pattern(label):
                  return re.compile(
                      rf"(?m)^[ \t]*(?:第[一二三四五六七八九十百千万0-9]+(?:章节|部分)\s*|[一二三四五六七八九十0-9]+[、.．]\s*)?{re.escape(label)}[ \t]*$"
                  )

              SPEC_SECTION_ALIASES = (
                  ("摘要", ("说明书摘要", "摘要")),
                  ("技术领域", ("技术领域",)),
                  ("背景技术", ("背景技术",)),
                  ("发明内容", ("发明内容",)),
                  ("附图说明", ("附图说明",)),
                  ("具体实施方式", ("具体实施方式",)),
                  ("标号清单", ("标号清单",)),
                  ("说明书", ("说明书",)),
                  ("序列表", ("序列表",)),
                  ("附录", ("附录", "附录说明")),
              )
              AGGRESSIVE_STRIP_SECTIONS = {"发明内容", "具体实施方式", "有益效果"}
              CLAIM_LIKE_PARAGRAPH_PATTERNS = (
                  re.compile(r"^权利要求\s*\d+", re.IGNORECASE),
                  re.compile(r"^(?:根据|如|按照)权利要求\s*\d+", re.IGNORECASE),
                  re.compile(r"^其特征在于", re.IGNORECASE),
                  re.compile(r"^(?:本发明|本申请)(?:提供|公开).*(?:一种|一个)(?:系统|装置|方法|结构|设备|组件|车辆)", re.IGNORECASE),
              )
              CLAIM_CLUSTER_START_PATTERNS = (
                  re.compile(r"^\d+[\.、]"),
                  re.compile(r"^在一种可能的实施方式中"),
                  re.compile(r"^(?:根据|如|按照)权利要求", re.IGNORECASE),
              )
              STRONG_CLAIM_RESTATEMENT_HINTS = ("一种用于", "一种受电弓", "一种轨道车辆")
              WEAK_CLAIM_RESTATEMENT_HINTS = ("一种系统", "一种方法", "一种装置", "一种结构", "一种")
              REWRITTEN_SPEC_OPENERS = ("本发明提供", "本申请提供", "本发明公开", "本申请公开")
              specification_heading_groups = [list(aliases) for _, aliases in SPEC_SECTION_ALIASES]

              def find_heading_match(text, labels):
                  normalized = str(text or "")
                  for label in labels:
                      match = heading_pattern(label).search(normalized)
                      if match:
                          return match
                  return None

              def has_heading(text, labels):
                  return bool(find_heading_match(text, labels))

              def canonical_spec_section_heading(line):
                  stripped = normalize_text(line)
                  if not stripped:
                      return ""
                  for canonical, aliases in SPEC_SECTION_ALIASES:
                      if find_heading_match(stripped, aliases):
                          return canonical
                  return ""

              def is_claim_line_start(line):
                  return bool(re.match(r"^\s*(?:权利要求\s*)?\d+\s*[.．、:：]\s*", str(line or "")))

              def numbered_claim_lines(text):
                  return [normalize_text(line) for line in str(text or "").splitlines() if is_claim_line_start(line)]

              def looks_like_claims_text(text):
                  claim_lines = numbered_claim_lines(text)
                  if not claim_lines:
                      return False
                  normalized = normalize_text(text)
                  explicit_claim_markers = [r"权利要求\s*\d+", r"根据权利要求", r"其特征在于"]
                  if any(re.search(pattern, normalized) for pattern in explicit_claim_markers):
                      return True
                  strong_claim_patterns = [r"其特征在于", r"根据权利要求", r"所述"]
                  weak_claim_patterns = [r"包括", r"包含", r"设有", r"用于"]
                  if any(re.search(pattern, normalized) for pattern in strong_claim_patterns):
                      return True
                  claim_noun_patterns = [r"一种", r"装置", r"系统", r"设备", r"模块", r"组件", r"机构", r"单元", r"方法"]
                  claim_noun_hits = 0
                  for line in claim_lines:
                      content = re.sub(r"^\s*(?:权利要求\s*)?\d+\s*[.．、:：]\s*", "", line)
                      if any(re.search(pattern, content) for pattern in claim_noun_patterns):
                          claim_noun_hits += 1
                  weak_hits = sum(1 for pattern in weak_claim_patterns if re.search(pattern, normalized))
                  return claim_noun_hits > 0 and weak_hits > 0

              def is_non_claim_section_heading(line):
                  stripped = normalize_text(line)
                  if not stripped or is_claim_line_start(stripped):
                      return False
                  for labels in specification_heading_groups:
                      if any(heading_pattern(label).match(stripped) for label in labels):
                          return True
                  return False

              def split_mixed_application_package(text):
                  claims_match = find_heading_match(text, ["权利要求书"])
                  if not claims_match:
                      return "", ""
                  claims_heading = normalize_text(claims_match.group(0)) or "权利要求书"
                  suffix = text[claims_match.end():]
                  claim_blocks = []
                  current_block = []
                  trailing_lines = []
                  trailing_started = False

                  for raw_line in suffix.splitlines():
                      line = raw_line.rstrip()
                      stripped = normalize_text(line)
                      if not stripped:
                          if trailing_started:
                              trailing_lines.append("")
                          elif current_block:
                              current_block.append("")
                          continue
                      if trailing_started:
                          trailing_lines.append(stripped)
                          continue
                      if is_non_claim_section_heading(stripped):
                          if current_block:
                              claim_blocks.append(normalize_long_text("\n".join(current_block)))
                              current_block = []
                          trailing_started = True
                          trailing_lines.append(stripped)
                          continue
                      if is_claim_line_start(stripped):
                          if current_block:
                              claim_blocks.append(normalize_long_text("\n".join(current_block)))
                          current_block = [stripped]
                      elif current_block:
                          current_block.append(stripped)
                  if current_block:
                      claim_blocks.append(normalize_long_text("\n".join(current_block)))

                  claims_body = normalize_long_text("\n".join(block for block in claim_blocks if block))
                  specification_prefix = normalize_long_text(text[:claims_match.start()])
                  specification_suffix = normalize_long_text("\n".join(trailing_lines))
                  specification_text = normalize_long_text("\n\n".join(part for part in [specification_prefix, specification_suffix] if part))
                  claims_text = normalize_long_text("\n".join(part for part in [claims_heading, claims_body] if part)) if claims_body else ""
                  return claims_text, specification_text

              def detect_mixed_application_package(text):
                  if not text or not has_heading(text, ["权利要求书"]):
                      return False
                  matched = 0
                  for labels in specification_heading_groups[:6]:
                      if has_heading(text, labels):
                          matched += 1
                  return matched >= 2

              def strip_embedded_claims_from_specification(text, cleanup_trace):
                  if not isinstance(text, str) or not text.strip():
                      return ""
                  cleaned = normalize_long_text(text)
                  cleaned = re.sub(
                      r"<details>\s*<summary>\s*权利要求书\s*</summary>.*?</details>",
                      "",
                      cleaned,
                      flags=re.IGNORECASE | re.DOTALL,
                  )
                  cleaned = re.sub(
                      r"```xml\s*(?:<details>\s*<summary>\s*权利要求书\s*</summary>.*?</details>|权利要求书[\s\S]*?)```",
                      "",
                      cleaned,
                      flags=re.IGNORECASE | re.DOTALL,
                  )
                  filtered_lines = []
                  inside_claims_block = False
                  for raw_line in cleaned.splitlines():
                      stripped = normalize_text(raw_line)
                      if inside_claims_block:
                          if canonical_spec_section_heading(raw_line) or is_non_claim_section_heading(raw_line):
                              inside_claims_block = False
                              filtered_lines.append(raw_line)
                          continue
                      if find_heading_match(stripped, ["权利要求书"]):
                          inside_claims_block = True
                          continue
                      filtered_lines.append(raw_line)
                  cleaned = normalize_long_text("\n".join(filtered_lines))
                  paragraphs = [part.strip() for part in re.split(r"\n\s*\n", cleaned) if part.strip()]
                  kept = []
                  for paragraph in paragraphs:
                      if any(pattern.search(paragraph) for pattern in CLAIM_LIKE_PARAGRAPH_PATTERNS):
                          cleanup_trace["removed_direct_claim_ref_paragraphs"] += 1
                          continue
                      kept.append(paragraph)
                  return normalize_long_text("\n\n".join(kept))

              def split_top_level_sections(text):
                  sections = []
                  current_title = ""
                  current_lines = []
                  for raw_line in str(text or "").splitlines():
                      canonical_heading = canonical_spec_section_heading(raw_line)
                      if canonical_heading:
                          if current_title or current_lines:
                              sections.append((current_title, normalize_long_text("\n".join(current_lines))))
                          current_title = canonical_heading
                          current_lines = []
                      else:
                          current_lines.append(raw_line)
                  if current_title or current_lines:
                      sections.append((current_title, normalize_long_text("\n".join(current_lines))))
                  return sections

              def extract_claim_fingerprints(claim_text):
                  claim_blocks = []
                  current = []
                  for raw_line in str(claim_text or "").splitlines():
                      stripped = normalize_text(raw_line)
                      if not stripped:
                          if current:
                              current.append("")
                          continue
                      if is_claim_line_start(stripped):
                          if current:
                              block = normalize_long_text("\n".join(current))
                              if block:
                                  claim_blocks.append(block)
                          current = [stripped]
                      elif current:
                          current.append(stripped)
                  if current:
                      block = normalize_long_text("\n".join(current))
                      if block:
                          claim_blocks.append(block)
                  fingerprints = []
                  for block in claim_blocks:
                      text = re.sub(r"^\s*\d+\.\s*", "", block)
                      text = re.sub(r"^(?:根据|如|按照)权利要求\s*\d+[^，。；;]*[，,]?\s*", "", text)
                      first_sentence = re.split(r"[。；;\n]", text, maxsplit=1)[0]
                      compact = re.sub(r"[\W_]+", "", normalize_text(first_sentence).lower())
                      if compact:
                          fingerprints.append(compact)
                  return list(dict.fromkeys(fingerprints))

              def compact_text(value):
                  return re.sub(r"[\W_]+", "", normalize_text(value).lower())

              def has_direct_claim_ref(paragraph):
                  normalized = normalize_text(paragraph)
                  return any(token in normalized for token in ("根据权利要求", "如权利要求", "按照权利要求"))

              def fingerprint_hits(paragraph, fingerprints):
                  compact = compact_text(paragraph)
                  if not compact:
                      return 0
                  return sum(1 for fp in fingerprints if fp and fp in compact)

              def strip_cluster_prefix(paragraph):
                  return re.sub(r"^\d+[\.、]\s*", "", normalize_text(paragraph))

              def restatement_hits(paragraph):
                  normalized = strip_cluster_prefix(paragraph)
                  strong = 1 if any(normalized.startswith(hint) for hint in STRONG_CLAIM_RESTATEMENT_HINTS) else 0
                  weak = 0
                  if not strong and any(normalized.startswith(hint) for hint in WEAK_CLAIM_RESTATEMENT_HINTS):
                      weak = 1
                  return strong, weak

              def rewritten_spec_signal_count(paragraph):
                  normalized = strip_cluster_prefix(paragraph)
                  score = 0
                  if any(normalized.startswith(prefix) for prefix in REWRITTEN_SPEC_OPENERS):
                      score += 1
                  if "其特征在于" in normalized:
                      score += 1
                  if normalized.count("所述") >= 2:
                      score += 1
                  if "本发明" in normalized and any(token in normalized for token in ("系统", "装置", "方法", "结构", "车辆", "设备")):
                      score += 1
                  return score

              def has_detail_anchor(paragraph):
                  normalized = strip_cluster_prefix(paragraph)
                  if re.search(r"(?:图|附图|标号)\s*\d+", normalized):
                      return True
                  if re.search(r"\d+\s*(?:mm|cm|m|kg|g|nm|μm|um|℃|°|度|个|组|层|段|N|kN|MPa|V|A|Hz|rpm|%)", normalized, flags=re.IGNORECASE):
                      return True
                  detail_keywords = (
                      "设置在", "设置于", "位于", "连接在", "连接于", "固定在", "固定于", "安装在", "安装于",
                      "套设", "卡接", "焊接", "螺接", "铰接", "转动连接", "围绕", "沿着", "之间", "对应图",
                  )
                  return sum(1 for token in detail_keywords if token in normalized) >= 2

              def claim_morphology_score(paragraph):
                  normalized = strip_cluster_prefix(paragraph)
                  strong_hits, weak_hits = restatement_hits(normalized)
                  score = strong_hits * 2 + weak_hits
                  if any(pattern.search(normalized) for pattern in CLAIM_LIKE_PARAGRAPH_PATTERNS):
                      score += 2
                  if "其特征在于" in normalized:
                      score += 2
                  if normalized.count("所述") >= 2:
                      score += 1
                  if rewritten_spec_signal_count(normalized) >= 2:
                      score += 1
                  return score

              def is_low_trust_effect_paragraph(paragraph):
                  normalized = strip_cluster_prefix(paragraph)
                  quantified = bool(
                      re.search(r"\d+\s*(?:[-~至]\s*\d+)?\s*%|\d+\s*倍|一倍以上|两倍以上|降低\s*\d+\s*(?:[-~至]\s*\d+)?\s*%|提升\s*\d+\s*(?:[-~至]\s*\d+)?\s*%", normalized)
                  )
                  effect_terms = any(
                      token in normalized
                      for token in (
                          "有益效果",
                          "显著提高",
                          "显著提升",
                          "显著降低",
                          "降低运营成本",
                          "提高响应灵敏度",
                          "延长滑板寿命",
                          "延长使用寿命",
                          "改善稳定性",
                      )
                  )
                  if not quantified and not effect_terms:
                      return False
                  if has_detail_anchor(normalized):
                      return False
                  return any(token in normalized for token in ("预计", "约", "可", "能够", "有助于", "提升", "降低", "延长", "效果"))

              def is_cluster_start(paragraph):
                  normalized = normalize_text(paragraph)
                  return any(pattern.search(normalized) for pattern in CLAIM_CLUSTER_START_PATTERNS)

              def cleanup_aggressive_section(section_text, claim_text):
                  fingerprints = extract_claim_fingerprints(claim_text)
                  local_trace = {
                      "removed_direct_claim_ref_paragraphs": 0,
                      "removed_claim_restatement_clusters": 0,
                      "removed_claim_like_impl_clusters": 0,
                      "fallback_used": False,
                  }
                  sections = split_top_level_sections(section_text)
                  if not sections:
                      return normalize_long_text(section_text), local_trace
                  title, body = sections[0]
                  paragraphs = [part.strip() for part in re.split(r"\n\s*\n", body) if part.strip()]
                  kept = []
                  i = 0
                  while i < len(paragraphs):
                      paragraph = paragraphs[i]
                      if any(pattern.search(paragraph) for pattern in CLAIM_LIKE_PARAGRAPH_PATTERNS):
                          local_trace["removed_direct_claim_ref_paragraphs"] += 1
                          i += 1
                          continue
                      standalone_normalized = normalize_text(paragraph)
                      standalone_strong_hits, standalone_weak_hits = restatement_hits(standalone_normalized)
                      standalone_rewritten_signals = rewritten_spec_signal_count(standalone_normalized)
                      if (
                          standalone_rewritten_signals >= 2
                          or (standalone_strong_hits >= 1 and ("所述" in standalone_normalized or "其特征在于" in standalone_normalized))
                          or (standalone_weak_hits >= 1 and standalone_normalized.count("所述") >= 2 and "其特征在于" in standalone_normalized)
                          or (standalone_normalized.startswith("在一种可能的实施方式中") and "所述" in standalone_normalized)
                          or is_low_trust_effect_paragraph(standalone_normalized)
                      ):
                          local_trace["removed_claim_like_impl_clusters"] += 1
                          local_trace["removed_claim_restatement_clusters"] += 1
                          i += 1
                          continue
                      if is_cluster_start(paragraph):
                          cluster = [paragraph]
                          j = i + 1
                          while j < len(paragraphs):
                              candidate = paragraphs[j]
                              if is_cluster_start(candidate):
                                  break
                              cluster.append(candidate)
                              j += 1
                          has_direct = False
                          claim_ref_count = 0
                          fingerprint_hit_count = 0
                          strong_restatement_count = 0
                          weak_restatement_count = 0
                          claim_style_count = 0
                          impl_marker_count = 0
                          rewritten_signal_total = 0
                          low_trust_effect_count = 0
                          for item in cluster:
                              normalized = normalize_text(item)
                              if has_direct_claim_ref(normalized):
                                  has_direct = True
                              if re.search(r"权利要求\s*\d+", normalized):
                                  claim_ref_count += 1
                              fingerprint_hit_count += fingerprint_hits(normalized, fingerprints)
                              strong_hits, weak_hits = restatement_hits(normalized)
                              strong_restatement_count += strong_hits
                              weak_restatement_count += weak_hits
                              if "所述" in normalized:
                                  claim_style_count += 1
                              if normalized.startswith("在一种可能的实施方式中") or re.match(r"^\d+[\.、]", normalized):
                                  impl_marker_count += 1
                              rewritten_signal_total += rewritten_spec_signal_count(normalized)
                              if is_low_trust_effect_paragraph(normalized):
                                  low_trust_effect_count += 1
                          should_drop = (
                              has_direct
                              or (claim_ref_count >= 1 and impl_marker_count >= 1)
                              or (fingerprint_hit_count >= 1 and impl_marker_count >= 1)
                              or fingerprint_hit_count >= 2
                              or (strong_restatement_count >= 1 and claim_style_count >= 1 and impl_marker_count >= 1)
                              or (strong_restatement_count >= 1 and weak_restatement_count >= 1 and impl_marker_count >= 1)
                              or (strong_restatement_count >= 1 and claim_style_count >= 1)
                              or (weak_restatement_count >= 1 and claim_style_count >= 2 and impl_marker_count >= 1)
                              or (rewritten_signal_total >= 2 and (impl_marker_count >= 1 or claim_style_count >= 1))
                              or (low_trust_effect_count >= 1 and (impl_marker_count >= 1 or rewritten_signal_total >= 1))
                          )
                          if should_drop:
                              local_trace["removed_claim_like_impl_clusters"] += 1
                              if has_direct or strong_restatement_count >= 1 or fingerprint_hit_count >= 1:
                                  local_trace["removed_claim_restatement_clusters"] += 1
                              i = j
                              continue
                          kept.extend(cluster)
                          i = j
                          continue
                      kept.append(paragraph)
                      i += 1
                  cleaned_body = normalize_long_text("\n\n".join(kept))
                  if title:
                      return (f"{title}\n{cleaned_body}" if cleaned_body else title), local_trace
                  return cleaned_body, local_trace

              def cleanup_fallback_section(section_text, claim_text):
                  fingerprints = extract_claim_fingerprints(claim_text)
                  local_trace = {
                      "removed_direct_claim_ref_paragraphs": 0,
                      "removed_claim_restatement_clusters": 0,
                      "removed_claim_like_impl_clusters": 0,
                      "fallback_used": False,
                  }
                  sections = split_top_level_sections(section_text)
                  if not sections:
                      return normalize_long_text(section_text), local_trace
                  title, body = sections[0]
                  paragraphs = [part.strip() for part in re.split(r"\n\s*\n", body) if part.strip()]
                  kept = []
                  for paragraph in paragraphs:
                      normalized = normalize_text(paragraph)
                      fingerprint_count = fingerprint_hits(normalized, fingerprints)
                      strong_hits, weak_hits = restatement_hits(normalized)
                      morphology_score = claim_morphology_score(normalized) + min(2, fingerprint_count)
                      lacks_detail_anchor = not has_detail_anchor(normalized)
                      direct_like = has_direct_claim_ref(normalized) or bool(re.search(r"权利要求\s*\d+", normalized))
                      rewritten_like = rewritten_spec_signal_count(normalized) >= 2
                      should_drop = lacks_detail_anchor and (
                          direct_like
                          or morphology_score >= 4
                          or (morphology_score >= 3 and rewritten_like)
                          or (strong_hits >= 1 and "所述" in normalized)
                          or (normalized.startswith("在一种可能的实施方式中") and morphology_score >= 3)
                          or is_low_trust_effect_paragraph(normalized)
                      )
                      if should_drop:
                          local_trace["removed_claim_like_impl_clusters"] += 1
                          if direct_like or strong_hits >= 1 or fingerprint_count >= 1:
                              local_trace["removed_claim_restatement_clusters"] += 1
                          continue
                      kept.append(paragraph)
                  cleaned_body = normalize_long_text("\n\n".join(kept))
                  if title:
                      return (f"{title}\n{cleaned_body}" if cleaned_body else title), local_trace
                  return cleaned_body, local_trace

              def merge_cleanup_trace(target, local_trace):
                  for key in ("removed_direct_claim_ref_paragraphs", "removed_claim_restatement_clusters", "removed_claim_like_impl_clusters"):
                      target[key] = int(target.get(key, 0)) + int(local_trace.get(key, 0))

              def cleanup_specification_sections(text, claim_text, cleanup_trace):
                  wrapper_only = normalize_long_text(text)
                  section_status_map = {}
                  kept_summary = []
                  dropped_summary = []
                  cleaned_sections = []
                  sections = split_top_level_sections(wrapper_only)
                  if not sections:
                      return wrapper_only, section_status_map, kept_summary, dropped_summary
                  for index, (section_title, section_body) in enumerate(sections, start=1):
                      label = section_title or f"正文前段{index}"
                      original_section = normalize_long_text(f"{section_title}\n{section_body}" if section_title else section_body)
                      if not original_section:
                          continue
                      if not section_title or section_title not in AGGRESSIVE_STRIP_SECTIONS or not section_body:
                          cleaned_section = original_section
                          status = "kept"
                      else:
                          candidate, local_trace = cleanup_aggressive_section(original_section, claim_text)
                          original_len = dense_length(original_section)
                          candidate_len = dense_length(candidate)
                          if candidate and not (original_len > 200 and candidate_len < max(80, original_len // 4)):
                              cleaned_section = candidate
                              merge_cleanup_trace(cleanup_trace, local_trace)
                              status = "cleaned" if candidate_len < original_len else "kept"
                              if local_trace.get("removed_claim_like_impl_clusters"):
                                  dropped_summary.append(f"{label}: removed_clusters={local_trace.get('removed_claim_like_impl_clusters')}")
                          else:
                              fallback_candidate, fallback_trace = cleanup_fallback_section(original_section, claim_text)
                              fallback_len = dense_length(fallback_candidate)
                              if fallback_candidate and fallback_len < original_len and fallback_len >= max(80, original_len // 3):
                                  cleaned_section = fallback_candidate
                                  merge_cleanup_trace(cleanup_trace, fallback_trace)
                                  status = "cleaned"
                                  if fallback_trace.get("removed_claim_like_impl_clusters"):
                                      dropped_summary.append(f"{label}: removed_clusters={fallback_trace.get('removed_claim_like_impl_clusters')}")
                              else:
                                  cleaned_section = original_section
                                  cleanup_trace["fallback_used"] = True
                                  status = "section_fallback"
                      section_status_map[label] = status
                      kept_summary.append(f"{label}:{status}")
                      cleaned_sections.append(cleaned_section)
                  return normalize_long_text("\n\n".join(part for part in cleaned_sections if normalize_long_text(part))), section_status_map, kept_summary, dropped_summary

              raw_application_title = normalize_text(application_title)
