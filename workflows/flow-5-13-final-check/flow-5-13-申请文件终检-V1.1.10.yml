    - data:
        code: |
          def main(normalized_input: dict, patent_type_draft: dict) -> dict:
              import json
              import re

              def ensure_dict(value):
                  return value if isinstance(value, dict) else {}

              def ensure_list(value):
                  return value if isinstance(value, list) else []

              def normalize_whitespace(value):
                  return re.sub(r"\s+", " ", str(value or "")).strip()

              def normalize_enum(value, allowed, default):
                  text = normalize_whitespace(value)
                  return text if text in allowed else default

              def dedupe_texts(items):
                  seen = set()
                  result = []
                  for item in ensure_list(items):
                      text = normalize_whitespace(item)
                      if not text:
                          continue
                      key = re.sub(r"[\W_]+", "", text.lower())
                      if key in seen:
                          continue
                      seen.add(key)
                      result.append(text)
                  return result

              def replace_claim_token(text):
                  def repl(match):
                      return f"权利要求{match.group(1)}"
                  text = re.sub(r"\bClaim\s*(\d+(?:\s*[-~至]\s*\d+)?)", repl, text, flags=re.IGNORECASE)
                  text = re.sub(r"\bClaims\s*(\d+(?:\s*[-~至]\s*\d+)?)", repl, text, flags=re.IGNORECASE)
                  return text

              def sanitize_process_text(value):
                  return replace_claim_token(normalize_whitespace(value))

              def clamp_confidence(candidate, upper_bound):
                  rank = {"high": 0, "medium": 1, "low": 2}
                  current = candidate if candidate in rank else "medium"
                  bound = upper_bound if upper_bound in rank else "medium"
                  return current if rank[current] >= rank[bound] else bound

              def contains_quantified_effect(text):
                  text = normalize_whitespace(text)
                  return bool(
                      re.search(r"\d+\s*(?:[-~至]\s*\d+)?\s*%|\d+\s*倍|一倍以上|两倍以上|降低\s*\d+\s*(?:[-~至]\s*\d+)?\s*%|提升\s*\d+\s*(?:[-~至]\s*\d+)?\s*%", text)
                  )

              def soften_quantified_evidence(items):
                  softened = []
                  replaced = False
                  for item in ensure_list(items):
                      text = sanitize_process_text(item)
                      if contains_quantified_effect(text):
                          softened.append("说明书记载了若干有益效果表述，但当前边界条件下仍需谨慎看待其证明强度。")
                          replaced = True
                      else:
                          softened.append(text)
                  return dedupe_texts(softened), replaced

              def soften_reason_summary(text):
                  text = sanitize_process_text(text)
                  if not text:
                      return text
                  text = re.sub(r"充分支持创造性评价|充分支持发明专利(?:定位|判断)", "可作为继续按发明专利口径审计的初步背景，但证明强度仍需谨慎复核", text)
                  text = re.sub(r"明显支持发明专利(?:定位|判断)|足以支持发明专利(?:定位|判断)", "可作为继续按发明专利口径审计的辅助信号，但仍需谨慎复核", text)
                  if contains_quantified_effect(text):
                      return "说明书记载了若干有益效果表述，但在当前边界条件下，这些内容更适合作为继续按发明口径审计的辅助背景，尚不宜直接作为核心判断依据。"
                  return text

              normalized_input = ensure_dict(normalized_input)
              draft = ensure_dict(patent_type_draft)

              boundary_status = normalize_enum(
                  normalized_input.get("boundary_status"),
                  {"clean", "recovered_from_mixed_file", "recovered_from_mixed_specification", "ambiguous"},
                  "ambiguous",
              )
              boundary_confidence = normalize_enum(normalized_input.get("boundary_confidence"), {"high", "medium", "low"}, "medium")
              analysis_scope = normalize_enum(
                  normalized_input.get("analysis_scope"),
                  {"claims_only", "specification_only", "full_application", "partial_application", "none"},
                  "partial_application",
              )

              invention = normalize_enum(draft.get("invention_feasibility"), {"adequate", "inadequate", "unclear"}, "unclear")
              utility = normalize_enum(draft.get("utility_model_feasibility"), {"adequate", "inadequate", "unclear"}, "unclear")
              mismatch = normalize_enum(draft.get("mismatch_level"), {"none", "warning", "blocking"}, "warning")
              candidate_confidence = normalize_enum(draft.get("confidence_candidate"), {"high", "medium", "low"}, "medium")
              evidence_points = dedupe_texts([sanitize_process_text(item) for item in ensure_list(draft.get("evidence_points"))])[:3]
              warnings = dedupe_texts(draft.get("assessment_warnings"))
              candidate_reason = sanitize_process_text(draft.get("reason_summary_draft"))
              agent_notice = sanitize_process_text(draft.get("agent_notice"))
              method_claims_present = bool(draft.get("method_claims_present"))
              process_logic_present = bool(draft.get("process_logic_present"))
              device_structure_dominant = bool(draft.get("device_structure_dominant"))

              if invention == "adequate":
                  review_mode = "invention"
                  recommended = "invention"
              elif invention == "inadequate" and utility == "adequate":
                  review_mode = "utility_model"
                  recommended = "utility_model"
              else:
                  review_mode = "manual_review"
                  recommended = "manual_review"

              confidence_upper_bound = "medium"
              if (
                  boundary_status == "clean"
                  and analysis_scope == "full_application"
                  and invention == "adequate"
                  and utility != "adequate"
              ):
                  confidence_upper_bound = "high"
              if invention == "adequate" and utility == "adequate":
                  confidence_upper_bound = "medium"
              if analysis_scope != "full_application":
                  confidence_upper_bound = "medium"
              if review_mode == "manual_review":
                  confidence_upper_bound = "low" if analysis_scope == "none" else "medium"

              confidence = clamp_confidence(candidate_confidence, confidence_upper_bound)
              low_boundary = boundary_status == "ambiguous" or boundary_confidence == "low"
              cautious_boundary = (
                  low_boundary
                  or boundary_status != "clean"
                  or boundary_confidence != "high"
                  or analysis_scope != "full_application"
              )
              quantified_signal_present = any(contains_quantified_effect(item) for item in evidence_points) or contains_quantified_effect(candidate_reason)
              if cautious_boundary and quantified_signal_present:
                  evidence_points, replaced_quantified_evidence = soften_quantified_evidence(evidence_points)
                  candidate_reason = soften_reason_summary(candidate_reason)
                  if quantified_signal_present or replaced_quantified_evidence:
                      warnings = dedupe_texts(warnings + ["当前量化效果表述仅作为弱背景信号处理，不作为申请类型判断的核心依据。"])

              if invention == "adequate" and utility == "adequate":
                  reason_summary = "现有材料更适合按发明专利口径继续审计，但其中部分内容亦可按实用新型理解，故当前把握度按谨慎口径控制为中。"
              elif review_mode == "utility_model":
                  reason_summary = candidate_reason or "当前材料以结构/构造改进为主，按实用新型口径继续审计更贴近现有文本重心。"
              elif review_mode == "manual_review":
                  reason_summary = candidate_reason or "当前材料的申请类型适配仍需代理师结合申请目标进一步人工判断。"
              else:
                  reason_summary = candidate_reason or "现有材料更适合按发明专利口径继续审计。"

              if analysis_scope != "full_application":
                  reason_summary = re.sub(r"完全符合发明专利审查深度|可直接按发明专利提交", "可继续按发明专利口径进行有限审计", reason_summary)
              if boundary_status == "ambiguous":
                  reason_summary = re.sub(r"把握度高|高度明确|明确适合", "当前边界仍需谨慎复核", reason_summary)
              if cautious_boundary:
                  reason_summary = soften_reason_summary(reason_summary)
              reason_summary = normalize_whitespace(reason_summary)

              if not agent_notice:
                  if review_mode == "manual_review":
                      agent_notice = "建议代理师先确认申请目标及材料完整性，再决定最终申请类型。"
                  elif confidence == "medium":
                      agent_notice = "当前类型判断可以作为终审口径参考，但仍建议代理师结合客户提交目标做最终把关。"
                  else:
                      agent_notice = "当前类型判断可作为后续终审口径，但仍不替代代理师最终法律判断。"

              if analysis_scope == "none":
                  review_mode = "manual_review"
                  recommended = "manual_review"
                  confidence = "low"
                  mismatch = "warning"
                  if not evidence_points:
                      evidence_points = ["当前可用材料不足，无法形成稳定的类型判断依据。"]
                  reason_summary = "当前可用正文不足，暂无法形成稳定的申请类型适配判断。"
                  agent_notice = "请先补齐至少一类可审正文后，再进行申请类型终判。"

              patent_type_assessment = {
                  "schema_version": "PatentTypeAssessmentV1",
                  "recommended_patent_type": recommended,
                  "invention_feasibility": invention,
                  "utility_model_feasibility": utility,
                  "review_mode": review_mode,
                  "mismatch_level": mismatch,
                  "reason_summary": reason_summary,
                  "evidence_points": evidence_points,
                  "confidence_level": confidence,
                  "agent_notice": agent_notice,
                  "assessment_warnings": dedupe_texts(
                      warnings
                      + (
