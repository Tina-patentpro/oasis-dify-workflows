                      )
                  return cleaned_blocks

              def ensure_required_report_sections(blocks, audit_obj, assessment_obj):
                  blocks = [normalize_block(item) for item in ensure_list(blocks) if clean_text(ensure_dict(item).get("section_key"))]
                  cleaned_blocks = []
                  for block in blocks:
                      if block["section_key"] in {"report_section_1", "report_section_2", "report_section_3", "report_section_6", "report_section_7"} and (not block["text"] or is_placeholder_only(block["text"])):
                          continue
                      cleaned_blocks.append(block)
                  if not has_real_section_block(cleaned_blocks, "report_section_1"):
                      conclusion_text = build_report_conclusion_fallback(audit_obj, assessment_obj)
                      if conclusion_text:
                          cleaned_blocks.append(
                              {
                                  "block_id": "rep-1-fallback",
                                  "section_key": "report_section_1",
                                  "source_id": "conclusion-fallback",
                                  "source_type": "deterministic_fallback",
                                  "text": conclusion_text,
                              }
                          )
                  if not has_real_section_block(cleaned_blocks, "report_section_2"):
                      boundary_text = build_boundary_report_fallback(audit_obj)
                      if boundary_text:
                          cleaned_blocks.append(
                              {
                                  "block_id": "rep-2-fallback",
                                  "section_key": "report_section_2",
                                  "source_id": "boundary-fallback",
                                  "source_type": "deterministic_fallback",
                                  "text": boundary_text,
                              }
                          )
                  if not has_real_section_block(cleaned_blocks, "report_section_3"):
                      patent_text = build_patent_type_report_fallback(assessment_obj)
                      if patent_text:
                          cleaned_blocks.append(
                              {
                                  "block_id": "rep-3-fallback",
                                  "section_key": "report_section_3",
                                  "source_id": "patent-type-fallback",
                                  "source_type": "deterministic_fallback",
                                  "text": patent_text,
                              }
                          )
                  if not has_real_section_block(cleaned_blocks, "report_section_6"):
                      cleaned_blocks.append(
                          {
                              "block_id": "rep-6-fallback",
                              "section_key": "report_section_6",
                              "source_id": "question-fallback",
                              "source_type": "deterministic_fallback",
                              "text": build_report_question_fallback(audit_obj),
                          }
                      )
                  if not has_real_section_block(cleaned_blocks, "report_section_7"):
                      cleaned_blocks.append(
                          {
                              "block_id": "rep-7-fallback",
                              "section_key": "report_section_7",
                              "source_id": "action-fallback",
