    - data:
        code: |
          def main(normalized_input: dict, patent_type_assessment: dict, legal_review: dict, strategy_review: dict, drafting_review: dict) -> dict:
              import copy
              import hashlib
              import json
              import re

              ROOT_CAUSES = {
                  "antecedent_basis",
                  "support_enablement",
                  "clarity",
                  "claim_structure",
                  "narrow_scope",
                  "angle_range_clarity",
                  "fallback",
                  "inventiveness_risk",
                  "term_consistency",
                  "formality",
                  "figure_support",
                  "abstract_title",
                  "unknown",
              }
              PRIMARY_MATRIX = {
                  "legal_support_review": {"antecedent_basis", "support_enablement", "clarity", "claim_structure"},
                  "protection_strategy_review": {"narrow_scope", "angle_range_clarity", "fallback", "inventiveness_risk"},
                  "drafting_formality_review": {"term_consistency", "formality", "figure_support", "abstract_title"},
              }
              ISSUE_CATEGORY_ALLOWED = {
                  "claim_structure",
                  "support",
                  "enablement",
                  "clarity",
                  "overbreadth",
                  "protection_strategy",
                  "fallback",
                  "inventiveness_risk",
                  "term_consistency",
                  "formality",
                  "abstract_title",
                  "drafting_quality",
                  "unknown",
              }

              def ensure_dict(value):
                  return value if isinstance(value, dict) else {}

              def ensure_list(value):
                  return value if isinstance(value, list) else []

              def normalize_whitespace(value):
                  return re.sub(r"\s+", " ", str(value or "")).strip()

              def normalize_enum(value, allowed, default):
                  text = normalize_whitespace(value)
                  return text if text in allowed else default

              def normalize_compact(value):
                  text = normalize_whitespace(value).lower()
                  replacements = {
                      "（": "(",
                      "）": ")",
                      "【": "[",
                      "】": "]",
                      "“": '"',
                      "”": '"',
                      "‘": "'",
                      "’": "'",
                      "－": "-",
                      "—": "-",
                      "–": "-",
                      "＋": "+",
                      "／": "/",
                      "：": ":",
                      "；": ";",
                      "，": ",",
                      "。": ".",
                  }
                  for old, new in replacements.items():
                      text = text.replace(old, new)
                  text = text.replace("+/-", "±")
                  text = re.sub(r"[\W_]+", "", text)
                  return text

              def dedupe_texts(items):
                  seen = set()
                  result = []
                  for item in ensure_list(items):
                      text = normalize_whitespace(item)
                      if not text:
                          continue
                      key = normalize_compact(text)
                      if key in seen:
                          continue
                      seen.add(key)
                      result.append(text)
                  return result

              def join_texts(items, limit=2):
                  texts = dedupe_texts(items)
                  return " ".join(texts[:limit]).strip()

              def ensure_sentence(text):
                  text = normalize_whitespace(text)
                  if not text:
                      return ""
                  if text[-1] not in "。！？":
                      text += "。"
                  return text

              def dedupe_structured_records(items, text_keys):
                  seen = set()
                  result = []
                  for item in ensure_list(items):
                      if not isinstance(item, dict):
                          continue
                      root = normalize_whitespace(item.get("normalized_root_cause")) or "unknown"
                      text_parts = [normalize_whitespace(item.get(key)) for key in ensure_list(text_keys)]
                      text = " ".join(part for part in text_parts if part)
                      if not text:
                          continue
                      key = f"{root}||{normalize_compact(text)}"
                      if key in seen:
                          continue
                      seen.add(key)
                      result.append(item)
                  return result

              def build_group_key(item):
                  location = ensure_dict(item.get("location"))
                  root = normalize_whitespace(item.get("normalized_root_cause")) or "unknown"
                  issue_category = normalize_whitespace(item.get("issue_category")) or "unknown"
                  impact_scope = normalize_whitespace(item.get("impact_scope")) or "unknown"
                  claim_no = normalize_whitespace(location.get("claim_no")) or "_"
                  term_refs = normalize_compact(" ".join(ensure_list(location.get("term_refs"))[:3])) or "_"
                  return "||".join([root, issue_category, impact_scope, claim_no, term_refs])

              def build_client_group_key(item):
                  summary_signature = normalize_compact(
                      normalize_whitespace(item.get("client_safe_summary") or item.get("issue") or item.get("blocking_reason"))
                  )[:80] or "_"
                  bucket = normalize_whitespace(item.get("bucket")) or "info"
                  severity = normalize_whitespace(item.get("severity")) or "info"
                  return "||".join([build_group_key(item), bucket, severity, summary_signature])

              def merge_enum_values(items, key, limit=2):
                  merged = []
                  for item in ensure_list(items):
                      value = normalize_whitespace(ensure_dict(item).get(key))
                      if value:
                          merged.append(value)
                  return dedupe_texts(merged)[:limit]

              def build_location_summary(location):
                  location = ensure_dict(location)
                  claim_no = normalize_whitespace(location.get("claim_no"))
                  if claim_no.lower() in {"none", "null", "unknown", "n/a", "na"}:
                      claim_no = ""
                  sections = []
                  for item in dedupe_texts(location.get("section_titles"))[:2]:
                      normalized_section = normalize_whitespace(item)
                      if not normalized_section:
                          continue
                      if normalized_section in {"标题", "标题部分", "申请标题"}:
                          normalized_section = "说明书标题部分"
                      elif "标题" in normalized_section and "说明书" not in normalized_section and "全案" not in normalized_section:
                          normalized_section = "说明书标题部分"
                      sections.append(normalized_section)
                  figures = dedupe_texts(location.get("figure_nos"))[:2]
                  terms = dedupe_texts(location.get("term_refs"))[:2]
                  if claim_no and sections:
                      return f"权利要求{claim_no}及{sections[0]}"
                  if claim_no:
                      return f"权利要求{claim_no}"
                  if sections and figures:
                      return f"{sections[0]}（附图{figures[0]}）"
                  if sections:
                      return sections[0]
                  if figures:
                      return f"附图{figures[0]}"
                  if terms:
                      return f"涉及“{terms[0]}”的对应位置"
                  return "相关权利要求及说明书对应位置"

              def build_risk_basis_fallback(family_type, merged_location, lead, group_items):
                  explicit = join_texts(
                      [
                          item.get("legal_risk")
                          or item.get("why_this_draft_triggers_it")
                          or item.get("legal_risk_fact")
                          for item in group_items
                      ],
                      2,
                  )
                  if explicit:
                      return ensure_sentence(explicit)

                  location_summary = build_location_summary(merged_location)
                  issue_summary = normalize_whitespace(
                      lead.get("client_safe_summary") or lead.get("blocking_reason") or lead.get("issue")
                  )
                  symptom_summary = join_texts(
                      [
                          item
                          for group in [ensure_list(lead.get("symptom_facts"))]
                          + [ensure_list(item.get("symptom_facts")) for item in ensure_list(group_items)]
                          for item in group
                      ],
                      2,
                  )
                  compact = normalize_compact(" ".join([family_type, issue_summary, normalize_whitespace(lead.get("issue_category"))]))

                  if family_type == "term_consistency" or any(token in compact for token in ["术语", "称呼", "命名", "不一致"]):
                      return ensure_sentence(
                          f"{location_summary}处的术语指代当前仍不一致，可能影响保护范围与说明书记载之间的一致性判断"
                      )
                  if any(token in compact for token in ["笔误", "误写", "错字", "编号"]):
                      return ensure_sentence(
                          f"{location_summary}处当前仍存在文本准确性风险，可能增加后续审查沟通与解释成本"
                      )
                  if family_type in {"clarity", "angle_range_clarity"} or any(token in compact for token in ["范围", "角度", "参数", "明确"]):
                      return ensure_sentence(
                          f"{location_summary}处的表述边界目前不够明确，可能影响保护范围的稳定性"
                      )
                  if family_type in {"support_enablement", "antecedent_basis"} or any(token in compact for token in ["支撑", "前序", "引用基础"]):
                      return ensure_sentence(
                          f"{location_summary}处当前仍缺少足够清晰的说明书对应支撑，可能被继续追问其对应关系是否充分"
                      )
                  if symptom_summary:
                      return ensure_sentence(
                          f"{location_summary}处当前可见的稿件症状为：{symptom_summary}，该症状仍可能引发表述准确性、支撑关系或保护范围稳定性的后续审查关注"
                      )
                  return ensure_sentence(
                      f"{location_summary}处当前仍存在需要继续澄清的稿件症状，后续审查中可能围绕其表述准确性、支撑关系或保护范围稳定性继续追问"
                  )

              def merge_locations(items):
                  claim_nos = []
                  paragraph_ids = []
                  figure_nos = []
                  section_titles = []
                  term_refs = []
                  for item in ensure_list(items):
                      location = ensure_dict(item.get("location"))
                      claim_nos.append(location.get("claim_no"))
                      paragraph_ids.extend(ensure_list(location.get("paragraph_ids")))
                      figure_nos.extend(ensure_list(location.get("figure_nos")))
                      section_titles.extend(ensure_list(location.get("section_titles")))
                      term_refs.extend(ensure_list(location.get("term_refs")))
                  claim_no = "、".join(dedupe_texts(claim_nos)[:2])
                  return {
                      "claim_no": claim_no,
                      "paragraph_ids": dedupe_texts(paragraph_ids),
                      "figure_nos": dedupe_texts(figure_nos),
                      "section_titles": dedupe_texts(section_titles),
                      "term_refs": dedupe_texts(term_refs),
                  }

              def sort_items(items):
                  bucket_rank = {"block": 0, "warning": 1, "manual_review": 2}
                  severity_rank = {"block": 0, "warn": 1, "review": 2, "info": 3}
                  priority_rank = {"p0_immediate": 0, "p1_high": 1, "p2_medium": 2, "p3_low": 3}
                  return sorted(
                      ensure_list(items),
                      key=lambda item: (
                          bucket_rank.get(normalize_whitespace(item.get("bucket")), 9),
                          severity_rank.get(normalize_whitespace(item.get("severity")), 9),
                          priority_rank.get(normalize_whitespace(item.get("fix_priority")), 9),
                          normalize_whitespace(item.get("finding_id")),
                      ),
                  )

              def infer_root_cause(item, source_review):
                  raw = normalize_whitespace(item.get("normalized_root_cause"))
                  if raw in ROOT_CAUSES:
                      return raw
                  text = " ".join(
                      [
                          normalize_whitespace(item.get("issue")),
                          normalize_whitespace(item.get("blocking_reason")),
                          normalize_whitespace(item.get("recommendation")),
                          normalize_whitespace(item.get("client_safe_summary")),
                          normalize_whitespace(item.get("suggested_revision_direction")),
                          normalize_whitespace(item.get("issue_category")),
                      ]
                  )
                  compact = normalize_compact(text)
                  if any(token in compact for token in ["术语", "称谓", "名称不一致", "术语不一致"]):
                      return "term_consistency"
                  if any(token in compact for token in ["图号", "附图", "标号", "图文"]):
                      return "figure_support"
                  if any(token in compact for token in ["前序", "引用基础", "根据权利要求", "引用不清"]):
                      return "antecedent_basis"
                  if any(token in compact for token in ["支撑", "公开不充分", "可实施", "实施方式不足"]):
                      return "support_enablement"
                  if any(token in compact for token in ["不清楚", "明确性", "功能性", "表述不明"]):
                      return "clarity"
                  if any(token in compact for token in ["保护范围偏窄", "主权项过细", "易规避", "过窄"]):
                      return "narrow_scope"
                  if any(token in compact for token in ["角度范围", "参数范围", "±", "角度"]):
                      return "angle_range_clarity"
                  if any(token in compact for token in ["退路", "从属", "修改基础"]):
                      return "fallback"
                  if "创造性" in compact:
                      return "inventiveness_risk"
                  if any(token in compact for token in ["摘要", "标题"]):
                      return "abstract_title"
                  if any(token in compact for token in ["形式", "xml", "格式"]):
                      return "formality"
                  if any(token in compact for token in ["权项结构", "独立权利要求", "权利要求结构"]):
                      return "claim_structure"
                  fallback = {
                      "legal_support_review": "clarity",
                      "protection_strategy_review": "narrow_scope",
                      "drafting_formality_review": "formality",
                  }
                  return fallback.get(source_review, "unknown")

              def normalize_patent_type_assessment(value):
                  raw = ensure_dict(value)
                  review_mode = normalize_enum(raw.get("review_mode"), {"invention", "utility_model", "manual_review"}, "manual_review")
                  recommended = normalize_enum(raw.get("recommended_patent_type"), {"invention", "utility_model", "manual_review"}, review_mode)
                  invention = normalize_enum(raw.get("invention_feasibility"), {"adequate", "inadequate", "unclear"}, "unclear")
                  utility = normalize_enum(raw.get("utility_model_feasibility"), {"adequate", "inadequate", "unclear"}, "unclear")
                  mismatch = normalize_enum(raw.get("mismatch_level"), {"none", "warning", "blocking"}, "warning")
                  confidence = normalize_enum(raw.get("confidence_level"), {"high", "medium", "low"}, "low")
                  return {
                      "schema_version": "PatentTypeAssessmentV1",
                      "recommended_patent_type": recommended,
                      "invention_feasibility": invention,
                      "utility_model_feasibility": utility,
                      "review_mode": review_mode,
                      "mismatch_level": mismatch,
                      "reason_summary": normalize_whitespace(raw.get("reason_summary")),
                      "evidence_points": dedupe_texts(raw.get("evidence_points"))[:3],
                      "confidence_level": confidence,
                      "agent_notice": normalize_whitespace(raw.get("agent_notice")),
                      "assessment_warnings": dedupe_texts(raw.get("assessment_warnings"))[:4],
                  }

              def normalize_finding(item, source_review, index):
                  issue_category = normalize_enum(item.get("issue_category"), ISSUE_CATEGORY_ALLOWED, "unknown")
                  root_cause = infer_root_cause(item, source_review)
                  ownership = "primary" if root_cause in PRIMARY_MATRIX.get(source_review, set()) else "support_only"
                  location = ensure_dict(item.get("location"))
                  normalized = {
                      "finding_id": normalize_whitespace(item.get("finding_id")) or f"{source_review}-{index + 1}",
                      "gate_id": normalize_whitespace(item.get("gate_id")),
                      "gate_name": normalize_whitespace(item.get("gate_name")),
                      "issue_category": issue_category,
                      "normalized_root_cause": root_cause,
                      "ownership": ownership,
                      "bucket": normalize_enum(item.get("bucket"), {"block", "warning", "manual_review"}, "manual_review"),
                      "severity": normalize_enum(item.get("severity"), {"block", "warn", "review", "info"}, "review"),
                      "audience": normalize_enum(item.get("audience"), {"internal", "client", "both"}, "internal"),
                      "certainty_level": normalize_enum(item.get("certainty_level"), {"confirmed", "highly_likely", "plausible", "insufficient_info"}, "plausible"),
                      "claim_scope": normalize_enum(item.get("claim_scope"), {"independent", "dependent", "global", "unknown"}, "unknown"),
                      "impact_scope": normalize_enum(item.get("impact_scope"), {"claim_1", "independent_claims", "dependent_claims", "specification", "abstract_drawings", "global", "unknown"}, "unknown"),
                      "location": {
                          "claim_no": normalize_whitespace(location.get("claim_no")),
                          "paragraph_ids": dedupe_texts(location.get("paragraph_ids")),
                          "figure_nos": dedupe_texts(location.get("figure_nos")),
                          "section_titles": dedupe_texts(location.get("section_titles")),
                          "term_refs": dedupe_texts(location.get("term_refs")),
                      },
                      "issue": normalize_whitespace(item.get("issue")),
                      "legal_basis": dedupe_texts(item.get("legal_basis")),
                      "evidence": normalize_whitespace(item.get("evidence")),
                      "blocking_reason": normalize_whitespace(item.get("blocking_reason")),
                      "recommendation": normalize_whitespace(item.get("recommendation")),
                      "fix_priority": normalize_enum(item.get("fix_priority"), {"p0_immediate", "p1_high", "p2_medium", "p3_low"}, "p2_medium"),
                      "required_client_material": dedupe_texts(item.get("required_client_material")),
                      "suggested_revision_direction": normalize_whitespace(item.get("suggested_revision_direction")),
                      "client_safe_summary": normalize_whitespace(item.get("client_safe_summary")),
                      "source_review": source_review,
                  }
                  if ownership == "support_only":
                      normalized["audience"] = "internal"
                      normalized["blocking_reason"] = ""
                      normalized["recommendation"] = ""
                      normalized["required_client_material"] = []
                      normalized["suggested_revision_direction"] = ""
                      normalized["client_safe_summary"] = ""
                  return normalized

              def normalize_inventor_question(item, source_review, index):
                  raw = ensure_dict(item)
                  normalized = {
                      "question_id": normalize_whitespace(raw.get("question_id")) or f"{source_review}-question-{index + 1}",
                      "priority": normalize_enum(raw.get("priority"), {"p0_immediate", "p1_high", "p2_medium", "p3_low"}, "p2_medium"),
                      "blocking_related": bool(raw.get("blocking_related")),
                      "target_section": normalize_whitespace(raw.get("target_section")),
                      "why_needed": normalize_whitespace(raw.get("why_needed")),
                      "question_text": normalize_whitespace(raw.get("question_text")),
                      "expected_answer_format": normalize_whitespace(raw.get("expected_answer_format")),
                      "source_review": source_review,
                  }
                  normalized["normalized_root_cause"] = infer_root_cause(
                      {
                          "issue": normalized.get("question_text"),
                          "blocking_reason": normalized.get("why_needed"),
                          "recommendation": normalized.get("expected_answer_format"),
                          "client_safe_summary": normalized.get("target_section"),
                      },
                      source_review,
                  )
                  return normalized

              def normalize_human_action(item, source_review, index):
                  raw = ensure_dict(item)
                  normalized = {
                      "action_id": normalize_whitespace(raw.get("action_id")) or f"{source_review}-action-{index + 1}",
                      "priority": normalize_enum(raw.get("priority"), {"p0_immediate", "p1_high", "p2_medium", "p3_low"}, "p2_medium"),
                      "owner": normalize_enum(raw.get("owner"), {"agent", "inventor", "joint"}, "agent"),
                      "blocking_related": bool(raw.get("blocking_related")),
                      "objective": normalize_whitespace(raw.get("objective")),
                      "action_text": normalize_whitespace(raw.get("action_text")),
                      "related_gate_ids": dedupe_texts(raw.get("related_gate_ids")),
                      "source_review": source_review,
                  }
                  normalized["normalized_root_cause"] = infer_root_cause(
                      {
                          "issue": normalized.get("action_text"),
                          "blocking_reason": normalized.get("objective"),
                          "recommendation": " ".join(normalized.get("related_gate_ids", [])),
                      },
                      source_review,
                  )
                  return normalized

              def normalize_review(review, source_review):
                  raw = ensure_dict(review)
                  findings = [normalize_finding(item, source_review, index) for index, item in enumerate(ensure_list(raw.get("findings"))) if isinstance(item, dict)]
                  inventor_questions = [normalize_inventor_question(item, source_review, index) for index, item in enumerate(ensure_list(raw.get("inventor_questions"))) if isinstance(item, dict)]
                  recommended_human_actions = [normalize_human_action(item, source_review, index) for index, item in enumerate(ensure_list(raw.get("recommended_human_actions"))) if isinstance(item, dict)]
                  return {
                      "review_name": source_review,
                      "review_status": normalize_enum(raw.get("review_status"), {"ok", "insufficient_input", "invalid_input"}, "invalid_input"),
                      "gate_signal": normalize_enum(raw.get("gate_signal"), {"pass", "warn", "block", "review"}, "review"),
                      "review_conclusion": normalize_whitespace(raw.get("review_conclusion")),
                      "gate_summaries": ensure_list(raw.get("gate_summaries")),
                      "findings": findings,
                      "inventor_questions_internal": inventor_questions,
                      "recommended_human_actions_internal": recommended_human_actions,
                  }

              def build_boundary_statement(analysis_scope, recovery_mode, boundary_notice):
                  if analysis_scope == "full_application" and recovery_mode == "split_from_claims_file":
                      return "说明书未单独上传，但已从上传的申请文件中拆分出说明书内容并纳入审计。"
                  if analysis_scope == "full_application":
                      return "本次审计已基于可识别的权利要求书与说明书内容开展。"
                  if analysis_scope == "claims_only":
                      return "本次审计仅基于可识别的权利要求书内容开展，涉及说明书支撑与附图的结论应结合完整说明书复核。"
                  if analysis_scope == "specification_only":
                      return "本次审计主要基于说明书内容开展，权利要求书相关结论需待补充权项文本后复核。"
                  if analysis_scope == "partial_application":
                      return "本次审计基于当前可识别的部分申请材料开展，结论应结合补充文件复核。"
                  return normalize_whitespace(boundary_notice) or "当前未获得可用的权利要求书和说明书文本，本次无法形成有效终审意见，仅能提示先补齐基础材料后重新审计。"

              normalized_input = ensure_dict(normalized_input)
              analysis_scope = normalize_enum(normalized_input.get("analysis_scope"), {"claims_only", "specification_only", "full_application", "partial_application", "none"}, "partial_application")
              input_status = normalize_enum(normalized_input.get("input_status"), {"ok", "partial_input", "invalid_input", "insufficient_input"}, "ok")
              recovery_mode = normalize_enum(normalized_input.get("specification_recovery_mode"), {"none", "split_from_claims_file"}, "none")
              boundary_notice = normalize_whitespace(normalized_input.get("boundary_notice"))
              boundary_status = normalize_enum(
                  normalized_input.get("boundary_status"),
                  {"clean", "recovered_from_mixed_file", "recovered_from_mixed_specification", "ambiguous"},
                  "ambiguous",
              )
              claims_document_shape = normalize_enum(
                  normalized_input.get("claims_document_shape"),
                  {"pure_claims", "mixed_application_package", "unknown"},
                  "unknown",
              )

              patent_type = normalize_patent_type_assessment(patent_type_assessment)
              reviews = [
                  normalize_review(legal_review, "legal_support_review"),
                  normalize_review(strategy_review, "protection_strategy_review"),
                  normalize_review(drafting_review, "drafting_formality_review"),
              ]

              raw_findings = []
              review_conclusions = []
              inventor_questions_internal = []
              recommended_human_actions_internal = []
              for review in reviews:
                  raw_findings.extend(review.get("findings", []))
                  if review.get("review_conclusion"):
                      review_conclusions.append(review["review_conclusion"])
                  inventor_questions_internal.extend(review.get("inventor_questions_internal", []))
                  recommended_human_actions_internal.extend(review.get("recommended_human_actions_internal", []))

              OWNER_MATRIX = {
                  "term_consistency": "drafting_formality_review",
                  "formality": "drafting_formality_review",
                  "abstract_title": "drafting_formality_review",
                  "figure_support": "drafting_formality_review",
                  "clarity": "legal_support_review",
                  "support_enablement": "legal_support_review",
                  "antecedent_basis": "legal_support_review",
                  "claim_structure": "legal_support_review",
                  "angle_range_clarity": "protection_strategy_review",
                  "fallback": "protection_strategy_review",
                  "inventiveness_risk": "protection_strategy_review",
                  "narrow_scope": "protection_strategy_review",
              }

              def find_owner_review(item):
                  if not isinstance(item, dict):
                      return None
                  return OWNER_MATRIX.get(str(item.get("normalized_root_cause") or "").strip())

              def remap_primary_ownership(findings):
                  grouped = {}
                  for item in findings or []:
                      if not isinstance(item, dict):
                          continue
                      root = str(item.get("normalized_root_cause") or "").strip()
                      grouped.setdefault(root, []).append(item)
                  remapped = []
                  for root, items in grouped.items():
                      owner_review = OWNER_MATRIX.get(root)
                      owner_kept = False
                      for item in items:
                          cloned = copy.deepcopy(item)
                          review_name = str(cloned.get("review_name") or cloned.get("source_review") or "")
                          ownership = str(cloned.get("ownership") or cloned.get("support_role") or "")
                          if owner_review and review_name == owner_review:
                              cloned["ownership"] = "primary" if not owner_kept else "support_only"
                              cloned["support_role"] = cloned["ownership"]
                              owner_kept = True
                          elif owner_review and ownership == "primary":
                              cloned["ownership"] = "support_only"
                              cloned["support_role"] = "support_only"
                              cloned["audience"] = "internal"
                          remapped.append(cloned)
                  return remapped

              def filter_internal_contract_issues(issues):
                  filtered = []
                  for issue in issues or []:
                      issue_text = str(issue or "")
                      if "缺少主责结论" not in issue_text:
                          filtered.append(issue_text)
                          continue
                      filtered.append(issue_text)
                  return filtered

              def build_coarse_group_key(item):
                  root = str((item or {}).get("normalized_root_cause") or "").strip()
                  category = str((item or {}).get("issue_category") or "").strip()
                  return "::".join(part for part in [root, category] if part)

              raw_findings = remap_primary_ownership(raw_findings)
              inventor_questions_internal = dedupe_structured_records(inventor_questions_internal, ["question_text", "why_needed", "target_section"])
              recommended_human_actions_internal = dedupe_structured_records(recommended_human_actions_internal, ["action_text", "objective"])

              grouped = {}
              for item in raw_findings:
                  grouped.setdefault(build_coarse_group_key(item), []).append(item)

              root_cause_findings_internal = []
              root_cause_findings_client = []
              internal_contract_issues = []
              orphan_support_notes = []

              for group_key, items in grouped.items():
                  ordered = sort_items(items)
                  primary_items = [item for item in ordered if item.get("ownership") == "primary" and (item.get("client_safe_summary") or item.get("issue"))]
                  internal_lead = ordered[0]
                  group_root_cause = normalize_whitespace(internal_lead.get("normalized_root_cause")) or "unknown"
                  internal_item = {
                      "normalized_root_cause": group_root_cause,
                      "issue_category": internal_lead.get("issue_category"),
                      "source_reviews": dedupe_texts([item.get("source_review") for item in ordered]),
                      "location_pool": merge_locations(ordered),
                      "evidence_pool": dedupe_texts([item.get("evidence") for item in ordered])[:2],
                      "legal_basis": dedupe_texts(sum([ensure_list(item.get("legal_basis")) for item in ordered], []))[:3],
                      "lead_summary": normalize_whitespace(internal_lead.get("client_safe_summary") or internal_lead.get("issue")),
                  }
                  if group_root_cause == "unknown":
                      orphan_support_notes.append(
                          {
                              "source_reviews": dedupe_texts([item.get("source_review") for item in ordered]),
                              "location_pool": merge_locations(ordered),
                              "evidence_pool": dedupe_texts([item.get("evidence") for item in ordered])[:2],
                              "lead_summary": normalize_whitespace(internal_lead.get("issue") or internal_lead.get("client_safe_summary")),
                          }
                      )
                      continue
                  root_cause_findings_internal.append(internal_item)
                  if not primary_items:
                      internal_contract_issues.append(f"根因“{group_root_cause}”缺少主责结论，当前仅保留内部支撑证据。")
                      continue
                  client_grouped = {}
                  for item in primary_items:
                      client_grouped.setdefault(build_client_group_key(item), []).append(item)
                  for client_group_items in client_grouped.values():
                      client_lead = client_group_items[0]
                      client_item = {
                          "normalized_root_cause": group_root_cause,
                          "issue_category": client_lead.get("issue_category"),
                          "bucket": client_lead.get("bucket"),
                          "severity": client_lead.get("severity"),
                          "fix_priority": client_lead.get("fix_priority"),
                          "claim_scope": client_lead.get("claim_scope"),
                          "impact_scope": client_lead.get("impact_scope"),
                          "location": merge_locations(client_group_items),
                          "legal_basis": dedupe_texts(sum([ensure_list(item.get("legal_basis")) for item in client_group_items], []))[:3],
                          "evidence_points": dedupe_texts([item.get("evidence") for item in client_group_items])[:2],
                          "required_client_material": dedupe_texts(sum([ensure_list(item.get("required_client_material")) for item in client_group_items], []))[:2],
                          "client_safe_summary": normalize_whitespace(client_lead.get("client_safe_summary") or client_lead.get("issue")),
                          "blocking_reason": join_texts([item.get("blocking_reason") for item in client_group_items], 2),
                          "recommendation": join_texts([item.get("recommendation") for item in client_group_items], 2),
                          "suggested_revision_direction": join_texts([item.get("suggested_revision_direction") for item in client_group_items], 2),
                          "source_reviews": dedupe_texts([item.get("source_review") for item in client_group_items]),
                      }
                      root_cause_findings_client.append(client_item)

              root_cause_findings_internal = sort_items(root_cause_findings_internal)
              root_cause_findings_client = sort_items(root_cause_findings_client)

              ANGLE_HINTS = ("角度", "范围", "预设", "参数边界")

              def collapse_angle_range_client_findings(items):
                  grouped_by_location = {}
                  for item in ensure_list(items):
                      location = ensure_dict(item.get("location"))
                      claim_no = normalize_whitespace(location.get("claim_no"))
                      term_refs = normalize_compact(" ".join(ensure_list(location.get("term_refs"))))
                      section_refs = normalize_compact(" ".join(ensure_list(location.get("section_titles"))))
                      grouped_by_location.setdefault("||".join([claim_no, term_refs, section_refs]), []).append(item)

                  collapsed = []
                  for group_items in grouped_by_location.values():
                      angle_items = [item for item in group_items if normalize_whitespace(item.get("normalized_root_cause")) == "angle_range_clarity"]
                      clarity_items = []
                      for item in group_items:
                          if normalize_whitespace(item.get("normalized_root_cause")) != "clarity":
                              continue
                          haystacks = [
                              normalize_whitespace(item.get("client_safe_summary")),
                              normalize_whitespace(item.get("blocking_reason")),
                              normalize_whitespace(item.get("recommendation")),
                              normalize_whitespace(item.get("suggested_revision_direction")),
                          ] + [normalize_whitespace(point) for point in ensure_list(item.get("evidence_points"))]
                          if any(any(token in hay for token in ANGLE_HINTS) for hay in haystacks):
                              clarity_items.append(item)
                      if angle_items and clarity_items:
                          merged = ensure_dict(angle_items[0]).copy()
                          merged["normalized_root_cause"] = "angle_range_clarity"
                          merged["issue_category"] = "clarity"
                          merged["source_reviews"] = dedupe_texts(sum([ensure_list(item.get("source_reviews")) for item in angle_items + clarity_items], []))
                          merged["evidence_points"] = dedupe_texts(sum([ensure_list(item.get("evidence_points")) for item in angle_items + clarity_items], []))[:3]
                          merged["required_client_material"] = dedupe_texts(sum([ensure_list(item.get("required_client_material")) for item in angle_items + clarity_items], []))[:2]
                          merged["legal_basis"] = dedupe_texts(sum([ensure_list(item.get("legal_basis")) for item in angle_items + clarity_items], []))[:3]
                          merged["blocking_reason"] = join_texts([item.get("blocking_reason") for item in angle_items + clarity_items], 2)
                          merged["recommendation"] = join_texts([item.get("recommendation") for item in angle_items + clarity_items], 2)
                          merged["suggested_revision_direction"] = join_texts([item.get("suggested_revision_direction") for item in angle_items + clarity_items], 2)
                          collapsed.append(merged)
                          for item in group_items:
                              if item not in angle_items and item not in clarity_items:
                                  collapsed.append(item)
                      else:
                          collapsed.extend(group_items)
                  return sort_items(collapsed)

              root_cause_findings_client = collapse_angle_range_client_findings(root_cause_findings_client)
              report_issue_counts = {
                  "block": 0,
                  "warning": 0,
                  "manual_review": 0,
                  "info": 0,
              }
              for item in root_cause_findings_client:
                  bucket = normalize_whitespace(item.get("bucket"))
                  if bucket in report_issue_counts:
                      report_issue_counts[bucket] += 1

              review_label_map = {
                  "legal_support_review": "法律与支撑审查",
                  "protection_strategy_review": "保护范围与布局审查",
                  "drafting_formality_review": "撰稿质量与形式审查",
              }
              invalid_reviews = [review_label_map.get(review.get("review_name"), review.get("review_name")) for review in reviews if review.get("review_status") == "invalid_input"]
              insufficient_reviews = [review_label_map.get(review.get("review_name"), review.get("review_name")) for review in reviews if review.get("review_status") == "insufficient_input"]
              block_signal_reviews = [review_label_map.get(review.get("review_name"), review.get("review_name")) for review in reviews if review.get("gate_signal") == "block"]
              review_signal_reviews = [review_label_map.get(review.get("review_name"), review.get("review_name")) for review in reviews if review.get("gate_signal") == "review"]

              if invalid_reviews:
                  internal_contract_issues.append(f"以下审计维度未能获得有效输出：{'、'.join(dedupe_texts(invalid_reviews))}。当前结论需先复核节点结果后再使用。")
              if insufficient_reviews:
                  internal_contract_issues.append(f"以下审计维度仅基于不足输入形成有限判断：{'、'.join(dedupe_texts(insufficient_reviews))}。")
              if block_signal_reviews and report_issue_counts["block"] == 0:
                  internal_contract_issues.append(f"以下审计维度提示存在阻断风险但未形成主责问题：{'、'.join(dedupe_texts(block_signal_reviews))}。")
              if review_signal_reviews and report_issue_counts["manual_review"] == 0 and patent_type.get("review_mode") != "manual_review":
                  internal_contract_issues.append(f"以下审计维度建议进一步复核：{'、'.join(dedupe_texts(review_signal_reviews))}。")

              if analysis_scope == "none":
                  final_decision = "材料不足，暂无法形成有效终审意见"
                  internal_contract_issues.append("当前可用正文不足，终审结论需待补充材料后复核。")
              elif input_status == "invalid_input" or invalid_reviews:
                  final_decision = "需先复核审计结果后再行终审"
              elif report_issue_counts["block"] > 0 or block_signal_reviews:
                  final_decision = "暂不建议直接提交"
              elif patent_type.get("review_mode") == "manual_review":
                  final_decision = "建议先明确申请类型后再行终审"
              elif (
                  input_status == "partial_input"
                  or boundary_status == "ambiguous"
                  or report_issue_counts["warning"] > 0
                  or report_issue_counts["manual_review"] > 0
                  or insufficient_reviews
                  or review_signal_reviews
                  or internal_contract_issues
              ):
                  final_decision = "需补强后复审"
              else:
                  final_decision = "可进入提交前定稿"


              boundary_statement_for_internal = build_boundary_statement(analysis_scope, recovery_mode, boundary_notice)
              boundary_statement_for_formal_report = build_boundary_statement(analysis_scope, recovery_mode, boundary_notice)

              TERM_DRIFT_MARKERS = ("术语不一致", "称呼存在", "又称", "弹性连接件", "弓头弹簧", "命名漂移", "术语摇摆")
              TYPO_MARKERS = ("笔误", "误写", "文字错误", "错字", "错写", "文字笔误")

              def extract_issue_terms(*values):
                  terms = []
                  for value in values:
                      texts = value if isinstance(value, list) else [value]
                      for text in texts:
                          normalized = normalize_whitespace(text)
                          if not normalized:
                              continue
                          for match in re.findall(r"[“\"『「](.+?)[”\"』」]", normalized):
                              compact = normalize_whitespace(match)
                              if 1 < len(compact) <= 30:
                                  terms.append(compact)
                          for left, right in re.findall(r"([\u4e00-\u9fffA-Za-z0-9]+)\s*(?:与|和|/|又称)\s*([\u4e00-\u9fffA-Za-z0-9]+)", normalized):
                              if normalize_whitespace(left) and normalize_whitespace(right):
                                  terms.extend([normalize_whitespace(left), normalize_whitespace(right)])
                  return dedupe_texts(terms)[:2]

              def build_family_location_key(item):
                  location = ensure_dict(item.get("location"))
                  claim_no = normalize_whitespace(location.get("claim_no"))
                  term_refs = dedupe_texts(location.get("term_refs"))
                  sections = dedupe_texts(location.get("section_titles"))
                  parts = [claim_no, normalize_compact(" ".join(term_refs)), normalize_compact(" ".join(sections))]
                  compact = "|".join(part for part in parts if part)
                  return compact or normalize_compact(item.get("client_safe_summary"))[:80] or "general"

              def build_family_signature(item):
                  root = normalize_whitespace(item.get("normalized_root_cause")) or "unknown"
                  haystacks = [
                      normalize_whitespace(item.get("client_safe_summary")),
                      normalize_whitespace(item.get("blocking_reason")),
                      normalize_whitespace(item.get("recommendation")),
                      normalize_whitespace(item.get("suggested_revision_direction")),
                  ] + [normalize_whitespace(point) for point in ensure_list(item.get("evidence_points"))]
                  combined = " ".join(haystacks)
                  location_key = build_family_location_key(item)
                  terms = extract_issue_terms(ensure_dict(item.get("location")).get("term_refs"), haystacks)
                  if any(marker in combined for marker in TERM_DRIFT_MARKERS):
                      pair_key = "|".join(terms) or normalize_compact(combined)[:80] or "term-drift"
                      return "term_consistency", f"term_consistency|{location_key}|{pair_key}"
                  if any(marker in combined for marker in TYPO_MARKERS):
                      typo_key = normalize_compact(combined)[:80] or "typo"
                      return "typo", f"typo|{location_key}|{typo_key}"
                  family_key = f"{root}|{location_key}|{normalize_compact(combined)[:80] or 'general'}"
                  return root, family_key

              def blocking_level_for_item(item):
                  bucket = normalize_whitespace(item.get("bucket"))
                  if bucket == "block":
                      return "block"
                  if bucket == "manual_review":
                      return "review"
                  return "warning"

              def attorney_priority_rank_for_item(item):
                  bucket_rank = {"block": 1, "warning": 2, "manual_review": 3}.get(normalize_whitespace(item.get("bucket")), 4)
                  priority_rank = {"p0_critical": 1, "p1_high": 2, "p2_medium": 3, "p3_low": 4}.get(normalize_whitespace(item.get("fix_priority")), 3)
                  return bucket_rank * 10 + priority_rank

              family_groups = {}
              for item in root_cause_findings_client:
                  family_type, family_key = build_family_signature(item)
                  family_groups.setdefault((family_type, family_key), []).append(item)

              issue_families = []
              ordered_family_keys = sorted(
                  family_groups.keys(),
                  key=lambda entry: (
                      min(attorney_priority_rank_for_item(item) for item in family_groups[entry]),
                      entry[0],
                      entry[1],
                  ),
              )
              for family_type, family_key in ordered_family_keys:
                  group_items = sort_items(family_groups[(family_type, family_key)])
                  lead = group_items[0]
                  digest = hashlib.md5(family_key.encode("utf-8")).hexdigest()[:10]
                  merged_location = merge_locations(group_items)
                  issue_families.append(
                      {
                          "issue_family_id": f"family-{digest}",
                          "issue_family_type": family_type,
                          "primary_root_cause": normalize_whitespace(lead.get("normalized_root_cause")) or family_type,
                          "primary_location": merged_location,
                          "primary_location_summary": build_location_summary(merged_location),
                          "blocking_level": blocking_level_for_item(lead),
                          "report_section_hint": "section_4" if blocking_level_for_item(lead) == "block" else "section_5",
                          "attorney_priority_rank": min(attorney_priority_rank_for_item(item) for item in group_items),
                          "client_repeat_block_key": family_key,
                          "should_surface_to_client": True,
                          "surface_reason": normalize_whitespace(lead.get("client_safe_summary")) or normalize_whitespace(lead.get("blocking_reason")),
                          "location_summary": build_location_summary(merged_location),
                          "issue_summary": normalize_whitespace(lead.get("client_safe_summary")) or normalize_whitespace(lead.get("blocking_reason")),
                          "symptom_facts": dedupe_texts([item.get("blocking_reason") or item.get("client_safe_summary") for item in group_items])[:3],
                          "risk_basis": dedupe_texts(
                              [item.get("legal_risk") or item.get("why_this_draft_triggers_it") or item.get("legal_risk_fact") for item in group_items]
                          )[:2] or [build_risk_basis_fallback(family_type, merged_location, lead, group_items)],
                          "revision_intent": dedupe_texts([item.get("suggested_revision_direction") or item.get("recommendation") for item in group_items])[:2],
                          "merge_source_findings": dedupe_texts(sum([ensure_list(item.get("source_reviews")) for item in group_items], [])),
                          "issue_title": normalize_whitespace(lead.get("client_safe_summary")) or normalize_whitespace(lead.get("blocking_reason")) or "当前稿件仍存在需优先处理的问题",
                          "evidence_points": dedupe_texts(sum([ensure_list(item.get("evidence_points")) for item in group_items], []))[:3],
                          "required_client_material": dedupe_texts(sum([ensure_list(item.get("required_client_material")) for item in group_items], []))[:2],
                          "required_client_material_summary": join_texts(sum([ensure_list(item.get("required_client_material")) for item in group_items], []), 2),
                          "legal_basis": dedupe_texts(sum([ensure_list(item.get("legal_basis")) for item in group_items], []))[:3],
                          "severity": normalize_whitespace(lead.get("severity")) or "review",
                          "priority": normalize_whitespace(lead.get("fix_priority")) or "p2_medium",
                      }
                  )

              def family_sort_key(family):
                  blocking_rank = {"block": 0, "warning": 1, "review": 2, "info": 3}
                  severity_rank = {"block": 0, "warn": 1, "review": 2, "info": 3}
                  priority_rank = {"p0_critical": 0, "p1_high": 1, "p2_medium": 2, "p3_low": 3}
                  family = ensure_dict(family)
                  return (
                      blocking_rank.get(normalize_whitespace(family.get("blocking_level")), 9),
                      severity_rank.get(normalize_whitespace(family.get("severity")), 9),
                      priority_rank.get(normalize_whitespace(family.get("priority")), 9),
                      normalize_whitespace(family.get("issue_family_id")),
                  )

              def sanitize_prompt_revision_intent(text):
                  text = normalize_whitespace(text)
                  if not text:
                      return ""
                  if normalize_whitespace(normalized_input.get("application_title_status")) != "missing":
                      return text
                  text = re.sub(r"建议使用[“\"].+?[”\"]作为正式标题。?", "补正正式申请名称。", text)
                  text = re.sub(r"建议补写正式标题为[“\"].+?[”\"]。?", "补正正式申请名称。", text)
                  text = re.sub(r"建议补写正式申请名称为[“\"].+?[”\"]。?", "补正正式申请名称。", text)
                  text = re.sub(r"建议补写正式发明名称为[“\"].+?[”\"]。?", "补正正式申请名称。", text)
                  if any(token in text for token in ["正式标题", "正式申请名称", "发明名称", "申请名称"]):
                      return "补正正式申请名称。"
                  return text

              def sanitize_prompt_location_summary(text):
                  text = normalize_whitespace(text)
                  if not text:
                      return ""
                  text = re.sub(r"权利要求\s*0(?:处)?", "申请名称", text)
                  text = re.sub(r"claim[_\s-]*0\b", "申请名称", text, flags=re.IGNORECASE)
                  text = text.replace("标题位置处", "标题位置")
                  return normalize_whitespace(text)

              def sanitize_prompt_compact_text(text):
                  text = normalize_whitespace(text)
                  if not text:
                      return ""
                  text = sanitize_prompt_location_summary(text)
                  text = text.replace("稿件症状", "当前风险点")
                  text = text.replace("需要继续澄清", "仍需进一步核实")
                  text = text.replace("继续澄清", "进一步核实")
                  text = text.replace("需继续澄清", "仍需进一步核实")
                  text = text.replace("继续补强澄清", "进一步补强确认")
                  return normalize_whitespace(text)

              def compact_family(family):
                  family = ensure_dict(family)
                  return {
                      "issue_family_id": normalize_whitespace(family.get("issue_family_id")),
                      "blocking_level": normalize_whitespace(family.get("blocking_level")) or "warning",
                      "severity": normalize_whitespace(family.get("severity")) or "review",
                      "location_summary": sanitize_prompt_location_summary(normalize_whitespace(family.get("location_summary")) or normalize_whitespace(family.get("primary_location_summary"))),
                      "surface_reason": sanitize_prompt_compact_text(normalize_whitespace(family.get("surface_reason")) or normalize_whitespace(family.get("issue_summary"))),
                      "symptom_fact_top1": sanitize_prompt_compact_text((dedupe_texts(family.get("symptom_facts")) or [""])[0]),
                      "risk_basis_top1": sanitize_prompt_compact_text((dedupe_texts(family.get("risk_basis")) or [""])[0]),
                      "revision_intent_top1": sanitize_prompt_compact_text(sanitize_prompt_revision_intent((dedupe_texts(family.get("revision_intent")) or [""])[0])),
                      "required_client_material_top1": (dedupe_texts(family.get("required_client_material")) or [""])[0],
                      "slot_tags": dedupe_texts(
                          [
                              "summary",
                              "question" if dedupe_texts(family.get("required_client_material")) else "",
                              "action" if dedupe_texts(family.get("revision_intent")) else "",
                          ]
                      ),
                  }

              issue_family_board = {
                  "schema_version": "IssueFamilyBoardV2",
                  "boundary_confidence": normalize_whitespace(normalized_input.get("boundary_confidence")) or ("low" if boundary_status == "ambiguous" else "medium"),
                  "final_decision": final_decision,
                  "issue_families": issue_families,
              }

              canonical_audit = {
                  "schema_version": "CanonicalAuditV7",
                  "audit_status": "degraded" if internal_contract_issues else "ok",
                  "final_decision": final_decision,
                  "boundary_notice": boundary_notice,
                  "boundary_status": boundary_status,
                  "boundary_confidence": normalize_whitespace(normalized_input.get("boundary_confidence")) or ("low" if boundary_status == "ambiguous" else "medium"),
                  "spec_section_status_map": ensure_dict(normalized_input.get("spec_section_status_map")),
                  "spec_sections_kept_summary": dedupe_texts(normalized_input.get("spec_sections_kept_summary"))[:6],
                  "spec_sections_dropped_summary": dedupe_texts(normalized_input.get("spec_sections_dropped_summary"))[:6],
                  "analysis_scope": analysis_scope,
                  "application_title_status": normalize_whitespace(normalized_input.get("application_title_status")) or "missing",
                  "normalized_application_title": normalize_whitespace(normalized_input.get("normalized_application_title")) or "未命名申请",
                  "delivery_safe_application_title": normalize_whitespace(normalized_input.get("delivery_safe_application_title")) or "申请名称待补正",
                  "boundary_statement_for_internal": boundary_statement_for_internal,
                  "boundary_statement_for_formal_report": boundary_statement_for_formal_report,
                  "claims_source": normalize_whitespace(normalized_input.get("claims_source")) or "empty",
                  "claims_document_shape": claims_document_shape,
                  "specification_source": normalize_whitespace(normalized_input.get("specification_source")) or "empty",
                  "specification_recovery_mode": recovery_mode,
                  "claims_trace": {
                      "claims_file_path_used": normalize_whitespace(normalized_input.get("claims_source")) == "file",
                      "claims_module_extracted_from_specification": normalize_whitespace(normalized_input.get("claims_source")) == "derived",
                      "not_executed_because": "claims_file_absent" if normalize_whitespace(normalized_input.get("claims_source")) == "derived" else "",
                  },
                  "patent_type_assessment": patent_type,
                  "review_conclusions": dedupe_texts(review_conclusions),
                  "raw_findings": raw_findings,
                  "findings": root_cause_findings_client,
                  "root_cause_findings": root_cause_findings_client,
                  "root_cause_findings_internal": root_cause_findings_internal,
                  "root_cause_findings_client": root_cause_findings_client,
                  "inventor_questions_internal": inventor_questions_internal,
                  "recommended_human_actions_internal": recommended_human_actions_internal,
                  "orphan_support_notes": orphan_support_notes,
                  "internal_contract_issues": dedupe_texts(filter_internal_contract_issues(internal_contract_issues)),
                  "report_issue_counts": report_issue_counts,
                  "finding_counts": report_issue_counts,
              }
              canonical_audit["issue_family_board"] = issue_family_board
              top_issue_families = [compact_family(family) for family in sorted(issue_families, key=family_sort_key)[:6]]
              downstream_prompt_context = {
                  "schema_version": "DownstreamPromptContextV1",
                  "final_decision": final_decision,
                  "analysis_scope": analysis_scope,
                  "boundary_confidence": normalize_whitespace(normalized_input.get("boundary_confidence")) or ("low" if boundary_status == "ambiguous" else "medium"),
                  "boundary_status": boundary_status,
                  "claims_source": normalize_whitespace(normalized_input.get("claims_source")) or "empty",
                  "claims_document_shape": claims_document_shape,
                  "recommended_patent_type": normalize_whitespace(patent_type.get("recommended_patent_type")) or "manual_review",
                  "review_mode": normalize_whitespace(patent_type.get("review_mode")) or "manual_review",
                  "confidence_level": normalize_whitespace(patent_type.get("confidence_level")) or "low",
                  "top_issue_family_ids": [normalize_whitespace(item.get("issue_family_id")) for item in top_issue_families if normalize_whitespace(item.get("issue_family_id"))],
                  "has_question_facts": any(normalize_whitespace(item.get("required_client_material_top1")) for item in top_issue_families) or bool(inventor_questions_internal),
                  "has_action_facts": any(normalize_whitespace(item.get("revision_intent_top1")) for item in top_issue_families) or bool(recommended_human_actions_internal),
                  "top_issue_families": top_issue_families,
              }
              return {
                  "canonical_audit": canonical_audit,
                  "canonical_audit_json": json.dumps(canonical_audit, ensure_ascii=False, indent=2),
                  "issue_family_board": issue_family_board,
                  "issue_family_board_json": json.dumps(issue_family_board, ensure_ascii=False, indent=2),
                  "downstream_prompt_context": downstream_prompt_context,
                  "downstream_prompt_context_json": json.dumps(downstream_prompt_context, ensure_ascii=False, indent=2),
                  "final_decision": final_decision,
              }
