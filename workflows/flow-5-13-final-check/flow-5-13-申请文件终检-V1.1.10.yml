                          f"当前状态：{current_status}",
                          "发现问题：当前未见背景技术部分的单独阻断问题，但仍需核对其是否充分交代现有技术痛点与拟解决的技术矛盾。",
                          "风险影响：若背景技术对问题场景交代不足，后续方案必要性与效果链条会显得不够完整。",
                          "建议处理：建议在终稿中补核背景技术对现有问题、使用场景及改进目标的交代是否完整。",
                      ],
                      "invention_content": [
                          f"当前状态：{current_status}",
                          "发现问题：当前未见发明内容部分的单独阻断问题，但仍需核对核心技术方案、技术效果与修改基础之间的衔接。",
                          "风险影响：若方案主链或效果主链表达不稳，会影响说明书对权利要求的支撑力度。",
                          "建议处理：建议在终稿中同步核对核心技术方案、主要技术效果及修改基础是否前后一致。",
                      ],
                      "embodiments": [
                          f"当前状态：{current_status}",
                          "发现问题：当前未见具体实施方式的单独阻断问题，但仍需核对结构细节、参数范围和实施例支撑是否充分。",
                          "风险影响：若实施方式公开不足，可能影响关键特征的公开充分性和后续修改空间。",
                          "建议处理：建议在终稿中补核结构细节、参数与实施例是否足以支撑权利要求中的关键技术特征。",
                      ],
                      "drawings": [
                          f"当前状态：{current_status}",
                          "发现问题：当前需重点核对附图文件、附图说明与图文对应关系是否完整。",
                          "风险影响：若附图文件缺失或图文对应不足，可能削弱结构公开充分性和审查可读性。",
                          "建议处理：建议补充附图图片文件或图纸资料，并逐项核对附图说明与图文对应关系。",
                      ],
                      "terminology": [
                          f"当前状态：{current_status}",
                          "发现问题：当前需重点核对术语、部件名称和附图标号的一致性。",
                          "风险影响：术语或标号前后不一致，可能影响权利要求、说明书与附图之间的对应关系。",
                          "建议处理：建议统一正文、附图说明及标号清单中的术语表达，并逐项核对部件命名与标号对应关系。",
                      ],
                  }
                  return defaults.get(
                      component_key,
                      [
                          f"当前状态：{current_status}",
                          "发现问题：暂无稳定的单独问题证据。",
                          "风险影响：该部分仍需结合人工终稿复核。",
                          "建议处理：建议在终稿整理时同步核对该组成部分与全文的一致性。",
                      ],
                  )

              def render_component_section(component_key, title, families):
                  issue_texts = []
                  risk_texts = []
                  action_texts = []
                  for family in ensure_list(families):
                      family = ensure_dict(family)
                      issue_texts.append(top_family_text(family, ["surface_reason", "issue_summary", "client_safe_summary"]))
                      risk_texts.append(top_family_text(family, ["risk_basis", "blocking_reason"]))
                      action_texts.append(sanitize_title_suggestion_text(top_family_text(family, ["revision_intent", "recommendation"])))
                  issue_texts = dedupe_texts(issue_texts)
                  risk_texts = dedupe_texts(risk_texts)
                  action_texts = dedupe_texts(action_texts)
                  if component_key == "application_title" and clean_text(canonical_audit.get("application_title_status")) == "missing":
                      issue_texts = ["标题位置仍缺少正式申请名称。"]
                      risk_texts = ["形式缺陷会影响最终交付完整性与提交流程衔接。"]
                  if component_key == "drawings" and isinstance(canonical_audit.get("drawings_image_count"), int) and canonical_audit.get("drawings_image_count") <= 0:
                      issue_texts = dedupe_texts(issue_texts + ["当前缺少附图图片文件。"])
                      risk_texts = dedupe_texts(risk_texts + ["附图缺失会削弱结构公开充分性和图文对应性。"])
                      action_texts = dedupe_texts(action_texts + ["补充附图图片文件，并核对附图说明与图文对应关系。"])
                  if not issue_texts and not risk_texts and not action_texts:
                      return title, component_default_lines(component_key)
                  issue_line = "；".join(sanitize_risk_basis_text(item) for item in issue_texts[:2] if clean_text(item)) or "暂无稳定的单独问题证据。"
                  risk_line = "；".join(sanitize_risk_basis_text(item) for item in risk_texts[:2] if clean_text(item)) or "该部分仍需结合人工终稿复核。"
                  action_line = "；".join(to_action_sentence(item) for item in action_texts[:2] if clean_text(item)) or "建议在终稿整理时同步核对该组成部分与全文的一致性。"
                  lines = [
                      f"当前状态：{sanitize_customer_visible_text(component_status(component_key))}",
                      f"发现问题：{sanitize_customer_visible_text(ensure_sentence(issue_line))}",
                      f"风险影响：{sanitize_customer_visible_text(ensure_sentence(risk_line))}",
                      f"建议处理：{sanitize_customer_visible_text(ensure_sentence(action_line))}",
                  ]
                  return title, lines

              def build_component_analysis_board():
                  groups = {key: [] for key, _ in COMPONENT_SECTIONS}
                  for family in sorted(get_issue_families(canonical_audit), key=priority_rank):
                      key = infer_component(family)
                      if key in groups:
                          groups[key].append(family)
                  return [render_component_section(key, title, groups.get(key)) for key, title in COMPONENT_SECTIONS]

              def canonicalize_risk_key(issue_text, risk_text):
                  combined = join_nonempty([issue_text, risk_text])
                  if any(token in combined for token in ["术语", "标号", "命名", "一致性", "部件名称"]):
                      return "term_consistency"
                  if any(token in combined for token in ["申请名称", "标题", "形式缺陷", "形式项"]):
                      return "formality_title"
                  if any(token in combined for token in ["附图", "图片", "图纸", "CAD", "图文对应"]):
                      return "drawings_support"
                  if any(token in combined for token in ["角度", "参数", "数值", "比例", "范围"]):
                      return "parameter_support"
                  return compact_key(combined)[:80]

              def build_risk_priority_board():
                  merged = {}
                  for family in sorted(get_issue_families(canonical_audit), key=priority_rank):
                      issue = sanitize_risk_basis_text(top_family_text(family, ["surface_reason", "issue_summary", "client_safe_summary"]))
                      risk = sanitize_risk_basis_text(top_family_text(family, ["risk_basis", "blocking_reason"]))
                      if not issue:
                          continue
                      key = canonicalize_risk_key(issue, risk)
                      line = f"{priority_label(family)}：{issue}"
                      if risk:
                          line += f" —— {risk}"
                      existing = merged.get(key)
                      if not existing or len(line) > len(existing):
                          merged[key] = ensure_sentence(line)
                  items = list(merged.values())
                  return items[:4] or ["P2：当前未识别到可单列的新增高优先级风险，建议继续结合人工复核。"]

              def build_client_material_board(report_blocks):
                  items = collect_question_items(canonical_audit)
                  for block in ensure_list(report_blocks):
                      normalized = normalize_block(block)
                      if normalized["section_key"] == "report_section_6":
                          items.extend(split_candidate_items(normalized["text"]))
                  sentences = [render_client_question_sentence(item) for item in merge_question_items(dedupe_texts(items))]
                  sentences = [item for item in sentences if item]
                  return sentences[:4] or ["请确认当前仍需补充核实的关键技术事实，以便完成提交前检查。"]

              def canonicalize_action_key(sentence):
                  text = clean_text(sentence)
                  if any(token in text for token in ["申请名称", "发明名称", "标题", "形式"]):
                      return "formality_title"
                  if any(token in text for token in ["术语", "标号", "命名", "部件名称"]):
                      return "term_consistency"
                  if any(token in text for token in ["附图", "图片", "图纸", "CAD"]) and not support_action_needed(text):
                      return "drawings_files"
                  if support_action_needed(text):
                      return "spec_support"
                  if any(token in text for token in ["权利要求", "权项", "从属", "独立", "保护范围"]):
                      return "claims_scope"
                  return compact_key(text)[:80]

              def categorize_action(sentence):
                  text = clean_text(sentence)
                  if any(token in text for token in ["申请名称", "发明名称", "标题", "形式"]):
                      return "formality"
                  if support_action_needed(text):
                      return "specification"
                  if any(token in text for token in ["权利要求", "权项", "从属", "独立", "保护范围"]):
                      return "claims"
                  if any(token in text for token in ["附图", "图片", "图纸", "CAD", "标号", "术语", "命名"]):
                      return "drawings_terms"
                  return "specification"

              def build_action_board(report_blocks):
                  grouped = {key: [] for key, _ in ACTION_GROUPS}
                  items = collect_action_items(canonical_audit)
                  for block in ensure_list(report_blocks):
                      normalized = normalize_block(block)
                      if normalized["section_key"] == "report_section_7":
                          items.extend(split_candidate_items(normalized["text"]))
                  merged = {}
                  for item in dedupe_texts(items):
                      sentence = to_action_sentence(item)
                      if not sentence:
                          continue
                      key = canonicalize_action_key(sentence)
                      existing = merged.get(key)
                      if not existing or len(sentence) > len(existing):
                          merged[key] = sentence
                  for sentence in merged.values():
                      grouped[categorize_action(sentence)].append(sentence)
                  if not any(grouped.values()):
                      grouped["specification"].append("建议结合终稿复核结果继续完善说明书与权利要求书的一致性。")
                  return {key: dedupe_texts(values)[:4] for key, values in grouped.items()}

              def render_component_text(board):
                  parts = []
                  for title, lines in board:
                      parts.append(title)
                      parts.append("")
                      for line in ensure_list(lines):
                          parts.append(line)
                          parts.append("")
                  return "\n".join(part for part in parts if part is not None).strip()

              def render_component_markdown(board):
                  parts = []
                  for title, lines in board:
                      parts.append(f"### {title}")
                      parts.append("")
                      for line in ensure_list(lines):
                          parts.append(line)
                          parts.append("")
                  return "\n".join(part for part in parts if part is not None).strip()

              def render_numbered_section(items, prefix):
                  parts = []
                  for index, item in enumerate(ensure_list(items), start=1):
                      if not clean_text(item):
                          continue
                      parts.append(f"{prefix}.{index} {ensure_sentence(item)}")
                      parts.append("")
                  return "\n".join(parts).strip()

              def render_bullet_section(items, prefix):
                  return render_numbered_section(items, prefix)

              def render_action_text(groups):
                  parts = []
                  for group_index, (key, title) in enumerate(ACTION_GROUPS, start=1):
                      items = ensure_list(groups.get(key))
                      if not items:
                          continue
                      parts.append(title)
                      parts.append("")
                      for item_index, item in enumerate(items, start=1):
                          if not clean_text(item):
                              continue
                          parts.append(f"7.{group_index}.{item_index} {ensure_sentence(item)}")
                          parts.append("")
                  return "\n".join(part for part in parts if part is not None).strip()

              def render_action_markdown(groups):
                  parts = []
                  for group_index, (key, title) in enumerate(ACTION_GROUPS, start=1):
                      items = ensure_list(groups.get(key))
                      if not items:
                          continue
                      parts.append(f"### {title}")
                      parts.append("")
                      for item_index, item in enumerate(items, start=1):
                          if not clean_text(item):
                              continue
                          parts.append(f"7.{group_index}.{item_index} {ensure_sentence(item)}")
                          parts.append("")
                  return "\n".join(part for part in parts if part is not None).strip()

              def build_brief_question_fallback(audit_obj=None):
                  audit_obj = ensure_dict(audit_obj) or canonical_audit
                  items = [to_question_sentence(item) for item in collect_question_items(audit_obj)]
                  items = [item for item in items if item]
                  return "\n".join(items[:3]) if items else "当前未识别到必须单列追问的新增技术事实，可先按现有材料继续修改。"

              def build_brief_action_fallback(audit_obj=None):
                  audit_obj = ensure_dict(audit_obj) or canonical_audit
                  items = [to_action_sentence(item) for item in collect_action_items(audit_obj)]
                  items = [item for item in items if item]
                  return "\n".join(items[:3]) if items else "当前未识别到必须单列追加的内部推进动作，可按常规修订流程继续处理。"

              draft_brief_blocks = ensure_list(draft_bundle.get("brief_section_blocks"))
              revised_brief_blocks = ensure_list(rewrite_bundle.get("revised_brief_blocks"))
              draft_report_blocks = ensure_list(draft_bundle.get("report_section_blocks"))
              revised_report_blocks = ensure_list(rewrite_bundle.get("revised_report_blocks"))

              merged_brief_blocks = merge_blocks(draft_brief_blocks, revised_brief_blocks)
              merged_brief_blocks = ensure_required_brief_sections(merged_brief_blocks, canonical_audit, draft_bundle)
              merged_report_blocks = merge_blocks(draft_report_blocks, revised_report_blocks)
              merged_report_blocks = [dict(normalize_block(block), text=sanitize_customer_visible_text(normalize_block(block).get("text"))) for block in merged_report_blocks]

              review_brief_text = assemble_sections(merged_brief_blocks, BRIEF_SECTIONS, "内部摘要") if merged_brief_blocks else ""
              if review_brief_text and not review_brief_text.startswith("内部摘要"):
                  review_brief_text = f"内部摘要\n{review_brief_text}".strip()
              review_brief_text = sanitize_brief_reason_section(sanitize_customer_visible_text(review_brief_text))

              report_blocks_by_section = {}
              for block in merged_report_blocks:
                  report_blocks_by_section.setdefault(block["section_key"], []).append(block["text"])
              report_section_1 = "\n".join(report_blocks_by_section.get("report_section_1") or []).strip() or build_report_conclusion_fallback(canonical_audit, patent_type_assessment)
              report_section_2 = "\n".join(report_blocks_by_section.get("report_section_2") or []).strip() or build_boundary_report_fallback(canonical_audit)
              report_section_3 = "\n".join(report_blocks_by_section.get("report_section_3") or []).strip() or build_patent_type_report_fallback(patent_type_assessment)
              report_section_1 = sanitize_customer_visible_text(report_section_1)
              report_section_2 = sanitize_customer_visible_text(report_section_2)
              report_section_3 = sanitize_customer_visible_text(report_section_3)

              component_board = build_component_analysis_board()
              risk_priority_board = build_risk_priority_board()
              client_material_board = build_client_material_board(merged_report_blocks)
              action_board = build_action_board(merged_report_blocks)

              section_4_text = render_component_text(component_board)
              section_5_text = render_bullet_section(risk_priority_board, "5")
              section_6_text = render_bullet_section(client_material_board, "6")
              section_7_text = render_action_text(action_board)

              upstream_has_real_content = bundle_has_real_content(draft_bundle) or bundle_has_real_content(rewrite_bundle)
              if upstream_has_real_content and is_placeholder_only(review_brief_text):
                  raise ValueError("final assembler collapsed real content into placeholder output")
              if build_boundary_report_fallback(canonical_audit) and not clean_text(report_section_2):
                  raise ValueError("final assembler left report section 2 empty despite available boundary facts")
              if build_patent_type_report_fallback(patent_type_assessment) and not clean_text(report_section_3):
                  raise ValueError("final assembler left report section 3 empty despite available patent-type facts")
              if has_brief_reason_facts(canonical_audit, draft_bundle) and "二、主要理由\n当前暂无新增内容。" in review_brief_text:
                  raise ValueError("final assembler left brief section 2 empty despite available reason facts")
              if has_priority_issue_facts(canonical_audit) and "三、最该先改的问题\n当前暂无新增内容。" in review_brief_text:
                  raise ValueError("final assembler left brief section 3 empty despite available priority issue facts")
              if has_report_conclusion_facts(canonical_audit, patent_type_assessment) and not clean_text(report_section_1):
                  raise ValueError("final assembler left report section 1 empty despite available conclusion facts")
              if has_question_facts(canonical_audit) and "四、需补充确认的技术事实\n当前暂无新增内容。" in review_brief_text:
                  raise ValueError("final assembler left brief section 4 empty despite available question facts")
              if has_question_facts(canonical_audit) and not clean_text(section_6_text):
                  raise ValueError("final assembler left report section 6 empty despite available question facts")
              if has_action_facts(canonical_audit) and "五、代理师下一步动作\n当前暂无新增内容。" in review_brief_text:
                  raise ValueError("final assembler left brief section 5 empty despite available action facts")
              if has_action_facts(canonical_audit) and not clean_text(section_7_text):
                  raise ValueError("final assembler left report section 7 empty despite available action facts")

              audit_report_text = "\n\n".join(
                  [
                      f"一、终审结论\n{report_section_1 or PLACEHOLDER}",
                      f"二、审计边界与材料完整性\n{report_section_2 or PLACEHOLDER}",
                      f"三、专利类型建议\n{report_section_3 or PLACEHOLDER}",
                      f"四、按申请文件组成部分的针对性分析\n{section_4_text or PLACEHOLDER}",
                      f"五、核心风险优先级\n{section_5_text or PLACEHOLDER}",
                      f"六、需客户补充确认的技术事实与材料\n{section_6_text or PLACEHOLDER}",
                      f"七、建议修改动作\n{section_7_text or PLACEHOLDER}",
                  ]
              )
              audit_report_text = sanitize_customer_visible_text(audit_report_text)

              docx_markdown = "\n\n".join(
                  [
                      "# 申请文件审计报告",
                      f"申请名称：{delivery_safe_application_title}",
                      f"## 一、终审结论\n{report_section_1 or PLACEHOLDER}",
                      f"## 二、审计边界与材料完整性\n{report_section_2 or PLACEHOLDER}",
                      f"## 三、专利类型建议\n{report_section_3 or PLACEHOLDER}",
                      f"## 四、按申请文件组成部分的针对性分析\n{render_component_markdown(component_board) or PLACEHOLDER}",
                      f"## 五、核心风险优先级\n{section_5_text or PLACEHOLDER}",
                      f"## 六、需客户补充确认的技术事实与材料\n{section_6_text or PLACEHOLDER}",
                      f"## 七、建议修改动作\n{render_action_markdown(action_board) or PLACEHOLDER}",
                  ]
              )
              docx_markdown = sanitize_customer_visible_text(docx_markdown)

              docx_output_basename = build_docx_output_basename(delivery_safe_application_title)
              review = f"{review_brief_text}\n\n{audit_report_text}" if review_brief_text and audit_report_text else review_brief_text or audit_report_text
              review = sanitize_customer_visible_text(review)
              if any(contains_machine_row_tokens(text) for text in [review_brief_text, audit_report_text, review, docx_markdown]):
                  raise ValueError("final assembler leaked machine payload into customer-visible output")

              return {
                  "review_brief_text": review_brief_text,
                  "audit_report_text": audit_report_text,
                  "review": review,
                  "docx_markdown": docx_markdown,
                  "delivery_safe_application_title": delivery_safe_application_title,
                  "docx_output_basename": docx_output_basename,
                  "brief_section_2_placeholder": "二、主要理由\n当前暂无新增内容。" in review_brief_text,
              }
