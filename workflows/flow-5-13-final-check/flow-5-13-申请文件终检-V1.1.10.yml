        cases:
        - case_id: 'true'
          conditions:
          - comparison_operator: empty
            id: claims-text-empty
            value: ''
            varType: string
            variable_selector:
            - '1833300100001'
            - claims_text
          id: 'true'
          logical_operator: and
        desc: ''
        selected: false
        title: 5-13-2-权利要求书文本为空判断
        type: if-else
      height: 122
      id: '1833300100101'
      position:
        x: 300
        y: 180
      positionAbsolute:
        x: 300
        y: 180
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: |-
          def main(
              text_input: str = "",
              file_text: str = "",
              derived_text: str = "",
              derived_success=None,
              derived_reason: str = "",
          ) -> dict:
              import re

              def normalize(value):
                  if value is None:
                      return ""
                  return str(value).replace("\r\n", "\n").replace("\r", "\n").strip()

              def normalize_success(value):
                  if isinstance(value, bool):
                      return value
                  text = normalize(value).lower()
                  return text in {"1", "true", "yes", "ok", "success"}

              def is_not_found_reason(value):
                  text = normalize(value).lower()
                  if not text:
                      return True
                  patterns = [
                      "not found",
                      "no match",
                      "no section",
                      "no module",
                      "empty result",
                      "未找到",
                      "未命中",
                      "未提取到",
                      "找不到",
                      "没有标题",
                  ]
                  return any(pattern in text for pattern in patterns)

              def numbered_claim_lines(value):
                  text = str(value or "").replace("\r\n", "\n").replace("\r", "\n")
                  return re.findall(r"(?m)^\s*(?:权利要求\s*)?\d+\s*[.．、:：].*$", text)

              def contains_specification_heading(value):
                  text = str(value or "").replace("\r\n", "\n").replace("\r", "\n")
                  headings = ["说明书摘要", "摘要", "背景技术", "发明内容", "具体实施方式", "附图说明", "标号清单", "说明书", "序列表", "附录", "附录说明"]
                  return any(re.search(rf"(?m)^\s*{re.escape(heading)}\s*$", text) for heading in headings)

              def looks_like_claims_text(value):
                  text = str(value or "").replace("\r\n", "\n").replace("\r", "\n").strip()
                  if not text or contains_specification_heading(text):
                      return False
                  claim_lines = numbered_claim_lines(text)
                  if not claim_lines:
                      return False
                  explicit_claim_markers = [
                      r"(?m)^\s*权利要求书\s*$",
                      r"(?m)^\s*权利要求\s*\d+\s*[.．、:：]",
                  ]
                  if any(re.search(pattern, text) for pattern in explicit_claim_markers):
                      return True
                  strong_claim_patterns = [r"其特征在于", r"根据权利要求", r"所述"]
                  weak_claim_patterns = [r"包括", r"包含", r"设有", r"用于"]
                  if any(re.search(pattern, text) for pattern in strong_claim_patterns):
                      return True
                  procedural_prefix = r"(?:安装|连接|校准|设置|启动|关闭|检测|执行|打开|固定|调整|放置|插入|装配|组装|拆卸|焊接|拧紧|测量|记录)"
                  process_context_patterns = [r"步骤", r"流程", r"操作", r"作业", r"施工", r"调试", r"补充说明"]
                  claim_noun_patterns = [r"一种", r"装置", r"系统", r"设备", r"模块", r"组件", r"机构", r"单元", r"方法"]
                  claim_noun_hits = 0
                  procedural_hits = 0
                  for line in claim_lines:
                      content = re.sub(r"^\s*(?:权利要求\s*)?\d+\s*[.．、:：]\s*", "", line)
                      if any(re.search(pattern, content) for pattern in claim_noun_patterns):
                          claim_noun_hits += 1
                      if re.match(procedural_prefix, content):
                          procedural_hits += 1
                      elif any(re.search(pattern, content) for pattern in process_context_patterns):
                          procedural_hits += 1
                  if procedural_hits and claim_noun_hits < len(claim_lines) and not any(re.search(pattern, text) for pattern in strong_claim_patterns):
                      return False
                  weak_hits = sum(1 for pattern in weak_claim_patterns if re.search(pattern, text))
                  return claim_noun_hits > 0 and weak_hits > 0 and procedural_hits == 0

              normalized_text_input = normalize(text_input)
              normalized_file_text = normalize(file_text)
              normalized_derived_text = normalize(derived_text)
              normalized_derived_reason = normalize(derived_reason)
              normalized_derived_success = normalize_success(derived_success)

              if normalized_text_input:
                  return {"output": normalized_text_input, "source": "text", "derivation_status": "skipped"}
              if normalized_file_text:
                  return {"output": normalized_file_text, "source": "file", "derivation_status": "skipped"}
              if normalized_derived_text:
                  if looks_like_claims_text(normalized_derived_text):
                      return {"output": normalized_derived_text, "source": "derived", "derivation_status": "ok"}
                  return {"output": "", "source": "empty", "derivation_status": "invalid_input"}
              if normalized_derived_success and not normalized_derived_text:
                  return {"output": "", "source": "empty", "derivation_status": "invalid_input"}
              if normalized_derived_reason and not is_not_found_reason(normalized_derived_reason):
                  return {"output": "", "source": "empty", "derivation_status": "invalid_input"}
              return {"output": "", "source": "empty", "derivation_status": "not_found"}
        code_language: python3
        desc: ''
        outputs:
          output:
            children: null
            type: string
          source:
            children: null
            type: string
          derivation_status:
            children: null
            type: string
        selected: false
        title: 5-13-3-权利要求书来源统一
