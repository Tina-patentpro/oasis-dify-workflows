                  return value if isinstance(value, dict) else {}

              def ensure_list(value):
                  return value if isinstance(value, list) else []

              def ensure_text_list(value):
                  if isinstance(value, list):
                      items = []
                      for item in value:
                          if isinstance(item, str):
                              text = clean_text(item)
                              if text:
                                  items.append(text)
                      return items
                  if not isinstance(value, str):
                      return []
                  text = clean_text(value)
                  return [text] if text else []

              def clean_text(value):
                  return str(value or "").strip()

              def ensure_sentence(text):
                  text = clean_text(text)
                  if not text:
                      return ""
                  if text[-1] not in "。！？!?；;":
                      text += "。"
                  return text

              def join_nonempty(parts, sep=" "):
                  return sep.join(part for part in parts if clean_text(part)).strip()

              def normalize_block(block):
                  block = ensure_dict(block)
                  return {
                      "block_id": clean_text(block.get("block_id")),
                      "section_key": clean_text(block.get("section_key")),
                      "source_id": clean_text(block.get("source_id")),
                      "source_type": clean_text(block.get("source_type")),
                      "text": clean_text(block.get("text")),
                  }

              def sanitize_output_text(text):
                  text = clean_text(text)
                  if not text:
                      return ""
                  text = re.sub(
                      r"((?:[一二三四五六七八九十]+、)?(?:阻断性问题|重点风险预警))\s*[（(]\s*G\d+\s*[)）]",
                      r"\1",
                      text,
                  )
                  text = re.sub(r"请补充请发明人确认[:：]?", "请发明人确认：", text)
                  text = re.sub(r"请补充请说明[:：]?", "请说明：", text)
                  text = re.sub(r"请补充请提供[:：]?", "请提供：", text)
                  text = re.sub(r"请补充请确认[:：]?", "请确认：", text)
                  text = re.sub(r"请补充请", "请", text)
                  text = re.sub(r"：{2,}", "：", text)
                  text = re.sub(r"\n{3,}", "\n\n", text)
                  return text.strip()

              def sanitize_brief_reason_section(text):
                  text = str(text or "")
                  match = re.search(
                      r"(二、主要理由\s*\n)([\s\S]*?)(?=\n(?:三、最该先改的问题|四、需补充确认的技术事实|五、代理师下一步动作)\b|\Z)",
                      text,
                  )
                  if not match:
                      return text
                  section_body = match.group(2)
                  section_body = re.sub(
                      r"(?m)^[ \t]*(?:[-•*]\s*|\d+[.、]\s*)?(?:主要理由如下|主要理由|补充理由)\s*[:：]\s*",
                      "",
                      section_body,
                  )
                  cleaned_block = f"{match.group(1)}{section_body.strip()}"
                  return f"{text[:match.start()]}{cleaned_block}{text[match.end():]}"

              def merge_blocks(draft_blocks, revised_blocks):
                  draft_blocks = [normalize_block(item) for item in ensure_list(draft_blocks) if clean_text(ensure_dict(item).get("section_key"))]
                  revised_map = {}
                  for item in ensure_list(revised_blocks):
                      normalized = normalize_block(item)
                      if normalized["block_id"]:
                          revised_map[normalized["block_id"]] = normalized
                  merged = []
                  seen_ids = set()
                  for item in draft_blocks:
                      bid = item["block_id"]
                      replacement = revised_map.get(bid)
                      chosen = dict(item)
                      if replacement and replacement["text"]:
                          chosen["text"] = replacement["text"]
                      merged.append(chosen)
                      if bid:
                          seen_ids.add(bid)
                  for bid, replacement in revised_map.items():
                      if bid in seen_ids or not replacement["text"]:
                          continue
                      merged.append(replacement)
                  return merged

              def is_placeholder_only(text):
                  text = clean_text(text)
                  if not text:
                      return True
                  headings = ["内部摘要"] + [heading for _, heading in BRIEF_SECTIONS] + [heading for _, heading in REPORT_SECTIONS]
                  stripped = text
                  for heading in headings:
                      stripped = stripped.replace(heading, "")
                  stripped = stripped.replace(PLACEHOLDER, "")
                  stripped = re.sub(r"[\s:：\-•*0-9]+", "", stripped)
                  return not stripped.strip()

              def bundle_has_real_content(bundle):
                  bundle = ensure_dict(bundle)
                  text_fields = [
                      bundle.get("review_brief_text_draft"),
                      bundle.get("audit_report_text_draft"),
                      bundle.get("review_brief_text_revised"),
                      bundle.get("audit_report_text_revised"),
                  ]
                  if any(clean_text(value) and not is_placeholder_only(value) for value in text_fields):
                      return True
                  block_fields = [
                      bundle.get("brief_section_blocks"),
                      bundle.get("report_section_blocks"),
                      bundle.get("revised_brief_blocks"),
                      bundle.get("revised_report_blocks"),
                  ]
                  for block_list in block_fields:
                      for item in ensure_list(block_list):
                          text = clean_text(ensure_dict(item).get("text"))
                          if text and not is_placeholder_only(text):
                              return True
                  return False

              def human_boundary_status(status):
                  mapping = {
                      "clean": "边界清晰",
                      "ambiguous": "边界仍存在不确定性",
                      "recovered_from_mixed_file": "已从整份申请文稿中拆分恢复",
                      "recovered_from_mixed_specification": "已从说明书输入中拆分恢复",
                  }
                  return mapping.get(clean_text(status), clean_text(status) or "边界状态待确认")

              def human_confidence(level):
                  mapping = {"high": "高", "medium": "中", "low": "低"}
                  return mapping.get(clean_text(level), clean_text(level) or "待确认")

              def human_claims_source(source):
                  mapping = {
                      "file": "独立上传的权利要求书文本",
                      "text": "直接粘贴的权利要求书文本",
                      "derived": "从说明书输入中拆分出的权利要求模块",
                      "empty": "当前未提供独立权利要求书文本",
                  }
                  return mapping.get(clean_text(source), clean_text(source) or "来源待确认")

              def human_doc_shape(shape):
                  mapping = {
                      "mixed_application_package": "整份申请文稿混合输入",
                      "pure_claims": "独立权利要求书输入",
                      "unknown": "文稿形态待确认",
                  }
                  return mapping.get(clean_text(shape), clean_text(shape) or "文稿形态待确认")

              def human_patent_type(value):
                  mapping = {
                      "invention": "发明专利",
                      "utility_model": "实用新型",
                      "manual_review": "人工复核",
                  }
                  return mapping.get(clean_text(value), clean_text(value) or "待进一步判断")

              def human_review_mode(value):
                  mapping = {
                      "invention": "发明专利口径",
                      "utility_model": "实用新型口径",
                      "manual_review": "人工复核口径",
                  }
                  return mapping.get(clean_text(value), clean_text(value) or "待进一步确认")

              def human_analysis_scope(value):
                  mapping = {
                      "full_application": "全案范围",
                      "partial_application": "局部材料范围",
                      "claims_only": "仅权利要求范围",
                      "specification_only": "仅说明书范围",
                      "none": "材料不足范围",
                  }
                  return mapping.get(clean_text(value), clean_text(value) or "当前可识别范围")

              def summarize_items(values, limit=3):
                  items = [clean_text(item) for item in ensure_list(values) if clean_text(item)]
                  return "；".join(items[:limit])

              def dedupe_texts(items):
                  seen = set()
                  result = []
                  for item in ensure_list(items):
                      text = clean_text(item)
                      if not text:
                          continue
                      key = re.sub(r"[\s；;，,。.!！？?]+", "", text)
                      if key in seen:
                          continue
                      seen.add(key)
                      result.append(text)
                  return result

              def contains_machine_row_tokens(text):
                  haystack = clean_text(text).lower()
                  if not haystack:
                      return False
                  return any(token in haystack for token in MACHINE_ROW_TOKENS)

              def first_clean_text(value):
                  if isinstance(value, str):
                      return clean_text(value)
                  if isinstance(value, list):
                      for item in value:
                          text = first_clean_text(item)
                          if text:
                              return text
                  return ""

              def extract_question_row_text(row):
                  if isinstance(row, str):
                      return clean_text(row)
                  row = ensure_dict(row)
                  for field_name in [
                      "question_text",
                      "required_client_material_summary",
                      "required_client_material_top1",
                      "required_client_material",
                      "text",
                      "question",
                      "summary",
                  ]:
                      text = first_clean_text(row.get(field_name))
                      if text and not contains_machine_row_tokens(text):
                          return text
                  return ""

              def extract_action_row_text(row):
                  if isinstance(row, str):
                      return clean_text(row)
                  row = ensure_dict(row)
                  for field_name in [
                      "action_text",
                      "revision_intent_top1",
                      "revision_intent_summary",
                      "revision_intent",
                      "recommendation",
                      "text",
                      "action",
                  ]:
                      text = first_clean_text(row.get(field_name))
                      if text and not contains_machine_row_tokens(text):
                          return text
                  return ""

              def collect_safe_rows(value, extractor):
                  if isinstance(value, list):
                      items = []
                      for item in value:
                          items.extend(collect_safe_rows(item, extractor))
                      return items
                  if isinstance(value, str):
                      text = clean_text(value)
                      return [text] if text else []
                  if isinstance(value, dict):
                      text = extractor(value)
                      return [text] if text else []
                  return []

              def get_issue_families(audit_obj):
                  board = ensure_dict(audit_obj.get("issue_family_board"))
                  return [ensure_dict(item) for item in ensure_list(board.get("issue_families"))]

              def collect_question_items(audit_obj):
                  items = []
                  items.extend(collect_safe_rows(audit_obj.get("inventor_questions_internal"), extract_question_row_text))
                  for family in get_issue_families(audit_obj):
                      items.extend(collect_safe_rows(family.get("required_client_material"), extract_question_row_text))
                      items.extend(
                          collect_safe_rows(
                              {
                                  "required_client_material_summary": family.get("required_client_material_summary"),
                                  "required_client_material_top1": family.get("required_client_material_top1"),
                              },
                              extract_question_row_text,
                          )
                      )
                  return dedupe_texts(items)

              def collect_action_items(audit_obj):
                  items = []
                  for family in get_issue_families(audit_obj):
                      items.extend(collect_safe_rows(family.get("revision_intent"), extract_action_row_text))
                      items.extend(
                          collect_safe_rows(
                              {
                                  "revision_intent_top1": family.get("revision_intent_top1"),
                                  "recommendation": family.get("recommendation"),
                              },
                              extract_action_row_text,
                          )
                      )
                  items.extend(collect_safe_rows(audit_obj.get("recommended_human_actions_internal"), extract_action_row_text))
                  return dedupe_texts(items)

              def has_question_facts(audit_obj):
                  return bool(collect_question_items(audit_obj))

              def has_action_facts(audit_obj):
                  return bool(collect_action_items(audit_obj))

              def priority_rank(family):
                  family = ensure_dict(family)
                  blocking_level = clean_text(family.get("blocking_level"))
                  severity = clean_text(family.get("severity"))
                  priority = clean_text(family.get("priority"))
                  blocking_rank = {"block": 0, "warning": 1, "manual_review": 2, "info": 3}
                  severity_rank = {"block": 0, "warn": 1, "review": 2, "info": 3}
                  priority_rank_map = {"p0_immediate": 0, "p1_high": 1, "p2_medium": 2, "p3_low": 3}
                  return (
                      blocking_rank.get(blocking_level, 9),
                      severity_rank.get(severity, 9),
                      priority_rank_map.get(priority, 9),
                  )

              def priority_label(family):
                  family = ensure_dict(family)
                  mapping = {
                      "p0_immediate": "P0",
                      "p1_high": "P1",
                      "p2_medium": "P2",
                      "p3_low": "P3",
                  }
                  return mapping.get(clean_text(family.get("priority")), "P2")

              def top_family_text(family, field_names):
                  family = ensure_dict(family)
                  for field_name in ensure_list(field_names):
                      value = family.get(field_name)
                      if isinstance(value, list):
                          texts = dedupe_texts(value)
                          if texts:
                              return texts[0]
                      else:
                          text = clean_text(value)
                          if text:
                              return text
                  return ""

              def collect_priority_issue_items(audit_obj):
                  families = [family for family in get_issue_families(audit_obj) if ensure_dict(family)]
                  families.sort(key=priority_rank)
                  items = []
                  for family in families:
                      reason = clean_text(family.get("surface_reason"))
                      symptom = summarize_items(family.get("symptom_facts"), 2)
                      location = clean_text(family.get("location_summary"))
                      if reason and location:
                          items.append(ensure_sentence(f"{location}最需优先处理的问题为：{reason}"))
                      elif reason:
                          items.append(ensure_sentence(reason))
                      elif symptom and location:
                          items.append(ensure_sentence(f"{location}当前主要症状为：{symptom}"))
                      elif symptom:
                          items.append(ensure_sentence(symptom))
                  return dedupe_texts(items)

              def collect_brief_reason_items(audit_obj):
                  audit_obj = ensure_dict(audit_obj)
                  items = []
                  boundary_notice = clean_text(audit_obj.get("boundary_notice"))
                  if boundary_notice:
                      items.append(ensure_sentence(boundary_notice))
                  analysis_scope = clean_text(audit_obj.get("analysis_scope"))
                  boundary_confidence = clean_text(audit_obj.get("boundary_confidence"))
                  if analysis_scope or boundary_confidence:
                      analysis_text = human_analysis_scope(analysis_scope)
                      confidence_text = human_confidence(boundary_confidence) if boundary_confidence else "待进一步确认"
                      items.append(
                          ensure_sentence(
                              f"当前判断基于{analysis_text}范围内可识别材料作出，边界置信度为{confidence_text}"
                          )
                      )
                  for family in get_issue_families(audit_obj):
                      reason = clean_text(family.get("surface_reason"))
                      symptom = summarize_items(family.get("symptom_facts"), 1)
                      if reason:
                          items.append(ensure_sentence(reason))
                      elif symptom:
                          items.append(ensure_sentence(symptom))
                  return dedupe_texts(items)

              def has_priority_issue_facts(audit_obj):
                  return bool(collect_priority_issue_items(audit_obj))

              def has_report_conclusion_facts(audit_obj, assessment_obj):
                  audit_obj = ensure_dict(audit_obj)
                  assessment_obj = ensure_dict(assessment_obj)
                  return bool(
                      clean_text(audit_obj.get("final_decision"))
                      or clean_text(audit_obj.get("analysis_scope"))
                      or clean_text(audit_obj.get("boundary_confidence"))
                      or clean_text(audit_obj.get("boundary_status"))
                      or collect_priority_issue_items(audit_obj)
                      or clean_text(assessment_obj.get("recommended_patent_type"))
                  )

              def extract_brief_section_body(text, heading):
                  text = str(text or "")
                  headings = [item_heading for _, item_heading in BRIEF_SECTIONS]
                  pattern = re.escape(heading)
                  alternatives = "|".join(re.escape(item) for item in headings if item != heading)
                  match = re.search(
                      rf"(?:^|\n){pattern}\s*\n([\s\S]*?)(?=\n(?:{alternatives})\b|\Z)",
                      text,
                  )
                  if not match:
                      return ""
                  return clean_text(match.group(1))

              def has_brief_reason_facts(audit_obj, draft_bundle):
                  draft_bundle = ensure_dict(draft_bundle)
                  if extract_brief_section_body(draft_bundle.get("review_brief_text_draft"), "二、主要理由"):
                      return True
                  return bool(collect_brief_reason_items(audit_obj))

              def to_question_clause(text):
                  text = clean_text(text).rstrip("。；;")
                  if not text:
                      return ""
                  if text.startswith(("需", "请", "补充")):
                      return text
                  return f"需补充确认{text}"

              def to_action_clause(text):
                  text = clean_text(text).rstrip("。；;")
                  if not text:
                      return ""
                  if text.startswith(("建议", "宜", "可先")):
                      return text
                  return f"建议{text}"

              def build_boundary_report_fallback(audit_obj):
                  audit_obj = ensure_dict(audit_obj)
                  if not audit_obj:
                      return ""
                  boundary_status = clean_text(audit_obj.get("boundary_status"))
                  boundary_confidence = clean_text(audit_obj.get("boundary_confidence"))
                  claims_source = clean_text(audit_obj.get("claims_source"))
                  claims_shape = clean_text(audit_obj.get("claims_document_shape"))
                  kept = summarize_items(audit_obj.get("spec_sections_kept_summary"), 3)
                  dropped = summarize_items(audit_obj.get("spec_sections_dropped_summary"), 3)
                  boundary_notice = clean_text(audit_obj.get("boundary_notice"))
                  if not any([boundary_status, boundary_confidence, claims_source, claims_shape, kept, dropped, boundary_notice]):
                      return ""
                  sentences = ["本次审计基于当前可识别的申请文件内容开展。"]
                  sentences.append(
                      ensure_sentence(
                          f"权利要求书来源为{human_claims_source(claims_source)}，当前文稿形态可归纳为{human_doc_shape(claims_shape)}，边界状态为{human_boundary_status(boundary_status)}，边界置信度为{human_confidence(boundary_confidence)}"
                      )
                  )
                  if boundary_notice:
                      sentences.append(ensure_sentence(boundary_notice))
                  if kept:
                      sentences.append(ensure_sentence(f"当前保留并纳入分析的说明书章节主要包括：{kept}"))
                  if dropped:
                      sentences.append(ensure_sentence(f"出于边界谨慎，以下内容已做清洗或降权处理：{dropped}"))
                  return join_nonempty(sentences)

              def build_patent_type_report_fallback(assessment_obj):
                  assessment_obj = ensure_dict(assessment_obj)
                  if not assessment_obj:
                      return ""
                  recommended = clean_text(assessment_obj.get("recommended_patent_type"))
                  review_mode = clean_text(assessment_obj.get("review_mode"))
                  confidence = clean_text(assessment_obj.get("confidence_level"))
                  reason_summary = ensure_sentence(assessment_obj.get("reason_summary"))
                  warnings = summarize_items(assessment_obj.get("assessment_warnings"), 2)
                  if not any([recommended, review_mode, confidence, reason_summary, warnings]):
                      return ""
                  sentences = [
                      ensure_sentence(
                          f"结合当前文稿形态，建议先按{human_patent_type(recommended)}方向继续完善，审查口径按{human_review_mode(review_mode)}处理"
                      )
                  ]
                  if confidence:
                      sentences.append(ensure_sentence(f"当前类型判断置信度为{human_confidence(confidence)}"))
                  if reason_summary:
                      sentences.append(reason_summary)
                  if warnings:
                      sentences.append(ensure_sentence(f"仍需注意：{warnings}"))
                  return join_nonempty(sentences)

              def build_brief_question_fallback(audit_obj):
                  items = [to_question_clause(item) for item in collect_question_items(audit_obj)]
                  items = [item for item in items if item]
                  if not items:
                      return "当前未识别到必须单列追问的新增技术事实，可先按现有材料继续修改。"
                  return ensure_sentence(f"建议内部先向发明人补充确认以下事实：{'；'.join(items[:3])}")

              def build_brief_priority_fallback(audit_obj):
                  items = collect_priority_issue_items(audit_obj)
                  if not items:
                      return "当前未识别到必须单列优先处理的阻断性问题，可按常规顺序继续完善稿件。"
                  return ensure_sentence(f"当前最应优先处理的问题包括：{'；'.join(items[:3])}")

              def build_brief_reason_fallback(audit_obj, draft_bundle):
                  reason_from_draft = extract_brief_section_body(ensure_dict(draft_bundle).get("review_brief_text_draft"), "二、主要理由")
                  if reason_from_draft and not is_placeholder_only(reason_from_draft):
                      return ensure_sentence(reason_from_draft)
                  items = collect_brief_reason_items(audit_obj)
                  if items:
                      return ensure_sentence(f"当前结论主要基于以下理由：{'；'.join(items[:3])}")
                  return "当前未识别到必须单列补充的主要理由，可结合终审结论与正式报告继续复核。"

              def build_brief_action_fallback(audit_obj):
                  items = [to_action_clause(item) for item in collect_action_items(audit_obj)]
                  items = [item for item in items if item]
                  if not items:
                      return "当前未识别到必须单列追加的内部推进动作，可按常规修订流程继续处理。"
                  return ensure_sentence(f"建议内部优先推进以下修改动作：{'；'.join(items[:3])}")

              def build_report_conclusion_fallback(audit_obj, assessment_obj):
                  audit_obj = ensure_dict(audit_obj)
                  assessment_obj = ensure_dict(assessment_obj)
                  final_decision = ensure_sentence(audit_obj.get("final_decision"))
                  boundary_confidence = clean_text(audit_obj.get("boundary_confidence"))
                  analysis_scope = clean_text(audit_obj.get("analysis_scope"))
                  recommended_type = clean_text(assessment_obj.get("recommended_patent_type"))
                  top_issues = collect_priority_issue_items(audit_obj)
                  sentences = []
                  if final_decision:
                      sentences.append(final_decision)
                  if boundary_confidence or analysis_scope:
                      scope_text = human_confidence(boundary_confidence) if boundary_confidence else "待进一步确认"
                      analysis_text = human_analysis_scope(analysis_scope)
                      sentences.append(
                          ensure_sentence(
                              f"本次结论系基于{analysis_text}内当前可识别材料作出的终审判断，边界置信度为{scope_text}，仍需结合补充材料谨慎把握"
                          )
                      )
                  if recommended_type:
                      sentences.append(ensure_sentence(f"当前建议仍以{human_patent_type(recommended_type)}口径继续完善并复核主要风险点"))
                  if top_issues:
                      sentences.append(ensure_sentence(f"现阶段最需优先处理的问题集中在：{'；'.join(top_issues[:2])}"))
                  return join_nonempty(sentences)

              def build_report_question_fallback(audit_obj):
                  items = [to_question_clause(item) for item in collect_question_items(audit_obj)]
                  items = [item for item in items if item]
                  if not items:
                      return "基于当前材料，暂未识别到必须先由客户单列补充确认的新增技术事实。"
                  return ensure_sentence(f"为提高后续修改与提交把握度，现阶段仍需请发明人或申请人补充确认以下事实：{'；'.join(items[:4])}")

              def build_report_action_fallback(audit_obj):
                  items = [to_action_clause(item) for item in collect_action_items(audit_obj)]
                  items = [item for item in items if item]
                  if not items:
                      return "当前未识别到必须单列追加的代理修改动作，可先按前述问题常规修订。"
                  return ensure_sentence(f"建议优先执行以下修改动作：{'；'.join(items[:4])}")

              def resolve_delivery_safe_title(audit_obj):
                  audit_obj = ensure_dict(audit_obj)
                  title_status = clean_text(audit_obj.get("application_title_status"))
                  safe_title = clean_text(audit_obj.get("delivery_safe_application_title"))
                  if title_status == "missing" or not safe_title or safe_title == "未命名申请":
                      return "申请名称待补正"
                  return safe_title

              def build_docx_output_basename(safe_title):
                  basename = f"flow-5-13-申请文件审计报告-1.1.10-{clean_text(safe_title) or '申请名称待补正'}"
                  return re.sub(r'[\\\\/:*?"<>|]+', "-", basename)

              def has_real_section_block(blocks, section_key):
                  for block in ensure_list(blocks):
                      normalized = normalize_block(block)
                      if normalized["section_key"] == section_key and normalized["text"] and not is_placeholder_only(normalized["text"]):
                          return True
                  return False

              def ensure_required_brief_sections(blocks, audit_obj, draft_bundle):
                  blocks = [normalize_block(item) for item in ensure_list(blocks) if clean_text(ensure_dict(item).get("section_key"))]
                  cleaned_blocks = []
                  for block in blocks:
                      if block["section_key"] in {"brief_section_2", "brief_section_3", "brief_section_4", "brief_section_5"} and (not block["text"] or is_placeholder_only(block["text"])):
                          continue
                      cleaned_blocks.append(block)
                  if not has_real_section_block(cleaned_blocks, "brief_section_2"):
                      cleaned_blocks.append(
                          {
                              "block_id": "brief-2-fallback",
                              "section_key": "brief_section_2",
                              "source_id": "reason-fallback",
                              "source_type": "deterministic_fallback",
                              "text": build_brief_reason_fallback(audit_obj, draft_bundle),
                          }
                      )
                  if not has_real_section_block(cleaned_blocks, "brief_section_3"):
                      cleaned_blocks.append(
                          {
                              "block_id": "brief-3-fallback",
                              "section_key": "brief_section_3",
                              "source_id": "priority-fallback",
                              "source_type": "deterministic_fallback",
                              "text": build_brief_priority_fallback(audit_obj),
                          }
                      )
                  if not has_real_section_block(cleaned_blocks, "brief_section_4"):
                      cleaned_blocks.append(
