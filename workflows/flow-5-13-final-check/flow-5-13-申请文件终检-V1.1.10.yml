                      )
                  return cleaned_blocks

              def assemble_sections(blocks, section_defs, title):
                  grouped = {key: [] for key, _ in section_defs}
                  for block in ensure_list(blocks):
                      normalized = normalize_block(block)
                      if normalized["section_key"] in grouped and normalized["text"]:
                          grouped[normalized["section_key"]].append(normalized["text"])
                  parts = [title] if title else []
                  for key, heading in section_defs:
                      section_lines = [text for text in grouped.get(key, []) if clean_text(text)]
                      body = "\n".join(section_lines).strip()
                      if body:
                          parts.append(f"{heading}\n{body}")
                      else:
                          parts.append(f"{heading}\n{PLACEHOLDER}")
                  return "\n".join(part for part in parts if clean_text(part)).strip()

              draft_bundle = ensure_dict(draft_bundle)
              critique_bundle = ensure_dict(critique_bundle)
              rewrite_bundle = ensure_dict(rewrite_bundle)
              canonical_audit = ensure_dict(canonical_audit)
              patent_type_assessment = ensure_dict(patent_type_assessment)

              critique_status = clean_text(critique_bundle.get("pass_or_fail")).lower() or "pass"
              delivery_safe_application_title = resolve_delivery_safe_title(canonical_audit)
              missing_title_flag = clean_text(canonical_audit.get("application_title_status")) == "missing" or delivery_safe_application_title == "申请名称待补正"

              def sanitize_title_suggestion_text(text):
                  text = clean_text(text)
                  if not text or not missing_title_flag:
                      return text
                  replacements = [
                      (r"建议使用[“\"].+?[”\"]作为正式标题[。；;]?", "建议补正正式申请名称。"),
                      (r"建议补写正式标题为[“\"].+?[”\"][。；;]?", "建议补正正式申请名称。"),
                      (r"建议补写正式申请名称为[“\"].+?[”\"][。；;]?", "建议补正正式申请名称。"),
                      (r"建议补写正式发明名称为[“\"].+?[”\"][。；;]?", "建议补正正式申请名称。"),
                      (r"建议补写正式的发明名称[。；;]?", "建议补正正式申请名称。"),
                      (r"标题为[“\"].+?[”\"]", "正式申请名称待补正"),
                      (r"正式标题为[“\"].+?[”\"]", "正式申请名称待补正"),
                  ]
                  for pattern, replacement in replacements:
                      text = re.sub(pattern, replacement, text)
                  if re.search(r"(正式标题|正式申请名称|发明名称|申请名称).{0,10}[“\"].+?[”\"]", text):
                      return "建议补正正式申请名称。"
                  return text

              def sanitize_machine_payload_text(text):
                  text = clean_text(text)
                  if not text or not contains_machine_row_tokens(text):
                      return text
                  haystack = text.lower()
                  if any(token in haystack for token in ["question_id", "question_text", "expected_answer_format", "required_client_material"]):
                      return "需结合前述风险点进一步确认相关技术事实与补充材料，以便完成终稿复核。"
                  if any(token in haystack for token in ["action_id", "revision_intent", "recommended_human_actions", "recommendation"]):
                      if missing_title_flag and any(token in text for token in ["标题", "申请名称", "发明名称"]):
                          return "建议补正正式申请名称，并同步更新摘要、说明书、权利要求书及审计报告中的名称信息。"
                      return "建议结合前述风险点完成对应修改，并同步核对相关章节的一致性。"
                  return "请结合前述风险点进一步核对相关技术事实、材料与修改动作。"

              def sanitize_customer_visible_text(text):
                  text = sanitize_output_text(text)
                  text = sanitize_title_suggestion_text(text)
                  text = sanitize_machine_payload_text(text)
                  text = re.sub(r"显示标题为[?\"]?未命名申请[?\"]?", "标题尚未正式补正", text)
                  text = text.replace("未命名申请", "申请名称待补正")
                  text = text.replace("claims_file", "独立权利要求书文件").replace("权利要求none", "相关权利要求")
                  text = re.sub(r"权利要求\s*(?:none|null|unknown|n/?a|na)(?=$|[^A-Za-z0-9_])", "相关权利要求", text, flags=re.IGNORECASE)
                  text = re.sub(r"\n{3,}", "\n\n", text)
                  return text.strip()

              def split_candidate_items(text):
                  text = sanitize_customer_visible_text(text)
                  if not text:
                      return []
                  text = text.replace("；", "。\n").replace(";", "。\n")
                  text = re.sub(r"(?<!\n)(?=建议)", "\n", text)
                  text = re.sub(r"(?<!\n)(?=需请)", "\n", text)
                  text = re.sub(r"(?<!\n)(?=需补充)", "\n", text)
                  text = re.sub(r"(?<!\n)(?=需确认)", "\n", text)
                  items = []
                  for chunk in text.splitlines():
                      chunk = clean_text(chunk)
                      if not chunk:
                          continue
                      for piece in re.split(r"(?<=[。！？])\s*", chunk):
                          piece = clean_text(piece)
                          if piece:
                              items.append(piece)
                  return dedupe_texts(items)

              def compact_key(text):
                  return re.sub(r"[\s；;，,。.!！？?：:\"“”'‘’()（）_\-]+", "", clean_text(text).lower())

              def normalize_client_location_label(text):
                  text = sanitize_customer_visible_text(text).rstrip("。；;")
                  if not text:
                      return ""
                  text = re.sub(r"权利要求\s*0(?:处)?", "申请名称", text)
                  text = re.sub(r"claim[_\s-]*0\b", "申请名称", text, flags=re.IGNORECASE)
                  text = text.replace("标题位置处", "标题位置")
                  return clean_text(text)

              def sanitize_risk_basis_text(text):
                  text = normalize_client_location_label(text)
                  if not text:
                      return ""
                  text = text.replace("稿件症状", "当前缺陷")
                  text = text.replace("需要继续澄清", "仍需进一步核实")
                  text = text.replace("继续澄清", "进一步核实")
                  text = text.replace("仍存在需要", "仍需")
                  return clean_text(text)

              def question_purpose(text):
                  text = clean_text(text)
                  if any(token in text for token in ["标题", "申请名称", "发明名称"]):
                      return "以便完成形式核对与终稿统一"
                  if any(token in text for token in ["附图", "图片", "图纸", "CAD", "JPG", "PDF", "PNG"]):
                      return "以便核对附图支撑与公开充分性"
                  if any(token in text for token in ["角度", "参数", "数值", "比例", "长度", "范围"]):
                      return "以便补强权利要求边界与说明书支撑"
                  if any(token in text for token in ["术语", "标号", "命名"]):
                      return "以便完成全文一致性核对"
                  return "以便完成终稿复核"

              def question_topic(text):
                  text = clean_text(text)
                  if any(token in text for token in ["标题", "申请名称", "发明名称"]):
                      return "title"
                  if any(token in text for token in ["附图", "图片", "图纸", "CAD", "JPG", "PDF", "PNG"]):
                      return "drawings"
                  if any(token in text for token in ["角度", "参数", "数值", "比例", "长度", "范围"]):
                      return "parameters"
                  if any(token in text for token in ["术语", "标号", "命名"]):
                      return "terminology"
                  return "general"

              def question_mode(text):
                  text = clean_text(text)
                  if any(token in text for token in ["提供", "补充", "图片", "图纸", "CAD", "JPG", "PDF", "PNG", "材料", "文件"]):
                      return "provide"
                  return "confirm"

              def normalize_question_item_text(text):
                  text = sanitize_customer_visible_text(text).rstrip("。；;")
                  text = sanitize_title_suggestion_text(text)
                  if not text:
                      return ""
                  text = re.sub(r"^(?:需确认请问|请确认请问|需请|请问)", "", text)
                  text = re.sub(r"^(?:需补充提供|请补充提供|请提供|提供)", "", text)
                  text = re.sub(r"^(?:需补充确认|请补充确认|需确认|请确认|确认)", "", text)
                  text = re.sub(r"^[：:，,\s]+", "", text)
                  return clean_text(text)

              def canonicalize_question_key(text):
                  normalized = normalize_question_item_text(text)
                  if not normalized:
                      return ""
                  return "|".join([question_mode(normalized), question_topic(normalized), question_purpose(normalized)])

              def merge_question_items(items):
                  merged = {}
                  for item in ensure_list(items):
                      normalized = normalize_question_item_text(item)
                      if not normalized:
                          continue
                      key = canonicalize_question_key(normalized)
                      if not key:
                          continue
                      existing = merged.get(key)
                      if not existing or len(normalized) > len(existing):
                          merged[key] = normalized
                  return list(merged.values())

              def render_client_question_sentence(text):
                  normalized = normalize_question_item_text(text)
                  if not normalized:
                      return ""
                  topic = question_topic(normalized)
                  purpose = question_purpose(normalized)
                  mode = question_mode(normalized)
                  if missing_title_flag and topic == "title":
                      normalized = "正式申请名称"
                      mode = "confirm"
                  if topic == "drawings":
                      normalized = "附图图片文件或可用于出图的 CAD/结构图资料"
                      mode = "provide"
                  if mode == "provide":
                      return ensure_sentence(f"请补充提供{normalized}，{purpose}")
                  return ensure_sentence(f"请确认{normalized}，{purpose}")

              def to_question_sentence(text):
                  return render_client_question_sentence(text)

              def support_action_needed(text):
                  text = clean_text(text)
                  return any(token in text for token in ["说明书", "实施方式", "实施例", "参数", "角度", "范围", "技术效果", "支撑", "公开充分", "结构细节"])

              def to_action_sentence(text):
                  text = sanitize_customer_visible_text(text).rstrip("。；;")
                  if not text:
                      return ""
                  if missing_title_flag and any(token in text for token in ["正式标题", "正式申请名称", "发明名称", "申请名称"]):
                      text = "补正正式申请名称"
                  if not text.startswith(("建议", "宜", "可先")):
                      text = f"建议{text}"
                  return ensure_sentence(text)

              def infer_component(family):
                  family = ensure_dict(family)
                  haystack = " ".join(
                      dedupe_texts(
                          [
                              family.get("issue_family_type"),
                              family.get("impact_scope"),
                              family.get("issue_summary"),
                              family.get("surface_reason"),
                              family.get("location_summary"),
                              family.get("primary_location_summary"),
                              family.get("blocking_reason"),
                              family.get("recommendation"),
                          ]
                          + ensure_list(family.get("section_titles"))
                          + ensure_list(family.get("term_refs"))
                      )
                  )
                  has_drawings = any(token in haystack for token in ["附图", "图片", "图纸", "CAD", "figure", "drawings", "图文对应"])
                  has_terms = bool(family.get("term_refs")) or any(token in haystack for token in ["术语", "标号", "一致性", "命名", "部件名称"])
                  has_drawings_file_gap = any(token in haystack for token in ["附图文件", "图片文件", "图纸", "CAD", "附图说明", "图文对应", "图片缺失"])
                  if any(token in haystack for token in ["标题", "申请名称", "发明名称"]):
                      return "application_title"
                  if "摘要" in haystack:
                      return "abstract"
                  if any(token in haystack for token in ["claim_", "independent_claim", "dependent_claim", "权利要求", "从属", "独立权利要求"]):
                      return "claims"
                  if "背景技术" in haystack:
                      return "background"
                  if any(token in haystack for token in ["发明内容", "有益效果", "技术效果"]):
                      return "invention_content"
                  if any(token in haystack for token in ["具体实施方式", "实施例", "公开充分", "支撑", "参数"]):
                      return "embodiments"
                  if has_drawings and has_drawings_file_gap:
                      return "drawings"
                  if has_terms:
                      return "terminology"
                  if has_drawings:
                      return "drawings"
                  return ""

              def component_status(component_key):
                  spec_map = ensure_dict(canonical_audit.get("spec_section_status_map"))
                  if component_key == "application_title":
                      if clean_text(canonical_audit.get("application_title_status")) == "missing":
                          return "申请名称当前缺失，最终交付已按安全占位处理。"
                      return f"当前可交付标题为“{delivery_safe_application_title}”。"
                  if component_key == "abstract":
                      abstract_status = clean_text(spec_map.get("摘要")) or ("present" if clean_text(canonical_audit.get("abstract_title_flags")) else "unknown")
                      return ensure_sentence(f"摘要模块当前状态为{abstract_status or 'unknown'}")
                  if component_key == "claims":
                      return ensure_sentence(
                          f"权利要求书当前来源为{human_claims_source(canonical_audit.get('claims_source'))}，文稿形态为{human_doc_shape(canonical_audit.get('claims_document_shape'))}"
                      )
                  if component_key == "background":
                      return ensure_sentence(f"背景技术模块当前状态为{clean_text(spec_map.get('背景技术')) or '待进一步人工确认'}")
                  if component_key == "invention_content":
                      return ensure_sentence(f"发明内容模块当前状态为{clean_text(spec_map.get('发明内容')) or '待进一步人工确认'}")
                  if component_key == "embodiments":
                      return ensure_sentence(f"具体实施方式模块当前状态为{clean_text(spec_map.get('具体实施方式')) or '待进一步人工确认'}")
                  if component_key == "drawings":
                      drawings_count = canonical_audit.get("drawings_image_count")
                      if isinstance(drawings_count, int) and drawings_count <= 0:
                          return "当前未获得可用的附图图片文件。"
                      return ensure_sentence(f"附图相关材料当前状态为{clean_text(spec_map.get('附图说明')) or '待进一步人工确认'}")
                  if component_key == "terminology":
                      terminology_issues = dedupe_texts(canonical_audit.get("terminology_issues"))
                      if terminology_issues:
                          return ensure_sentence(f"当前已识别到术语或标号一致性风险，主要表现为：{'；'.join(terminology_issues[:2])}")
                      return "当前未识别到术语或标号的单独阻断性问题。"

              def component_default_lines(component_key):
                  current_status = sanitize_customer_visible_text(component_status(component_key))
                  defaults = {
                      "abstract": [
                          f"当前状态：{current_status}",
