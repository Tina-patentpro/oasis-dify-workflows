                  "document_presence": document_presence,
                  "missing_inputs": missing_inputs,
                  "input_warning_codes": input_warning_codes,
                  "input_warning_facts": input_warning_facts,
              }

              return {
                  **normalized_package,
                  "normalized_package": normalized_package,
                  "normalized_package_json": json.dumps(normalized_package, ensure_ascii=False),
              }
