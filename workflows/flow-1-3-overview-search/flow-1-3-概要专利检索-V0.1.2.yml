        code: |
          import json

          def _normalize(value):
              if value is None:
                  return ""
              return str(value).replace("\r\n", "\n").replace("\r", "\n").strip()

          def main(
              user_input=None,
              technical_solutions=None,
              disclosure_text=None,
              parsed_focus_text=None,
              tech_landscape_text=None,
              tech_landscape_file_text=None,
              **kwargs
          ):
              user_input = _normalize(user_input)
              technical_solutions = _normalize(technical_solutions)
              disclosure_text = _normalize(disclosure_text)
              parsed_focus_text = _normalize(parsed_focus_text)
              tech_landscape_text = _normalize(tech_landscape_text)
              tech_landscape_file_text = _normalize(tech_landscape_file_text)

              primary_candidates = [
                  ("technical_solutions", technical_solutions),
                  ("triz_analysis_report_patent_file", parsed_focus_text),
                  ("tech_landscape", tech_landscape_text),
                  ("tech_landscape_file", tech_landscape_file_text),
                  ("Technical_Disclosure_File", disclosure_text),
                  ("User_input", user_input),
              ]

              chosen_source = "missing"
              chosen_text = ""
              for source_name, value in primary_candidates:
                  if value:
                      chosen_source = source_name
                      chosen_text = value
                      break

              output = []
              output.append("# 用户指令（最高优先级）")
              output.append(user_input or "未提供")
              output.append("")
              output.append("# 主技术检索语义")
              output.append(chosen_text or "未提供")
              output.append("")
              output.append("# 交底书补充文本")
              output.append(disclosure_text or "未提供")
              output.append("")
              output.append("# 技术背景补充")
              output.append(tech_landscape_text or tech_landscape_file_text or "未提供")

              priority_trace = {
                  "chosen_primary_source": chosen_source,
                  "has_user_input": bool(user_input),
                  "has_technical_solutions": bool(technical_solutions),
                  "has_disclosure_text": bool(disclosure_text),
                  "has_triz_patent_focus": bool(parsed_focus_text),
                  "has_tech_landscape_text": bool(tech_landscape_text),
                  "has_tech_landscape_file_text": bool(tech_landscape_file_text),
              }

              return {
                  "output": "\n".join(output).strip(),
                  "priority_trace": priority_trace,
              }
