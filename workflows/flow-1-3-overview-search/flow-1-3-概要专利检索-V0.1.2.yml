        prompt_template:
        - id: 011-query-system
          role: system
          text: 你是 disclosure 路径的专利检索词设计专家。你的输出仅作为后备查询来源：只有在未提供可用的 TRIZ 报告，或 TRIZ 报告既未直接产出可执行 hints、也未能通过 TRIZ 全文补生得到查询时，才基于用户指令、技术方向、技术交底文本与技术背景补全查询。不要覆盖已存在的 TRIZ 直接 hints，也不要覆盖基于 TRIZ 报告全文补生得到的查询。输出必须满足既有 structured_output schema。
        - id: 011-query-user
          role: user
          text: |-
            # 归一化检索上下文
            {{#1768984375226.output#}}

            # 检索意图
            {{#1757935375807.structured_output#}}

            # TRIZ 报告检索线索
            {{#1769301001001.search_context_text#}}

            请输出候选检索词、最终选择、Serper 批量请求体与质量指标。
        selected: false
        structured_output:
          schema:
            additionalProperties: false
            properties:
              analysis:
                type: string
              candidates:
                items:
                  additionalProperties: false
                  properties:
                    keywords:
                      minItems: 1
                      items:
                        minLength: 1
                        type: string
