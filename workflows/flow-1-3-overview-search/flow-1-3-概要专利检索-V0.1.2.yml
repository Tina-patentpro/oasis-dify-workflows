    - data:
        code: |
          import json

          def _as_obj(payload):
              if isinstance(payload, str):
                  text = payload.strip()
                  if text.startswith("{") or text.startswith("["):
                      try:
                          return json.loads(text)
                      except Exception:
                          return payload
              return payload

          def _append_query(out, value):
              if isinstance(value, str):
                  text = " ".join(value.split()).strip()
                  if text:
                      out.append({"q": text})

          def _extract_queries(payload):
              payload = _as_obj(payload)
              if payload is None:
                  return []

              if isinstance(payload, list):
                  out = []
                  for item in payload:
                      out.extend(_extract_queries(item))
                  return out

              if isinstance(payload, dict):
                  out = []
                  if isinstance(payload.get("q"), str):
                      _append_query(out, payload.get("q"))
                  if isinstance(payload.get("query"), str):
                      _append_query(out, payload.get("query"))
                  if out:
                      return out

                  candidates = payload.get("candidates")
                  if isinstance(candidates, list):
                      out = []
                      for item in candidates:
                          if isinstance(item, dict):
                              if isinstance(item.get("q"), str):
                                  _append_query(out, item.get("q"))
                              elif isinstance(item.get("query"), str):
                                  _append_query(out, item.get("query"))
                      if out:
                          return out

                  final_selection = payload.get("final_selection")
                  if isinstance(final_selection, dict):
                      out = []
                      for value in final_selection.values():
                          out.extend(_extract_queries(value))
                      if out:
                          return out

                  for key in ("queries", "structured_output", "payload", "text", "data", "result"):
                      if key in payload:
                          out = _extract_queries(payload.get(key))
                          if out:
                              return out

              return []

          def _extract_string_field(payload, keys):
              payload = _as_obj(payload)
              if payload is None:
                  return ""
              if isinstance(payload, dict):
                  for key in keys:
                      value = payload.get(key)
                      if isinstance(value, str):
                          text = " ".join(value.split()).strip()
                          if text:
                              return text
                  for nested in ("structured_output", "payload", "text", "data", "result"):
                      if nested in payload:
                          text = _extract_string_field(payload.get(nested), keys)
                          if text:
                              return text
              return ""

          def _dedup_keep_order(items):
              seen = set()
              deduped = []
              for item in items:
                  if not isinstance(item, dict):
                      continue
                  query = item.get("q")
                  if not isinstance(query, str):
                      continue
                  query = " ".join(query.split()).strip()
                  if not query or query in seen:
                      continue
                  seen.add(query)
                  deduped.append({"q": query})
              return deduped

          def main(structured_output=None, queries=None, regenerated_queries=None, report_parse_status=None, triz_report_text=None, text=None, payload=None, **kwargs):
              parser_candidates = _dedup_keep_order(_extract_queries(queries))
              regenerated_candidates = _dedup_keep_order(_extract_queries(regenerated_queries))
              regenerated_status = _extract_string_field(regenerated_queries, ("triz_query_fallback_status",))
              regenerated_reason = _extract_string_field(regenerated_queries, ("regeneration_reason",))
              report_status = " ".join(str(report_parse_status or "").split()).strip()
              triz_report_text = " ".join(str(triz_report_text or "").split()).strip()
              triz_report_available = bool(triz_report_text) or regenerated_status not in ("", "not_available")

              candidates = []
              query_source = "generated_from_disclosure"
              final_triz_status = "not_available"
              final_reason = "no_triz_report_available"

              if parser_candidates:
                  candidates = parser_candidates
                  query_source = "triz_report_hints"
                  final_triz_status = "not_needed"
                  final_reason = "used_original_triz_hints"
              elif regenerated_candidates:
                  candidates = regenerated_candidates
                  query_source = "triz_report_regenerated"
                  final_triz_status = regenerated_status or "regenerated_from_triz_report"
                  final_reason = regenerated_reason or "regenerated_queries_from_triz_report"
              else:
                  if triz_report_available and report_status in ("partial_context_only", "no_valid_hints", "ok"):
                      raise ValueError("TRIZ report was provided, but no usable queries could be derived from hints or regenerated analysis.")

                  for source_name, source_value in (
                      ("generated_from_disclosure", structured_output),
                      ("generated_from_disclosure", text),
                      ("generated_from_disclosure", payload),
                  ):
                      if source_value is None:
                          continue
                      candidates = _extract_queries(source_value)
                      if candidates:
                          query_source = source_name
                          break

                  if not candidates:
                      fallback_kwargs = {
                          key: value
                          for key, value in kwargs.items()
                          if key not in {"queries", "regenerated_queries", "report_parse_status", "triz_report_text"}
                      }
                      candidates = _extract_queries(fallback_kwargs)
                      if candidates:
                          query_source = "generated_from_disclosure"

                  if not candidates:
                      candidates = _extract_queries(
                          {
                              "structured_output": structured_output,
                              "text": text,
                              "payload": payload,
                              **{
                                  key: value
                                  for key, value in kwargs.items()
                                  if key not in {"queries", "regenerated_queries", "report_parse_status", "triz_report_text"}
                              },
                          }
                      )
                      if candidates:
                          query_source = "generated_from_disclosure"

              if not candidates:
                  raise ValueError("No valid queries found in inputs.")

              candidates = _dedup_keep_order(candidates)
              top_queries = candidates[:12]

              body_list = [
                  {"q": item["q"], "num": 100, "gl": "cn", "hl": "zh-cn"}
                  for item in top_queries
                  if isinstance(item, dict) and isinstance(item.get("q"), str) and item["q"].strip()
              ]
              if not body_list:
                  raise ValueError("Extracted queries are empty after cleaning.")

              return {
                  "serper_batch_body": json.dumps(body_list, ensure_ascii=False),
                  "query_source": query_source,
                  "triz_query_fallback_status": final_triz_status,
                  "triz_regeneration_reason": final_reason,
              }
        code_language: python3
        desc: ''
        outputs:
          query_source:
            children: null
            type: string
          serper_batch_body:
            children: null
            type: string
          triz_query_fallback_status:
            children: null
            type: string
          triz_regeneration_reason:
            children: null
            type: string
