    - data:
        code: |
          import json
          import re

          DELIVERY_TARGET = 15

          def _as_docs(value):
              if isinstance(value, list):
                  return [item for item in value if isinstance(item, dict)]
              if isinstance(value, str):
                  text = value.strip()
                  if (text.startswith("{") and text.endswith("}")) or (text.startswith("[") and text.endswith("]")):
                      try:
                          return _as_docs(json.loads(text))
                      except Exception:
                          return []
              if isinstance(value, dict):
                  for key in ("merged_docs", "docs", "items", "results", "data"):
                      maybe = value.get(key)
                      if isinstance(maybe, list):
                          return [item for item in maybe if isinstance(item, dict)]
                  return [value]
              return []

          def _slug(text):
              text = re.sub(r'[\\/:*?"<>|]+', "_", str(text or "").strip())
              text = re.sub(r"\s+", "_", text)
              return text[:80] or "patent"

          def _clean(value):
              return str(value).strip() if value is not None else ""

          def _claims(value):
              if isinstance(value, list):
                  return [str(x).strip() for x in value if str(x).strip()]
              text = _clean(value)
              return [text] if text else []

          def main(merged_docs=None, **kwargs):
              docs = _as_docs(merged_docs)
              analysis_top15 = docs[:DELIVERY_TARGET]
              pdf_delivery_list = []
              seen = set()

              missing_or_duplicate_from_top15 = []
              for idx, doc in enumerate(docs):
                  pdf_url = _clean(doc.get("pdfUrl"))
                  usable = bool(pdf_url) and pdf_url not in seen
                  if idx < DELIVERY_TARGET and not usable:
                      missing_or_duplicate_from_top15.append({
                          "rank": doc.get("rank") or idx + 1,
                          "title": _clean(doc.get("title")),
                          "reason": "missing_pdf_url" if not pdf_url else "duplicate_pdf_url",
                      })
                  if not usable:
                      continue
                  seen.add(pdf_url)
                  pdf_delivery_list.append({
                      "delivery_rank": len(pdf_delivery_list) + 1,
                      "source_rank": doc.get("rank") or idx + 1,
                      "title": _clean(doc.get("title")),
                      "link": _clean(doc.get("link")),
                      "publicationNumber": _clean(doc.get("publicationNumber")),
                      "abstract": _clean(doc.get("abstract")),
                      "claims": _claims(doc.get("claims")),
                      "implementation_text": _clean(doc.get("implementation_text")),
                      "implementation_points": doc.get("implementation_points") if isinstance(doc.get("implementation_points"), list) else [],
                      "pdf_url": pdf_url,
                      "score": doc.get("score") if isinstance(doc.get("score"), (int, float)) else None,
                      "is_backfill": bool((doc.get("rank") or idx + 1) > DELIVERY_TARGET),
                      "filename_hint": f"{len(pdf_delivery_list)+1:02d}_{_slug(doc.get('title'))}.pdf",
                  })
                  if len(pdf_delivery_list) >= DELIVERY_TARGET:
                      break

              backfill_count = sum(1 for item in pdf_delivery_list if item.get("is_backfill"))
              shortfall = max(0, DELIVERY_TARGET - len(pdf_delivery_list))
              pdf_selection_note = (
                  f"analysis_top15={len(analysis_top15)}, delivered_pdfs={len(pdf_delivery_list)}, "
                  f"backfill_count={backfill_count}, missing_or_duplicate_in_top15={len(missing_or_duplicate_from_top15)}"
              )
              pdf_shortfall_note = (
