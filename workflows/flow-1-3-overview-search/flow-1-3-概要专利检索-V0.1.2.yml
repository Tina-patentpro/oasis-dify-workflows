    - data:
        code: |
          import json
          import re
          from typing import Any, Dict, List, Tuple

          HEADING_RE = re.compile(
              r'^\s*(?:#{1,6}\s*)?(?:\*{0,2}\s*)?M[\s\-]?(\d{2})(?:\s*[:\uff1a]\s*(.*))?\s*(?:\*{0,2})?\s*$',
              re.I,
          )


          def _strip_fences(text: str) -> str:
              s = (text or '').strip()
              s = re.sub(r'^```(?:json|JSON|markdown|md)?\s*', '', s)
              s = re.sub(r'\s*```$', '', s)
              return s.strip()


          def _clean_inline(text: str) -> str:
              text = text or ''
              text = re.sub(r'\*\*', '', text)
              text = re.sub(r'__+', '', text)
              return text.strip()


          def _collapse_escaped_quotes(text: str) -> str:
              prev = None
              while prev != text:
                  prev = text
                  text = text.replace('\\"', '"').replace("\\'", "'")
              return text


          def _restore_escaped_markdown(value: Any) -> Tuple[str, str]:
              raw = '' if value is None else str(value)
              raw = _strip_fences(raw)
              decode_status = 'as_is'

              stripped = raw.strip()
              if stripped.startswith('"') and stripped.endswith('"'):
                  try:
                      decoded = json.loads(stripped)
                      if isinstance(decoded, str):
                          raw = decoded
                          decode_status = 'json_string'
                  except Exception:
                      pass

              escaped_breaks = raw.count('\\r\\n') + raw.count('\\n') + raw.count('\\r')
              real_breaks = raw.count('\n') + raw.count('\r')
              looks_escaped = escaped_breaks >= 2 and escaped_breaks >= max(2, real_breaks)
              if looks_escaped:
                  raw = raw.replace('\\r\\n', '\n')
                  raw = raw.replace('\\n', '\n')
                  raw = raw.replace('\\r', '\n')
                  raw = raw.replace('\\t', '\t')
                  decode_status = 'escaped_markdown' if decode_status == 'as_is' else f'{decode_status}+escaped_markdown'

              raw = _collapse_escaped_quotes(raw)
              raw = re.sub(r'\\+\n', '\n', raw)
              raw = raw.replace('\r\n', '\n').replace('\r', '\n')
              raw = re.sub(r'\n{3,}', '\n\n', raw)
              return raw.strip(), decode_status


          def _extract_sections_by_lines(text: str) -> Tuple[Dict[str, str], str]:
              lines = text.splitlines()
              hits = []
              for idx, raw in enumerate(lines):
                  line = _clean_inline(raw)
                  m = HEADING_RE.match(line)
                  if m:
                      hits.append((m.group(1), idx, _clean_inline(m.group(2) or '')))
              if not hits:
                  return {}, 'none'

              sections: Dict[str, str] = {}
              for pos, (sec_id, line_idx, inline_rest) in enumerate(hits):
                  next_idx = hits[pos + 1][1] if pos + 1 < len(hits) else len(lines)
                  body_lines: List[str] = []
                  if inline_rest:
                      body_lines.append(inline_rest)
                  body_lines.extend(lines[line_idx + 1:next_idx])
                  sections[sec_id] = '\n'.join(body_lines).strip()
              return sections, 'line_heading'


          def _extract_block(text: str, sec_id: str, next_ids: List[str]) -> str:
              next_pat = '|'.join([rf'M[\s\-]?{nid}\b' for nid in next_ids]) if next_ids else r'\Z'
              pattern = re.compile(
                  rf'(?is)(?:^|\n)\s*(?:#{{1,6}}\s*)?(?:\*{{0,2}}\s*)?M[\s\-]?{sec_id}\s*(?:[:\uff1a]\s*)?(.*?)(?=\n\s*(?:#{{1,6}}\s*)?(?:\*{{0,2}}\s*)?(?:{next_pat})|\Z)'
              )
              m = pattern.search(text)
              if not m:
                  return ''
              return _clean_inline(m.group(1)).strip()


          def _extract_sections(text: str) -> Tuple[Dict[str, str], str]:
              sections, mode = _extract_sections_by_lines(text)
              if sections:
                  return sections, mode
              fallback: Dict[str, str] = {}
              m06 = _extract_block(text, '06', ['07', '08', '09', '10'])
              m07 = _extract_block(text, '07', ['08', '09', '10'])
              if m06:
                  fallback['06'] = m06
              if m07:
                  fallback['07'] = m07
              return fallback, 'regex_fallback' if fallback else 'none'


          def _normalize_query_text(text: str) -> str:
              text = _clean_inline(text)
              text = re.sub(r'^\d+[.)\u3001]\s*', '', text)
              text = text.replace('`', '')
              text = _collapse_escaped_quotes(text)
              text = text.replace('\\', '')
              text = ' '.join(text.split())
              return text.strip()


          def _split_keywords(section: str) -> List[str]:
              keywords: List[str] = []
              for raw in section.splitlines():
                  cleaned = _clean_inline(raw).strip(' -*\t')
                  if not cleaned or '\u7c07' not in cleaned:
                      continue
                  if '\uff1a' in cleaned:
                      cleaned = cleaned.split('\uff1a', 1)[1]
                  elif ':' in cleaned:
                      cleaned = cleaned.split(':', 1)[1]
                  parts = re.split(r'[\u3001,\uff0c\uff1b;]+', cleaned)
                  for part in parts:
                      token = re.sub(r'^[A-Za-z]\s*[\uff1a:]', '', part).strip()
                      token = re.sub(r'^\*+|\*+$', '', token).strip()
                      token = _normalize_query_text(token)
                      if token and len(token) >= 2:
                          keywords.append(token)
              out: List[str] = []
              seen = set()
              for token in keywords:
                  key = token.lower()
                  if key in seen:
                      continue
                  seen.add(key)
                  out.append(token)
              return out


          def _build_keyword_queries(keywords: List[str], limit: int = 12) -> List[str]:
              queries: List[str] = []
              seen = set()
              for i in range(0, len(keywords), 3):
                  chunk = [item for item in keywords[i:i + 4] if item]
                  if not chunk:
                      continue
                  q = ' '.join(chunk).strip()
                  if q and q not in seen:
                      seen.add(q)
                      queries.append(q)
                  if len(queries) >= limit:
                      break
              return queries


          def _extract_boolean_queries(section: str) -> List[str]:
              queries: List[str] = []
              for raw in section.splitlines():
                  cleaned = _normalize_query_text(raw)
                  lowered = cleaned.lower()
                  if not cleaned:
                      continue
                  if ('ti=' in lowered or 'ab=' in lowered or 'cl=' in lowered) and (' and ' in lowered or ' or ' in lowered or '(' in cleaned):
                      queries.append(cleaned)
              return queries


          def _extract_codes(section: str) -> List[str]:
              codes: List[str] = []
              for code in re.findall(r'\b[A-HY][0-9]{2}[A-Z]?\d+(?:/\d+)?\b', section):
                  if code not in codes:
                      codes.append(code)
              return codes


          def _extract_bullets(section: str) -> List[str]:
              bullets: List[str] = []
              for raw in section.splitlines():
                  cleaned = _normalize_query_text(raw)
                  if not cleaned:
                      continue
                  if re.match(r'^(?:[-*\u2022]|\d+[.)\u3001])\s*', cleaned):
                      cleaned = re.sub(r'^(?:[-*\u2022]|\d+[.)\u3001])\s*', '', cleaned).strip()
                  bullets.append(cleaned)
              return bullets[:12]


          def _as_query_objects(items: List[str]) -> List[Dict[str, str]]:
              out: List[Dict[str, str]] = []
              seen = set()
              for item in items:
                  q = ' '.join((item or '').split()).strip()
                  if not q or q in seen:
                      continue
                  seen.add(q)
                  out.append({'q': q})
              return out


          def main(report_text=None, text=None, payload=None, **kwargs):
              source_value = report_text if report_text is not None else text
              if source_value is None:
                  source_value = payload
              if source_value is None and kwargs:
                  source_value = kwargs

              normalized_text, decode_status = _restore_escaped_markdown(source_value)
              if not normalized_text:
                  return {
                      'queries': [],
                      'search_context_text': json.dumps({}, ensure_ascii=False),
                      'parsed_focus_text': '',
                      'report_parse_status': 'no_valid_hints',
                      'report_parse_meta': {
                          'section_keys': [],
                          'query_count': 0,
                          'heading_mode': 'none',
                          'section_found_m06': False,
                          'section_found_m07': False,
                          'decode_status': decode_status,
                      },
                  }

              sections, heading_mode = _extract_sections(normalized_text)
              m06 = sections.get('06', '')
              m07 = sections.get('07', '')
              intro_focus = '\n'.join(normalized_text.splitlines()[:20]).strip()

              boolean_queries = _extract_boolean_queries(m06)
              keyword_queries = _build_keyword_queries(_split_keywords(m06))
              queries = _as_query_objects(boolean_queries + keyword_queries)

              search_context = {
                  'm06_keywords': _split_keywords(m06)[:24],
                  'boolean_queries': boolean_queries[:12],
                  'ipc_cpc_candidates': _extract_codes(m06)[:12],
                  'divisional_focus': _extract_bullets(m07)[:8],
              }
              parsed_focus_text = '\n\n'.join(part for part in [intro_focus, m06[:1200], m07[:1200]] if part).strip()

              if queries:
                  status = 'ok'
              elif any(search_context.values()):
                  status = 'partial_context_only'
              else:
                  status = 'no_valid_hints'

              return {
                  'queries': queries,
                  'search_context_text': json.dumps(search_context, ensure_ascii=False),
                  'parsed_focus_text': parsed_focus_text,
                  'report_parse_status': status,
                  'report_parse_meta': {
                      'section_keys': sorted(sections.keys()),
                      'query_count': len(queries),
                      'heading_mode': heading_mode,
                      'section_found_m06': bool(m06.strip()),
                      'section_found_m07': bool(m07.strip()),
                      'decode_status': decode_status,
                  },
              }
        code_language: python3
        outputs:
          queries:
            children: null
            type: array[object]
          search_context_text:
            children: null
            type: string
          parsed_focus_text:
            children: null
            type: string
          report_parse_status:
            children: null
            type: string
          report_parse_meta:
            children: null
            type: object
