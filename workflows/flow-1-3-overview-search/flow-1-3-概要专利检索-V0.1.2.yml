    - data:
        code: |
          import json
          import re
          from typing import Any, List

          def _as_text_list(value: Any) -> List[str]:
              if isinstance(value, list):
                  return [str(item) for item in value]
              if isinstance(value, str):
                  return [value]
              return []

          def _as_docs(value: Any):
              if isinstance(value, list):
                  return [item for item in value if isinstance(item, dict)]
              if isinstance(value, str):
                  text = value.strip()
                  if (text.startswith("{") and text.endswith("}")) or (text.startswith("[") and text.endswith("]")):
                      try:
                          payload = json.loads(text)
                          return _as_docs(payload)
                      except Exception:
                          return []
              if isinstance(value, dict):
                  for key in ("pdf_delivery_list", "docs", "items", "results", "data"):
                      maybe = value.get(key)
                      if isinstance(maybe, list):
                          return [item for item in maybe if isinstance(item, dict)]
                  return [value]
              return []

          def _normalize(text: Any) -> str:
              if text is None:
                  return ""
              value = str(text).replace("\r\n", "\n").replace("\r", "\n")
              value = re.sub(r"\n{3,}", "\n\n", value)
              return value.strip()

          def _extract_section(md: str, heads: List[str], stop_heads: List[str]) -> str:
              if not md:
                  return ""
              head_pat = r"(?mi)^(?:\s*#{1,3}\s*)?(%s)\s*(?:\(\s*\d+\s*\))?\s*[:：]?\s*$" % "|".join(re.escape(h) for h in heads)
              m = re.search(head_pat, md)
              if not m:
                  return ""
              start = m.end()
              stop_pat = r"(?mi)^(?:\s*#{1,3}\s*)?(%s)\s*(?:\(\s*\d+\s*\))?\s*[:：]?\s*$" % "|".join(re.escape(h) for h in stop_heads)
              m2 = re.search(stop_pat, md[start:])
              end = start + (m2.start() if m2 else len(md))
              return md[start:end].strip()

          def _split_claims(text: str) -> List[str]:
              if not text:
                  return []
              claims = []
              current = []
              for raw in text.splitlines():
                  line = raw.strip()
                  if not line:
                      continue
                  if re.match(r"^(?:\(?\d+\)?[\.、)]|\d+[\.\)]|[一二三四五六七八九十]+、)\s*", line):
                      if current:
                          claims.append(" ".join(current).strip())
                          current = []
                      line = re.sub(r"^(?:\(?\d+\)?[\.、)]|\d+[\.\)]|[一二三四五六七八九十]+、)\s*", "", line)
                  current.append(line)
              if current:
                  claims.append(" ".join(current).strip())
              out = []
              seen = set()
              for claim in claims:
                  key = claim.lower()
                  if claim and key not in seen:
                      seen.add(key)
                      out.append(claim)
              return out[:10]

          def _implementation_points(text: str) -> List[str]:
              points = []
              for raw in text.splitlines():
                  line = raw.strip(" -*\t")
                  if line:
                      points.append(line)
                  if len(points) >= 10:
                      break
              return points

          def main(pdf_texts=None, pdf_delivery_list=None, **kwargs):
              texts = _as_text_list(pdf_texts)
              delivery = _as_docs(pdf_delivery_list)
              analyses = []
              extracted_count = 0
              fallback_count = 0

              for idx, item in enumerate(delivery):
                  raw_text = _normalize(texts[idx]) if idx < len(texts) else ""
                  claims_block = _extract_section(raw_text, ["Claims", "权利要求", "权利要求书"], ["Description", "具体实施方式", "实施例", "实施方式", "Legal Events", "References"])
                  implementation_block = _extract_section(raw_text, ["Description", "具体实施方式", "实施例", "实施方式"], ["Legal Events", "References", "Patent Citations", "Country Status"])
                  claims = _split_claims(claims_block)
                  implementation_text = implementation_block[:4000]
                  if claims or len(implementation_text) >= 80:
                      analysis_source = "pdf_extracted"
                      extracted_count += 1
                      info_limit_note = ""
                  else:
                      analysis_source = "page_fallback"
                      fallback_count += 1
                      claims = item.get("claims") if isinstance(item.get("claims"), list) else []
                      implementation_text = str(item.get("implementation_text") or "")
                      info_limit_note = "PDF提取失败，以下分析基于页面抓取降级结果。"

                  analyses.append({
                      "delivery_rank": item.get("delivery_rank"),
                      "source_rank": item.get("source_rank"),
                      "is_backfill": bool(item.get("is_backfill")),
                      "title": item.get("title"),
                      "link": item.get("link"),
                      "publicationNumber": item.get("publicationNumber"),
                      "pdf_url": item.get("pdf_url"),
                      "abstract": item.get("abstract"),
                      "claims": claims,
                      "implementation_text": implementation_text,
                      "implementation_points": _implementation_points(implementation_text),
                      "score": item.get("score"),
                      "analysis_source": analysis_source,
                      "info_limit_note": info_limit_note,
                  })

              return {
                  "pdf_analysis_docs_json": json.dumps(analyses, ensure_ascii=False),
                  "pdf_analysis_note": f"delivery_count={len(analyses)}, pdf_extracted={extracted_count}, page_fallback={fallback_count}",
              }
        code_language: python3
        desc: ''
        outputs:
          pdf_analysis_docs_json:
            children: null
            type: string
          pdf_analysis_note:
            children: null
            type: string
        selected: false
        title: PDF分析结果整理
        type: code
        variables:
