    - data:
        code: "import re\nfrom typing import Dict, Any\n\n\ndef extract_invention_section(text:\
          \ str) -> str:\n    \"\"\"\n    提取 <SECTION_INVENTION_GUIDE> ... </SECTION_INVENTION_GUIDE>\
          \ 内部的原始内容。\n    - 如果能匹配到该标签，则返回标签内部内容；\n    - 如果匹配不到，则返回空字符串，由上层决定是否用原始\
          \ input 兜底。\n    \"\"\"\n    if not text:\n        return \"\"\n    m =\
          \ re.search(\n        r\"<SECTION_INVENTION_GUIDE>(.*?)</SECTION_INVENTION_GUIDE>\"\
          ,\n        text,\n        re.S | re.I,\n    )\n    if not m:\n        return\
          \ \"\"\n    return m.group(1).strip()\n\n\ndef extract_invention_forbidden_rule(section:\
          \ str) -> str:\n    \"\"\"\n    在 SECTION_INVENTION_GUIDE 内容中，提取 [禁止指令]\
          \ 后面的内容。\n    模板示例（仅说明结构，不会出现在输出中）:\n    [禁止指令] :\n    - 不得暴露完整权利要求1文本\n\
          \    - 不得输出具体实施方式细节\n    \"\"\"\n    if not section:\n        return \"\"\
          \n\n    m = re.search(\n        r\"\\[禁止指令\\]\\s*:?(.*)\",\n        section,\n\
          \        re.S,\n    )\n    if not m:\n        return \"\"\n\n    return\
          \ m.group(1).strip()\n\n\ndef main(input: str = \"\", **kwargs) -> Dict[str,\
          \ Any]:\n    \"\"\"\n    Dify 代码节点入口。\n    注意：Dify 会以 main(input=...) 的形式调用，所以这里参数名必须是\
          \ input。\n\n    输出字段名需要和节点右侧“输出变量”配置完全一致：\n    - invention_section_raw\n\
          \    - invention_forbidden_rule\n    \"\"\"\n    raw_text = input or \"\"\
          \n\n    # 1. 优先尝试提取 <SECTION_INVENTION_GUIDE> 区块\n    section_raw = extract_invention_section(raw_text)\n\
          \n    # 如果模板里暂时还没有添加该标签，则退回整个 input 作为原始大纲内容\n    if not section_raw:\n\
          \        section_raw = raw_text.strip()\n\n    # 2. 从区块中解析 [禁止指令] 段（如果有）\n\
          \    forbidden_rule = extract_invention_forbidden_rule(section_raw)\n\n\
          \    # 3. 返回给 Dify\n    return {\n        \"invention_section_raw\": section_raw,\
          \        # String\n        \"invention_forbidden_rule\": forbidden_rule,\
          \  # String\n    }\n"
