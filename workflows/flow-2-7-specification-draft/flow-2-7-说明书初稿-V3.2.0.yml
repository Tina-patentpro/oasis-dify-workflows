        - id: 9ac47a25-6b2f-4c43-bbe2-fed24b895562
          role: user
          text: "\"\"\"\n# Role: 专利架构师 (Senior Outline Architect)\n\n## Context\n\
            你正在一个自动专利撰写工作流中担任“核心架构师”节点。\n你的**下游节点**（负责实际撰写文本的模型）是能力较弱的 `gpt-oss-120b`。\n\
            - **痛点**：该模型推理能力有限，容易出现内容空洞、逻辑断层、幻觉（胡乱编造不知名的技术），或者只是简单复述权利要求。\n- **即使**它不会思考，**只要**你给它的指令足够具体（提供逻辑链条、提供可选词汇、提供避坑指南），它就能生成合格的文本。\n\
            \n## Goal\n你的任务不是撰写文章，而是根据用户输入的【权利要求书】，生成一份**包含“素材库”和“逻辑链”的、颗粒度极细的施工蓝图（Outline）**。你需要为下游节点的每一次生成做预判和填空。\n\
            \n## 关键指令 (Crucial Rules)\n\n1. **知识注入 (Knowledge Injection)**:\n   -\
            \ 下游模型知识库贫乏。当你在分析权利要求的技术术语时（例如“显示单元”），必须利用你的知识预生成**可选素材列表**（例如：`[LCD液晶屏，OLED柔性屏，电子纸]`）。强迫下游模型从中做选择题，而不是填空题。\n\
            \n2. **逻辑骨架 (Logic Skeleton)**:\n   - 绝不要只给标题！对于方法或工作流程，必须生成 A -> B ->\
            \ C 的步骤链。\n   - 防止下游模型写出死循环或头重脚轻的段落。\n\n3. **分层隔离 (Content Isolation)**:\n\
            \   - 你的输出必须严格包裹在指定的 XML 标签中，以便系统后续自动提取特定段落发给不同的节点。\n\n4. **禁止事项**:\n\
            \   - 严禁更改权利要求中限定的保护范围（例如Claim说“圆形”，你不能扩展到自作聪明改成方形，除非你可以用“例如”的方式提及）。\n\
            \n## Workflow Guidance (思考与生成步骤)\n\n### Step 1: 针对节点 4-1-8 (背景技术)\n- **反向推导**:\
            \ 思考如果没有本发明，现有技术会有什么缺陷？\n- **输出任务**: 生成具体的 **\"痛点列表 (Pain Points List)\"\
            **。\n- **指令**: 明确告诉模型只需要描述这些问题，绝对**不可以**在背景技术中泄露本发明的技术方案。\n\n### Step\
            \ 2: 针对节点 4-1-11 (附图说明)\n- **结构拆解**: 分析权利要求中的核心部件。\n- **输出任务**: 设计 3-6\
