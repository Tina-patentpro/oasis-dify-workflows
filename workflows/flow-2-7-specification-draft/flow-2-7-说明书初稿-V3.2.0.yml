    - data:
        code: "import re\nfrom typing import Dict, Any\n\n\ndef extract_background_section(text:\
          \ str) -> str:\n    \"\"\"\n    提取 <SECTION_BACKGROUND_GUIDE> ... </SECTION_BACKGROUND_GUIDE>\
          \ 内部的原始内容。\n    如果找不到标签，则返回空字符串。\n    \"\"\"\n    if not text:\n       \
          \ return \"\"\n    m = re.search(\n        r\"<SECTION_BACKGROUND_GUIDE>(.*?)</SECTION_BACKGROUND_GUIDE>\"\
          ,\n        text,\n        re.S | re.I,\n    )\n    if not m:\n        return\
          \ \"\"\n    return m.group(1).strip()\n\n\ndef extract_pain_points(section:\
          \ str) -> str:\n    \"\"\"\n    在已截取的 SECTION_BACKGROUND_GUIDE 内容中，提取 [痛点列表]\
          \ 下的条目。\n    输出为多行字符串，每行一条。\n    \"\"\"\n    if not section:\n        return\
          \ \"\"\n\n    m = re.search(\n        r\"\\[痛点列表\\]\\s*:?(.*?)(?:\\[禁止指令\\\
          ]|\\Z)\",\n        section,\n        re.S,\n    )\n    if not m:\n     \
          \   return \"\"\n\n    block = m.group(1)\n    lines = []\n    for line\
          \ in block.splitlines():\n        raw = line.strip()\n        if not raw:\n\
          \            continue\n        # 一般是 \"1. 现有技术缺陷 A: ...\" 之类，原样保留\n    \
          \    lines.append(raw)\n\n    return \"\\n\".join(lines) if lines else \"\
          \"\n\n\ndef extract_forbidden_rule(section: str) -> str:\n    \"\"\"\n \
          \   在已截取的 SECTION_BACKGROUND_GUIDE 内容中，提取 [禁止指令] 后面的全部内容。\n    输出为一个字符串。\n\
          \    \"\"\"\n    if not section:\n        return \"\"\n\n    m = re.search(\n\
          \        r\"\\[禁止指令\\]\\s*:?(.*)\",\n        section,\n        re.S,\n \
          \   )\n    if not m:\n        return \"\"\n\n    return m.group(1).strip()\n\
          \n\ndef main(input: str = \"\", **kwargs) -> Dict[str, Any]:\n    \"\"\"\
          \n    Dify 代码节点入口。\n    Dify 会以 main(input=...) 的形式调用，所以这里参数名必须是 input。\n\
          \    \"\"\"\n    raw_text = input or \"\"\n\n    # 1. 拿到背景大纲原始区块\n    section_raw\
          \ = extract_background_section(raw_text)\n\n    # 2. 从区块中解析痛点列表和禁止指令\n \
          \   pain_points = extract_pain_points(section_raw)\n    forbidden_rule =\
          \ extract_forbidden_rule(section_raw)\n\n    # 3. 返回给 Dify，字段名必须和“输出变量”配置完全一致\n\
          \    return {\n        \"background_section_raw\": section_raw,        #\
          \ String\n        \"background_pain_points\": pain_points,        # String\n\
          \        \"background_forbidden_rule\": forbidden_rule,  # String\n    }\n"
        code_language: python3
