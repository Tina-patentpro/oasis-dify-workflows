          \   import re\n\n    # 1) 兜底：保证是字符串\n    text = \"\" if input is None else\
          \ str(input)\n\n    # 2) 规范换行，去除BOM与常见零宽字符\n    text = text.replace(\"\\\
          r\\n\", \"\\n\").replace(\"\\r\", \"\\n\")\n    text = text.replace(\"\\\
          ufeff\", \"\")               # BOM\n    text = re.sub(r\"[\\u200B-\\u200D\\\
          uFEFF]\", \"\", text)  # 零宽字符\n\n    # 3) 删除所有标准形式的 <think ...>...</think>（大小写不敏感，允许属性）\n\
          \    pattern_closed = re.compile(r\"<\\s*think\\b[^>]*>.*?</\\s*think\\\
          s*>\",\n                                re.IGNORECASE | re.DOTALL)\n   \
          \ text = pattern_closed.sub(\"\", text)\n\n    # 4) 容错：若还有未闭合的 <think> 残片（例如被截断），从开标签至文末全部移除\n\
          \    pattern_unclosed = re.compile(r\"<\\s*think\\b[^>]*>.*\\Z\",\n    \
          \                              re.IGNORECASE | re.DOTALL)\n    text = pattern_unclosed.sub(\"\
          \", text)\n\n    # 5) 清理多余空行与首尾空白\n    # 连续≥3个空行压缩为2个；再整体去首尾空白\n    text\
          \ = re.sub(r\"\\n{3,}\", \"\\n\\n\", text)\n    text = text.strip()\n\n\
          \    return {\"output\": text}\n"
