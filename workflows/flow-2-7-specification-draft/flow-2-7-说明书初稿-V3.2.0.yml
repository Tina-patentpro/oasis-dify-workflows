            在一种可能的实施方式中，感应元件为激光传感器，激光传感器发出的激光束与空气弹簧进气柱的外边沿相切。其中，激光传感器数量为两个，两个激光传感器的激光束平行，两条激光束的间距与空气弹簧进气柱的外边沿的距离相等。

