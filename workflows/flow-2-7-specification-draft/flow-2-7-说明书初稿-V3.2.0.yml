          \ 内部的原始内容。\n    如果找不到标签，则返回空字符串。\n    \"\"\"\n    if not text:\n       \
          \ return \"\"\n    m = re.search(\n        r\"<SECTION_EMBODIMENTS_GUIDE>(.*?)</SECTION_EMBODIMENTS_GUIDE>\"\
          ,\n        text,\n        re.S | re.I,\n    )\n    if not m:\n        return\
          \ \"\"\n    return m.group(1).strip()\n\n\ndef extract_specifics_db(section:\
          \ str) -> str:\n    \"\"\"\n    在 SECTION_EMBODIMENTS_GUIDE 内容中，提取\n   \
          \ [Specifics Database / 实体词素材库] 区块。\n\n    输出为原始多行字符串。\n    \"\"\"\n   \
          \ if not section:\n        return \"\"\n\n    m = re.search(\n        r\"\
          \\[Specifics Database\\s*/\\s*实体词素材库\\]\\s*:?(.*?)(?:\\[Case 1 Logic Chain\\\
          s*/\\s*基础实施例逻辑链\\]|\\Z)\",\n        section,\n        re.S,\n    )\n   \
          \ if not m:\n        return \"\"\n\n    block = m.group(1).strip()\n   \
          \ return block\n\n\ndef extract_case1_logic_chain(section: str) -> str:\n\
          \    \"\"\"\n    在 SECTION_EMBODIMENTS_GUIDE 内容中，提取\n    [Case 1 Logic Chain\
          \ / 基础实施例逻辑链] 区块。\n    \"\"\"\n    if not section:\n        return \"\"\n\
          \n    m = re.search(\n        r\"\\[Case 1 Logic Chain\\s*/\\s*基础实施例逻辑链\\\
          ]\\s*:?(.*?)(?:\\[Case 2 Logic Chain\\s*/\\s*有益效果实施例逻辑链\\]|\\Z)\",\n   \
          \     section,\n        re.S,\n    )\n    if not m:\n        return \"\"\
          \n\n    block = m.group(1).strip()\n    return block\n\n\ndef extract_case2_logic_chain(section:\
          \ str) -> str:\n    \"\"\"\n    在 SECTION_EMBODIMENTS_GUIDE 内容中，提取\n   \
          \ [Case 2 Logic Chain / 有益效果实施例逻辑链] 区块。\n    \"\"\"\n    if not section:\n\
          \        return \"\"\n\n    m = re.search(\n        r\"\\[Case 2 Logic Chain\\\
          s*/\\s*有益效果实施例逻辑链\\]\\s*:?(.*)\",\n        section,\n        re.S,\n   \
          \ )\n    if not m:\n        return \"\"\n\n    block = m.group(1).strip()\n\
          \    return block\n\n\ndef main(input: str = \"\", **kwargs) -> Dict[str,\
          \ Any]:\n    \"\"\"\n    Dify 代码节点入口。\n    注意：Dify 会以 main(input=...) 的形式调用，所以这里参数名必须是\
          \ input。\n    返回必须包含节点里配置的 4 个输出变量：\n    - embodiments_section_raw\n   \
          \ - embodiments_specifics_db\n    - embodiments_case1_logic_chain\n    -\
          \ embodiments_case2_logic_chain\n    \"\"\"\n    raw_text = input or \"\"\
          \n\n    # 1. 提取具体实施方式大纲原始区块\n    section_raw = extract_embodiments_section(raw_text)\n\
          \n    # 2. 从区块中解析实体词素材库、Case1 逻辑链、Case2 逻辑链\n    specifics_db = extract_specifics_db(section_raw)\n\
          \    case1_logic = extract_case1_logic_chain(section_raw)\n    case2_logic\
          \ = extract_case2_logic_chain(section_raw)\n\n    # 3. 返回给 Dify，字段名要和“输出变量”配置完全一致\n\
          \    return {\n        \"embodiments_section_raw\": section_raw,       \
          \       # String\n        \"embodiments_specifics_db\": specifics_db,  \
          \          # String\n        \"embodiments_case1_logic_chain\": case1_logic,\
          \        # String\n        \"embodiments_case2_logic_chain\": case2_logic,\
          \        # String\n    }\n"
