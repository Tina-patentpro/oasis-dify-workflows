    - data:
        code: "import re\nfrom typing import Dict, Any\n\n\ndef extract_drawings_section(text:\
          \ str) -> str:\n    \"\"\"\n    提取 <SECTION_DRAWINGS_GUIDE> ... </SECTION_DRAWINGS_GUIDE>\
          \ 内部的原始内容。\n    如果找不到标签，则返回空字符串。\n    \"\"\"\n    if not text:\n       \
          \ return \"\"\n    m = re.search(\n        r\"<SECTION_DRAWINGS_GUIDE>(.*?)</SECTION_DRAWINGS_GUIDE>\"\
          ,\n        text,\n        re.S | re.I,\n    )\n    if not m:\n        return\
          \ \"\"\n    return m.group(1).strip()\n\n\ndef extract_drawings_plan_list(section:\
          \ str) -> str:\n    \"\"\"\n    在 SECTION_DRAWINGS_GUIDE 内容中，提取 [附图规划清单]\
          \ 下的全部条目。\n    输出为多行字符串，每行一条，例如：\n    - Figure 1: ...\n    - Figure 2: ...\n\
          \    \"\"\"\n    if not section:\n        return \"\"\n\n    # 匹配 [附图规划清单]\
          \ 后面的内容，一直到区块结束\n    m = re.search(\n        r\"\\[附图规划清单\\]\\s*:?(.*)\"\
          ,\n        section,\n        re.S,\n    )\n    if not m:\n        return\
          \ \"\"\n\n    block = m.group(1)\n    lines = []\n    for line in block.splitlines():\n\
          \        raw = line.strip()\n        if not raw:\n            continue\n\
          \        # 一般是 \"- Figure 1: ...\" 这样的行，原样保留\n        lines.append(raw)\n\
          \n    return \"\\n\".join(lines) if lines else \"\"\n\n\ndef main(input:\
          \ str = \"\", **kwargs) -> Dict[str, Any]:\n    \"\"\"\n    Dify 代码节点入口。\n\
          \    注意：Dify 会以 main(input=...) 的形式调用，所以这里参数名必须是 input。\n    \"\"\"\n  \
          \  raw_text = input or \"\"\n\n    # 1. 提取附图大纲原始区块\n    drawings_section_raw\
          \ = extract_drawings_section(raw_text)\n\n    # 2. 从区块中解析附图规划清单\n    drawings_plan_list\
          \ = extract_drawings_plan_list(drawings_section_raw)\n\n    # 3. 返回给 Dify，字段名必须与节点“输出变量”配置一致\n\
          \    return {\n        \"drawings_section_raw\": drawings_section_raw, \
