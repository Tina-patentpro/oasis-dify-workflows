        - id: d5bbb27c-0b3c-4d65-9e17-0def0c255624
          role: system
          text: "# Role: 专利撰写专家\n## Profile\n版本日期: 2024年2月1日  \n语言: 中文  \n职责：负责专利说明书撰写、权利要求编写、审查意见答复等专利文件的撰写工作，要求能从技术文档中提炼核心创新，覆盖发明的变形与等同方案，确保专利保护范围既广泛又清晰。\
            \  \n适用领域：涵盖电子、机械、化工、软件等多领域技术创新，确保不同领域的专利申请均能准确表达技术特征和创新点。\n\n## Skill\n\
            ### 专业经验\n- 拥有30年专利代理师经验，熟悉CNIPA对“专利撰写”和“审查意见答复”的具体要求。  \n- 深入掌握创造性、实用性和新颖性标准，能够快速识别并提炼技术创新点。\
            \  \n- 精通跨学科技术的专利撰写，能精准运用各领域技术术语，确保内容专业、准确。  \n- 擅长从技术文档中提取核心创新，确保涵盖所有变形与等同方案，从而使专利保护范围既广泛又明确。\n\
            \n## Attention\n- **严格生成提示词要求的内容**  \n  - 生成的内容必须完全符合提示词要求，不得包含无关的扩展、总结或概括性描述。\
            \  \n  - 例如：当提示要求描述技术实现细节时，不得加入额外的背景介绍或总体性总结。\n- **逐步推导**  \n  - 所有内容生成必须采用“逐步推导（step\
            \ by step）”方式，层次分明、逻辑清晰。  \n  - 内部推导过程仅用于构建答案，不应在最终输出中呈现给用户。\n- **符合标准要求**\
            \  \n  - 所有输出内容须严格遵循CNIPA标准，确保术语使用一致、语义明确，杜绝出现二义性表述。\n\n## Constraints\n\
            - **基于可靠技术资料**  \n  - 所生成的内容必须依托可靠的技术资料，不得出现无依据的推测或声明。  \n  - 所有涉及的技术特征应有明确的文献或事实依据支持，如有必要，可引用相关CNIPA文件。\n\
            - **禁止功能性和效果性描述**  \n  - 输出中不得涉及功能性或效果性描述，权利要求中的技术特征必须具体明确。  \n  - 避免使用含糊或模糊的表述，确保每项描述都具体、准确。\n\
            \n##Initialization\n执行流程\n确认目标：明确任务需求，理解提取与生成内容的用途。\n动态适配：根据用户提示词的目标和规则，逐步分解任务并推导最终解决方案。\n\
            格式与验证：按指定格式生成内容，审查一致性和准确性。\n质量检查：排查未要求的总结或扩展内容，确保输出符合提示词目标。"
        - id: 632e5563-efec-44b6-b253-9d0c30ec8e1b
          role: user
          text: '##Goals

            依据“权利要求书”的内容，生成"说明书-发明内容"。

            ##Rules：

            说明书-发明内容由两部分组成.

            第一部分（不显示）：

            保证[权利要求书]或[权利要求书草稿]和【发明内容】的实质性文字内容的一致性，只对特定的词汇进行替换。将“根据权利要求x的...，其特征在于”
            替换为“在一种可能的实施方式中”，除此之外，所有其他文字必须保持不变。

            输入的全部权利要求书条款都必须对应的进行输出。例如，输入n条，则输出也必须是n条。

            除了文字替换之外，不允许增加任何其他内容。如第一部分“，“第一条”，“实施方式一”等。

            第二部分（不显示）：

            格式为：基于上述技术方案，本发明/实用新型的xxxx（发明/实用新型名称），通过（权利要求1的技术方案的概述和工作原理的分析），解决了xxxx问题，具有xxx效果。

            注意：在”权利要求1的技术方案的概述“中要**特别加强**并用较大的篇幅对工作原理和对解决技术问题的推导过程进行分析说明。

            ##Examples

            示例1：生成''说明书-发明内容''第一部分

            示例输入”权利要求书“：

            ”“”

            1.一种空气弹簧检测系统，其特征在于，包括：控制模块（10）、上料模块（20）、校正装置（30）和检测装置（40），其中，控制模块（10）用于执行如下操作中的一种或多种：

            控制上料模块（20）提供空气弹簧；

            控制校正装置（30）调整空气弹簧进气柱的角度，以使得进气柱与检测装置的充气孔相对应；

            控制上料模块（20）将调整角度后的空气弹簧移至检测装置（40）；以及，

            控制检测装置（40）对空气弹簧进行检测。

            2.根据权利要求1的空气弹簧检测系统，其特征在于，校正装置（30）包括：基座（301）、旋转盘（302）、旋转电机（303）和两个或两个以上感应元件（304）；其中，旋转盘（302）安装在基座（301）上，旋转电机（303）置于基座（301）下方，旋转盘（302）与旋转电机（303）轴连接，两个或两个以上感应元件（304）设置在旋转盘（302）上方，感应元件（304）在检测到旋转盘（302）上的空气弹簧进气柱（66）的外边沿时发出触发信号；其中，控制模块（10）还用于：根据感应元件（304）的触发信号，控制旋转电机（303）停止转动。

            3.根据权利要求2的空气弹簧检测系统，其特征在于，感应元件（304）为激光传感器，激光传感器发出的激光束与空气弹簧进气柱（66）的外边沿相切；其中，激光传感器数量为两个，两个激光传感器的激光束平行，两条激光束的间距与空气弹簧进气柱的外边沿的距离相等。

            “”“

            ####示例输出: ”说明书-发明内容“第一部分：

            """

            在一种可能的实施方式中，提供了一种空气弹簧检测系统，包括：控制模块、上料模块、校正装置和检测装置，其中，控制模块用于执行如下操作中的一种或多种：控制上料模块提供空气弹簧；控制校正装置调整空气弹簧进气柱的角度；控制上料模块将调整角度后的空气弹簧移至检测装置；以及，控制检测装置对空气弹簧进行检测。

