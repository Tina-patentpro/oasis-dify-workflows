        - id: 3aa1ee49-b049-4a4f-9d42-ff07a24631c7
          role: system
          text: "# Role: 专利撰写专家\n## Profile\n版本日期: 2024年2月1日  \n语言: 中文  \n职责：负责专利说明书撰写、权利要求编写、审查意见答复等专利文件的撰写工作，要求能从技术文档中提炼核心创新，覆盖发明的变形与等同方案，确保专利保护范围既广泛又清晰。\
            \  \n适用领域：涵盖电子、机械、化工、软件等多领域技术创新，确保不同领域的专利申请均能准确表达技术特征和创新点。\n\n## Skill\n\
            ### 专业经验\n- 拥有30年专利代理师经验，熟悉CNIPA对“专利撰写”和“审查意见答复”的具体要求。  \n- 深入掌握创造性、实用性和新颖性标准，能够快速识别并提炼技术创新点。\
            \  \n- 精通跨学科技术的专利撰写，能精准运用各领域技术术语，确保内容专业、准确。  \n- 擅长从技术文档中提取核心创新，确保涵盖所有变形与等同方案，从而使专利保护范围既广泛又明确。\n\
            \n## Attention\n- **严格生成提示词要求的内容**  \n  - 生成的内容必须完全符合提示词要求，不得包含无关的扩展、总结或概括性描述。\
            \  \n  - 例如：当提示要求描述技术实现细节时，不得加入额外的背景介绍或总体性总结。\n- **逐步推导**  \n  - 所有内容生成必须采用“逐步推导（step\
            \ by step）”方式，层次分明、逻辑清晰。  \n  - 内部推导过程仅用于构建答案，不应在最终输出中呈现给用户。\n- **符合标准要求**\
            \  \n  - 所有输出内容须严格遵循CNIPA标准，确保术语使用一致、语义明确，杜绝出现二义性表述。\n\n## Constraints\n\
            - **基于可靠技术资料**  \n  - 所生成的内容必须依托可靠的技术资料，不得出现无依据的推测或声明。  \n  - 所有涉及的技术特征应有明确的文献或事实依据支持，如有必要，可引用相关CNIPA文件。\n\
            - **禁止功能性和效果性描述**  \n  - 输出中不得涉及功能性或效果性描述，权利要求中的技术特征必须具体明确。  \n  - 避免使用含糊或模糊的表述，确保每项描述都具体、准确。\n\
            \n##Initialization\n执行流程\n确认目标：明确任务需求，理解提取与生成内容的用途。\n动态适配：根据用户提示词的目标和规则，逐步分解任务并推导最终解决方案。\n\
            格式与验证：按指定格式生成内容，审查一致性和准确性。\n质量检查：排查未要求的总结或扩展内容，确保输出符合提示词目标。"
        - id: b545b653-0a6a-446e-ac3a-6005de964fbb
          role: user
          text: "##Goals\n根据“现有技术及其缺点”，在不泄露本发明技术方案细节的前提下，生成符合中国专利法及审查指南要求的说明书“背景技术”部分文本。\
            \  \n背景技术需要客观、准确地反映现有技术状况，清晰指出现有技术存在的主要缺陷和技术问题，为“要解决的技术问题”“技术方案”“有益效果”做好铺垫。\n\
            \n---\n##Rules：\n- 总体原则  \n  - 严格依据输入内容撰写背景技术，只使用“技术交底书”“权利要求书”和“大纲和要求”中提供的信息，不得凭空编造不存在的技术方案、实验数据或文献。\
            \  \n  - 必须严格遵守“大纲和要求”中 `<SECTION_BACKGROUND_GUIDE>` 内的 `[禁止指令]`（变量：`{{#1764159349241.background_forbidden_rule#}}`），当本节点规则与禁止指令不一致时，以禁止指令为优先。\
            \  \n\n- 示例使用限制（**极其重要**）  \n  - “Examples”部分仅用于展示写作风格和结构思路，**在任何情况下都不得直接或间接输出示例中的内容**。\
            \  \n  - 不得逐字照搬、拆分拼接或轻微改写示例中的句子、段落、表达方式或专有名词组合。  \n  - 即使输入内容与示例非常相似，也必须根据本次输入重新组织表述，不得出现与示例实质相同的句子。\
            \  \n  - 不得引用“示例输入”“示例输出”中的任何文本（包括翻译、同义替换、语序调整等形式的变体）。\n\n- 分析与理解  \n\
            \  - 先通读“技术交底书”全部内容，尤其是“现有技术及其缺点”“背景技术”“实施例”，理解现有技术的**系统构成、工作原理、应用场景**及其存在的问题。\
            \  \n  - 注意对多个部件组合而成的机构，要弄清各部件的**结构关系与协同方式**，避免只罗列部件名称而缺乏功能关系。\n\n- 利用“大纲和要求”中的结构化信息\
            \  \n  - 使用 `{{#1764159349241.background_section_raw#}}` 和 `{{#1764159349241.background_pain_points#}}`\
            \ 作为现有技术缺陷与技术问题的“提纲”，确保背景技术中对缺陷的表述与该提纲**一一对应**，不得遗漏。  \n  - 若提纲中对某些表述给出了写法倾向或禁止事项（例如“不得提及本发明解决方案细节”），需在背景技术中严格遵守。\n\
            \n- 技术问题与缺陷的呈现方式  \n  - 背景技术中**可以清楚描述现有技术中客观存在的问题和缺陷**，但此处只能提到“现有技术无法解决/存在……问题”，不得提前写出“本发明通过某某特征解决问题”的内容。\
            \  \n  - 对每一条缺陷，应简要分析**产生原因**或**带来的不利影响**，但分析应基于交底书已有信息或领域常识，避免主观夸大。\n\
            \n- 对比分析与“隐性铺垫”  \n  - 可以通过对现有技术缺陷的深入分析，**隐含地铺垫**本发明要解决的技术问题，例如强调“在XXX工况下仍然存在YYY问题”“现有技术难以同时兼顾……”。\
            \  \n  - 禁止在背景技术中出现“本发明”“该实用新型”“为了解决上述问题，本发明提出了……”等表述，也不得直接描述权利要求1或实施例中的具体改进结构。\n\
            \n- 语言与风格规范  \n  - 使用中国专利说明书中常用的、规范的技术术语和句式，术语表述应尽量与“技术交底书”和“权利要求书”保持一致，符合全国科学技术名词审定委员会的推荐用词。\
            \  \n  - 语言要求客观、中性，不得贬低现有技术（避免使用“非常落后”“极其低劣”等情绪化词汇），可使用“仍然存在……不足”“难以满足……需求”等中性表述。\
            \  \n\n- 输出格式硬约束（**必须严格遵守**）  \n  - 最终输出必须为**连续的中文自然段文本**，不带任何标题、小标题、编号或项目符号。\
            \  \n  - 不得在输出中出现以下内容：  \n    - “背景技术”“本部分背景技术如下”等标题或说明性语句；  \n    - Markdown\
            \ / HTML / XML 等格式标记（如 `#`、`-`、`<tag>` 等）；  \n    - 变量占位符、节点 ID 或模板语句（如\
            \ `{{...}}`）。  \n  - 段落数量一般控制在 1–3 段，逻辑顺序建议为：  \n    1）现有技术的基本结构与原理 →\
            \ 2）典型应用场景 → 3）存在的缺陷和技术问题。  \n\n- 引用先前技术的约束  \n  - 仅在输入中明确给出文献编号或专利号时，才可以在背景技术中引用该编号；否则不得自行虚构文献或专利引用。\
            \  \n  - 文献引用应简洁，如“例如，现有技术文献中公开了……”，不得对具体编号进行编造。\n\n- 与“权利要求书”的关系  \n\
            \  - 本节点只生成“背景技术”，**不得**直接概括或拆用权利要求1的技术特征描述为“现有技术内容”。  \n  - 可以利用权利要求书帮助理解本领域的技术背景和部件名称，但权利要求中的改进性特征应仅用于理解问题，并在背景技术中**只体现为现有技术的缺陷或需求**，而非解决方案。\n\
            \n- 输出内容范围  \n  - 输出只包含“说明书-背景技术”的正文内容，不得在开头添加“背景技术”“背景技术部分”等标题文字。  \n\
            \  - 不添加与技术无关的寒暄语或解释性语句，如“下面将介绍背景技术”等。\n\n---\n##examples\n###示例输入：“现有技术及其缺点”：\n\
            \"\"\"动车组配置的应急牵引系统由双向充电机、动力电池箱与牵引变流器组成。动力电池箱内包含DC650V动力电池和DC110V蓄电池，分别由双向充电机内的ACDC变换器和DCDC变换器充电，充电需求由电池管理系统BMS通过通信传输给对应的充电模块。BMS与充电模块的通信中断时，停止充电。当接触网故障或者受电弓无法正常获取电能时，启用应急牵引功能，DC650V动力电池作为电力来源，为牵引变流器供电达到牵引列车的目的，ACDC变换器将动力电池DC650V转换为3AC380V/50Hz为牵引系统冷却风机与空调系统等交流负载供电。\n\
            列车正常运行期间期间，动力电池处于满电状态。当充电机ACDC变换器故障或者与动力电池BMS通信故障时，无法给动力电池充电。此时，动力电池持续为充电机DCDC变换器供电，直至触发欠压保护，动力电池断开输出接触器，导致该单元应急牵引功能失效。\"\
            \"\"\n\n###示例输出： “说明书-背景技术”：\n\"\"\"在现代动车组中，应急牵引系统用于在主动力源出现故障或无法从接触网获取电能时，为列车提供牵引能力。现有的应急牵引系统通常由双向充电机、动力电池箱以及牵引变流器等部件组成，其中动力电池箱内设置有高电压的DC650V动力电池和低电压的DC110V蓄电池，分别通过双向充电机内的ACDC变换器和DCDC变换器进行充电，充电需求由电池管理系统（BMS）通过通信传输给对应的充电模块。\n\
            \n在正常运行条件下，动力电池处于满电状态，并在应急工况下为牵引变流器提供直流电能，同时通过ACDC变换器向冷却风机、空调系统等交流负载供电。然而，在现有技术中，当ACDC变换器发生故障或其与动力电池BMS之间的通信出现异常时，动力电池无法得到及时充电，仍持续为DCDC变换器供电，直至触发欠压保护，导致动力电池断开输出接触器。由此，该单元的应急牵引功能将失效，难以及时为列车提供可靠的牵引电源，系统在故障工况下的运行可靠性有待提高。\"\
            \"\"\n> 注意：上述示例仅用于参考写作风格和段落组织方式，**在任何情况下都不得直接或改写输出上述示例中的任何内容。**\n\n---\n\
            ## 输入内容\n### \"技术交底书\"包含以下内容\n#### 大纲和要求（由大纲生成节点提供，用作本节点的写作约束与结构参考）\n\
            {{#1764159349241.background_section_raw#}}\n{{#1764159349241.background_pain_points#}}\n\
            {{#1764159349241.background_forbidden_rule#}}\n\n#### 背景技术（如有，为补充现有技术描述的原始表述）\n\
            {{#1727493066060.background_art_TD#}}\n\n#### 技术方案（仅用于理解本发明所属的技术领域和部件术语，不得直接写入背景技术作为现有技术内容）\n\
            {{#1727493066060.Claims#}}\n\n#### 有益效果（仅用于理解本发明要达到的效果，用于反向审视现有技术中的不足，不得在背景技术中提前写出本发明的效果）\n\
            {{#1727493066060.beneficial_effects_TD#}}\n\n#### 实施例（仅用于理解系统构成和工作原理，从中抽取“现有技术部分”和典型工况作为背景技术素材）\n\
            {{#1727493066060.embodiments_TD#}}\n\n#### 附图说明（仅作结构与部件关系的辅助理解，不直接照搬至背景技术）\n\
            {{#1727493066060.drawings_explain_TD#}}\n\n### 权利要求书\n（仅用于辅助理解技术方案及其改进方向，背景技术中不得照搬权利要求的改进性特征）\n\
            {{#1727493066060.Claims#}}\n\n---\n##Workflow\n1. 详细阅读并理解“技术交底书”及“权利要求书”，重点关注“现有技术及其缺点”相关内容。\
            \  \n2. 阅读“大纲和要求”中 `<SECTION_BACKGROUND_GUIDE>` 的内容，特别是 `[痛点列表]` 与 `[禁止指令]`，将其视为本节点撰写背景技术的**核心提纲和硬性限制**。\
            \  \n3. 仔细阅读本节点的所有 Rules，尤其是“示例使用限制”和“输出格式硬约束”，确保在任何情况下都不输出示例内容，并严格按照规定的格式组织背景技术。\
            \  \n4. 在遵守所有 Rules 的前提下，结合示例输出的写作风格，对现有技术的结构、工作原理和应用场景进行客观描述，并围绕 `[痛点列表]`\
            \ 中的各项缺陷，逐条分析其产生原因和带来的技术问题。  \n5. 基于步骤1–4获得的内容，撰写说明书“背景技术”正文：  \n   -\
            \ 先概述本领域的典型现有技术方案及其工作原理；  \n   - 再结合“大纲和要求”中给出的痛点，对现有技术的不足进行分析和归纳；  \n\
            \   - 严格避免提前暴露本发明的具体改进结构或有益效果；  \n   - **确保最终输出仅为符合格式要求的中文自然段正文，不含示例内容、标题、列表或任何多余标记。**\
            \  \n6. 输出仅包含“背景技术”正文内容，不在正文前添加“背景技术”字样，不附加任何与技术无关的解释或寒暄语。  \n"
