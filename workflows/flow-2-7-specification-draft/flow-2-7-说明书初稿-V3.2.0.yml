        prompt_template:
        - id: 6ee03190-aae8-4014-a8f8-5d34c113dfcf
          role: system
          text: "# Role: 专利撰写专家\n## Profile\n版本日期: 2024年2月1日  \n语言: 中文  \n职责：负责专利说明书撰写、权利要求编写、审查意见答复等专利文件的撰写工作，要求能从技术文档中提炼核心创新，覆盖发明的变形与等同方案，确保专利保护范围既广泛又清晰。\
            \  \n适用领域：涵盖电子、机械、化工、软件等多领域技术创新，确保不同领域的专利申请均能准确表达技术特征和创新点。\n\n## Skill\n\
            ### 专业经验\n- 拥有30年专利代理师经验，熟悉CNIPA对“专利撰写”和“审查意见答复”的具体要求。  \n- 深入掌握创造性、实用性和新颖性标准，能够快速识别并提炼技术创新点。\
            \  \n- 精通跨学科技术的专利撰写，能精准运用各领域技术术语，确保内容专业、准确。  \n- 擅长从技术文档中提取核心创新，确保涵盖所有变形与等同方案，从而使专利保护范围既广泛又明确。\n\
            \n## Attention\n- **严格生成提示词要求的内容**  \n  - 生成的内容必须完全符合提示词要求，不得包含无关的扩展、总结或概括性描述。\
            \  \n  - 例如：当提示要求描述技术实现细节时，不得加入额外的背景介绍或总体性总结。\n- **逐步推导**  \n  - 所有内容生成必须采用“逐步推导（step\
            \ by step）”方式，层次分明、逻辑清晰。  \n  - 内部推导过程仅用于构建答案，不应在最终输出中呈现给用户。\n- **符合标准要求**\
            \  \n  - 所有输出内容须严格遵循CNIPA标准，确保术语使用一致、语义明确，杜绝出现二义性表述。\n\n## Constraints\n\
            - **基于可靠技术资料**  \n  - 所生成的内容必须依托可靠的技术资料，不得出现无依据的推测或声明。  \n  - 所有涉及的技术特征应有明确的文献或事实依据支持，如有必要，可引用相关CNIPA文件。\n\
            - **禁止功能性和效果性描述**  \n  - 输出中不得涉及功能性或效果性描述，权利要求中的技术特征必须具体明确。  \n  - 避免使用含糊或模糊的表述，确保每项描述都具体、准确。\n\
            \n##Initialization\n执行流程\n确认目标：明确任务需求，理解提取与生成内容的用途。\n动态适配：根据用户提示词的目标和规则，逐步分解任务并推导最终解决方案。\n\
            格式与验证：按指定格式生成内容，审查一致性和准确性。\n质量检查：排查未要求的总结或扩展内容，确保输出符合提示词目标。"
        - id: 3367e0c6-32d6-4580-a659-97b0b1930c13
          role: user
          text: '##Goals

            根据"权利要求1"，“说明书-背景技术”的内容生成“说明书摘要”

            ##Rules：

            说明书摘要由两部分组成：

            第一部分：

            1、将“权利要求1（全文）”去掉”其特征在于”，去掉括号内的数字。生成【权利要求1的技术方案】

            2、在【权利要求1的技术方案】前增加”本发明涉及“

            第二部分

            3、从“说明书-背景技术”中提取“权利要求1”所直接对应的最核心的需要解决的问题生成【解决问题】。

            4、在【解决问题】前增加“本发明解决了”。在【解决问题】后增加“的技术问题”

            说明书摘要的字数不能超过300个汉字或英文单词

            格式为：本发明（或实用新型）涉及[权利要求1的技术方案]。本发明（或实用新型）解决了【解决问题】的技术问题。

            Examples

            Example 1

            示例输入：“权利要求1”

            “”“

            1.一种应急牵引系统，其特征在于，包括一组以上双向充电机、牵引变流器和电池组；其中，双向充电机包括：ACDC变换器和DCDC变换器；电池组包括：动力电池、蓄电池、与动力电池连接的动力电池管理系统和与蓄电池连接的蓄电池管理系统；以及，车辆控制单元，车辆控制单元与双向充电机连接。

            ”“”

            ####示例输入：“背景技术”

            “”“

            在现代动车组中，应急牵引系统是一个关键组件，用于确保即使在主动力源出现故障或无法获取电能的情况下，列车也能继续运行。这个系统主要由以下几个部分组成：双向充电机：它具有两种功能，一是将交流电（AC）转换为直流电（DC），用于给动力电池充电，二是将DC转换为AC，供应给列车的其他系统；电池组：包含两种类型的电池，一是高电压的DC650V动力电池，二是低电压的DC110V蓄电池；这两种电池分别由内置的ACDC变换器和DCDC变换器充电。牵引变流器：在应急情况下，它利用电池组提供的电能来驱动列车的牵引系统；电池管理系统（BMS）：负责监控电池的状态，包括电压、电流和温度等，并根据需要调节充电过程；BMS通过通信传输给充电模块以控制充电过程。

            在正常运行条件下，动力电池处于满电状态，并为列车的其他系统（如冷却风机和空调系统）提供电能。然而，如果ACDC变换器或BMS出现故障，导致无法给动力电池充电，动力电池将继续为DCDC变换器供电，直至触发欠压保护。这将导致动力电池断开输出接触器，使得该单元的应急牵引功能失效。

            ”“”

            ####示例输出：说明书概要

            ”“”

            本发明涉及一种应急牵引系统，包括一组以上双向充电机、电池组和牵引变流器；其中，双向充电机包括：ACDC变换器和DCDC变换器；电池组包括：动力电池、蓄电池、与动力电池连接的动力电池管理系统和与蓄电池连接的蓄电池管理系统；以及，车辆控制单元，车辆控制单元与双向充电机连接。本发明解决了现有技术中动力电池亏电导致应急牵引功能失效的技术问题。

            “”“

            Example 2：

            示例输入：“权利要求1”

            “”“

            1.一种焊接工艺参数推荐方法，其特征在于，包括以下步骤：

            S10，对焊接样件进行焊接；

            S20，对焊接后的焊接样件进行金相制备和力学测试，获取包括：气孔率、余高、抗拉强度和延伸率的测试结果；

            S30，基于测试结果和聚类分析进行缺陷识别，建立缺陷逻辑回归模型，其中，缺陷逻辑回归模型的输入量为：焊接速度、送丝速度、坡口角度和焊缝间隙，输出量为逻辑值；

            S40，通过余高测量构建余高二阶响应模型，并进行显著性分析和回归分析，得到最终的余高二阶响应模型；

            S50， 根据构建的最终的余高二阶响应模型，以焊接速度和送丝速度作为x、y面、余高为z轴进行绘制，得到余高响应面；

            S60，根据余高响应面和缺陷逻辑回归模型确定不同余高期望下对应的无缺陷焊接工艺参数，包括：焊接速度和送丝速度。

            ”“”

            示例输入：“背景技术”

            """

            焊接作为高铁生产制造的核心技术之一，其焊接质量与车体的安全和性能的提高紧密相连。当前，工艺水平已能够满足如车体长直焊缝等自动焊接问题的焊接要求，但在大型车体的焊接过程中还存在着大量复杂的空间曲面焊缝与焊接位置多样的焊接工况。

            目前针对大型曲面焊缝，拼缝特征多变的焊件，其焊接质量完全依靠作业者的焊接经验，作业者根据听焊接声音、观察熔池状态等方法，然后结合经验进行焊接速度、焊枪姿态的调整，在焊接过程中较难发现焊接质量缺陷，实际工况下难以获得优良性能的焊缝。同时对于焊缝位置多样，包含横焊缝、竖焊缝、水平焊缝、等空间多位置多样式焊缝，焊接位置的不同导致熔滴的受力状态不同，因此焊接质量的控制以及大尺寸外板的焊接位置多样性等问题亟待解决。

            """

            示例输出：说明书概要

            “”“

            本发明涉及一种焊接工艺参数推荐方法，包括：对焊接样件进行焊接；对焊接样件进行金相制备和力学测试；基于测试结果和聚类分析进行缺陷识别，建立缺陷逻辑回归模型，其中，缺陷逻辑回归模型的输入量为：焊接速度、送丝速度、坡口角度和焊缝间隙，输出量为逻辑值；通过余高测量构建余高二阶响应模型，并进行显著性分析和回归分析，得到最终的余高二阶响应模型；根据构建的最终的余高二阶响应模型，以焊接速度和送丝速度作为x、y面、余高为z轴进行绘制，得到余高响应面；根据余高响应面和缺陷逻辑回归模型获取不同余高期望下对应的无缺陷焊接工艺参数。本发明解决了焊接工艺中无法根据焊接件形状和尺寸自动调节焊接工艺参数的技术问题。

            ”“”

            Example 3：

            示例输入：“权利要求1”

            """

            1.一种空气弹簧组装系统，其特征在于，空气弹簧组装系统包括：上盖上料模块（10）、胶囊供料模块（20）、取钉拧紧模块（30）、定位模块（40）和控制模块（50）；

            其中，控制模块（50）用于执行如下操作中的一种或多种：

            控制上盖上料模块（10）获取上盖，并将上盖放置于扣环上；

            控制胶囊供料模块（20）获取已安装的胶囊和扣环，并夹持或松开已安装的胶囊和扣环；

            控制定位模块（40）获取上盖和扣环的螺钉孔的位置数据，并调整上盖和/或扣环的螺钉孔位置，以使得上盖和扣环的螺钉孔相对应；以及，

            控制取钉拧紧模块（30）获取螺钉，并用螺钉组装上盖和扣环。

            """

            示例输入：“背景技术”

            """

            空气弹簧包括上盖、扣环、胶囊和辅助簧等，空气弹簧的组装包括：扣环与胶囊装配，辅助弹簧装配，扣环胶囊与辅助弹簧组件装配，上盖与扣环装配，装配过程复杂。其中，上盖与扣环的装配中，紧固是一个关键的步骤，上盖通过一圈包含若干个螺钉固定到扣环上，目前这一步骤主要由工人操作完成，需要两名或两名以上工人协同工作，一人负责固定扣环，另一人负责旋转上盖以使其与扣环二者的螺钉孔对齐，然后再进行螺钉的紧固。由于螺钉数量众多，这一过程耗时较多，且容易出现误差。此外，整个上盖组装过程需要工人进行搬运，而上盖本身的重量较大，这增加了工人的劳动强度。现有的手工组装方式存在生产效率低、工人劳动强度大的问题。

            因此，寻求一种改进的空气弹簧上盖组装方法和系统，以提高生产效率、降低工人劳动强度，并满足智能化生产需求，成为了当前的技术挑战。

            """

            示例输出：说明书概要

            “”“

