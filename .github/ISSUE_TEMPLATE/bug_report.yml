name: 问题报告（工作流导入／运行）
description: "报告 YML 的导入、依赖、节点行为或输出问题。公开 Issue 请先脱敏。"
title: "[问题] "
body:
  - type: markdown
    attributes:
      value: |
        提交前请确认：**不要在公开 Issue 提交**案件全文、客户交底、未公开发明、
        凭据／Token／Cookie、本机绝对路径、内部服务器地址、评价专用答案与评分材料、个人信息、
        可直接利用的安全细节。报错原文、日志、截图与证据路径同样须脱敏。

        安全漏洞**不要**在公开 Issue 贴可利用细节；先看 `docs/FAQ.md` 的 Q13（私密举报渠道尚未核准，
        不要在公开 Issue 提交可利用细节）。

        字段说明见 `CONTRIBUTING.md`。请按固定版本提问，`main` 不自动等于 rc1。

  - type: input
    id: asset-id
    attributes:
      label: "资产 ID"
      description: "流程编号，例如 `Flow-1-1`；不确定写目录名"
      placeholder: "Flow-1-1"
    validations:
      required: true

  - type: input
    id: ref-and-version
    attributes:
      label: "集合 ref／流程版本"
      description: "集合固定版本（如 `2026.11.07-rc1`）或实际 commit，加上 YML 内标注的版本（如 V1.0.2）"
      placeholder: "2026.11.07-rc1 / V1.0.2"
    validations:
      required: true

  - type: input
    id: hash
    attributes:
      label: "YML SHA-256"
      description: "所报 YML 文件的 SHA-256；用 `catalog.json` 对账，不要手抄不完整值"
      placeholder: "c83d953e…（完整 64 位十六进制）"
    validations:
      required: true

  - type: input
    id: env-version
    attributes:
      label: "Dify 版本"
      description: "实际使用的 Dify 版本与部署形态（自建／云）；未验证的版本直接写「未验证」"
      placeholder: "例：Dify 0.15.x 自建／未验证"
    validations:
      required: true

  - type: textarea
    id: minimal-input
    attributes:
      label: "非敏感最小输入／步骤"
      description: "能复现问题的最小步骤或最小题面。**不要**贴真实案件、客户交底、密钥或内部地址。"
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true

  - type: textarea
    id: expected-vs-actual
    attributes:
      label: "预期与实际"
      description: "分开写。附报错原文（已脱敏）或证据路径，不要只写「跑不通」。"
      placeholder: |
        预期：…
        实际：…
        报错原文（已脱敏）：…
    validations:
      required: true

  - type: dropdown
    id: reproduce-layer
    attributes:
      label: "复现层级"
      description: "问题停在哪一层。不确定就选「未确定」，不要笼统写「跑不通」。"
      options:
        - 发现（Skill／流程是否被识别）
        - 资源读取（文件、依赖、示例是否读到）
        - 执行（步骤／节点实际运行）
        - 保存或输出（产物落盘、格式）
        - 工具调用（外部服务、插件、凭据模板）
        - 仅静态解析（没有真正运行）
        - 未确定
    validations:
      required: true

  - type: textarea
    id: missing-deps
    attributes:
      label: "依赖缺件"
      description: "模型、插件、环境变量、知识库引用、凭据模板等缺哪些，如实列出；缺件就是缺件，不要删节点凑「能跑」。"
    validations:
      required: false

  - type: textarea
    id: redacted-evidence
    attributes:
      label: "脱敏证据"
      description: "说明已去除哪些内容（密钥、真实案件、内部地址、个人信息），再贴最小日志或截图。"
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: "提交前确认"
      options:
        - label: 我已确认上述内容不含真实案件、客户交底、凭据或内部地址
          required: true
        - label: 我已按固定 ref／版本填写，而不是默认 `main` 等于 rc1
          required: true
